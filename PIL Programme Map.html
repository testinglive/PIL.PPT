<title>PIL Programme Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<style>
/* Layout: a fixed chrome (bar, index, drawer, minimap) around one pannable, zoomable drawing sheet. */
:root{
  --bg:#E9ECEE; --sheet:#F6F7F8; --paper:#FFFFFF; --paper2:#F2F4F6; --ink:#17212B; --muted:#56616D; --faint:#8C96A1;
  --line:#D6DBE0; --line2:#BCC4CC; --grid:rgba(23,33,43,.055);
  --accent:#E8552D; --accent-ink:#C23F1A; --accent-soft:rgba(232,85,45,.10);
  --life:#E8552D; --people:#14857A; --money:#2E5EA8; --found:#687380; --ext:#8B95A0;
  --now:#E8552D; --cap:#B7791F; --sap:#4A6F97;
  --chrome:rgba(255,255,255,.94); --shadow:0 12px 32px rgba(18,28,38,.14);
  --serif:"Source Serif 4", Charter, Georgia, serif; --sans:"IBM Plex Sans", "Segoe UI", Roboto, Arial, sans-serif; --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1216; --sheet:#141A20; --paper:#1A2129; --paper2:#212A33; --ink:#E4E8EC; --muted:#A3ADB8; --faint:#7C8793;
  --line:#2D3741; --line2:#3E4A56; --grid:rgba(228,232,236,.045);
  --accent:#FF6B45; --accent-ink:#FF8A6A; --accent-soft:rgba(255,107,69,.14);
  --life:#FF6B45; --people:#3DB7A8; --money:#6B9BE8; --found:#98A3AF; --ext:#8792A0;
  --now:#FF6B45; --cap:#E0A33F; --sap:#88A9D1;
  --chrome:rgba(22,28,35,.94); --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1216; --sheet:#141A20; --paper:#1A2129; --paper2:#212A33; --ink:#E4E8EC; --muted:#A3ADB8; --faint:#7C8793;
  --line:#2D3741; --line2:#3E4A56; --grid:rgba(228,232,236,.045);
  --accent:#FF6B45; --accent-ink:#FF8A6A; --accent-soft:rgba(255,107,69,.14);
  --life:#FF6B45; --people:#3DB7A8; --money:#6B9BE8; --found:#98A3AF; --ext:#8792A0;
  --now:#FF6B45; --cap:#E0A33F; --sap:#88A9D1;
  --chrome:rgba(22,28,35,.94); --shadow:0 12px 32px rgba(0,0,0,.45); color-scheme:dark; }
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- chrome ---------- */
.bar{position:fixed;left:0;right:0;top:0;z-index:30;display:flex;align-items:center;gap:12px;
  padding:calc(8px + env(safe-area-inset-top,0px)) 16px 8px;background:var(--chrome);border-bottom:1px solid var(--line);backdrop-filter:blur(8px)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .mk{font-family:var(--mono);color:var(--accent);font-size:16px;letter-spacing:-2px}
.brand .nm{font-weight:600;white-space:nowrap}
.brand .nm b{color:var(--accent);font-weight:600}
.brand .sub{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1}
.search{position:relative;width:min(340px,40vw)}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--ink);font:inherit}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;fill:none;stroke:var(--faint);stroke-width:2}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;max-height:60vh;overflow:auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.results button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 12px;border-bottom:1px solid var(--line)}
.results button:hover,.results button:focus-visible{background:var(--accent-soft)}
.results small{display:block;color:var(--muted);font-size:12px}
.results .none{padding:12px;color:var(--muted)}
.zoom{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.zoom button{border:0;background:none;padding:7px 11px;line-height:1}
.zoom button:hover{background:var(--accent-soft)}
.zoom .pct{min-width:56px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted);border-left:1px solid var(--line);border-right:1px solid var(--line)}
.tbtn{border:1px solid var(--line);background:var(--paper);border-radius:8px;padding:7px 11px;white-space:nowrap}
.tbtn:hover{background:var(--accent-soft)}

#index{position:fixed;left:0;top:57px;bottom:0;width:260px;z-index:20;background:var(--chrome);border-right:1px solid var(--line);
  overflow:auto;padding-block:14px 24px;transition:transform .2s ease}
#index.closed{transform:translateX(-100%)}
#index h5{margin:16px 16px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
#index button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:none;padding:6px 16px;color:var(--ink)}
#index button:hover{background:var(--accent-soft)}
#index .dot{width:8px;height:8px;border-radius:50%;flex:none}
#index .ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint)}

#viewport{position:fixed;inset:0;overflow:hidden;cursor:grab;touch-action:none}
#viewport.drag{cursor:grabbing}
#world{box-sizing:border-box;position:absolute;left:0;top:0;transform-origin:0 0;width:4800px;padding:120px 80px 160px;background:var(--sheet);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:80px 80px;box-shadow:0 0 0 1px var(--line);font-size:17px;line-height:1.5}
#world.moving{will-change:transform}

.hint{position:fixed;left:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;color:var(--muted);font-size:12px;
  background:var(--chrome);border:1px solid var(--line);border-radius:8px;padding:6px 10px;transition:left .2s}
body.idx .hint{left:276px}
.minibox{position:fixed;right:16px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--chrome);border:1px solid var(--line);
  border-radius:10px;padding:6px;box-shadow:var(--shadow)}
.minibox canvas{display:block;cursor:pointer}

/* ---------- drawer ---------- */
#drawer{position:fixed;top:57px;right:0;bottom:0;width:min(680px,100vw);z-index:40;background:var(--paper);border-left:1px solid var(--line);
  box-shadow:var(--shadow);display:flex;flex-direction:column;transform:translateX(105%);transition:transform .22s ease}
#drawer.open{transform:none}
.dh{padding:18px 22px 0;border-bottom:1px solid var(--line)}
.dh .row{display:flex;align-items:flex-start;gap:12px}
.dh .grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:600}
.dh h2{font-family:var(--serif);font-weight:600;font-size:30px;margin:2px 0 6px;text-wrap:balance}
.dh .x{margin-left:auto;border:1px solid var(--line);background:none;border-radius:8px;width:34px;height:34px;font-size:18px;flex:none}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px}
.tabs button{border:0;background:none;padding:9px 11px;border-bottom:2px solid transparent;color:var(--muted);white-space:nowrap;font-weight:500}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.db{overflow:auto;padding:18px 22px 40px;flex:1;line-height:1.55}
.db h4{font-family:var(--serif);font-size:19px;font-weight:600;margin:22px 0 8px}
.db h4:first-child{margin-top:0}
.db p{margin:0 0 10px}
.db .muted{color:var(--muted)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line2)}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.n{font-family:var(--mono);color:var(--faint);width:24px}
.tbl td b{font-weight:600}
.stage{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;background:var(--paper2)}
.stage h5{margin:0 0 6px;font-size:15px;font-weight:600}
.stage .note{font-size:13px;color:var(--muted);margin-top:8px}
.open-list{padding-left:20px;margin:0}
.open-list li{margin-bottom:8px}
.link{border:0;background:none;padding:0;color:var(--accent-ink);text-decoration:underline;text-underline-offset:2px}

/* ---------- shared pieces ---------- */
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 8px;border-radius:999px;white-space:nowrap;border:1px solid currentColor}
.pill.now{color:var(--now)} .pill.cap{color:var(--cap)} .pill.sap{color:var(--sap)}
.sapb{display:inline-block;font-family:var(--mono);font-size:10px;padding:1px 5px;border-radius:4px;background:var(--sap);color:var(--paper);vertical-align:2px;margin-left:6px}
.chain{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.chain .ar{color:var(--faint)}
.cn{border:1px solid var(--line2);background:var(--paper2);border-radius:8px;padding:6px 10px;line-height:1.25}
.cn b{display:block;font-weight:600;font-size:.95em}
.cn span{display:block;color:var(--muted);font-size:.78em}
.cn.hl{border-color:var(--accent);background:var(--paper)}
.cn.dec{border-style:dashed;border-color:var(--accent);background:var(--accent-soft)}
.cn.dec b::after{content:" ◇";color:var(--accent)}
.cn.side{opacity:.8;font-size:.9em}

/* ---------- boards ---------- */
.board{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:64px 72px;margin-bottom:90px}
.sec-no{font-family:var(--mono);color:var(--accent);font-size:22px;letter-spacing:.06em}
.board>h2{font-family:var(--serif);font-weight:600;font-size:64px;line-height:1.08;margin:6px 0 14px;text-wrap:balance}
.board>.lead{font-size:24px;color:var(--muted);max-width:68ch;margin:0 0 44px}
.twin{display:grid;grid-template-columns:minmax(0,1.62fr) minmax(0,1fr);gap:90px;margin-bottom:90px}
.twin>.board{margin-bottom:0}

/* hero */
.hero{padding:90px 96px}
.hero .eyebrow{font-family:var(--mono);font-size:22px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
.hero h1{font-family:var(--serif);font-weight:600;font-size:150px;line-height:.98;margin:18px 0 26px;letter-spacing:-.01em;text-wrap:balance}
.hero .lead{font-size:30px;max-width:56ch;color:var(--muted);margin:0 0 56px}
.stats{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;border-top:2px solid var(--ink);border-bottom:1px solid var(--line)}
.stat{padding:28px 26px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-family:var(--serif);font-size:84px;line-height:1;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{color:var(--muted);font-size:20px}
.principles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:56px;margin-top:64px}
.principles h3{font-family:var(--serif);font-size:34px;font-weight:600;margin:0 0 10px}
.principles p{font-size:21px;color:var(--muted);margin:0}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px;margin-top:64px;padding-top:40px;border-top:1px solid var(--line)}
.legend h4{margin:0 0 14px;font-size:15px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);font-weight:600}
.legend .li{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:19px}
.sw{width:18px;height:18px;border-radius:5px;flex:none}

/* lifecycle road */
.road{position:relative;display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:18px;padding-top:34px}
.road::before{content:"";position:absolute;left:0;right:0;top:58px;height:10px;border-radius:5px;background:repeating-linear-gradient(90deg,var(--ink) 0 38px,transparent 38px 64px);opacity:.85}
.stepc{position:relative;padding-top:74px}
.stepc .km{position:absolute;top:0;left:0;font-family:var(--mono);font-size:15px;color:var(--faint);letter-spacing:.04em}
.stepc .pin{position:absolute;top:40px;left:0;width:44px;height:44px;border-radius:50%;background:var(--paper);border:4px solid var(--accent);display:grid;place-items:center;font-family:var(--mono);font-weight:500;font-size:17px}
.stepc h3{font-family:var(--serif);font-size:30px;font-weight:600;line-height:1.1;margin:10px 0 10px;text-wrap:balance}
.stepc p{font-size:17px;color:var(--muted);margin:0 0 14px}
.stepc .lead-d{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.dchip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px 3px 8px;font-size:15px;background:var(--paper);cursor:pointer;white-space:nowrap}
.dchip i{width:9px;height:9px;border-radius:50%;flex:none}
.dchip.lead{border-width:2px;font-weight:600}
.dchip.ext{border-style:dashed;cursor:default;color:var(--muted)}
.stepc .out{font-size:15px;border-left:3px solid var(--accent);padding:4px 0 4px 10px;margin-top:12px}
.stepc .out b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.support{margin-top:48px;padding-top:28px;border-top:1px dashed var(--line2);display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:19px;color:var(--muted)}

/* connection map */
.mapwrap{display:grid;grid-template-columns:minmax(0,1fr) 560px;gap:40px}
#cmap{width:100%;height:auto;display:block}
#cmap .edge{fill:none;stroke:var(--line2);stroke-width:1.4;transition:stroke .15s,opacity .15s}
#cmap .edge.ext{stroke-dasharray:4 5}
#cmap.focus .edge{opacity:.12}
#cmap.focus .edge.on{opacity:1;stroke:var(--accent);stroke-width:2.4}
#cmap .nd rect{fill:var(--paper);stroke:var(--line2);stroke-width:1.5}
#cmap .nd text{fill:var(--ink);font:600 15px var(--sans);text-anchor:middle;dominant-baseline:middle;pointer-events:none}
#cmap .nd .bar2{stroke:none}
#cmap .nd{cursor:pointer}
#cmap .nd.ext rect{stroke-dasharray:5 4;fill:var(--paper2)}
#cmap .nd.ext text{fill:var(--muted);font-weight:500}
#cmap.focus .nd{opacity:.35}
#cmap.focus .nd.on{opacity:1}
#cmap .nd.sel rect{stroke:var(--accent);stroke-width:3}
#cmap .lane{fill:var(--faint);font:600 13px var(--sans);letter-spacing:.1em;text-transform:uppercase}
#cmap .deg{fill:var(--faint);font:500 11px var(--mono);text-anchor:middle}
.handoffs{font-size:16px}
.handoffs h3{font-family:var(--serif);font-size:30px;margin:0 0 6px}
.handoffs .it{border-top:1px solid var(--line);padding:12px 0}
.handoffs .it b{font-size:17px}
.handoffs .it div{color:var(--muted);font-size:15px}
.handoffs .it em{font-style:normal;color:var(--ink)}
.handoffs .scroll{max-height:1320px;overflow:auto;padding-right:8px}

/* matrices */
.mx{border-collapse:separate;border-spacing:0;font-size:16px;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:center}
.mx thead th{height:190px;vertical-align:bottom;padding:0 0 12px;border-bottom:2px solid var(--ink)}
.mx thead th span{display:inline-block;writing-mode:vertical-rl;transform:rotate(180deg);font-weight:600;font-size:15px;white-space:nowrap}
.mx td.rh,.mx th.rh{text-align:left;min-width:280px}
.mx td.rh b{display:block;font-size:18px}
.mx td.rh small{color:var(--muted);font-size:14px}
.mx .mk{display:inline-block;width:20px;height:20px;border-radius:50%}
.mx .mk.c{background:var(--accent)}
.mx .mk.u{border:3px solid var(--line2)}
.mx .hm{display:inline-grid;place-items:center;min-width:40px;height:34px;border-radius:6px;font-family:var(--mono);font-size:15px}
.mx tr:hover td{background:var(--accent-soft)}
.mxnote{margin-top:22px;color:var(--muted);font-size:17px;display:flex;gap:28px;flex-wrap:wrap}
.mxnote span{display:inline-flex;align-items:center;gap:8px}

/* department cards */
.group-head{display:flex;align-items:baseline;gap:28px;margin:0 0 40px}
.group-head h2{font-family:var(--serif);font-weight:600;font-size:72px;margin:0;line-height:1}
.group-head p{font-size:24px;color:var(--muted);margin:0;max-width:70ch}
.group-head .bar3{width:14px;align-self:stretch;border-radius:7px}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:56px;margin-bottom:110px;align-items:start}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;position:relative;transition:box-shadow .2s,border-color .2s}
.card.flash{border-color:var(--accent);box-shadow:0 0 0 6px var(--accent-soft)}
.card .top{padding:30px 34px 22px;border-top:10px solid var(--gc)}
.card .grp{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--gc);font-weight:600}
.card h3{font-family:var(--serif);font-weight:600;font-size:46px;line-height:1.05;margin:6px 0 16px}
.card .nums{display:flex;flex-wrap:wrap;gap:10px 22px;font-size:16px;color:var(--muted)}
.card .nums b{font-family:var(--mono);font-weight:500;color:var(--ink);font-size:19px;margin-right:4px}
.card .body{padding:0 34px 30px}
.card .role{font-size:18px;margin:0 0 20px}
.card h4{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);font-weight:600;margin:24px 0 10px}
.card .chain{font-size:15px}
.card .insight{font-size:16px;color:var(--muted);border-left:3px solid var(--gc);padding-left:14px;margin:18px 0 0}
.cols{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:30px}
.mods{list-style:none;margin:0;padding:0}
.mods li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line);font-size:15.5px;line-height:1.35}
.mods li .n{font-family:var(--mono);color:var(--faint);font-size:13px;padding-top:2px}
.mods li small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.dash{list-style:none;margin:0;padding:0;columns:1}
.dash li{display:flex;gap:8px;align-items:baseline;font-size:15px;padding:3px 0}
.dash li i{width:9px;height:9px;border-radius:50%;flex:none;transform:translateY(-1px)}
.dash i.now{background:var(--now)} .dash i.cap{background:var(--cap)} .dash i.sap{background:var(--sap)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.pain{margin:0;padding-left:18px;font-size:15px}
.pain li{margin-bottom:6px}
.card .foot{display:flex;gap:10px;padding:0 34px 30px}
.card .open{border:2px solid var(--gc);background:none;border-radius:10px;padding:10px 18px;font-weight:600;font-size:17px}
.card .open:hover{background:var(--accent-soft)}
.card.pending .body{color:var(--muted)}
.found{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px}

@media (max-width:900px){
  .brand .sub{display:none}
  #index{width:min(280px,86vw)}
  body.idx .hint{left:16px}
  .minibox{display:none}
  .hint{font-size:11px;right:16px}
}
@media (max-width:640px){
  .brand,#oneBtn{display:none}
  .bar{gap:8px;padding-left:10px;padding-right:10px}
  .search{width:auto;flex:1;min-width:0}
  .sp{display:none}
  .zoom .pct{min-width:44px}
  .hint{display:none}
}
@media (prefers-reduced-motion:reduce){ #index,#drawer,.card{transition:none} }
</style>

<header class="bar">
  <button class="tbtn" id="idxBtn" aria-controls="index" aria-expanded="false" title="Map index">☰ Index</button>
  <div class="brand"><span class="mk">‹›</span><span class="nm">iTech<b>Notion</b></span><span class="sub">· Patel Infrastructure Limited · Programme map</span></div>
  <div class="sp"></div>
  <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Search departments, modules, dashboards…" autocomplete="off" aria-label="Search the map">
    <div class="results" id="res" hidden></div></div>
  <div class="zoom" role="group" aria-label="Zoom">
    <button id="zOut" title="Zoom out (−)" aria-label="Zoom out">−</button><span class="pct" id="pct">100%</span><button id="zIn" title="Zoom in (+)" aria-label="Zoom in">+</button>
  </div>

<script>
const DATA = {"depts": {"design": {"key": "design", "name": "Design", "intro": ["The Design function is a coordination department rather than a drafting department. Detailed design is outsourced to third-party Detailed Design Consultants, and a project may carry more than one. A team of three selects those consultants, appoints them, holds them to a deliverable schedule, reviews what they submit, and keeps site and consultant aligned through every revision. The department sits between Bidding and Contracts on one side and Planning and Site on the other, and operates through eight stages."], "insight": "The site response determines the path. Where site and planning confirm the released drawing, it proceeds to the Independent Engineer or Authority Engineer for approval and on to construction. Where changes are returned, the drawing re-enters the review cycle as a new revision and travels the same route again. The same loop runs once more at the end of the project, when what was built differs from what was drawn.", "flowcap": "Master flow — eight stages from tender handover to as-built closure", "flow": [{"t": "1. Tender Handover", "s": "inputs from BD & Contracts", "dec": false, "hl": false}, {"t": "2. Consultant Selection", "s": "pool to appointed DDC", "dec": false, "hl": false}, {"t": "3. Work Order", "s": "issued and acknowledged", "dec": false, "hl": true}, {"t": "4. Design Development", "s": "consultant prepares", "dec": false, "hl": false}, {"t": "5. Drawing Review", "s": "comments and revisions", "dec": false, "hl": true}, {"t": "6. Release to Site", "s": "current revision issued", "dec": false, "hl": false}, {"t": "Site response", "s": "7 days", "dec": true, "hl": false}, {"t": "Revision cycle", "s": "returns to Stage 5", "dec": false, "hl": false}, {"t": "7. IE / AE Approval", "s": "authority sign-off", "dec": false, "hl": true}, {"t": "8. As-Built and Closure", "s": "drawing matches what was built", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Tender Handover and Design Initiation", "text": "Design receives the project from BD and Contracts. To begin, the department requires the tender BOQ as quantities without cost data, benchmark information on where work is to start, the land survey, the topographical and geotechnical investigation reports, ROW status, and the sequence in which site needs details and materials.", "nodes": [{"t": "Project awarded", "s": "BD and Contracts", "dec": false, "hl": false}, {"t": "Inputs requested", "s": "BOQ, survey, ROW", "dec": false, "hl": false}, {"t": "Inputs received", "s": "no governing checklist", "dec": false, "hl": true}, {"t": "Design record opened", "s": "work begins", "dec": false, "hl": false}], "note": "The tender BOQ is the item most often missing. Survey and geotechnical reports are the inputs the department describes as essential."}, {"title": "Stage 2 — Consultant Selection", "text": "The department identifies the need for a Detailed Design Consultant, sources candidates, and evaluates them on technical strength, team capacity, software expertise and past experience. Quotations are invited from the shortlist and the consultant is selected.", "nodes": [{"t": "Identify need", "s": "package scope", "dec": false, "hl": false}, {"t": "Source consultants", "s": "Google search", "dec": false, "hl": true}, {"t": "Evaluate and shortlist", "s": "manual forms", "dec": false, "hl": true}, {"t": "Invite quotations", "s": "from shortlist", "dec": false, "hl": false}, {"t": "Select DDC", "s": "consultant appointed", "dec": false, "hl": false}], "note": "Highlighted steps carry no structured record today. There is no consultant database, and the consultant list with portfolios is maintained by hand."}, {"title": "Stage 3 — Work Order and Appointment", "text": "A work order is prepared for the selected consultant, circulated internally for verification, updated, approved and issued.", "nodes": [{"t": "Draft work order", "s": "typed for each appointment", "dec": false, "hl": true}, {"t": "Circulate for verification", "s": "team reviews and updates", "dec": false, "hl": true}, {"t": "Approve", "s": "internal sign-off", "dec": false, "hl": false}, {"t": "Issue to consultant", "s": "appointment confirmed", "dec": false, "hl": false}], "note": "No approved template library exists. Work order creation and template management were named as the department's first pain point."}, {"title": "Stage 4 — Design Development and Coordination", "text": "Inputs are shared with the consultant, who prepares the deliverables. The department coordinates through the development period and logs each submission.", "nodes": [{"t": "Share inputs", "s": "survey, BOQ, scope", "dec": false, "hl": false}, {"t": "Consultant prepares", "s": "detailed design", "dec": false, "hl": false}, {"t": "Deliverable submitted", "s": "revision R0", "dec": false, "hl": true}, {"t": "Logged in tracker", "s": "maintained manually", "dec": false, "hl": true}], "note": "Drawing files are exchanged by email. Sending data and files to consultants was named as a pain point. A single project may run more than one consultant in parallel."}, {"title": "Stage 5 — Drawing Review and Internal Approval", "text": "The department reviews each submission in AutoCAD. Where comments arise the drawing returns to the consultant, who issues a revised version. Revisions are identified as R0, R1 and onwards. Once satisfied, the department approves the drawing internally.", "nodes": [{"t": "Review drawing", "s": "AutoCAD", "dec": false, "hl": false}, {"t": "Comments?", "s": "review outcome", "dec": true, "hl": false}, {"t": "Return to consultant", "s": "revised as R1, R2", "dec": false, "hl": true}, {"t": "Internally approved", "s": "ready for release", "dec": false, "hl": false}], "note": "Revision history is held manually. Which revision is current depends on who circulated it last."}, {"title": "Stage 6 — Release to Site and Site Response", "text": "Approved drawings are handed to the site head and the planning team. Site and planning are required to confirm the drawing or return changes within seven days. Where changes are returned, the department passes them to the consultant and the drawing re-enters review.", "nodes": [{"t": "Release to planning", "s": "current revision issued", "dec": false, "hl": false}, {"t": "Changes returned?", "s": "within 7 days", "dec": true, "hl": false}, {"t": "Back to consultant", "s": "new revision raised", "dec": false, "hl": true}, {"t": "Confirmed", "s": "proceeds to authority", "dec": false, "hl": false}], "note": "The seven-day expectation is not enforced and a non-response is not distinguishable from a confirmation."}, {"title": "Stage 7 — Independent Engineer and Authority Engineer Approval", "text": "The drawing is submitted for approval by the Independent Engineer or the Authority Engineer. Comments received drive a further revision through the consultant. Approval closes the drawing for construction.", "nodes": [{"t": "Submitted to IE / AE", "s": "from site", "dec": false, "hl": false}, {"t": "Comments?", "s": "authority review", "dec": true, "hl": false}, {"t": "Revision cycle", "s": "returns to Stage 5", "dec": false, "hl": true}, {"t": "Approved for construction", "s": "drawing released to build", "dec": false, "hl": false}], "note": "This stage sits outside the department's visibility today. Comments from the Independent Engineer and Authority Engineer are not recorded against the revision that caused them."}, {"title": "Stage 8 — As-Built Drawings and Design Closure", "text": "Where what was built differs from what was drawn, site marks the differences within seven days. The department forwards them to the consultant, who prepares the as-built drawings, which are then approved and retained as the record of the project.", "nodes": [{"t": "Construction complete", "s": "structure or package", "dec": false, "hl": false}, {"t": "Differences marked", "s": "by site, within 7 days", "dec": false, "hl": true}, {"t": "Consultant updates", "s": "as-built prepared", "dec": false, "hl": false}, {"t": "Approved and archived", "s": "project record closed", "dec": false, "hl": false}], "note": "The seven-day rule was described to us with three different starting points across the discussion. The start event is not fixed."}], "extra": null, "workflows": [["1", "Project initiation and input handover", "Project awarded and handed over", "BD and Contracts, Design", "Design record opened with a recorded set of inputs and a visible completeness position"], ["2", "Consultant onboarding to the register", "A new consultant is identified", "Design", "Consultant profile with specialisation, capacity, software, portfolio and documents, available to every future package"], ["3", "Consultant evaluation and selection", "A package requires a consultant", "Design, Head of Design, Management where applicable", "Selected consultant with the evaluation and quotation comparison that justified the choice retained against the project"], ["4", "Work order issue and acknowledgement", "Consultant selected", "Design, approver, consultant", "Issued work order generated from an approved template, with approval history and consultant acknowledgement"], ["5", "Deliverable schedule agreement", "Work order issued", "Design, consultant", "Agreed deliverable list with planned submission dates, forming the baseline the tracker measures against"], ["6", "Deliverable submission and logging", "Consultant submits a deliverable", "Consultant, Design", "Revision R0 recorded against the schedule line, with the tracker updating itself"], ["7", "Drawing review and comment closure", "Deliverable received", "Design, consultant", "Internally approved revision, with every comment tied to the revision it was raised against and closed before approval"], ["8", "Drawing release and distribution", "Internal approval complete", "Design to Planning and Site", "One revision marked current, the previous one superseded, and every stakeholder notified without anyone sending an email"], ["9", "Site response", "Drawing released", "Planning, Site", "A recorded confirmation or a recorded change request, with the clock visible to both sides"], ["10", "Authority submission and comment capture", "Site confirmation received", "Site, Design, Independent or Authority Engineer", "Approval evidence and authority comments held against the exact drawing revision"], ["11", "Design change and revision cycle", "Site query, authority comment or scope change", "Design, consultant, Head of Design", "A superseding revision that has travelled the same review and approval route as the original"], ["12", "Quantity variance and surplus approval", "Quantity exceeds the tender position beyond the agreed tolerance", "Design, Site, Planning", "A recorded decision by Design to approve, reject or revise, rather than a variance discovered later"], ["13", "As-built capture and issue", "Construction of a structure or package complete", "Site, Design, consultant", "Approved as-built drawing issued as a revision of the original and archived as the project record"]], "dashboards": [["1", "Design tracker", "Every deliverable by project, package and consultant, with planned against actual submission and current status", "now"], ["2", "Overdue deliverables", "Deliverables past their planned date, by consultant, with ageing", "now"], ["3", "Drawing revision register", "Current revision for every drawing, what it superseded, and when it was released", "now"], ["4", "BOQ comparison: tender against design", "Quantity variance line by line, tender against design, without cost data", "cap"], ["5", "Site response monitor", "Drawings awaiting confirmation from site and planning, with days elapsed against the seven-day expectation", "cap"], ["6", "IE and AE approval status", "Drawings submitted for authority approval, comments open and approvals received", "cap"], ["7", "Consultant register", "Consultants engaged, packages held by each, and current engagement load", "now"], ["8", "Work order register", "Work orders issued by project and consultant, with value, status and acknowledgement", "now"], ["9", "Handover completeness", "Inputs received from BD and Contracts against what Design requires, per project", "cap"], ["10", "As-built status", "Structures complete, differences marked, as-built pending and as-built approved", "cap"], ["11", "Consultant performance", "On-time submission rate, revisions consumed per deliverable and comments raised, accumulated across projects", "cap"], ["12", "Design cycle time", "Days from consultant submission to internal approval, and from release to site confirmation", "cap"], ["13", "Revision intensity", "Which packages and structure types consume the most revision cycles, and at which review stage", "cap"], ["14", "Quantity surplus register", "Surplus items raised against design, decisions taken and decisions pending", "cap"], ["15", "Priority alignment", "What site says it needs first against what design has released", "cap"]], "obs": "We note a single principle behind almost every request the department made: Design should not have to pass updates on by hand. Releasing a revision should notify the parties that need it, and other departments should read status from the system rather than wait for Design to send it.", "interactions": [["BD and Tender team", "Tender BOQ as quantities without cost, design assumptions taken at tender stage, benchmark information on where work is to start, land survey", "Feedback on tender quantities and design assumptions where the design departs from them", "Informal. The BOQ is frequently not received at all, which is why the tender-against-design comparison cannot be produced."], ["Contracts", "Contract scope, technical requirements, specification and standards set", "Consultant appointment requirement for work order and LOA issuance", "Email and shared folders. There is no checklist governing what must be handed over before Design begins."], ["Liaisoning", "ROW status and statutory position affecting where design can be released for construction", "Advance notice of where access will be required", "Not structured. ROW status was named as information the department needs and does not reliably get."], ["Planning", "Confirmation or change requests on released drawings, expected within seven days", "Approved drawings, the current revision, the drawing schedule and notification when a revision is released", "Email. The seven-day expectation is not enforced and a non-response is indistinguishable from a confirmation."], ["Site and Execution", "Site execution queries, GFC-against-actual differences, executed quantity, work priorities and which details or materials are needed first", "Current approved GFC drawings, responses to site queries and revised drawings", "Email and telephone. The department described this as having no visibility of site status."], ["Independent and Authority Engineer", "Comments on submitted drawings and final approval", "Drawings for approval, routed through site", "Handled at site. Comments are not recorded against the drawing revision that caused them, and Design learns of them informally."], ["Detailed Design Consultants", "Design deliverables, revisions and as-built drawings", "Project inputs, work order, deliverable schedule, review comments and site queries", "Email, including large AutoCAD files. A project may carry more than one consultant."], ["Survey and geotechnical consultants", "Topographical survey and geotechnical investigation reports", "Survey scope and requirement", "Appointed as needed. These were described as the main inputs the department wants and the ones it most often waits on."], ["Management", "Approval on consultant finalisation, and the approved formats for reports and decks", "Design status, consultant position, quantity variance and project design health", "On request, assembled by hand."]], "profile": [["Team size", "3 members", "All three hold full access, with no junior or senior split. The platform must work for a team where everyone can see everything, while still recording which of the three acted. It also means the system cannot rely on anyone having spare capacity for data entry."], ["Design work performed", "Outsourced", "Detailed design is carried out by third-party Detailed Design Consultants, and a project may carry more than one. The department's product is coordination and control, so the platform is built around consultant management and revision control rather than drafting."], ["Position in the flow", "BD and Contracts, then Design, then Planning", "Design is a midstream department. Its inputs and outputs cross a department boundary at both ends, which is where its pain points sit."]], "tools": [["MS Office, mainly Excel", "Design and drawing tracking, consultant list and portfolios, evaluation forms, work order drafts", "Replaced. Every one of these becomes a structured record, and the tracker populates itself from workflow rather than being typed."], ["AutoCAD", "Drawing review", "Retained. AutoCAD remains the drawing tool. The platform manages the file, its revision, its status and who may see it, not the drafting."], ["Email", "Every handoff, internal and external, including large drawing files", "Replaced for structured exchange. Notifications continue by email; files and comments move into the platform."], ["Google search", "Sourcing design consultants", "Replaced by the consultant register, with assisted discovery proposing candidates that a reviewer accepts or discards."], ["OneDrive and SharePoint", "Requested by the department, to hold the same file in a familiar place", "Supported. The department asked to have the same file available on OneDrive; how this is arranged is an architecture decision raised in Section 7."], ["SAP", "Not used by this department", "Out of scope for Design."]], "pains": [["1", "Work order creation and template management is manual", "Every appointment is typed from scratch and circulated for verification. Named as the department's first pain point.", "An approved template library, with the work order auto-filled from the selected consultant, the approved quotation and the deliverable schedule, then routed for approval."], ["2", "Sending data and files to consultants is difficult", "Large AutoCAD files move by email, with no control over which version the consultant is working from.", "A project document workspace with controlled upload, automatic revision numbering and consultant access to their own packages only."], ["3", "No visibility of site status", "The department does not know what site is building, what has changed, or what the authority has said.", "Structured site inputs returning against the drawing revision, and a project design view that shows release, response, authority and as-built position in one place."], ["4", "The BOQ from the tender team is not reaching Design", "Without tender quantities the department cannot compare what was priced against what is being designed.", "Tender BOQ as a mandatory handover input, quantities only with cost stripped at field level, feeding the tender-against-design comparison."], ["5", "Consultants are found by Google search", "There is no consultant database. Every package restarts the search, and knowledge of who is good sits with three people.", "A consultant register with profiles, portfolios, credentials and performance history, plus assisted discovery to propose new candidates for review."], ["6", "Consultant evaluation forms are filled by hand", "Technical strength, team capacity, software expertise and past experience are assessed but not retained comparably.", "A digital evaluation form with side-by-side comparison across the shortlist, retained against the project and comparable with later performance."], ["7", "Design tracking is manual", "The tracker is a spreadsheet someone has to maintain, so it is only as current as the last person to update it.", "A tracker derived from workflow events. If anyone has to maintain it, the design has failed and the spreadsheet returns."], ["8", "Revisions are identified and tracked by hand", "R0 and R1 are used, but which revision is current depends on who circulated it last.", "One revision flagged current at any time, earlier ones retained as superseded and visually unmistakable, with a warning when a superseded file is opened."], ["9", "Updates have to be passed to other departments manually", "Design becomes a distribution service. The department was explicit that it does not want to do this.", "Automatic notification on release, and other departments reading status from the system rather than waiting for Design to send it."], ["10", "Site and planning must respond within seven days, but do not always", "A non-response cannot be distinguished from a confirmation, so nobody knows whether a drawing is agreed.", "A visible clock on both sides, escalation on breach, and a non-response treated as an open item rather than silent approval."], ["11", "IE and AE comments are not recorded against the drawing", "The reason a revision exists is lost, and the same comment can recur on the next project.", "Authority submission, comments and approval evidence captured against the exact revision, and visible to Design without having to ask site."], ["12", "Quantity surplus is not notified to Design", "The department expects to be told and to approve when quantity becomes surplus, but nothing produces that notification.", "Variance detection against an agreed tolerance, a notification to Design and a recorded decision before the item proceeds."], ["13", "There is no checklist for the bidding team before handover", "Design starts without confirmation that its inputs are complete and discovers the gaps later.", "A handover checklist with owners, due dates and mandatory flags, shown as a completeness figure both departments can see."], ["14", "Survey and geotechnical reports are the inputs that matter most", "Design cannot begin properly without them, and they are the items most often waited on.", "Both carried as mandatory handover items with their own alert, so a delay is visible at the start rather than at the review."], ["15", "Work priorities and ROW status are not communicated", "The department does not know which details site needs first, or where access has been obtained.", "Both captured as structured inputs from site and liaisoning, driving the priority alignment view."], ["16", "A decision-making system is wanted within the application", "Approvals on consultant selection, work orders, revisions and quantity surplus currently happen in conversation.", "Approval steps built into each workflow, with the decision, the approver and the date recorded against the item being approved."], ["17", "Fixed report formats and a deck format per management layer are wanted", "Reports are assembled by hand each time, in whatever format the last person used.", "A report template library approved once and generated from live data, with an output tier for each management layer."]], "scope": [["1", "Project design record", "Project and package setup; design record summary; input and handover register; project list with filters", "One record per project and package that every consultant, work order, deliverable, revision and quantity hangs from. Nothing lives in a personal folder or a personal inbox."], ["2", "Handover checklist", "Checklist per project with owner, due date and mandatory flag; BD-side view; completeness figure; evidence attachment; exception approval", "Design no longer begins work without knowing what is missing, and BD and Contracts can see the same list."], ["3", "Consultant register", "Consultant directory with search and filter; consultant profile; portfolio and past projects; credentials with expiry; engagement load; assisted discovery", "A searchable consultant estate owned by the company, replacing the manual list and the search that restarts on every package."], ["4", "Evaluation and selection", "Evaluation form with configurable criteria; scoring comparison across the shortlist; quotation comparison; technical recommendation; selection record", "The evaluation on technical strength, team capacity, software expertise and past experience becomes a retained record that can be compared against the consultant's later performance."], ["5", "Work order management", "Approved template library with versions; work order create with auto-fill; verification and approval routing; issue and acknowledgement; amendment and short-closure", "Removes the retyping and email circulation named as the department's first pain point, and holds every version with its approval history."], ["6", "Deliverable schedule and tracker", "Deliverable schedule setup; tracker grid with filters; my queue; overdue view; project and package to consultant mapping; fixed-format export", "The tracker populates itself from workflow events instead of being maintained by hand, and answers what is due, what is late and with whom."], ["7", "Document exchange and revision control", "Project document workspace; upload and submit; automatic revision numbering; current and superseded marking; superseded-access warning; OneDrive or SharePoint access; consultant portal", "One place where the current approved drawing is unambiguous, superseded versions are retained but unmistakable, and large AutoCAD files move without email."], ["8", "Drawing review and comments", "Review screen; comment capture against the revision; return to consultant; resubmission; comment closure; internal approval", "The review loop becomes attributable. Each comment is tied to the revision it was raised against and carried until it is closed."], ["9", "Release and site coordination", "Release screen; automatic notification to site and planning; site response capture; seven-day monitor with escalation; work priority, ROW and site query inputs", "Closes the visibility gap in both directions: site knows a new revision exists, and Design knows what site has said and when."], ["10", "Authority approval tracking", "Submission record; IE and AE comment capture against the revision; approval evidence; ageing and status view by drawing and project", "Authority comments and approvals sit against the exact drawing revision rather than in an inbox at site."], ["11", "Quantity and BOQ control", "Tender BOQ intake, quantity only; tender against design comparison; variance register; surplus notification; surplus approval with recorded decision", "Gives the department the BOQ it has been asking for, and turns quantity drift into something visible and approved rather than discovered."], ["12", "As-built management", "Difference marking from site with evidence and location; forward to consultant; as-built revision; approval and archive; as-built completeness per project", "Turns the as-built obligation into a tracked sequence with a clock, rather than a task remembered at the end of a project."], ["13", "Dashboards and reports", "The fifteen dashboards of Section 3; drill-down to the underlying record; report template library; management formats by layer; export to Excel and PDF", "Management visibility without anyone assembling it by hand, in formats approved once and reused."], ["14", "Alerts, reminders and escalation", "Deliverable due and overdue; handover input overdue; seven-day site and as-built clocks; authority approval ageing; superseded revision access; consultant credential expiry; configurable thresholds", "Replaces manual follow-up, and prevents the most expensive failure in this department, which is building from a superseded drawing."], ["15", "Roles, access and audit", "Internal roles and permissions; separate external consultant access with least privilege; full audit trail; configuration masters for deliverable types, criteria, templates, tolerances and notification thresholds", "All three team members hold equal access today, so the platform records who did what even where permissions are identical, and keeps external parties to their own packages."]], "open": ["That the eight-stage process set out in Section 1 reflects how Design operates today.", "That the thirteen workflows in Section 2 are complete, and that none of the department's work falls outside them.", "Whether the seven-day rule is one rule or three. As-built after project completion, site marking after construction and site response after release were each described to us, and each needs its own start event before any clock can be built.", "Whether the seven-day clocks run on calendar days or working days, and against whose holiday calendar.", "Who submits drawings to the Independent Engineer and the Authority Engineer, Design or site. Our notes support both readings, and the answer decides whether Design owns a submission workflow or a visibility view.", "That the fifteen dashboards in Section 3 match management priority, and whether any view is missing.", "How the tender BOQ should reach Design. A feed from the BD tracker, or a structured upload until that department is digitised. The department has been asking for this and not receiving it, so the mechanism matters more than the format.", "The mandatory input list for the handover checklist in Section 7, and its owners and due dates, agreed between Design and BD and Contracts.", "The weightings and pass threshold for consultant evaluation, across technical strength, team capacity, software expertise and past experience.", "Who approves a work order, and whether that authority varies by value.", "Whether drawing files should remain on OneDrive with the platform holding status, revisions and links, or move into the platform with OneDrive kept as a synced copy. This is an architecture decision rather than a configuration one, and we recommend the second.", "Whether Detailed Design Consultants should have direct access to submit deliverables and receive comments, or whether all exchange continues to pass through the Design team.", "What quantity variance should trigger the surplus notification to Design, in percentage or absolute terms.", "Who is accountable for supplying ROW status and work priorities from site to Design, and at what frequency.", "The fixed report formats and the deck format for each management layer, and which management layers these are.", "Whether site staff marking as-built differences and responding to released drawings should be able to do so on mobile, or whether a mobile-friendly web view is sufficient.", "Whether existing consultant records, drawing registers and revision history should be migrated at go-live, and in what form they are held."], "sap": {"1": ["Project code and WBS (for linking only — Design keeps no data in SAP today)", "PS", "Read"], "5": ["Consultant vendor code, where the consultant is a SAP vendor", "MM / FI", "Read"]}}, "planning": {"key": "planning", "name": "Planning", "intro": ["Planning is the department that converts an awarded tender into something the business can execute against, and then holds execution to it. It runs in two halves. A Head Office planning team sets the project up — the site visit, the introduction meeting, the budget, the master schedule and the kick-off — and then reviews what comes back from every project. Site planning teams supply the daily and monthly information that the Head Office team verifies. Between them they own the numbers that management, finance and every other department read.", "The department works through ten stages. The first seven set a project up and end at a gate: nothing is released to execution until the approvals behind it exist. The last three are the monitoring cycle that runs for the life of the project."], "insight": "The kick-off gate is the structural feature of this process. On the fifteenth day from the introduction meeting, the mobilization plan, the budget, the master plan, the resource plan, the construction programme, the strategy and the milestones must all be approved and presented before the project is released for execution. Everything before that gate is setup; everything after it is a repeating cycle of daily reports, weekly reports, monthly plans, reconciliation and exception reporting, running until the project closes.", "flowcap": "Master flow — ten stages from tender study to project closure", "flow": [{"t": "1. Tender Study", "s": "award and data from BD", "dec": false, "hl": false}, {"t": "2. Site Visit", "s": "within 5 days", "dec": false, "hl": false}, {"t": "3. Introduction Meeting", "s": "within 7 days", "dec": false, "hl": false}, {"t": "4. Budget Approval", "s": "7 working days · SAP / WBS", "dec": false, "hl": true}, {"t": "5. Mobilization Plan", "s": "manpower, material, P&M", "dec": false, "hl": false}, {"t": "6. Master Schedule", "s": "seven planning components", "dec": false, "hl": true}, {"t": "Kick-off ready?", "s": "day 15", "dec": true, "hl": false}, {"t": "Release withheld", "s": "execution blocked", "dec": false, "hl": false}, {"t": "7. Kick-Off Gate", "s": "released to execution", "dec": false, "hl": true}, {"t": "8. Daily Monitoring", "s": "DPR and WPR cycle", "dec": false, "hl": true}, {"t": "9. Reporting and Reconciliation", "s": "MPR, planned vs achieved, MIS", "dec": false, "hl": false}, {"t": "10. Closure", "s": "planning records closed", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Project Award and Tender Study", "text": "On award, the department receives the project data from the BD team and studies the tender. Planning begins in Microsoft Project and is then exported to Excel, after which the Excel file becomes the working plan. From this point the department begins issuing requirements to the functions that will supply them: design data to Design, material data to Procurement, resource planning to HR.", "nodes": [{"t": "Project awarded", "s": "BD hands over", "dec": false, "hl": false}, {"t": "Tender study", "s": "scope and assumptions", "dec": false, "hl": false}, {"t": "Plan built in MS Project", "s": "exported to Excel", "dec": false, "hl": true}, {"t": "Excel becomes the plan", "s": "maintained by hand", "dec": false, "hl": true}], "note": "Once the schedule leaves Microsoft Project it is maintained in Excel, so the tool that produced the plan and the file the business actually uses are not the same thing."}, {"title": "Stage 2 — Preliminary Site Visit", "text": "The site visit is a Planning responsibility and is carried out within five days. It validates the tender assumptions against ground conditions and captures soil availability, quarry locations, raw-material rates, lead charts and photographs. The findings are issued as a Site Visit Report, reviewed by the Planning GM and approved by the SVP.", "nodes": [{"t": "Visit scheduled", "s": "within 5 days", "dec": false, "hl": false}, {"t": "Site data captured", "s": "soil, quarry, rates, leads, photos", "dec": false, "hl": true}, {"t": "Site Visit Report", "s": "findings and risks", "dec": false, "hl": false}, {"t": "Planning GM review", "s": "verification", "dec": false, "hl": false}, {"t": "SVP approval", "s": "report closed", "dec": false, "hl": false}], "note": "Capture is against a checklist and includes quotations and supporting documents. Photographs and geo details are part of the record, not an attachment to an email."}, {"title": "Stage 3 — Project Introduction Meeting", "text": "Within seven days of tender receipt an introduction meeting is held with the relevant stakeholders. It covers scope, site conditions, risks, execution strategy and the timelines for documents and budgets. The output is a minutes of meeting document, and every participant is expected to acknowledge it.", "nodes": [{"t": "Meeting scheduled", "s": "within 7 days of tender receipt", "dec": false, "hl": false}, {"t": "Agenda and participants", "s": "all relevant departments", "dec": false, "hl": false}, {"t": "Decisions and due dates", "s": "documents and budgets", "dec": false, "hl": false}, {"t": "MOM and acknowledgement", "s": "chased by hand today", "dec": false, "hl": true}], "note": "The meeting sets the due dates every other department then works to, which is why an unacknowledged MOM is not an administrative loose end."}, {"title": "Stage 4 — Department Budget Collection and Approval", "text": "Budget sheets are collected from each department within seven working days, consolidated by Planning, reviewed by the Project Coordinator and approved by the SVP. A rejected submission returns to the department with comments for resubmission. Once approved, the summarised budget is passed to the Techno-Commercial team and uploaded against the WBS in SAP.", "nodes": [{"t": "Budget request issued", "s": "to every department", "dec": false, "hl": false}, {"t": "Department sheets returned", "s": "7 working days", "dec": false, "hl": true}, {"t": "Complete?", "s": "review outcome", "dec": true, "hl": false}, {"t": "Comment and resubmit", "s": "returns to department", "dec": false, "hl": true}, {"t": "Consolidated by Planning", "s": "one project budget", "dec": false, "hl": false}, {"t": "Project Coordinator review", "s": "verification", "dec": false, "hl": false}, {"t": "SVP approval", "s": "budget fixed", "dec": false, "hl": false}, {"t": "SAP / WBS upload", "s": "via Techno-Commercial", "dec": false, "hl": true}], "note": "Chasing the departments that have not submitted is manual work today, and there is no single view of who is outstanding against the seven-day clock."}, {"title": "Stage 5 — Mobilization Planning", "text": "Against the approved budget and scope, the department plans the resources the project will need — manpower, materials, plant and machinery, and site establishment — and issues the requirements to the functions that supply them.", "nodes": [{"t": "Approved budget and scope", "s": "baseline set", "dec": false, "hl": false}, {"t": "Resource requirement planned", "s": "manpower, material, P&M", "dec": false, "hl": false}, {"t": "Requirements issued", "s": "HR, Procurement, P&M", "dec": false, "hl": true}, {"t": "Mobilization plan baselined", "s": "input to kick-off", "dec": false, "hl": false}], "note": "Resource planning goes to Head Office for consolidation. Today the requirement and the response travel by email and spreadsheet."}, {"title": "Stage 6 — Master Planning and Schedule Approval", "text": "The master plan is not only a list of activities. The monthly work programme, the S-curve, the cash flow, the manpower plan, the machinery plan and the material requirement are all compulsory planning outputs and all linked to the same baseline. The package is reviewed by the Planning GM and the Project Coordinator, approved by the SVP, and released to site and the project manager as an activity-wise Master Work Programme.", "nodes": [{"t": "Draft master plan", "s": "schedule and WBS", "dec": false, "hl": false}, {"t": "Seven planning components", "s": "schedule, S-curve, cash flow, manpower, machinery, material, monthly programme", "dec": false, "hl": true}, {"t": "Planning GM review", "s": "first review", "dec": false, "hl": false}, {"t": "Project Coordinator review", "s": "second review", "dec": false, "hl": false}, {"t": "SVP approval", "s": "baseline locked", "dec": false, "hl": false}, {"t": "Released to site and PM", "s": "activity-wise work programme", "dec": false, "hl": true}], "note": "A rejection carries a reason and returns for revision. The approved version becomes a locked baseline, and later revisions are compared against it rather than replacing it."}, {"title": "Stage 7 — Kick-Off and Release to Execution", "text": "On the fifteenth day from the introduction meeting, the kick-off is held. The approved mobilization plan, budget, master plan, resources, construction programme, strategy and milestones are presented, the minutes are issued and acknowledged, and only then is the project released for execution.", "nodes": [{"t": "Kick-off scheduled", "s": "day 15 from introduction", "dec": false, "hl": false}, {"t": "All approvals in place?", "s": "mandatory checklist", "dec": true, "hl": false}, {"t": "Release blocked", "s": "missing item named", "dec": false, "hl": true}, {"t": "Presentation and attendance", "s": "stakeholders present", "dec": false, "hl": false}, {"t": "MOM and acknowledgement", "s": "recorded", "dec": false, "hl": false}, {"t": "Released to execution", "s": "project starts", "dec": false, "hl": true}], "note": "The checklist covers mobilization, budget, master plan, resources, construction programme, strategy and milestones. A missing approval should hold the release rather than be noted and passed over."}, {"title": "Stage 8 — Daily and Weekly Progress Monitoring", "text": "The site team submits the daily progress report covering the previous day's work. The Head Office team reviews it the same morning and either verifies it or flags it back to site with comments. The cycle is expected to close on the day the report is received. A weekly progress report follows every Monday.", "nodes": [{"t": "Site submits DPR", "s": "by 9:30, previous day's work", "dec": false, "hl": false}, {"t": "HO review", "s": "by 11:00", "dec": false, "hl": true}, {"t": "Verified?", "s": "against design and plan", "dec": true, "hl": false}, {"t": "Flagged to site", "s": "comments returned", "dec": false, "hl": true}, {"t": "Approved", "s": "by 16:00, same day", "dec": false, "hl": false}], "note": "Verification includes component-wise quantities and a comparison against the current design. The weekly progress report is issued every Monday."}, {"title": "Stage 9 — Monthly Reporting, Reconciliation and Exceptions", "text": "Site planning teams submit a monthly plan which the Head Office team verifies. Planned quantities are compared against achieved quantities, reconciliation is carried out, exception reports are raised, and the management MIS pack is issued on the fixed monthly dates.", "nodes": [{"t": "Monthly plan from site", "s": "per project", "dec": false, "hl": false}, {"t": "HO verification", "s": "multiple projects reviewed", "dec": false, "hl": true}, {"t": "Planned versus achieved", "s": "by activity and quantity", "dec": false, "hl": false}, {"t": "Reconciliation", "s": "balance quantity", "dec": false, "hl": false}, {"t": "MIS issued", "s": "fixed monthly dates", "dec": false, "hl": true}], "note": "Exception reports sit alongside the MIS. Management asked for early red flags on a visual dashboard rather than another set of SAP and Excel reports."}, {"title": "Stage 10 — Project Closure", "text": "At the end of execution the balance quantities are closed out, the final reconciliation is completed, and the planning record for the project is closed and handed over.", "nodes": [{"t": "Balance quantity closed", "s": "final position", "dec": false, "hl": false}, {"t": "Final reconciliation", "s": "plan against actual", "dec": false, "hl": false}, {"t": "Planning record closed", "s": "handed over", "dec": false, "hl": false}], "note": "Closure was named as a stage but not described in detail during the discussion. The scope of Planning's closure obligations is raised for confirmation in Section 8."}], "extra": null, "workflows": [["1", "Project initiation and tender study", "Project awarded and data received from BD", "BD, Planning", "Planning record opened against the project and WBS, with tender scope, quantities and assumptions held in one place"], ["2", "Preliminary site visit", "Project record opened", "Planning, Planning GM, SVP", "Site Visit Report with checklist findings, geo and site details, photographs, quotations, risks and rates, reviewed and approved within the five-day window"], ["3", "Project introduction meeting", "Tender received", "Planning, all contributing departments", "Minutes of meeting with decisions, document and budget due dates, and an acknowledgement recorded against each participant"], ["4", "Department budget collection", "Introduction meeting held", "Planning, every contributing department", "Department budget sheets received against a seven-working-day clock, with a live list of who is still outstanding"], ["5", "Budget consolidation, review and approval", "Department sheets received", "Planning, Project Coordinator, SVP", "One approved project budget, with rejected submissions returned with comments and resubmitted rather than corrected offline"], ["6", "SAP and WBS budget handover", "Budget approved", "Planning, Techno-Commercial", "Budget uploaded against the WBS with a recorded sync status, mapping reference, timestamp and error log"], ["7", "Mobilization planning and resource requisition", "Budget approved", "Planning, HR, Procurement, Plant and Machinery", "Manpower, material and machinery requirements issued to the supplying functions with dates attached"], ["8", "Master planning component preparation", "Mobilization plan settled", "Planning", "Master schedule, S-curve, cash flow, manpower plan, machinery plan, material plan and monthly work programme, all linked to one baseline"], ["9", "Schedule approval and baseline release", "Master plan drafted", "Planning GM, Project Coordinator, SVP", "Approved and locked baseline released to site and the project manager as an activity-wise work programme, with revision comparison against the previous version"], ["10", "Kick-off readiness gate", "Day fifteen from the introduction meeting", "Planning, Management, all departments", "A checked mandatory document list, presentation, attendance, minutes and acknowledgement, followed by an explicit release to execution or a blocked release naming what is missing"], ["11", "Daily progress reporting and verification", "Site submits the previous day's report", "Site planning, Head Office planning", "A verified or flagged daily report closed the same day, with the review and approval times recorded against the clocks"], ["12", "Progress against design and quantity check", "Daily report received", "Planning, Design, Site", "Component-wise quantities checked against the current design, with differences returned to site as comments rather than resolved by telephone"], ["13", "Weekly progress reporting", "Every Monday", "Site planning, Head Office planning", "Weekly progress report generated from the daily data already verified, rather than re-entered"], ["14", "Monthly plan and material requirement", "Monthly planning cycle", "Planning, Design, Procurement, Site", "Monthly work programme and the material requirement that follows from it, passed to Procurement as a structured requirement"], ["15", "Planned versus achieved and reconciliation", "Month end", "Planning, Site, Billing", "Achieved quantity against planned quantity by activity, with balance quantity and reconciliation derived rather than rebuilt in a spreadsheet"], ["16", "Exception reporting and escalation", "A deviation, delay or breach is detected", "Planning, Project Coordinator, Management", "An exception raised with an owner and a due date, escalating through the defined hierarchy until it is closed"], ["17", "Monthly MIS pack generation", "Fixed monthly reporting dates", "Planning, Management", "The management pack produced in an approved format from live data on the fixed dates, without anyone assembling it"], ["18", "Project closure and planning handover", "Execution complete", "Planning, Site, Project Closure", "Balance quantities closed, final reconciliation completed and the planning record handed over"]], "dashboards": [["1", "Project status summary", "How much is complete, when it completed, weekly and monthly, and overall status across every live project", "cap"], ["2", "Planned versus achieved", "Planned against achieved quantity by activity, package and period, with variance", "now"], ["3", "Activity-wise progress", "Progress by major work item — earthwork, granular sub-base, wet mix macadam, dense bituminous macadam and bituminous concrete", "now"], ["4", "Completion measurement", "Project completion measured by milestone, by payment and by quantity calculation, side by side", "cap"], ["5", "DPR submission monitor", "Reports submitted, reviewed, approved or flagged against the daily clocks, by project and by site", "cap"], ["6", "Progress against design", "Reported quantity against design quantity, with differences open against site", "cap"], ["7", "Budget versus actual", "Budget against actual cost by WBS element, by department and by project", "sap"], ["8", "Budget collection status", "Department budget sheets received and outstanding against the seven-working-day clock, per project", "cap"], ["9", "Master schedule and S-curve", "Baseline against current schedule, with the S-curve and critical activities", "now"], ["10", "Cash flow plan versus actual", "Planned cash flow against actual, by month and by project", "sap"], ["11", "Manpower plan versus deployed", "Planned manpower against deployed, by category and by site", "cap"], ["12", "Machinery plan versus deployed", "Planned machinery against deployed and utilised, by site", "cap"], ["13", "Material requirement and supply", "Monthly material requirement against purchase and delivery status", "sap"], ["14", "Reconciliation and balance quantity", "Total project quantity, executed to date, remaining quantity and reconciliation position by unit of measurement", "now"], ["15", "Exception and red flag register", "Deviations, delays and breaches with owner, age and escalation level, surfaced early rather than at month end", "cap"], ["16", "Project readiness", "Where each project stands against the site visit, introduction meeting, budget, master plan and kick-off gate", "cap"], ["17", "Planning SLA monitor", "Every planning clock — due today, due soon, breached — with owner and escalation", "cap"], ["18", "MIS pack status", "Which reports are due, prepared, issued and outstanding against the fixed monthly dates", "cap"]], "obs": "We note that most of what Planning does today is collection. Information exists across the business but has to be gathered, aggregated and converted into management reports by hand, which is why so many of the pain points in Section 6 are about format and delay rather than about the planning work itself.", "interactions": [["BD and Tender team", "Awarded project data, tender documents, scope, quantities and the assumptions priced at tender", "Validation of tender assumptions against ground conditions from the preliminary site visit", "Handover on award. The site visit findings are reported upward but not fed back against the tender assumption that they test."], ["Design", "Drawings, design revisions and design quantities", "Design requirement dates from the master plan, the monthly plan, and queries where reported progress does not match the current design", "Email and shared files. Design data is compared against reported progress manually."], ["Procurement and Purchase", "Purchase order and delivery status", "Monthly material requirement derived from the monthly work programme", "The requirement passes by spreadsheet. The planning cycle ends at Purchase, so a late requirement becomes a late delivery."], ["Stores", "Stock position and consumption against issued material", "Material planning and expected consumption", "Reconciled manually against reported progress."], ["Human Resources", "Manpower availability and actual deployment", "Manpower plan and resource requirement, consolidated to Head Office", "Resource planning is sent to Head Office. Planned against deployed is not visible in one place."], ["Plant and Machinery", "Machinery availability, deployment and utilisation", "Machinery plan and mobilization requirement", "Planned and actual held separately."], ["Techno-Commercial", "WBS creation and confirmation of the SAP upload", "The approved summarised budget for upload against the WBS", "Handover after SVP approval. There is no recorded status showing whether the upload succeeded."], ["Finance and Accounts", "Actual cost booked against the project", "Project budget and the planned cash flow", "Through SAP, retrieved manually when a report is being built."], ["Quality", "Test results and non-conformance affecting reported progress", "Quality requirement dates within the master plan", "Reported separately from progress."], ["Safety", "Site safety reporting", "Safety requirements within the plan and the monitoring cycle", "Site safety management was described as part of the monitoring flow but is reported outside it."], ["Billing", "Certified quantities", "Executed quantity and progress data supporting certification", "Quantities are reconciled between the two by hand."], ["Site team and Project Manager", "Daily progress reports, monthly plans, site quantities, site activities and site conditions", "The released master work programme, verified plans, comments on flagged reports and the approved monthly plan", "Excel, email and WhatsApp. The site team cannot check or monitor its own information in a system."], ["Management, SVP and Planning GM", "Approvals at the site visit, budget, schedule and kick-off gates", "MIS pack, dashboards, exception reports and early red flags", "Assembled manually each period. Management asked for a visual dashboard rather than another SAP or Excel report."]], "profile": [["Team structure", "Head Office planning team and site planning teams", "Two populations with different jobs. Site supplies daily and monthly information; Head Office verifies it across multiple projects at once. The platform therefore needs a site-facing entry experience and a Head Office review queue, not one screen serving both."], ["Team size", "Not recorded during the discussion", "Headcount at Head Office and at each site was not captured. It affects queue design and review load, and we have raised it in Section 8."], ["SAP usage", "In use", "Unlike other departments in this programme, Planning already depends on SAP. The approved budget is uploaded against the WBS, and actual cost sits there. The problem is not absence of SAP but retrieval: data is searched for across email and Excel instead of being pulled from it."], ["WBS coding", "Not fully aligned", "Budget, execution, resources, actual cost and MIS must share one WBS structure and coding. Until they do, budget-against-actual reporting will stay unreliable whatever is built on top of it."], ["Position in the flow", "BD and Contracts, then Design, then Planning", "Planning is downstream of Design and upstream of Purchase, HR and execution. Its planning cycle runs budget, design, revision, planning, monthly plan, purchase."]], "tools": [["Microsoft Project", "Building the initial schedule, which is then exported", "Retained or replaced, subject to confirmation. The schedule can be imported and held as a baseline in the platform, or the platform can own the schedule outright. This is raised in Section 8."], ["Microsoft Planner", "Used on a few projects", "Replaced. Task and activity tracking moves into the project plan rather than sitting in a separate tool for some projects and not others."], ["Excel", "The working plan after export, progress tracking, budgets, monthly plans, reconciliation and every report", "Replaced. These become structured records, and the reports generate themselves from data that was entered once."], ["Email and WhatsApp", "Daily reports, departmental inputs, chasing and approvals", "Replaced for structured exchange. These channels are the main source of the duplication the department described."], ["SAP", "WBS, approved budget and actual cost", "Retained as the financial record. The platform reads from it and writes the approved budget to it, with the sync status visible rather than assumed."]], "pains": [["1", "Information exists but has to be collected and aggregated by hand", "The department spends its time assembling management reports rather than planning.", "Reports generated from data captured once at source, so consolidation stops being a monthly task."], ["2", "Departmental inputs arrive late, missing or in different formats", "A report is only as current as the slowest contributor, and formats have to be reconciled before anything can be summarised.", "Structured request and submission with a due date per department, a live list of who is outstanding, and one format for everyone."], ["3", "MIS was named as a pain point", "The pack is assembled manually against fixed monthly dates and is out of date by the time it is read.", "MIS generated from live data in approved formats on the fixed dates, with a status view showing what is due and what is outstanding."], ["4", "Planning starts in MS Project and then moves to Excel", "The schedule logic and the progress against it live in different files, kept in step by a person.", "One plan of record, with the schedule, the S-curve, the cash flow and the resource plans linked to the same baseline."], ["5", "Excel, WhatsApp, email and SAP flows create duplication", "The same number is entered several times in several places, and disagreement between them has to be investigated.", "Direct import and integration, with one entry point per fact and everything else reading from it."], ["6", "Data has to be searched for across emails and Excel files", "Time is lost finding information that SAP or a previous report already holds.", "Relevant SAP data surfaced in the planning screens directly, rather than retrieved by hand each time it is needed."], ["7", "WBS coding is not aligned across budget, execution, resources and cost", "Budget against actual cannot be trusted, so neither can anything built on top of it.", "One WBS structure agreed and applied across budget, execution, resources, actual cost and MIS, as a precondition rather than a later correction."], ["9", "The daily report cycle is manual", "The previous day's report is checked each morning and has to be closed the same day, which leaves no room for chasing.", "Digital daily report with the submission, review and approval clocks running automatically, and flagged reports returned with comments in the system."], ["10", "The site team cannot check or monitor its own information", "Site supplies the data but cannot see what happened to it, so queries come back by telephone.", "Site-facing views showing submitted reports, their status, comments raised and the current approved plan."], ["11", "Weekly and monthly plans, material requirements and cash flow are substantially manual", "Each is rebuilt each period from the same underlying data.", "All four derived from the master plan and the verified daily data, with the monthly material requirement passing to Procurement as a structured requirement."], ["12", "Management wants a visual dashboard with early red flags", "SAP and Excel reports show a position; they do not warn.", "An exception and red flag register feeding a management view, raised as a deviation occurs rather than at month end."], ["13", "Department budget sheets have to be chased", "The seven-working-day clock exists in the SOP but nothing enforces or displays it.", "Budget request and submission tracker with the pending department list, the due date and escalation on breach."], ["14", "Meeting minutes have to be chased for acknowledgement", "The introduction meeting sets the due dates every department then works to, so an unacknowledged minute is an unowned commitment.", "Minutes generated from the meeting record, with an acknowledgement tracker and automatic reminders on those still pending."], ["15", "There is no hard gate before execution starts", "A project can begin with an approval missing, and the consequence surfaces months later.", "Kick-off built as a readiness gate: mandatory checklist, presentation, attendance, minutes and acknowledgement, with release blocked and the missing item named."], ["16", "Planned against achieved is rebuilt each period", "The comparison management relies on is reconstructed by hand from several sources.", "Planned against achieved derived from the baseline and the verified daily data, available at
