ages five and six hand the contract over to the people who will build it. Stage seven is where most of the department's time goes: an unbroken flow of correspondence with the client, each item needing an owner, inputs from other departments, a review and a response date. Whenever something on site or from the client affects time or cost, the matter moves into stage eight, where a late notice or missing evidence can cost PIL the claim.", "flowcap": "Master flow — nine stages from tender support to contract closure", "flow": [{"t": "1. Tender Support", "s": "document review and queries", "dec": false, "hl": false}, {"t": "2. LOA Acceptance", "s": "within 7 days of award", "dec": false, "hl": true}, {"t": "3. Security and Insurance", "s": "BG in 15 to 30 days", "dec": false, "hl": false}, {"t": "4. Agreement", "s": "Legal, POA, Finance · ~45 days", "dec": false, "hl": true}, {"t": "5. Contract Initiation", "s": "land, memorandum, appointed date", "dec": false, "hl": false}, {"t": "6. Mobilisation", "s": "work programme and CAD", "dec": false, "hl": false}, {"t": "7. Administration", "s": "letters, reviews, submissions", "dec": false, "hl": false}, {"t": "Time or cost affected?", "s": "event on site or from client", "dec": true, "hl": false}, {"t": "8. Variation, EOT, Claims", "s": "notice, evidence, submission", "dec": false, "hl": true}, {"t": "9. Securities, Disputes, Closure", "s": "renewal, resolution, DLP and close", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Tender and Bid Document Support", "text": "Before award, the department checks the tender and bid documents — conditions, technical schedules, eligibility and supporting certificates, and the draft agreement. Where it finds a mistake, an ambiguity or something that needs clarification, it goes to the Tender team, who raise the query with the client.", "nodes": [{"t": "Tender received", "s": "RFP, draft agreement, drawings", "dec": false, "hl": false}, {"t": "Contract review", "s": "conditions and schedules", "dec": false, "hl": false}, {"t": "Issue found", "s": "error, update or feedback", "dec": false, "hl": true}, {"t": "Query via Tender", "s": "raised with the client", "dec": false, "hl": false}], "note": "The tender register and the certificates required for each bid sit with this stage. Queries and their answers are held in email today, separate from the tender they concern."}, {"title": "Stage 2 — Award and LOA Acceptance", "text": "On award, the client issues the Letter of Award. The department prepares and issues the acceptance within seven days. This is the first of several contractual clocks and it starts the moment the LOA arrives.", "nodes": [{"t": "Project awarded", "s": "LOA received", "dec": false, "hl": false}, {"t": "Acceptance drafted", "s": "by Contract", "dec": false, "hl": false}, {"t": "Approved", "s": "internal sign-off", "dec": false, "hl": false}, {"t": "Acceptance issued", "s": "within 7 days", "dec": false, "hl": true}], "note": "The department asked that other teams be notified automatically once a project is awarded, so that their own obligations start from the same date rather than from whenever they hear about it."}, {"title": "Stage 3 — Performance Security and Insurance", "text": "The department issues the required format for the performance security — a bank guarantee, or where the contract allows it, an insurance surety bond — and works with Accounts to have it issued and submitted to the client, typically within fifteen to thirty days. The insurance policies the contract requires are arranged in the same window.", "nodes": [{"t": "Security format", "s": "as per contract", "dec": false, "hl": false}, {"t": "Request to Accounts", "s": "BG or surety bond", "dec": false, "hl": true}, {"t": "Instrument issued", "s": "bank or insurer", "dec": false, "hl": false}, {"t": "Submitted to client", "s": "15 to 30 days", "dec": false, "hl": false}], "note": "Contractor's all-risk and workmen's compensation cover were both mentioned, along with insurance due dates. Every instrument carries an expiry, and a lapse is a contractual default."}, {"title": "Stage 4 — Legal Opinion, Power of Attorney and Agreement", "text": "The agreement needs a legal opinion, a power of attorney for the signatory, and Finance's inputs. The department coordinates all of these so that the agreement is executed and signed by both parties within the contractual period, generally around forty-five days.", "nodes": [{"t": "Acceptance and BG", "s": "submitted", "dec": false, "hl": false}, {"t": "Legal", "s": "opinion and POA", "dec": false, "hl": true}, {"t": "Finance", "s": "required inputs", "dec": false, "hl": true}, {"t": "Agreement signed", "s": "both parties · ~45 days", "dec": false, "hl": false}], "note": "Highlighted steps sit with other departments. The department carries the deadline but not the work, which is why it spends so much of this window following up."}, {"title": "Stage 5 — Contract Initiation and Appointed Date", "text": "After the agreement, the client provides the land, and permission to use it is received. The site team confirms the location on the ground and a memorandum is signed. The appointed date — the contractual start — then follows, and the construction period runs from it.", "nodes": [{"t": "Land provided", "s": "permission to use", "dec": false, "hl": false}, {"t": "Location confirmed", "s": "by site team", "dec": false, "hl": false}, {"t": "Memorandum signed", "s": "with client", "dec": false, "hl": false}, {"t": "Appointed date", "s": "contract clock starts", "dec": false, "hl": true}], "note": "We recorded thirty days for EPC and one hundred and fifty days for HAM and BOT against this part of the process. What those periods run between is raised in Section 8."}, {"title": "Stage 6 — Mobilisation, Work Programme and Contract Appreciation", "text": "From the appointed date, Planning begins mobilisation and prepares the work programme. The department reviews it and submits it to the client. It also prepares the Contract Appreciation Document, which sets out the obligations, dates, securities and clauses the project team needs to work to.", "nodes": [{"t": "Mobilisation", "s": "Planning starts", "dec": false, "hl": false}, {"t": "Work programme", "s": "prepared by Planning", "dec": false, "hl": false}, {"t": "Contract review", "s": "then submitted to client", "dec": false, "hl": true}, {"t": "CAD issued", "s": "obligations handed over", "dec": false, "hl": false}], "note": "The CAD is the natural source for the obligation calendar in the proposed platform. Each obligation it lists can become a dated item with an owner rather than a paragraph in a document."}, {"title": "Stage 7 — Contract Administration and Correspondence", "text": "For the rest of the project, the department runs the formal communication with the client. Letters from site reach head office by email. Letters from the client often need inputs from two or more departments. Every document going to the client — from any department — is reviewed by Contract before it is submitted, and Contract submits it. The department also raises assistance requests with the client, such as shifting electrical lines and other utilities.", "nodes": [{"t": "Letter or document", "s": "from client, site or department", "dec": false, "hl": false}, {"t": "Inputs requested", "s": "Planning, Design, Quality…", "dec": false, "hl": true}, {"t": "Draft prepared", "s": "response or submission", "dec": false, "hl": false}, {"t": "Cleared?", "s": "Contract review", "dec": true, "hl": false}, {"t": "Issued to client", "s": "by Contract", "dec": false, "hl": false}], "note": "Where review returns a draft, it goes back to the department that prepared it. Delays in submissions attract penalties, and there is no single place today that shows which letters are awaiting inputs, review or reply."}, {"title": "Stage 8 — Variations, Extensions of Time and Claims", "text": "Where scope changes, where the client or an authority delays access or approvals, or where an event outside PIL's control affects the work, the department gives notice within the period the contract allows, gathers the evidence, and submits the variation, extension of time or claim.", "nodes": [{"t": "Event recorded", "s": "date and clause", "dec": false, "hl": false}, {"t": "Notice given", "s": "within contract period", "dec": false, "hl": true}, {"t": "Evidence gathered", "s": "progress, tests, drawings", "dec": false, "hl": true}, {"t": "Submitted", "s": "time and cost sought", "dec": false, "hl": false}, {"t": "Outcome", "s": "accepted, rejected, disputed", "dec": false, "hl": false}], "note": "A notice given late, or a claim without evidence, can lose the right to time or cost and leave PIL open to deductions. Commercial calculation and approval stay with the teams responsible for them."}, {"title": "Stage 9 — Securities, Disputes and Closure", "text": "Securities and insurance are kept valid, extended and eventually released. Disputes move through negotiation, conciliation or arbitration, with Legal involved where needed. The contractual record is held through completion, the defect liability or maintenance period, and final closure.", "nodes": [{"t": "Renewals", "s": "BG and insurance", "dec": false, "hl": false}, {"t": "Disputes", "s": "negotiation to arbitration", "dec": false, "hl": false}, {"t": "Completion", "s": "DLP, O&M obligations", "dec": false, "hl": false}, {"t": "Release and closure", "s": "securities returned", "dec": false, "hl": true}], "note": "For BOT and HAM projects the operation and maintenance period can run for many years after construction, so the contract record has to outlive the people who set it up."}], "extra": {"title": "Contract models", "heads": ["Model", "As we understood it", "What it changes for the Contract department"], "rows": [["EPC", "Engineering, procurement and construction of the full project, with defined milestones and a limited maintenance obligation", "Milestone-linked payment, milestone and completion dates, defect liability period"], ["HAM", "Hybrid annuity: the client funds part of the cost during construction, recorded as 40 to 60 percent, and the balance is paid over time", "Construction milestones plus a long operation and maintenance period, and annuity-related obligations"], ["BOT", "Build, operate and transfer: PIL carries almost the whole project, the client pays nothing, and PIL earns from the project's revenue", "Longest obligation period, operation obligations and transfer conditions at the end of the concession"], ["Item rate", "Payment for work done, against measured quantities at agreed rates", "Measurement and certification prerequisites rather than milestones"]]}, "workflows": [["1", "Tender document review and query routing", "Tender or bid documents received", "Contract, Tender", "Review comments on the tender, and queries passed to the Tender team for raising with the client, with the answers held against the tender"], ["2", "Award registration and notification", "LOA received", "Contract, all dependent departments", "A contract record opened with its model and SAP project reference, and an automatic notice to every department whose clock starts at award"], ["3", "LOA acceptance", "Contract record opened", "Contract, management", "An acceptance letter drafted, approved and issued within seven days"], ["4", "Performance security", "LOA accepted", "Contract, Accounts, bank or insurer", "A bank guarantee or surety bond in the contract's format, issued and submitted within fifteen to thirty days, and entered in the security register"], ["5", "Insurance arrangement", "LOA accepted, or policy due", "Contract, Accounts or Insurance, insurer", "The required policies in place, with their cover period and expiry recorded"], ["6", "Legal opinion, POA and agreement execution", "Security submitted", "Contract, Legal, Finance, client", "A signed agreement within the contractual period, held as the governing record and never overwritten"], ["7", "Land, permission and memorandum", "Agreement signed", "Contract, site team, client", "Permission to use the land, the location confirmed by site and the memorandum signed"], ["8", "Appointed date", "Conditions for start satisfied", "Contract, client", "The appointed date recorded, and every dependent date in the contract calculated from it"], ["9", "Work programme submission", "Appointed date", "Planning, Contract, client", "The work programme reviewed by Contract and submitted to the client, with acknowledgement recorded"], ["10", "Contract Appreciation Document", "Agreement signed", "Contract, project team", "The CAD issued, and its obligations entered as dated items with owners"], ["11", "Incoming correspondence registration", "Letter, email or notice received at head office or site", "Contract, site team", "A registered letter with reference number, owner, priority and response date, linked to the contract"], ["12", "Internal input request", "A letter or submission needs another department's input", "Contract, any department", "A tracked request with owner and promised date, followed up automatically and visible until answered"], ["13", "Contract review of outgoing documents", "Any department prepares a document for the client", "Originating department, Contract", "The document cleared or returned with comments; only cleared documents are issued"], ["14", "Outgoing letter issue and acknowledgement", "Draft cleared and approved", "Contract, approver, client", "A letter issued with its reference number, proof of submission and client acknowledgement"], ["15", "Client assistance requests", "Site needs action from the client", "Site team, Contract, client", "A request for utility shifting, access or permission raised formally and tracked to closure"], ["16", "Variation and change of scope", "Scope, quantity or design change", "Contract, Design, Planning, Billing", "A variation registered with clause, evidence, submission and outcome"], ["17", "Delay events and extension of time", "Client or authority delay, access or permission issue, force majeure, change in law", "Contract, Planning, site team", "Notice given within the contractual period, and an EOT request with evidence and outcome"], ["18", "Claims and penalty defence", "Cost impact, or penalty threatened or levied", "Contract, Planning, Quality, Finance", "A claim or defence with its evidence pack, submission and result; calculations remain with the responsible team"], ["19", "Security and insurance renewal, release and claims", "Expiry approaching, release condition met, or insured event", "Contract, Accounts, bank or insurer", "Instruments extended before expiry, released when due, and insurance claims tracked against the event"], ["20", "Disputes and closure", "Claim unresolved, or contract completing", "Contract, Legal, management", "A dispute tracked through negotiation, conciliation or arbitration, and the contract closed through DLP or O&M with its record complete"]], "dashboards": [["1", "My pending items", "Each user's tasks, approvals and verifications, sorted by priority and due date", "cap"], ["2", "Contract register", "Every contract by project, client, model, value reference, status and key dates", "now"], ["3", "Award to agreement", "For each new award, where LOA acceptance, security, legal opinion, POA and agreement stand against their day limits", "cap"], ["4", "Obligation calendar", "Contractual obligations due this week, this month and overdue, in red, amber and green", "cap"], ["5", "Correspondence register", "Incoming and outgoing letters by project, with status, owner and response due", "cap"], ["6", "Unanswered client letters", "Client letters without a reply, with days remaining or days overdue", "cap"], ["7", "Overdue internal inputs", "Inputs owed to Contract, by department and person, with age", "cap"], ["8", "Contract review queue", "Documents from other departments awaiting Contract review, returned, or cleared", "cap"], ["9", "Priority view", "Open items split by normal, urgent and timeline-based, with escalations", "cap"], ["10", "Security register", "Bank guarantees and surety bonds by project, with expiry, extension due and release status", "now"], ["11", "Insurance register", "Policies in force, due for renewal, lapsed, and claims in progress", "now"], ["12", "Variation register", "Variations raised, submitted, approved and rejected, by project", "cap"], ["13", "EOT and delay events", "Delay events with notice status, time sought and time granted", "cap"], ["14", "Claims status", "Claims by stage, from notice to outcome, with the evidence still outstanding", "cap"], ["15", "Client assistance requests", "Requests to the client for utilities, access and permissions, open and closed, with age", "cap"], ["16", "Penalty exposure", "Submissions at risk of a penalty, and penalties levied or deducted by the client", "sap"], ["17", "Disputes", "Matters in negotiation, conciliation, arbitration or with Legal", "cap"], ["18", "Contract MIS", "The management view across all contracts — deadlines at risk, pending replies, securities expiring, claims open", "cap"]], "obs": "We note that the department's deadlines are mostly met by other people's work. That is why so much of its day is spent following up, and why tracked input requests will do more for it than any report.", "interactions": [["Tender and BD", "Tender documents, bid submission, award", "Review comments and queries for the client", "Queries are passed by email and held apart from the tender."], ["Accounts and Finance", "Bank guarantees, financial inputs for the agreement, financial values", "Security formats, request dates, renewal and release instructions", "Requested by email and followed up by telephone."], ["Legal", "Legal opinion, power of attorney, dispute support", "Agreement drafts, correspondence and claim history", "Documents sent back and forth by email."], ["Insurance", "Policies, renewals, claim progress", "Contract insurance requirements and due dates", "Tracked by hand against expiry."], ["Planning", "Work programme, mobilisation status, progress and delay evidence", "Appointed date, contractual milestones, client comments on the programme", "The programme is received, reviewed and forwarded to the client."], ["Design", "Drawings and revisions, design inputs for letters and variations", "Client and authority comments, scope changes", "Inputs requested per letter, without a tracked due date."], ["Quality", "Test and inspection evidence for replies and claims", "Client and authority observations", "Requested when a letter needs it."], ["Billing", "Certification position, deductions", "Variation and claim outcomes, contract terms for billing", "Linked informally."], ["Site team", "Letters received at site, location confirmation, site records and photographs", "Contractual instructions, replies, assistance request status", "Site letters reach head office by email and through WhatsApp groups."], ["Client, authority and IE", "LOA, letters, instructions, approvals, penalties", "Acceptance, securities, agreement, programme, replies, notices, claims", "Formal letters, hard copies and email, from several mail IDs."], ["Banks and insurers", "Issued instruments and policies", "Formats, extension and release requests", "Through Accounts and Insurance."], ["Management", "Approvals and direction", "Deadlines at risk, pending replies, claims and disputes", "Compiled by hand when asked."]], "profile": [["Team size and structure", "Four team members recorded", "A Vice President, three Contract managers and an Assistant Manager were described. The count and the structure need reconciling, which we raise in Section 8. A small team carrying every client exchange across all projects needs the system to do the chasing for it."], ["Where the work happens", "Head office, with inputs from every site", "Contract works from head office, but its letters originate at site. Site users need a simple way to upload letters and evidence and respond to input requests from their phones."], ["Nature of the work", "Deadline-driven and formal", "Every item has a contractual date and a consequence. Priority, due date and escalation belong on every record, not only on some."], ["Contract models", "EPC, HAM, BOT and item rate", "Obligations, milestones and securities have to be configured by model and by client rather than built in."], ["Consequence of delay", "Penalties", "Late submissions attract penalties, and late notices can lose claims. The system has to warn before a date is missed, not report afterwards."]], "tools": [["Email, across several mail IDs", "Client letters, site letters, internal requests", "Retained as a channel. Important letters are registered in the platform, and outgoing letters are issued from it with a reference number."], ["Hard copies", "Signed agreements, formal letters, securities", "Retained where the client requires them, with a scanned copy registered as the controlled record."], ["Site, personal and cloud folders", "Contract documents and evidence", "Replaced by one version-controlled repository, searchable by project, clause, letter number and subject."], ["WhatsApp groups", "Quick sharing between site and head office", "Kept for sharing out through the phone's native share, but no longer the record. What is shared comes from the platform, and what matters is registered there."], ["Letter and security templates", "Standard letters and BG formats", "Held as approved templates by client and contract model, alongside free drafting for technical and client-specific letters."], ["SAP", "Project and WBS references, vendor and customer masters, commercial and financial transactions", "Retained and unchanged. The platform reads these references and links its contract records to them. It does not post, invoice, pay or keep a ledger."]], "pains": [["1", "Records are spread across mail IDs, hard copies, site folders, cloud folders and WhatsApp", "Finding the governing agreement, the latest drawing, the previous letter and the evidence takes time and is not always possible.", "A single document management system per project, version-controlled and searchable."], ["2", "There is no live register of letters", "Nobody can see at a glance who owns a letter, who owes an input, when a reply is due and whether it is approved.", "A correspondence register with reference number, owner, contributors, due date and status on every item."], ["3", "One letter often needs inputs from two or more departments", "Dependencies are not tracked, and follow-up depends on the telephone.", "Input requests assigned to named people with promised dates, and automatic reminders until they are answered."], ["4", "Delays attract penalties", "A missed submission or a late notice has a direct cost, and can lose the right to time or money.", "Due dates, advance warnings and escalation on every contractual item, and a penalty exposure view."], ["5", "Letters from site reach head office by email", "They arrive in different inboxes and have to be registered by hand, if at all.", "Site upload from mobile, registering the letter against the contract with its photograph or scan."], ["6", "The award-to-agreement clocks are tight and depend on other teams", "Acceptance in 7 days, security in 15 to 30, agreement in around 45 — with Accounts, Legal and Finance all involved.", "An award checklist that starts every clock from the LOA date and shows each dependency's status."], ["7", "Every document to the client must be reviewed by Contract", "The review is a control point, but the queue is invisible to the department and to the teams waiting on it.", "A review queue that nothing can bypass, with return comments and the time each item has waited."], ["8", "Templates exist for some letters and securities, but formats vary by client and contract", "A fixed letter generator would not fit how the department actually works.", "Approved templates where they exist, free drafting where they do not, and both going through the same workflow."], ["9", "Contract models differ", "EPC, HAM, BOT and item rate carry different obligations, milestones and payment rules.", "Contract-model configuration, versioned, rather than one hard-coded process."], ["10", "Securities and insurance are tracked by hand", "A lapsed guarantee or policy is a default under the contract.", "A security and insurance register with early renewal alerts, an owner and escalation."], ["11", "Variations, EOTs and claims need timely evidence", "The evidence sits with Planning, Quality, Design and site, and is gathered after the event.", "A claims workspace that links progress, test, drawing and site records to the event as they happen."], ["12", "Assistance requests to the client are not tracked to closure", "Utility shifting and access issues delay work, and the delay needs to be attributable.", "A client assistance register, linked to delay events where the request holds up work."], ["13", "Items are not marked by urgency", "An urgent notice and a routine reply look the same in an inbox.", "Normal, urgent and timeline-based priority on every item, with notification rules for each."], ["14", "There is no dashboard of pending tasks, approvals and verifications", "What is waiting, and on whom, has to be worked out from memory and email.", "A pending-items dashboard for each user and a combined view for the department head."], ["15", "WhatsApp is used for sharing and the department wants to keep that", "It is quick, but it is not a record, and documents shared there are hard to control.", "Native sharing from the platform to WhatsApp and other apps, with the platform holding the record."], ["16", "The department asked for mail automation and help with drafting", "Much of the effort goes into routine acknowledgements and replies that draw on earlier letters.", "Automatic notices on award and on key events, and assisted drafting that proposes a reply from the contract and earlier letters for a person to edit and approve."], ["17", "Obligations reach the project team as a document", "The CAD is read once and then relied on from memory.", "CAD obligations entered as dated items with owners, feeding the obligation calendar."], ["18", "There is no audit trail of who drafted, reviewed, approved and issued", "Accountability for a late or wrong submission cannot be reconstructed.", "A read-only history on every letter, task and document, with a log of every action."]], "scope": [["1", "Contract record and register", "Contract ID per project and package; client or authority; contract model; key dates; linked SAP project and WBS reference; amendments and addenda", "One record per contract that every letter, task, security, variation and claim hangs from."], ["2", "Contract model configuration", "Templates for EPC, HAM, BOT and item rate; milestones; securities and insurance; notice periods; obligations; approval matrix; version and effective date", "Each contract carries the rules of its own model and client, without a new build for each."], ["3", "Award to agreement", "Award checklist; LOA acceptance; security request; legal opinion and POA; Finance inputs; agreement execution; day counters from LOA date", "The first forty-five days made visible, with every dependency and its clock in one place."], ["4", "Contract initiation", "Land and permission; site location confirmation; memorandum; appointed date; work programme submission; CAD", "The start of the contract recorded formally, and every dependent date calculated from the appointed date."], ["5", "Obligation calendar", "Obligations from the CAD with owner, trigger, due date, evidence required and consequence; red, amber and green; history of date changes", "The department sees what is due before it is late."], ["6", "Document management system", "Project-wise repository; tender, LOA, agreement, schedules, drawings, securities, insurance, letters and evidence; versioning; executed documents locked; search by project, clause, letter number, subject, date and department", "The governing document and its history found in seconds rather than searched for."], ["7", "Correspondence register and letter workflow", "Incoming and outgoing register; unique reference numbers; draft, input, review, approval, issue, acknowledgement and closure; templates and free drafting; proof of submission", "Every contractual letter controlled from receipt to closure, with nothing issued outside it."], ["8", "Internal input requests", "Request to any department or person; promised date; response and attachments; reminders; escalation; observer access", "The follow-up the department now does by telephone, done by the system."], ["9", "Contract review gate", "Review queue for documents from all departments; clear or return with comments; time waiting; only cleared documents issued", "The department's review becomes a control that cannot be bypassed and whose workload is visible."], ["10", "Client assistance requests", "Request for utility shifting, access or permission; client reference; follow-ups; closure; link to delay events", "Requests to the client tracked to closure and available as evidence when they cause delay."], ["11", "Variation, EOT and claims workspace", "Separate linked registers; event date and clause; notice deadline; evidence list linked to Planning, Quality, Design and site records; stage from notice to outcome", "Claims prepared on time with the evidence already attached, and no calculation or posting made in SAP from the platform."], ["12", "Security and insurance register", "BG, surety bond and policy register; format, issuer, reference, issue and expiry; extension, release and claim tasks; early alerts", "No instrument lapses unnoticed, and releases are claimed when due."], ["13", "Disputes register", "Matter linked to contract and claims; negotiation, conciliation, arbitration and Legal stages; documents and hearings", "Disputes followed with their full contractual history attached."], ["14", "Site mobile access", "Upload letters and evidence; respond to input requests; view authorised records; native share to WhatsApp and other apps", "Site becomes part of the workflow without WhatsApp becoming the record."], ["15", "Notifications, priority and follow-up", "Normal, urgent and timeline-based priority; in-app and email notifications; reminders before due dates; escalation; automatic notices on award and key events", "The right person is told at the right time, according to how urgent the item is."], ["16", "Assisted drafting", "Suggested replies drawn from the contract clauses and earlier letters on the same matter; always edited and approved by a person", "Faster first drafts for routine replies, with the decision staying with the department."], ["17", "Dashboards, MIS and reports", "The eighteen dashboards of Section 3; drill-down to the letter, task or document; export to Excel and PDF", "Management sees deadlines at risk and pending replies without anyone compiling them."], ["18", "SAP references, roles, access and audit", "Read project, WBS, party and financial references from SAP; role and RACI configuration including observers; project-level access; full audit trail", "Contract records tied to the same references the rest of the business uses, without a competing ledger."]], "open": ["That the nine-stage process set out in Section 1 reflects how the Contract department operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The team size and structure. Four team members were recorded, and a Vice President, three Contract managers and an Assistant Manager were described.", "The start event and day basis for each clock: acceptance in 7 days, security in 15 to 30 days and agreement in around 45 days — whether each runs from the LOA date, and whether calendar or working days apply.", "What the recorded periods of 30 days for EPC and 150 days for HAM and BOT measure, and between which two events.", "Whether the timelines and obligations differ by client or authority as well as by contract model, and which clients should be configured first.", "The approved letter and security templates in use, and which clients require their own formats.", "Who approves an outgoing letter, and whether approval depends on value or subject. A figure of 50 crore was noted, and we would like to confirm what it relates to.", "The meaning of three items in our notes that we could not resolve: \"EAD\" in the award sequence, \"proof and safety\" under project execution, and the insurance recorded as \"GAR\". We have read the last as contractor's all-risk cover.", "What each priority means — normal, urgent and timeline-based — and the reminder and escalation rules for each.", "Which mail IDs receive contractual correspondence today, and whether incoming mail should be registered automatically or by a person.", "That WhatsApp is used for sharing out only, with the platform holding the record.", "Which submissions carry penalties, and where penalties levied are recorded today.", "Whether assisted drafting of replies is acceptable, and any restriction on which documents it may draw on.", "How many site users will upload letters and respond to input requests, and who the observers should be.", "The SAP boundary, confirmed with the SAP owner, including which references the platform should read.", "Whether contracts, correspondence, securities and insurance for ongoing projects should be migrated at go-live, and in what form they are held."], "sap": {"1": ["Project and WBS; client (customer) code", "PS / SD", "Read"], "12": ["BG and security references, if held in SAP", "FI / TRM", "Read"], "18": ["Party and financial references (contract value, billed to date)", "SD / FI", "Read"]}}, "legal": {"key": "legal", "name": "Legal & Secretarial", "intro": ["The department has two sides. Legal drafts and vets contracts, lease deeds and banking and loan documents, answers legal queries from across the business, replies to notices, and manages litigation and arbitration with the help of external advocates. Secretarial keeps every group company in line with the Companies Act, 2013 — the statutory calendar, e-form filings on the MCA portal, board meetings, minutes, resolutions, board reports and the powers of attorney the business runs on.", "Both sides work from trackers. Legal keeps eight, covering queries, documents, powers of attorney, notices and more. Secretarial keeps forty to forty-two, most of them per company and per year. The work runs through nine stages, four on the legal side, four on the secretarial side and one shared."], "insight": "The legal side is driven by requests and events: a contract to vet, a query to answer, a notice that arrives by post. The secretarial side is driven by the calendar: a filing due, a meeting to hold, a signature about to expire. What both have in common is a deadline that someone outside the department sets, and a record that has to survive for years.", "flowcap": "Master flow — nine stages across Legal and Secretarial", "flow": [{"t": "1. Request Intake", "s": "from site, project, corporate", "dec": false, "hl": false}, {"t": "2. Drafting and Vetting", "s": "contracts, deeds, loan documents", "dec": false, "hl": false}, {"t": "3. Notices", "s": "received and replied from HO", "dec": false, "hl": true}, {"t": "Resolved?", "s": "reply, settle or close", "dec": true, "hl": false}, {"t": "4. Litigation and Arbitration", "s": "with external advocates", "dec": false, "hl": true}, {"t": "Matter closed", "s": "outcome recorded", "dec": false, "hl": false}, {"t": "5. statutory Calendar", "s": "40 to 42 trackers", "dec": false, "hl": false}, {"t": "6. E-form Filing", "s": "on the MCA portal", "dec": false, "hl": true}, {"t": "7. Board and Governance", "s": "agenda, minutes, board report", "dec": false, "hl": false}, {"t": "8. POA and Authority", "s": "resolutions and powers", "dec": false, "hl": false}, {"t": "9. Records, Company Information and Reporting", "s": "shared by both sides · documents, CIN and PAN, MIS", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Legal Request Intake", "text": "Requests reach Legal from site, project and corporate teams by email, WhatsApp and by hand — a contract to vet, a lease to draft, a question to answer. Legal opens the matter, takes ownership and asks the originating team for the facts it needs.", "nodes": [{"t": "Request raised", "s": "email, WhatsApp, by hand", "dec": false, "hl": false}, {"t": "Matter opened", "s": "category and entity", "dec": false, "hl": true}, {"t": "Owner assigned", "s": "within Legal", "dec": false, "hl": false}, {"t": "Facts requested", "s": "from the originating team", "dec": false, "hl": true}], "note": "Highlighted steps have no record today. The request lives in whichever channel it arrived through, and so does the answer."}, {"title": "Stage 2 — Drafting, Vetting and Execution", "text": "Legal drafts or vets EPC contracts, subcontracts, service agreements, lease deeds, connection agreements, affidavits, and banking and loan documents. Standard formats are adapted to each transaction. Comments go back and forth with the originating team or the counterparty until the document is approved, signed and filed.", "nodes": [{"t": "Format selected", "s": "standard template", "dec": false, "hl": false}, {"t": "Draft or vet", "s": "legal and commercial risk", "dec": false, "hl": false}, {"t": "Comments resolved", "s": "internal and counterparty", "dec": false, "hl": true}, {"t": "Approved and signed", "s": "by authorised signatory", "dec": false, "hl": false}, {"t": "Signed copy held", "s": "shared server today", "dec": false, "hl": true}], "note": "Once a document is signed, its key terms — renewal, notice period, expiry, indemnity, dispute clause — are not recorded anywhere that could send a reminder."}, {"title": "Stage 3 — Notices", "text": "Legal notices arrive by email and registered post. The head office team replies, gathering technical and commercial facts from the relevant department and bringing in an external advocate where the matter needs one. A notice is then replied to, settled, closed, or taken forward as litigation or arbitration.", "nodes": [{"t": "Notice received", "s": "email or registered post", "dec": false, "hl": false}, {"t": "Facts gathered", "s": "from internal teams", "dec": false, "hl": true}, {"t": "Reply drafted", "s": "in-house or by advocate", "dec": false, "hl": false}, {"t": "Closed?", "s": "after reply", "dec": true, "hl": false}, {"t": "To litigation", "s": "stage 4", "dec": false, "hl": false}], "note": "The reply deadline is the one date in this stage that cannot slip. Today it is held in the notice tracker and in the memory of whoever opened the envelope."}, {"title": "Stage 4 — Litigation, Arbitration and Claims", "text": "Legal manages motor accident claims before the MACT, consumer disputes, commercial disputes and arbitrations on National Highway contracts, and gives guidance on insurance claims. External advocates are appointed, including local counsel where a case needs representation in a local court. Legal reviews pleadings, follows hearings and records orders.", "nodes": [{"t": "Case opened", "s": "court, number, parties", "dec": false, "hl": false}, {"t": "Advocate appointed", "s": "including local counsel", "dec": false, "hl": true}, {"t": "Pleadings and filings", "s": "reviewed by Legal", "dec": false, "hl": false}, {"t": "Hearings", "s": "dates and updates", "dec": false, "hl": true}, {"t": "Order or outcome", "s": "settled, decided, withdrawn", "dec": false, "hl": false}], "note": "One accident or one counterparty can produce several cases in different courts and places. The department asked for custom grouping so related cases can be seen together without losing each case's own history."}, {"title": "Stage 5 — statutory Calendar and Trackers", "text": "Secretarial maintains the statutory calendar for each group company — annual, quarterly, half-yearly and event-driven obligations under the Companies Act. Each obligation has a due date, a done date and comments, and is held in one of forty to forty-two trackers, kept year-wise and in some cases offline.", "nodes": [{"t": "Obligation applies", "s": "by company and event", "dec": false, "hl": false}, {"t": "Due date set", "s": "in the relevant tracker", "dec": false, "hl": false}, {"t": "Data requested", "s": "from Finance, HR, others", "dec": false, "hl": true}, {"t": "Done date recorded", "s": "with comments", "dec": false, "hl": false}], "note": "Forty trackers multiplied by the number of group companies is a large surface to watch by hand. A missed date shows up as a late fee rather than as a warning."}, {"title": "Stage 6 — E-form Filing", "text": "E-forms, the annual return and XBRL filings are prepared, reviewed, signed with a digital signature and filed on the MCA portal. The filing reference and proof are kept as the record.", "nodes": [{"t": "Data received", "s": "and documents", "dec": false, "hl": false}, {"t": "Form prepared", "s": "e-form, return, XBRL", "dec": false, "hl": false}, {"t": "Reviewed and signed", "s": "valid DSC required", "dec": false, "hl": true}, {"t": "Filed on MCA", "s": "official portal", "dec": false, "hl": false}, {"t": "Proof stored", "s": "SRN, date, fees", "dec": false, "hl": false}], "note": "Filing stays on the MCA portal. What moves into the platform is everything around it: the data chase, the review, the approval, the signature check and the proof."}, {"title": "Stage 7 — Board Meetings and Governance Records", "text": "Secretarial issues notices and agendas for board, committee and shareholder meetings, records attendance, prepares minutes and resolutions, and produces the board report. Statutory registers for directors, shareholders and auditors are maintained per company.", "nodes": [{"t": "Notice and agenda", "s": "issued to members", "dec": false, "hl": false}, {"t": "Meeting held", "s": "attendance recorded", "dec": false, "hl": false}, {"t": "Minutes", "s": "drafted, circulated, signed", "dec": false, "hl": true}, {"t": "Resolutions", "s": "entered in register", "dec": false, "hl": false}, {"t": "Board report", "s": "and registers updated", "dec": false, "hl": false}], "note": "Appointments and resignations of directors, auditors and the company secretary each trigger their own filings, which is where the meeting record and the statutory calendar meet."}, {"title": "Stage 8 — Powers of Attorney and Authority", "text": "Powers of attorney and board resolutions authorise project managers, employees and advocates to act for the company. Each has a scope, a holder, an effective date and an expiry, and must be revoked or reviewed when the holder leaves or changes role.", "nodes": [{"t": "Authority requested", "s": "for a person and purpose", "dec": false, "hl": false}, {"t": "Resolution passed", "s": "where required", "dec": false, "hl": false}, {"t": "POA issued", "s": "scope and expiry", "dec": false, "hl": false}, {"t": "Review on change", "s": "expiry, exit, transfer", "dec": false, "hl": true}, {"t": "Renewed or revoked", "s": "with record kept", "dec": false, "hl": false}], "note": "The POA tracker shows what was issued. It does not know when the holder resigns, so an authority can outlive the employment it was granted for."}, {"title": "Stage 9 — Records, Company Information and Reporting", "text": "Both sides keep documents on shared server folders: signed agreements, notices, case papers, loan documents, minutes, registers and filings. Company information — CIN and PAN for each entity, directors, auditors, incorporation details — is looked up constantly, and management receives authority MIS and status reports.", "nodes": [{"t": "Document stored", "s": "shared server folders", "dec": false, "hl": false}, {"t": "Company information", "s": "CIN, PAN, directors", "dec": false, "hl": false}, {"t": "Search and identify", "s": "by hand today", "dec": false, "hl": true}, {"t": "MIS and reports", "s": "compiled when asked", "dec": false, "hl": true}], "note": "The department asked for a time record on queries, so it can show how long each one took and where it waited."}], "extra": {"title": "Litigation categories", "heads": ["Category", "As we understood it", "What it needs in the system"], "rows": [["Motor accident claims", "Claims before the Motor Accident Claims Tribunal, often in the district where the accident happened", "Grouping by accident, local counsel, insurer and policy details, many locations"], ["Consumer disputes", "Complaints before consumer forums", "Forum, stage, hearing dates and outcome"], ["Commercial disputes", "Disputes with vendors, subcontractors and other counterparties", "Link to the governing contract, exposure reference, facts from project teams"], ["Arbitration", "Arbitrations on National Highway contracts", "Link to the Contract department's claims and correspondence, tribunal and long timelines"], ["Insurance claims", "Legal gives guidance; the claim itself sits with the insurance function", "Advisory record linked to the claim, without Legal owning the claim"]]}, "workflows": [["1", "Legal request intake", "A request from site, project or corporate", "Requester, Legal", "A matter with number, category, entity, project, priority, owner and confidentiality level, whatever channel it came through"], ["2", "Contract drafting and vetting", "Request for a contract, lease, affidavit or other document", "Legal, originating team, counterparty", "A draft from an approved template, or a vetted document with comments, carried through each round of review"], ["3", "Contract approval and execution", "Draft agreed", "Legal, approver, authorised signatory", "An approved and signed document held as the final copy, never overwritten"], ["4", "Key terms and obligations", "Document signed", "Legal, contract owner", "Parties, term, renewal, notice period, indemnity, dispute clause and critical dates recorded, with alerts before each"], ["5", "Banking, loan and property documents", "Funding, lease or site arrangement", "Legal, Finance, bank, landowner", "Loan and security documents, lease deeds and related legal checks prepared, executed and held"], ["6", "Legal query and opinion", "A question from any department", "Legal, requester", "A recorded answer against the matter, with the time taken to give it"], ["7", "Internal information request", "Legal needs facts from another team", "Legal, any department", "A tracked request with a due date, reminders and escalation until answered"], ["8", "Notice receipt and reply", "Notice received by email or post", "Legal, internal teams, advocate", "A registered notice with its reply deadline, a reviewed reply and proof of dispatch"], ["9", "Notice to litigation", "Notice not resolved by reply", "Legal, management", "A decision to settle, close or litigate, and where litigated a case opened from the notice with its history carried over"], ["10", "Case and hearing management", "Case filed or received", "Legal, advocate", "A case record with court, number, parties, category, stage, next hearing, filings and orders"], ["11", "Related-case grouping", "Several cases from one event, party or project", "Legal", "A custom group showing related cases together while each keeps its own record"], ["12", "External advocate engagement", "A matter needs counsel", "Legal, advocate", "An advocate assigned with scope, deadlines and controlled document access, and updates recorded against the case"], ["13", "Settlement and closure", "Order, settlement or withdrawal", "Legal, management", "The outcome recorded and the matter closed, with the ability to reopen"], ["14", "statutory calendar tasks", "An obligation falls due for a company", "Secretarial, data owners", "A task per obligation per company with due date, owner, reviewer, data required, done date and comments"], ["15", "E-form and statutory filing", "statutory task due, or an event such as an appointment", "Secretarial, approver, signatory", "Data received, form prepared, reviewed, signed, filed on MCA, and the SRN, date, fees and proof stored"], ["16", "Board and shareholder meetings", "Meeting scheduled", "Secretarial, directors, members", "Notice, agenda, attendance, minutes and resolutions, from draft to signed record"], ["17", "Board report and registers", "Year end, or a change in directors, shareholders or auditors", "Secretarial", "The board report and statutory registers kept current per company"], ["18", "POA and authority issue", "Request for authority", "Requester, Secretarial, Legal, board", "A resolution where required and a POA with scope, holder, entity, effective date and expiry"], ["19", "POA, DSC and KYC review", "Expiry approaching, or holder exits or transfers", "Secretarial, HR", "Authorities, digital signatures and director KYC renewed, revoked or reassigned before they lapse or outlive their purpose"], ["20", "Company information and MIS", "A lookup, or a reporting date", "Legal, Secretarial, management", "Company details found by CIN, PAN or name, and weekly, monthly and authority MIS produced from the records"]], "dashboards": [["1", "My pending actions", "Each user's matters, replies, filings and approvals, by due date", "cap"], ["2", "Legal request queue", "Requests by department, category, owner and age, with time taken on closed queries", "cap"], ["3", "Contract vetting workload", "Documents in drafting, in review, awaiting input, awaiting approval and executed", "cap"], ["4", "Contract dates and obligations", "Renewals, expiries and notice periods coming up across signed documents", "cap"], ["5", "Notice register", "Notices received, replied, due soon and overdue", "now"], ["6", "Litigation register", "Open matters by category, forum, stage, entity and project, with ageing", "now"], ["7", "Hearing calendar", "Hearings this week and this month, by court and advocate", "now"], ["8", "Grouped matters", "Related cases together by event, party, project or location", "cap"], ["9", "External advocates", "Matters per advocate, updates pending, and fee status", "sap"], ["10", "Internal information requests", "Facts owed to Legal and Secretarial, by department and age", "cap"], ["11", "statutory calendar", "Obligations due, overdue and done, by company and category", "now"], ["12", "Filing status", "E-forms, annual returns and XBRL filings by stage, with SRN, delay days and fees", "cap"], ["13", "DSC and director KYC", "Digital signatures and director KYC approaching expiry", "cap"], ["14", "Meetings and minutes", "Upcoming meetings, agendas pending, minutes unsigned or uncirculated", "cap"], ["15", "Resolution register", "Resolutions by company, date and purpose, linked to what they authorise", "cap"], ["16", "POA and authority", "Authorities active, expiring, and held by people who have left or moved", "now"], ["17", "Company information", "Each group company's CIN, PAN, directors, auditors and key dates", "now"], ["18", "Legal and authority MIS", "The management view — notices, cases, hearings, statutory and decisions awaited — sent weekly and monthly", "cap"]], "obs": "We note that the department holds the most sensitive records in the business while depending on the widest range of people for inputs. The platform has to open the request to those people without opening the matter.", "interactions": [["Contract", "Client disputes heading to arbitration, contract claims history", "Legal opinion, pleadings, arbitration support", "Handed over by email with the correspondence attached."], ["Projects and site", "Requests for leases and site arrangements, facts for notices and cases, accident details", "Vetted documents, replies, case updates", "Requests by email and WhatsApp; facts chased by telephone."], ["Planning", "Delay and progress facts for disputes", "Legal positions and deadlines", "Requested when a matter needs it."], ["Finance and Accounts", "Loan and funding documents, financial data for filings, fee payments", "Vetted banking documents, filing requirements, statutory deadlines", "Documents and data exchanged by email."], ["HR and Admin", "Joining, exit and transfer information, employee authorities", "POA reviews, authority changes", "Exits do not reach the POA tracker automatically."], ["Insurance", "Policy and claim details for accident and other cases", "Guidance on claims", "Advisory, case by case."], ["Procurement and vendors", "Vendor agreements and subcontracts for vetting", "Vetted agreements", "Sent in by email."], ["Board and management", "Meeting decisions, approvals, direction on matters", "Agendas, minutes, resolutions, board report, MIS", "Reports compiled by hand."], ["External advocates", "Advice, pleadings, hearing updates, orders", "Instructions, documents, deadlines", "Email and telephone; updates when asked."], ["Courts, tribunals and authorities", "Notices, summons, orders", "Replies, filings, appearances", "Through advocates and formal channels."], ["MCA and statutory portals", "Filing acknowledgements and SRNs", "E-forms, returns, XBRL filings", "Filed on the portal; proof saved to folders."], ["Banks and lenders", "Loan and security document formats", "Executed documents, resolutions, authorities", "Paper and email."]], "profile": [["Team size", "Legal: four members", "The size of the secretarial team was not recorded, and is raised in Section 8. A small team covering every entity and every site needs the system to track dates and chase inputs for it."], ["Entities covered", "Multiple group companies", "Every record — matter, filing, meeting, POA — has to carry the company it belongs to, and each company needs its own statutory calendar."], ["Trackers", "Legal: 8 · Secretarial: 40 to 42", "Legal's include query, document, POA and notice trackers. These become the structure of the platform rather than spreadsheets alongside it, with an upload form for each process."], ["Where the work happens", "Head office", "Requesters and data owners are everywhere; they need to raise requests and answer them without seeing more than their part."], ["Sensitivity", "Privileged and confidential", "Access by role and by matter, download controls and a full audit log are requirements, not options."], ["Decision-making", "Legal judgement", "The platform handles reminders, templates and workflow. It gives no legal advice; review and decisions stay with the department."]], "tools": [["Excel trackers", "Legal and secretarial tracking, year-wise and some offline", "Replaced. Each tracker becomes a structured register with due dates, owners and alerts."], ["Email and WhatsApp", "Requests, documents, updates", "Retained as channels. Requests and documents are registered against the matter."], ["Registered post", "Notices received and sent", "Retained. Notices are scanned and registered with the reply deadline."], ["Shared server folders", "Drafts, signed documents, case papers, filings", "Replaced by a secure repository with versions, metadata and access control."], ["MCA and statutory portals", "E-form, annual return and XBRL filing", "Retained for filing. Preparation, approval and proof are tracked in the platform."], ["Digital signature certificates", "Signing e-forms and documents", "Retained. Holders and expiry dates are tracked, with alerts before expiry."], ["SAP", "Entity, project, vendor and financial records", "Retained and unchanged. The platform reads references and does not keep a finance or contract-value ledger."]], "pains": [["1", "Requests arrive by email, WhatsApp and by hand", "Ownership and status are hard to see, and requests can sit unanswered.", "One intake form, so every request becomes a matter with an owner."], ["2", "Litigation and notices are tracked manually in Excel", "Deadlines depend on someone opening the right sheet.", "Notice and case registers with hearing calendar and reminders. A notice converts to a case with its history, and a deadline changes only with a recorded reason."], ["3", "Related cases cannot be grouped", "One accident or counterparty can produce many cases across courts, and the full picture is lost.", "Custom grouping by event, party, project, location or issue, with each case kept separately."], ["4", "Case updates depend on external advocates", "The tracker is only as current as the last phone call.", "Advocate assignment with controlled access to post updates and documents against the case."], ["5", "Forty to forty-two secretarial trackers across group companies", "A large number of dates to watch by hand, company by company.", "An entity-wise statutory calendar with one engine behind every tracker."], ["6", "DSC and director KYC expiry are tracked by hand", "An expired signature stops a filing at the last moment.", "Expiry alerts well ahead of the date, by holder and company."], ["7", "Documents sit on shared server folders", "Draft, signed and superseded versions are hard to tell apart, and access is not controlled.", "A secure repository with versions, final copies locked, and search by matter, company, party and case number."], ["8", "There is no upload form for each process", "Documents land in folders without the details that make them findable.", "A form for each process that captures the details with the document."], ["9", "Facts from other teams are chased informally", "Replies and filings wait on inputs nobody is tracking.", "Internal information requests with due dates, reminders and escalation."], ["10", "Key terms of signed contracts are not tracked", "Renewals, notice periods and expiries pass without warning.", "A key-terms and obligations register with alerts."], ["11", "POAs are not reviewed when people leave", "An authority can outlive the employment it was granted for.", "An automatic review task on exit or transfer, with revocation approved and recorded."], ["12", "Minutes, resolutions and registers are prepared by hand", "The record of what was decided is slow to finalise and hard to trace back to.", "Meeting workflow from notice to signed minutes, and a resolution register linked to what each resolution authorises."], ["13", "Company information is looked up by hand", "CIN, PAN and director details are needed constantly across entities.", "A company master searchable by name, CIN or PAN."], ["14", "There is no record of how long queries take", "The department's workload and response time are invisible.", "A time record on every query, from request to answer."], ["15", "Management reporting is compiled by hand", "Status is only as current as the last report.", "Dashboards and scheduled weekly and monthly reports, including authority MIS."], ["16", "Sensitive matters need restricted access", "Facts must come from many people without exposing privileged material.", "Role and matter-level access, download restrictions, watermarking and an audit log."]], "scope": [["1", "Request intake and matter workspace", "Intake form by category; matter number; entity, project, counterparty, priority, owner and confidentiality; matter timeline; configurable statuses; query time record", "Every request becomes an owned matter with its history in one place."], ["2", "Contract drafting and vetting", "Template library by document type; clause library with approved fallback language; drafting, redline and comments; approval and execution; signed-copy repository", "Contracts, leases and loan documents move from request to signed copy on one record."], ["3", "Key terms and obligations", "Parties, term, renewal, notice period, indemnity, dispute clause, governing law and critical dates; alerts", "Obligations in signed documents are remembered by the system, not by people."], ["4", "Banking, loan and property documents", "Loan, security and banking documents; lease deeds; connection agreements; affidavits; related checks and approvals", "A controlled home for documents Finance and projects depend on."], ["5", "Notice register and reply", "Notice intake with scan; sender, date, deadline, subject and linked contract or project; reply workflow; dispatch proof; convert to case", "No reply deadline missed, and no history lost when a notice becomes a case."], ["6", "Litigation and arbitration", "Case register by category (MACT, consumer, commercial, arbitration, insurance guidance); forum, number, parties, jurisdiction, stage; hearing calendar; filings and orders; outcome and closure", "Every case current, with its next date visible."], ["7", "Custom grouping", "Group and tag cases by event, party, project, location or issue; many-to-many links; group view", "Related cases seen together, each keeping its own record."], ["8", "External advocate management", "Advocate master by practice area and jurisdiction; assignment; scope and deadlines; controlled upload of updates and documents; fee status from SAP", "Case updates arrive against the case instead of by phone."], ["9", "Internal information requests", "Request to any department or person; due date; response and attachments; reminders; escalation; restricted view of the matter", "Inputs from other teams tracked without exposing the matter."], ["10", "Company master", "Each group company's CIN, PAN, incorporation details, directors, shareholders, auditors and signatories; search", "Company information found in seconds and reused across every record."], ["11", "statutory calendar", "Applicability by company; annual, quarterly, half-yearly and event-driven obligations; due and done dates; owner and reviewer; comments; upload form per process; red and amber alerts", "The forty-odd trackers replaced by one calendar per company."], ["12", "Statutory filing workflow", "Data requested, received, draft, review, approval and signature; filed on MCA; SRN, date, delay days and fees; proof stored", "Everything around a filing tracked, with the filing itself staying on the portal."], ["13", "Meetings, minutes and board report", "Board, committee and shareholder calendar; notice and agenda; attendance; minutes from draft to signed; board report", "The meeting record finalised on time and traceable later."], ["14", "Resolutions and registers", "Resolution register linked to the entity and what it authorises; statutory registers for directors, shareholders and auditors", "Every authority traceable to the resolution that granted it."], ["15", "POA, DSC and KYC", "POA request and approval; scope, holder, entity, dates; expiry and revocation; review on exit or transfer; DSC and director KYC register with alerts", "No authority or signature lapses, or outlives its holder, unnoticed."], ["16", "Secure document repository", "Documents by type, entity, project and matter; versions; final copies locked; retention period; search by case number, filing reference, party and date", "The shared server replaced by a controlled, searchable record."], ["17", "Dashboards, MIS and reports", "The eighteen dashboards of Section 3; drill-down to the record; scheduled weekly and monthly reports; authority MIS; export to Excel and PDF", "Management sees status without anyone compiling it."], ["18", "SAP references, access and audit", "Read company, project, WBS, vendor and fee references from SAP; role and matter-level access; download control and watermarking; full audit trail", "Legal records tied to the same references the business uses, with privileged material protected."]], "open": ["That the nine-stage process set out in Section 1 reflects how Legal and Secretarial operate today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The size of the secretarial team, and whether it sits within the four Legal members or alongside them.", "The full list of Legal's eight trackers and Secretarial's forty to forty-two, with a copy of each, and the written procedures behind them.", "The list of group companies, and which obligations apply to each.", "The litigation categories, confirmed as motor accident claims, consumer disputes, commercial disputes, National Highway arbitrations and insurance claim guidance, and whether any others should be configured.", "How related cases should be grouped — by accident or event, party, project, location or issue — and whether one case may sit in more than one group.", "The approval matrix for contracts, notice replies, litigation decisions, POAs, resolutions and filings.", "The format for matter and case numbers.", "Who may see which matters, and what external advocates and other departments should be able to see and upload.", "The meaning of items in our notes we could not resolve: \"FE debit\" among the legal documents, \"DP3 document\" among the secretarial items, which we have read as director KYC, and the scope of title search.", "Which standard templates and clauses exist today, and which document types should be configured first.", "Which portals are used besides MCA, and what filing proof should be stored for each.", "Who holds digital signatures, and the policy for their custody and renewal.", "How HR should notify exits and transfers so that authorities can be reviewed.", "The format and recipients of the weekly and monthly reports and the authority MIS.", "The SAP boundary, confirmed with the SAP owner, including which references the platform should read.", "Whether existing trackers, case files, filings and documents on the shared server should be migrated at go-live, and the retention rules that apply to them."], "sap": {"8": ["Advocate vendor code; fee invoices and payment status", "FI", "Read"], "10": ["Company codes", "FI", "Read"], "18": ["Project and WBS references for matters", "PS", "Read"]}}, "closure": {"key": "closure", "name": "Project Closure", "intro": ["There is no Project Closure department at PIL. Closure is done by almost every department at once, each working through its own checklist when its part of the project ends — site execution, design, procurement, HR, plant and machinery, techno-commercial, finance, contracts and legal. Quality and safety take part through final testing and the safety audit.", "On the client side, closure runs to the client's own completion points and the Commercial Operation Date, which PIL receives from the client. After completion, maintenance is carried out by a separate department or company, so closure also means handing the project over. The formats shared with us — the document checklist, the demobilisation plan, the closure report, the project synopsis and the lessons learnt report — show the ground closure covers. The work runs through nine stages."], "insight": "Stages four to seven run in parallel, one department beside another, and that is where closure is won or lost. Each department knows its own list. Nobody sees all of them together, so the question \"what is still open on this project, and with whom?\" has no single answer today. The decision before handover is that answer: until every checklist is closed, or its open items are carried forward with an owner, the project is not closed.", "flowcap": "Master flow — nine stages from the closure trigger to the closure report", "flow": [{"t": "1. Closure Trigger", "s": "HO visit at 90% completion", "dec": false, "hl": false}, {"t": "2. Punch List and Testing", "s": "QA, site testing, safety audit", "dec": false, "hl": false}, {"t": "3. COD and Takeover", "s": "from the client", "dec": false, "hl": true}, {"t": "4. Technical Close‑out", "s": "as-builts, reconciliations", "dec": false, "hl": false}, {"t": "5. Demobilisation", "s": "people, plant, inventory, site", "dec": false, "hl": false}, {"t": "6. Financial Close‑out", "s": "BGs, accounts, taxes, dues", "dec": false, "hl": false}, {"t": "7. Claims and Legal", "s": "open claims, cases, POAs", "dec": false, "hl": false}, {"t": "Checklists closed?", "s": "every department", "dec": true, "hl": false}, {"t": "Remaining tasks", "s": "owner and action date", "dec": false, "hl": false}, {"t": "8. Maintenance Handover", "s": "to the O&M team or company", "dec": false, "hl": true}, {"t": "9. Closure Report", "s": "synopsis and lessons learnt", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Closure Trigger and Readiness", "text": "At around ninety percent work completion, the Planning, Billing and Coordination team from head office visits the site. This is the practical start of closure. The likely completion date and the start date of demobilisation are fixed, and each department begins on its checklist.", "nodes": [{"t": "90% work complete", "s": "from progress", "dec": false, "hl": false}, {"t": "HO team visits", "s": "Planning, Billing, Coordination", "dec": false, "hl": false}, {"t": "Dates fixed", "s": "completion and demobilisation", "dec": false, "hl": true}, {"t": "Checklists issued", "s": "to every department", "dec": false, "hl": true}], "note": "Highlighted steps are not recorded anywhere shared. Each department starts when it learns its part has come, so the start of closure differs from one department to the next."}, {"title": "Stage 2 — Punch List, Testing and Safety Audit", "text": "Site prepares internal and external punch lists, each item carrying the person responsible and the action date. Final site testing is carried out with Quality involved, the design and drawing team reviews what was built, and a safety audit is done. Items that remain are shown in a task tracker.", "nodes": [{"t": "Punch list", "s": "internal and external", "dec": false, "hl": false}, {"t": "Site testing", "s": "with Quality", "dec": false, "hl": false}, {"t": "Safety audit", "s": "before handover", "dec": false, "hl": false}, {"t": "Remaining tasks", "s": "owner and action date", "dec": false, "hl": true}], "note": "The department asked for remaining tasks to be shown in a task tracker. Today the punch list is a sheet, and the sheet does not remind anyone."}, {"title": "Stage 3 — Client Completion, Takeover and COD", "text": "The client has its own closure points. Provisional and final takeover certificates are obtained, and the Commercial Operation Date is received from the client. The site team collects the COD and the documents that go with it.", "nodes": [{"t": "Client closure points", "s": "per contract", "dec": false, "hl": false}, {"t": "Provisional takeover", "s": "certificate", "dec": false, "hl": false}, {"t": "COD received", "s": "collected by site", "dec": false, "hl": true}, {"t": "Final takeover", "s": "certificate", "dec": false, "hl": false}], "note": "The COD and takeover dates start other clocks — the defect liability or maintenance period, the release of securities, and the handover to maintenance."}, {"title": "Stage 4 — Technical and Commercial Close-out", "text": "Design finalises the as-built drawings, the reconciliation sheet, client correspondence and claim details. Site produces the material reconciliation, RFI inventory, sub-contractor tally and ledger, material variance and balance work reports. Techno-commercial closes work orders, takes each subcontractor's NOC with the final bill, states credits and debits with security deposit effects, and evaluates the subcontractor. Procurement closes open purchase orders and requisitions and collects performance warranties.", "nodes": [{"t": "As-built drawings", "s": "Design and Engineering", "dec": false, "hl": false}, {"t": "Reconciliations", "s": "material, RFI, ledger", "dec": false, "hl": true}, {"t": "Subcontractors closed", "s": "NOC, final bill, SD", "dec": false, "hl": false}, {"t": "POs and PRs closed", "s": "warranties collected", "dec": false, "hl": false}], "note": "Most of these closures happen in SAP — orders, stock and ledgers. What is missing is a view of which of them are done for this project and which are not."}, {"title": "Stage 5 — Demobilisation", "text": "People, plant, materials and the site itself are demobilised. HR prepares the manpower surplus schedule with each person's expertise and a recommendation for the next project, settles recoveries and payments, and records PF and labour welfare liabilities. Plant and machinery is transferred, hired equipment returned and RTO formalities closed. Inventory is transferred or scrapped against SAP and physical stock. Leases, licences, connections and SIM, data and visiting cards are cancelled, and a NOC is taken from the landowner.", "nodes": [{"t": "Manpower", "s": "transfer, relieve, F&F", "dec": false, "hl": false}, {"t": "Plant and machinery", "s": "transfer, hire return, RTO", "dec": false, "hl": false}, {"t": "Inventory", "s": "SAP against physical", "dec": false, "hl": true}, {"t": "Site administration", "s": "leases, licences, NOC", "dec": false, "hl": false}, {"t": "Plan against actual", "s": "by department", "dec": false, "hl": true}], "note": "The demobilisation plan alone runs to ten sheets. Every lease, connection or SIM that is not cancelled keeps costing money after the site has gone."}, {"title": "Stage 6 — Financial Close-out", "text": "Finance and Accounts lists bank guarantees, FDRs and LCs to be released to vendors and by the client, closes project bank accounts, states taxes due and receivable, and lists outstanding creditors, debtors and deposits.", "nodes": [{"t": "BGs and FDRs", "s": "to vendors, from client", "dec": false, "hl": true}, {"t": "Bank accounts", "s": "balances and closure", "dec": false, "hl": false}, {"t": "Taxes", "s": "payable and realisable", "dec": false, "hl": false}, {"t": "Creditors, debtors", "s": "and deposits", "dec": false, "hl": false}], "note": "Each BG and FDR carries its contractual clause, validity and the person to pursue for release. Money is held until someone follows it up."}, {"title": "Stage 7 — Claims, Cases and Authorities", "text": "Contracts documents the open claims and updates the claim tracker. Legal lists cases closed and ongoing, and the powers of attorney closed and still to be closed.", "nodes": [{"t": "Open claims", "s": "documented and tracked", "dec": false, "hl": false}, {"t": "Legal cases", "s": "closed and ongoing", "dec": false, "hl": false}, {"t": "POAs", "s": "closed or to be closed", "dec": false, "hl": true}, {"t": "Carried forward", "s": "with an owner", "dec": false, "hl": false}], "note": "Claims and cases can run for years after the site closes. They cannot hold the project open, but they must not be lost when it closes either."}, {"title": "Stage 8 — Handover to Maintenance", "text": "Development and construction are run separately from maintenance, by a different department or company. On completion, the project passes to the maintenance side with the documents it needs to operate and maintain the asset.", "nodes": [{"t": "As-builts", "s": "final drawings", "dec": false, "hl": false}, {"t": "Warranties", "s": "performance and asset", "dec": false, "hl": false}, {"t": "Obligations", "s": "DLP and maintenance", "dec": false, "hl": false}, {"t": "Handover accepted", "s": "by maintenance", "dec": false, "hl": true}], "note": "What the maintenance side receives, and who accepts it, was not defined in the discussion. It is raised in Section 8."}, {"title": "Stage 9 — Closure Report, Synopsis and Lessons Learnt", "text": "The project closure report compares baseline and actual dates, hours and budget, records deliverables, benefits, CAPEX and OPEX, resources, key issues, quality and assets, post-project tasks and recommendations. The synopsis compares LOA revenue with actual revenue and collection, and budgeted with booked cost. The lessons learnt report records each event, the lesson and the action taken.", "nodes": [{"t": "Closure report", "s": "baseline against actual", "dec": false, "hl": false}, {"t": "Project synopsis", "s": "revenue, cost, margin", "dec": false, "hl": false}, {"t": "Lessons learnt", "s": "event, lesson, action", "dec": false, "hl": true}, {"t": "Project closed", "s": "record archived", "dec": false, "hl": false}], "note": "These reports are compiled at the end from many sources. Most of what they contain already exists in other departments' records by the time they are written."}], "extra": {"title": "Department checklists", "heads": ["Department", "What it closes", "Evidence"], "rows": [["Site execution", "Material reconciliation PV, RFI inventory, sub-contractor tally and ledger, material variance, balance work, punch lists", "Reports and punch lists with owners and dates"], ["Design and engineering", "As-built drawings, takeover certificates, reconciliation, client correspondence, claim details", "Final drawings and certificates"], ["Procurement", "Licences with authorities, inventory transferred and scrapped, major material reconciliation, open POs and PRs, performance warranties", "Closure lists and warranty documents"], ["HR and administration", "Manpower demobilisation, leases and licences, SIM, data and visiting cards, PF and labour welfare liabilities, recoveries and payments, landowner NOC", "Demobilisation sheets, NOC, labour licence documents"], ["Plant and machinery", "Machinery and inventory transferred, insurance and warranty documents, RTO formalities, hired equipment returned", "Transfer lists and RTO closures"], ["Techno-commercial", "Work orders closed, subcontractor NOC and final bill, credits and debits with SD, material reconciliation, subcontractor evaluation", "NOCs, final bills, evaluation"], ["Finance and accounts", "BGs, FDRs and LCs released, bank accounts closed, taxes, creditors and debtors, deposits", "Release letters, closure confirmations"], ["Contracts", "Open claims and cases documented, claim tracker updated", "Claim documents and MIS"], ["Legal", "POAs closed and to be closed, legal cases closed and ongoing", "POA and case lists"], ["Quality and safety", "Site testing, QA sign-off, safety audit", "Test records and audit report"]]}, "workflows": [["1", "Closure initiation", "Work completion reaches the agreed threshold", "Planning, Billing, Coordination, project head", "A closure record with likely completion and demobilisation dates, and the HO site visit recorded"], ["2", "Department checklist issue", "Closure record opened", "All departments", "Each department's checklist issued from its template, with an owner and target date for every item"], ["3", "Punch list", "Site walk-through, internal or with the client", "Site, Quality, client", "Internal and external punch items with responsible person, action date, photographs and closure"], ["4", "Final testing, QA and safety audit", "Work ready for completion", "Site, Quality, Safety", "Test results, QA sign-off and safety audit findings closed"], ["5", "Remaining task tracking", "Any item not closed on time", "Owning department", "A single tracker of what remains, with owner, date and escalation"], ["6", "Client takeover and COD", "Client closure points satisfied", "Site, Contract, client", "Provisional and final takeover certificates and the COD recorded, starting the dependent clocks"], ["7", "As-built and design close-out", "Construction complete", "Design, site", "Final as-built drawings, reconciliation sheet, correspondence and claim details held against the project"], ["8", "Material reconciliation", "Closure record opened", "Site, Stores, Procurement", "Material issued, consumed and balance reconciled for client-issued and other items, with variance explained"], ["9", "Subcontractor close-out", "Subcontract work complete", "Techno-commercial, Billing, subcontractor", "Work orders closed, final bill, NOC, credit and debit statement with SD effects, and a performance evaluation"], ["10", "Procurement close-out", "Closure record opened", "Procurement, Purchase", "Open POs and PRs closed, licences with authorities closed, performance warranties collected"], ["11", "Manpower demobilisation", "Demobilisation start date", "HR, project head, employees", "Surplus schedule with expertise and recommendation, transfer or relief, full and final, and recoveries and payments settled"], ["12", "Plant and machinery demobil
