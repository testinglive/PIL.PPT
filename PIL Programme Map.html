il."], ["Admin", "Accident and medical support", "Claim guidance", "Case by case."], ["Insurers and brokers", "Quotes, policies, endorsements, decisions", "Proposals, member lists, claims", "Email and portals."], ["Surveyors", "Visits and queries", "Documents and access", "Email and phone."], ["RTO", "Registrations", "Applications and documents", "In person and portal."]], "profile": [["Team size", "2 members", "A small team; the platform must collect data from others rather than leave it to be chased."], ["Classes of cover", "Project, vehicles, equipment, GMC, GPA", "One policy register with fields and checklists for each class."], ["Where data sits", "Excel; nothing in SAP", "Excel trackers loaded at go-live; asset and employee data read from P&M and HR."], ["Budget approval", "CFO", "Budget and premium approvals recorded against the CFO's approved figure."], ["Vehicle renewal", "All on 30 March", "A bulk renewal screen for the whole fleet."], ["Insurers", "May change year to year", "History kept with the asset and the policy, not the insurer."]], "tools": [["Excel", "Policies, vehicles, equipment tracker, renewals, claims", "Replaced by the policy register, trackers, claims and dashboards."], ["Email", "Asset data, GMC updates, insurer and surveyor contact", "Replaced by tracked requests; insurer correspondence logged against the policy or claim."], ["SAP", "Not used for insurance", "Asset and payment references read where the SAP owner agrees; no postings."], ["Insurer and broker portals", "Policies, endorsements, claims", "Retained. References and documents recorded in the platform."]], "pains": [["1", "Everything is managed in Excel; nothing is in SAP", "Policies, assets and claims cannot be seen together.", "One insurance platform linking policies, assets, people and claims."], ["2", "Asset data comes from Purchase by hand", "Missing codes or values surface only when a claim is made.", "A data request on every purchase, checked before cover is placed."], ["3", "All vehicle insurance falls due on 30 March", "The whole fleet is renewed under pressure in one window.", "A bulk renewal screen with IDV, last premium and quotes per vehicle."], ["4", "New registrations and RTO status are tracked by hand", "A vehicle may run before its registration is complete.", "Registration status tracked from purchase to RTO completion."], ["5", "Non-registered equipment sits in a separate tracker", "Coverage of each machine is hard to confirm.", "An equipment tracker linked to the P&M list, with gaps flagged."], ["6", "The individual cost of non-registered equipment is not known", "The true cost of owning each machine is understated.", "Premium broken down to each item on an agreed basis."], ["7", "Insurance cost by equipment and by project is wanted", "Projects do not see what their cover costs.", "Cost by equipment and project, using P&M deployment."], ["8", "The amount approved is tracked alongside the budget by hand", "Remaining budget is uncertain during the year.", "Budget, approved and paid shown together."], ["9", "Insurers may change", "History can be lost with the old insurer's file.", "History kept with the asset and policy."], ["10", "A contract directory for insurers is needed", "Terms and contacts depend on memory.", "A directory of insurers, brokers and contracts."], ["11", "Due dates and renewals are tracked by hand", "A lapsed policy leaves PIL uninsured.", "Renewal reminders for every policy."], ["12", "GMC updates are sent by mail", "Joiners can be missed and leavers paid for.", "Additions and deletions raised from HR joining and exit."], ["13", "Claim documents are gathered by hand", "Claims wait on paperwork held elsewhere.", "A claim checklist with tasks to the teams holding each document."], ["14", "Project and flood claims need different documents", "A single upload screen would miss what the insurer needs.", "Checklists by claim type, set by Insurance."], ["15", "The data needed is not readily available by email", "Every claim starts with a search.", "A document store linked to the policy, asset and claim."], ["16", "Contract brings Insurance in at bid and commercial stage", "Insurance cost must be right in the bid.", "Insurance requests from Contract and Bidding, tracked to reply."]], "scope": [["1", "Policy register", "Policies by class, insurer, company and period; covered assets, projects or people; documents; status", "Every policy in one place."], ["2", "Asset data intake", "Request to Purchase and P&M on each purchase; asset code, class, value; missing or mismatched details flagged", "Cover placed on correct data."], ["3", "Vehicle registration", "New registrations; RTO status; documents; ageing", "No vehicle left unregistered."], ["4", "Vehicle insurance", "Vehicle policies; IDV and premium; bulk renewal for 30 March", "The fleet renewed in one controlled exercise."], ["5", "Equipment tracker", "Non-registered equipment by class and policy, linked to the P&M list; uninsured items flagged", "Every machine known to be covered."], ["6", "Cost allocation", "Premium by item, class and project; agreed allocation basis; P&M deployment", "The cost the team asked for, by equipment and project."], ["7", "Project insurance", "Requests from Bidding and Contract; insurance cost for bids; project policies linked to contract requirements", "Cover that matches every contract."], ["8", "Employee benefits", "GMC and GPA members from HR; additions and deletions on joining and exit; insurer confirmation", "The right people covered, and only them."], ["9", "Insurer and contract directory", "Insurers, brokers, surveyors, contacts and contracts; history by year", "Relationships and terms on record."], ["10", "Quotes and placement", "Quotes compared; insurer chosen; approval recorded; policy issued", "Placement decisions that can be explained."], ["11", "Renewals and due dates", "Calendar of expiries; reminders at set intervals; renewal status", "No policy lapses unseen."], ["12", "Budget and approvals", "Annual budget by class; CFO approval; approved and paid against budget", "Remaining budget always known."], ["13", "Claims", "Claim intimation; checklists by claim type — project, flood, vehicle, employee and others; owner and due dates", "Claims complete before they go out."], ["14", "Surveyor and insurer log", "Surveyor visits, queries and replies; insurer decisions and settlement references", "Every claim's story in one record."], ["15", "Documents", "Policies, endorsements, asset evidence, incident documents; versions; restricted access", "Documents found in seconds, not searched for."], ["16", "Tasks with other departments", "Requests to Purchase, P&M, HR, Contract, site, Safety, Finance and Legal; due dates; escalation", "Inputs arrive on time, or the delay is visible."], ["17", "Dashboards and MIS", "The eighteen dashboards of Section 3; CFO summary; export", "Management sees cover, cost and claims at a glance."], ["18", "Links, roles and audit", "P&M equipment list; HR employee data; SAP references where agreed; role access; audit trail", "Insurance tied to the records it depends on."]], "open": ["That the nine-stage process set out in Section 1 reflects how Insurance operates today.", "That the twenty workflows in Section 2 are complete, and that none of the team's work falls outside them.", "The roles of the two team members, and the companies covered.", "Whether any other cover is handled — for example fire, marine transit or workmen compensation — beyond the classes in Section 1.", "How Purchase and P&M send asset data today, and which reference identifies each asset.", "What decides whether equipment is registered or not, and the equipment classes in use.", "That all vehicle policies renew on 30 March, and what the \"PM date\" and \"30th month\" items in our notes refer to.", "The basis for working out the individual cost of non-registered equipment — value, class or another measure.", "How cost should be split when equipment moves between projects during a policy year.", "How the budget is prepared, and what \"how much approved\" refers to beyond the CFO's budget approval.", "What \"break clauses\" or \"bulk clauses\" under new registration refer to, as the term was not captured clearly.", "How GMC and GPA additions and deletions are sent today, and the format each insurer needs.", "What Insurance provides to Contract and Bidding at bid and commercial stage.", "The claim types, the documents each needs, and how surveyors are appointed.", "Who approves a claim before it is submitted, and who accepts a settlement, between Insurance, Finance and Legal.", "What the SAP item in our notes refers to, and whether any asset or payment data should be read from SAP.", "Whether the insurer contract directory should also hold brokers and surveyors.", "Whether current Excel trackers, policies and claim records should be migrated at go-live."], "sap": {"2": ["Asset code, class and value (where agreed — nothing is held for Insurance in SAP today)", "AA / PM", "Read"], "6": ["Equipment deployment by project", "PM", "Read"], "12": ["Premium payments booked", "FI", "Read"]}}, "snv": {"key": "snv", "name": "Security & Vigilance", "intro": ["Security and Vigilance protects what PIL owns at every site. It plans security for each project, hires guards through third-party agencies, keeps at least one of its own staff at every site, and checks everything that comes in or goes out of the gate. It watches sites through CCTV, and when material goes missing — one or two theft cases a day on a running project — it investigates, records the loss and follows up on recovery.", "SAP carries the agency POs, billing, invoices, gate passes and part of the attendance. At site, the inward register, gate pass challans and guard attendance are kept on paper, and guard records and theft data sit in Excel. The team told us inward and outward movement could be fully digital. The work runs through nine stages."], "insight": "Stages five to seven are where the department earns its place: every truck, every gate pass and every camera is a chance to catch a loss before it happens. When something is wrong, the PM and head office are told. Today that report, and the register behind it, are on paper — so a theft is recorded after the fact, and the pattern across sites is hard to see.", "flowcap": "Master flow — nine stages from a site's security requirement to agency billing and reporting", "flow": [{"t": "1. Requirement", "s": "site visit, PM, approval", "dec": false, "hl": false}, {"t": "2. Agency Selection", "s": "quotations, PO in SAP", "dec": false, "hl": false}, {"t": "3. Deployment", "s": "guards at each site", "dec": false, "hl": false}, {"t": "4. Attendance", "s": "guards, by shift", "dec": false, "hl": false}, {"t": "5. Inward Check", "s": "material, vehicle, weight", "dec": false, "hl": true}, {"t": "6. Gate Pass and Outward", "s": "verified at the gate", "dec": false, "hl": false}, {"t": "7. CCTV", "s": "surveillance", "dec": false, "hl": false}, {"t": "Issue found?", "s": "gate or camera", "dec": true, "hl": false}, {"t": "8. Theft and Incidents", "s": "to PM and HO", "dec": false, "hl": true}, {"t": "Cleared", "s": "movement recorded", "dec": false, "hl": false}, {"t": "9. Billing and Reports", "s": "agency bills, MIS", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Security Requirement and Budget", "text": "For each site, the department visits and works out what security is needed. The requirement goes to the PM, then to management for approval, along with the budget.", "nodes": [{"t": "Site visit", "s": "by S&V", "dec": false, "hl": false}, {"t": "Requirement", "s": "to the PM", "dec": false, "hl": false}, {"t": "Management approval", "s": "posts and budget", "dec": false, "hl": true}, {"t": "Deployment plan", "s": "for the site", "dec": false, "hl": false}], "note": "The requirement and the approval are discussed rather than recorded, so the approved strength for a site is not written down anywhere the team can check against later."}, {"title": "Stage 2 — Agency Selection", "text": "Almost all guards come from third-party agencies. The department collects quotations from several agencies, sends them to management for approval, and raises the PO in SAP.", "nodes": [{"t": "Quotations", "s": "from agencies", "dec": false, "hl": false}, {"t": "Compared", "s": "rates and terms", "dec": false, "hl": false}, {"t": "Management approval", "s": "agency chosen", "dec": false, "hl": true}, {"t": "PO in SAP", "s": "agency engaged", "dec": false, "hl": false}], "note": "Agency details, contacts, payment issues and past performance are kept by the team outside SAP. A record per agency would make the next comparison easier."}, {"title": "Stage 3 — Guard Deployment", "text": "The site sends details of the guards and where they are posted. The department keeps each guard's data and documents, and places at least one of its own staff at every site. Six guards are PIL's own.", "nodes": [{"t": "Agency guards", "s": "and 6 own guards", "dec": false, "hl": false}, {"t": "Documents", "s": "collected and checked", "dec": false, "hl": true}, {"t": "Posted", "s": "site and post", "dec": false, "hl": false}, {"t": "S&V staff", "s": "at least 1 per site", "dec": false, "hl": false}], "note": "Guard data and documents are held in Excel and on paper. When a guard changes, the record often does not."}, {"title": "Stage 4 — Guard Attendance", "text": "Guard attendance is marked on paper at site and entered in SAP. It is the basis for what the agency is paid.", "nodes": [{"t": "Shift", "s": "guard on post", "dec": false, "hl": false}, {"t": "Paper register", "s": "at site", "dec": false, "hl": false}, {"t": "Entered", "s": "in SAP", "dec": false, "hl": false}, {"t": "Agency bill", "s": "checked against it", "dec": false, "hl": true}], "note": "Paper attendance is copied before it can be used, and the copy is what the agency's invoice is checked against."}, {"title": "Stage 5 — Inward Check", "text": "Every incoming vehicle is checked at the gate — the material, the vehicle, the weight, and the date and time — and whether the truck arrived on time. The store report is submitted. If anything does not match, the PM and head office are told.", "nodes": [{"t": "Truck arrives", "s": "on time or late", "dec": false, "hl": false}, {"t": "Checked", "s": "material, vehicle, weight", "dec": false, "hl": false}, {"t": "Matches?", "s": "challan and PO", "dec": true, "hl": false}, {"t": "Reported", "s": "to PM and HO", "dec": false, "hl": true}], "note": "The inward register is on paper. A mismatch found at the gate is not linked to the PO, the store receipt or the vendor, so it cannot be followed up from one place."}, {"title": "Stage 6 — Gate Pass and Outward Movement", "text": "Anything leaving site needs a gate pass. The store creates it in SAP, and security checks and verifies it at the gate against the challan. Outward movement, including large or heavy items, is written into a register.", "nodes": [{"t": "Gate pass", "s": "created by store in SAP", "dec": false, "hl": false}, {"t": "Verified", "s": "by security", "dec": false, "hl": true}, {"t": "Challan", "s": "checked", "dec": false, "hl": false}, {"t": "Vehicle out", "s": "outward register", "dec": false, "hl": false}], "note": "The gate pass is in SAP but the verification is on paper. Nothing shows which gate passes were actually checked, or by whom."}, {"title": "Stage 7 — CCTV Surveillance", "text": "CCTV cameras cover sites and are part of the department's work. Footage is reviewed when something goes wrong, and the cameras themselves are assets to be kept working.", "nodes": [{"t": "Cameras", "s": "by site and location", "dec": false, "hl": false}, {"t": "Monitoring", "s": "live or recorded", "dec": false, "hl": false}, {"t": "Footage", "s": "reviewed on incident", "dec": false, "hl": false}, {"t": "Camera status", "s": "working or down", "dec": false, "hl": true}], "note": "A camera that is not working is found out when its footage is needed. A simple register of cameras and their status would show the gaps first."}, {"title": "Stage 8 — Theft and Incidents", "text": "During a running project, the department sees one or two theft cases a day. Each is reported, investigated using registers and CCTV, and followed up — including recovery from the responsible party through a debit note, and litigation where needed.", "nodes": [{"t": "Theft or incident", "s": "at site", "dec": false, "hl": false}, {"t": "Reported", "s": "PM and HO", "dec": false, "hl": false}, {"t": "Investigated", "s": "registers, CCTV", "dec": false, "hl": false}, {"t": "Recovery", "s": "debit note", "dec": false, "hl": true}, {"t": "Closed", "s": "or litigation", "dec": false, "hl": false}], "note": "Theft data is kept in Excel. Losses are not linked to the site, material, agency or shift involved, so patterns — which sites, which materials, which agencies — are not visible."}, {"title": "Stage 9 — Agency Billing and Reports", "text": "Agencies bill monthly. Billing and invoices are handled in SAP against the PO, with attendance as the basis. Payment issues and other agency matters are followed up by the department, which also reports to management.", "nodes": [{"t": "Agency invoice", "s": "monthly", "dec": false, "hl": false}, {"t": "Checked", "s": "against attendance", "dec": false, "hl": true}, {"t": "Billing in SAP", "s": "against the PO", "dec": false, "hl": false}, {"t": "Paid", "s": "issues followed up", "dec": false, "hl": false}], "note": "Half the diesel cost is borne by this department's budget, though it no longer manages diesel. How that share is worked out is raised in Section 8."}], "extra": {"title": "Registers kept today", "heads": ["Register", "What it records", "Kept in"], "rows": [["Inward register", "Material, vehicle, weight, date and time", "Paper at site"], ["Outward register", "Material leaving site, including large or heavy items", "Paper at site"], ["Gate pass challan", "Gate pass checked at the gate", "SAP pass; paper check"], ["Guard attendance", "Guards on duty by shift", "Paper at site; SAP"], ["Guard data", "Guard details and documents", "Excel and paper"], ["Theft records", "Cases, losses and follow-up", "Excel"], ["Agency records", "Agencies, quotations, payments, issues", "SAP and Excel"]]}, "workflows": [["1", "Site security assessment", "New project or site change", "S&V, PM", "Site visited; posts, guards and cameras needed recorded"], ["2", "Security budget approval", "Assessment complete", "S&V, PM, management", "Approved strength and budget for the site"], ["3", "Agency quotation and selection", "Guards needed", "S&V, agencies, management", "Quotations compared and agency approved"], ["4", "Agency PO", "Agency approved", "S&V, Purchase", "PO raised in SAP and linked to the agency record"], ["5", "Guard onboarding", "Guard joins a site", "Agency, site S&V", "Guard details and documents collected and checked"], ["6", "Deployment and changes", "Posting or replacement", "Site S&V, agency", "Guard posted to site and post; changes recorded the same day"], ["7", "Guard attendance", "Each shift", "Site S&V", "Attendance captured at site and passed to SAP"], ["8", "S&V staff coverage", "Site opens or staff moves", "S&V, HR", "At least one S&V staff member at every site"], ["9", "Inward check", "Vehicle arrives", "Gate security, store", "Material, vehicle, weight, date and time recorded; truck timing noted"], ["10", "Inward discrepancy", "Mismatch at the gate", "Gate security, PM, HO, Purchase", "Discrepancy reported with evidence and followed to closure"], ["11", "Store report", "Inward accepted", "Gate security, store", "Inward report submitted and matched to the store's receipt"], ["12", "Gate pass verification", "Material leaving site", "Store, gate security", "SAP gate pass checked against the challan and the load; verification recorded"], ["13", "Outward register", "Vehicle leaves", "Gate security", "Outward movement recorded, with large or heavy items marked"], ["14", "Material cross-check", "Daily, or on suspicion", "S&V, store", "Inward, issue and outward data compared to spot gaps"], ["15", "CCTV register", "Camera installed, moved or down", "S&V", "Cameras by site and location, with working status"], ["16", "Surveillance review", "Incident or routine check", "S&V", "Footage reviewed and findings recorded against the case"], ["17", "Theft and incident report", "Loss or incident at site", "Site S&V, PM, HO", "Case opened with site, material, value, time and shift"], ["18", "Investigation and recovery", "Case opened", "S&V, PM, Accounts, Legal", "Findings, debit note where recoverable, litigation where needed, case closed"], ["19", "Agency billing", "Monthly invoice", "S&V, Accounts", "Invoice checked against attendance and PO, billed in SAP, paid"], ["20", "Agency issues and MIS", "Issue raised, or month end", "S&V, agencies, management", "Agency issues tracked; security report by site for management"]], "dashboards": [["1", "Guard deployment", "Guards on duty by site, post and agency, against approved strength", "cap"], ["2", "Guard attendance", "Attendance by site, shift and agency", "sap"], ["3", "Guard documents", "Guards with documents complete, missing or expired", "cap"], ["4", "Agencies", "Agencies, sites served, rates and open issues", "cap"], ["5", "Agency POs and billing", "POs, invoices billed and paid, by agency", "sap"], ["6", "Staff coverage", "S&V staff by site, against requirement", "cap"], ["7", "Inward today", "Vehicles in, material, weight and time, by site", "cap"], ["8", "Inward discrepancies", "Mismatches found, reported and resolved", "cap"], ["9", "Delivery timing", "Trucks on time and late, by vendor and site", "cap"], ["10", "Gate passes", "Gate passes issued in SAP, verified and not verified", "sap"], ["11", "Outward movements", "Material leaving site, with large or heavy items marked", "cap"], ["12", "Material gaps", "Differences between inward, issue and outward", "cap"], ["13", "Theft cases", "Cases by site, material, value and shift", "now"], ["14", "Recovery and litigation", "Debit notes raised, amounts recovered, cases in litigation", "cap"], ["15", "CCTV status", "Cameras by site, working and down", "cap"], ["16", "Incidents", "Open and closed incidents, by type and age", "cap"], ["17", "Budget against spend", "Security budget against agency cost and the diesel share", "sap"], ["18", "Security MIS", "Monthly summary by site for management", "cap"]], "obs": "We note that the gate sits between Purchase, which ordered the material, and Store, which receives and issues it. If the gate record links to both, a shortage or a theft is found by comparison the same day, rather than by investigation after the fact.", "interactions": [["Store", "Gate passes in SAP, material issue details", "Gate verification, inward report", "SAP and paper."], ["Purchase", "PO details for inward material and equipment", "Inward checks, truck timing", "SAP view."], ["Project and PM", "Security requirement approval", "Discrepancy and theft reports", "Phone and email."], ["Management", "Budget and agency approvals", "Quotations, security reports", "Email and meetings."], ["Accounts and Treasury", "Agency payments", "Checked invoices, debit notes", "SAP."], ["HR", "S&V staff and their travel details", "Site attendance and incidents", "Email."], ["Plant and Machinery", "Equipment movements; diesel issued by store", "Share of diesel cost", "SAP."], ["Legal", "Guidance on theft cases", "Case facts and evidence", "Email."], ["Insurance", "Claim requirements", "Theft reports and evidence", "Email."], ["Safety", "Site incidents", "CCTV and gate records", "Case by case."], ["Security agencies", "Guards, invoices, quotations", "Deployment needs, payments, issues", "Phone and email."]], "profile": [["Team size", "40, including 6 guards", "A split of 32 at head office, with the rest at site, and a requirement of 80 were also noted. Raised in Section 8."], ["Site presence", "At least 1 S&V staff member per site", "Gate and guard screens must work on mobile, for one person running a site."], ["Guards", "Almost all from third-party agencies", "Agency, guard and attendance records linked, so billing can be checked."], ["Theft", "1 to 2 cases a day on a running project", "Quick case entry at site, with photos and CCTV references."], ["Diesel", "50% of cost borne; no longer managed", "The cost share shown against the budget, read from store and P&M data."], ["Approvals", "Management, for budget and agencies", "Approval routes recorded in the platform."]], "tools": [["SAP", "PO, billing, invoices, gate pass, attendance, DMS", "Retained and unchanged. Gate passes, POs and billing read by the platform."], ["Paper registers", "Inward, outward, challans, attendance", "Replaced by mobile entry at the gate."], ["Excel", "Guard data, theft data, minor records", "Replaced by guard, agency and case registers."], ["CCTV", "Site surveillance", "Retained. Cameras registered and footage referenced against cases."]], "pains": [["1", "The inward register, gate pass challans and attendance are on paper", "Nothing at the gate can be searched or compared.", "Mobile entry at the gate for every movement."], ["2", "Inward and outward data could be fully digital", "The team is ready for it.", "Inward and outward registers as the first module to go live."], ["3", "Guard data and documents are in Excel and on paper", "Who is on site, and whether they are cleared, is uncertain.", "A guard register with documents and site history."], ["4", "Guard attendance is marked on paper", "Agency bills are checked against a copy.", "Attendance captured at site, feeding the billing check."], ["5", "One or two theft cases a day on running projects", "Losses add up, and patterns go unseen.", "A case register by site, material, value and shift."], ["6", "Theft data is kept in Excel", "It cannot be linked to the gate, CCTV or agency.", "Cases linked to gate records, footage and guards on duty."], ["7", "Inward issues are reported to the PM and HO by hand", "Reports are late or lost.", "Discrepancy alerts to the PM and HO from the gate."], ["8", "Gate passes are made in SAP but checked on paper", "There is no record of which passes were verified.", "Gate pass read from SAP and verified on mobile."], ["9", "Truck timing is checked but not reported", "Late vendors are not held to account.", "Arrival time recorded and reported by vendor."], ["10", "Agency quotations go to management outside a system", "Past comparisons are hard to find.", "Quotations compared and approved in the platform."], ["11", "Agency payments and issues are followed up by hand", "Disputes repeat and take time.", "An agency record with issues, payments and performance."], ["12", "CCTV is part of the work but cameras are not tracked", "A camera may be down when it is needed.", "A camera register with working status by site."], ["13", "Recovery by debit note and litigation follow theft", "Recoveries can be missed.", "Recovery and litigation tracked on each case."], ["14", "Purchase and material issue data are viewed separately", "Gaps between what came in and what was used are hard to spot.", "Inward, issue and outward compared in one view."], ["15", "Budget approvals are discussed with management", "The approved strength per site is not on record.", "Site requirements and approvals recorded."], ["16", "Half of diesel cost is borne without managing diesel", "A cost the team cannot see or control.", "The diesel share shown against the budget."]], "scope": [["1", "Site security plan", "Site visit record; posts, guards and cameras needed; PM and management approval; approved strength", "Every site's security on record."], ["2", "Budget", "Security budget by site; agency cost and diesel share read from SAP; budget against spend", "Spend known against what was approved."], ["3", "Agency management", "Agency register; quotations and comparison; management approval; PO reference; issues and performance", "Agencies chosen and managed on facts."], ["4", "Guard register", "Agency and own guards; documents; site history; replacements", "Every guard known and cleared."], ["5", "Deployment", "Guards by site, post and shift; changes; strength against approved", "Who is on duty, and where, at a glance."], ["6", "Guard attendance", "Attendance at site on mobile; passed to SAP; basis for billing", "Paper registers retired."], ["7", "Staff coverage", "S&V staff by site; gaps flagged; requirement against actual", "No site without its S&V presence."], ["8", "Inward check", "Mobile gate entry: material, vehicle, weight, date and time, photos; PO reference; truck timing", "Every arrival recorded at the gate."], ["9", "Discrepancy alerts", "Mismatch reported from the gate to PM, HO and Purchase; follow-up to closure", "Problems raised in minutes, not days."], ["10", "Gate pass verification", "SAP gate pass read at the gate; challan and load checked; verifier and time recorded", "Nothing leaves unverified."], ["11", "Outward register", "Outward movement with vehicle, material and pass; large or heavy items marked", "A searchable record of everything leaving site."], ["12", "Material cross-check", "Inward, store receipt, issue and outward compared from SAP and gate data", "Gaps found by comparison, not investigation."], ["13", "CCTV", "Camera register by site and location; working status; footage references against cases", "Cameras known to be working."], ["14", "Theft and incidents", "Case entry at site with photos; site, material, value, shift and guards on duty; alerts to PM and HO", "Every loss on record the day it happens."], ["15", "Recovery and litigation", "Investigation notes; debit notes; recovery amounts; litigation status with Legal; insurance link", "Losses pursued to the end."], ["16", "Agency billing check", "Invoice against attendance and PO; differences flagged; SAP billing and payment status", "Agencies paid for guards who were there."], ["17", "Dashboards and MIS", "The eighteen dashboards of Section 3; monthly security report by site", "Management sees security across all sites."], ["18", "SAP links, roles and audit", "Read POs, gate passes, billing, attendance and material data from SAP; site and HO roles; audit trail", "Gate records tied to SAP, without a second system of record."]], "open": ["That the nine-stage process set out in Section 1 reflects how Security and Vigilance operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The team size — 40 including 6 guards, with 32 at head office noted, and a requirement of 80 — and what each figure covers.", "The sites and companies covered, and what \"one site manager from PJL\" refers to.", "The number of agencies in use, and how their rates and contracts are set.", "The documents required for each guard, and who checks them.", "How guard attendance reaches SAP today, and whether agency invoices are checked against it.", "What \"Mobile/Bridge\" in the inward notes refers to, and whether weight is taken from a weighbridge.", "What \"tangible and non-tangible\" refers to — for example returnable and non-returnable gate passes.", "What is recorded for large or heavy items in the outward register.", "Who is told about inward discrepancies and thefts, and how quickly.", "How thefts are reported beyond the company — police, insurer or both.", "What \"litigation — debit note for company\" refers to, and who the debit note is raised against.", "What \"OTM\" refers to in our notes, alongside general expense and department discussion.", "What \"employee, travel details\" refers to for this department.", "The CCTV set-up — number of cameras, who monitors them, and who owns the equipment.", "How the 50% share of diesel cost is worked out and charged to the department.", "The SAP boundary, confirmed with the SAP owner — POs, billing, invoices, ga document.getElementById('zOut').onclick = () => zoomAt(.8, innerWidth/2, innerHeight/2);
document.getElementById('fitBtn').onclick = () => fitAll();
document.getElementById('oneBtn').onclick = () => { const cx = innerWidth/2, cy = innerHeight/2; zoomAt(1/S.s, cx, cy); };
addEventListener('keydown', e => { if (e.target.closest('input')) return;
  if (e.key==='+'||e.key==='=') zoomAt(1.25, innerWidth/2, innerHeight/2);
  else if (e.key==='-'||e.key==='_') zoomAt(.8, innerWidth/2, innerHeight/2);
  else if (e.key==='0') fitAll(); else if (e.key==='1') zoomAt(1/S.s, innerWidth/2, innerHeight/2);
  else if (e.key==='Escape') closeDrawer();
  else if (e.key.startsWith('Arrow')){ const d = 80; if (e.key==='ArrowLeft') S.x+=d; if (e.key==='ArrowRight') S.x-=d; if (e.key==='ArrowUp') S.y+=d; if (e.key==='ArrowDown') S.y-=d; apply(); } });

/* index toggle */
const idxBtn = document.getElementById('idxBtn');
idxBtn.onclick = () => { const open = idx.classList.toggle('closed') === false; document.body.classList.toggle('idx', open); idxBtn.setAttribute('aria-expanded', open); };

/* ---------- minimap ---------- */
const mini = document.getElementById('mini'); const mctx = mini.getContext('2d'); let MR = null;
function miniLayout(){ const W = 190, ww = world.offsetWidth, wh = world.offsetHeight, H = Math.min(260, Math.round(W*wh/ww)); const k = Math.min(W/ww, H/wh);
  const dpr = devicePixelRatio || 1; mini.width = Math.round(ww*k*dpr); mini.height = Math.round(wh*k*dpr); mini.style.width = Math.round(ww*k)+'px'; mini.style.height = Math.round(wh*k)+'px';
  MR = {k, items:[...world.querySelectorAll('.board,.card')].map(el => ({r:rectOf(el), card:el.classList.contains('card'), c: el.style.getPropertyValue('--gc')}))}; drawMini(); }
function cssv(v){ return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
function drawMini(){ if (!MR) return; const dpr = devicePixelRatio || 1, k = MR.k*dpr; mctx.setTransform(1,0,0,1,0,0); mctx.clearRect(0,0,mini.width,mini.height);
  mctx.fillStyle = cssv('--sheet'); mctx.fillRect(0,0,mini.width,mini.height);
  MR.items.forEach(it => { let col = cssv('--line2'); if (it.card){ const m = /var\((--[\w-]+)\)/.exec(it.c); if (m) col = cssv(m[1]); }
    mctx.fillStyle = it.card ? col : cssv('--paper'); mctx.globalAlpha = it.card ? .55 : 1; mctx.fillRect(it.r.x*k, it.r.y*k, it.r.w*k, it.r.h*k); mctx.globalAlpha = 1; });
  const vx = (-S.x)/S.s, vy = (topInset()-S.y)/S.s, vw = innerWidth/S.s, vh = (innerHeight-topInset())/S.s;
  mctx.strokeStyle = cssv('--accent'); mctx.lineWidth = 2*dpr; mctx.strokeRect(vx*k, vy*k, vw*k, vh*k); }
let mdrag = false;
const miniGo = e => { const b = mini.getBoundingClientRect(); const wx = (e.clientX-b.left)/MR.k, wy = (e.clientY-b.top)/MR.k;
  S.x = innerWidth/2 - wx*S.s; S.y = (topInset() + innerHeight)/2 - wy*S.s; apply(); };
mini.addEventListener('pointerdown', e => { mdrag = true; mini.setPointerCapture(e.pointerId); miniGo(e); e.stopPropagation(); });
mini.addEventListener('pointermove', e => { if (mdrag) miniGo(e); });
mini.addEventListener('pointerup', () => mdrag = false);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', drawMini);
new MutationObserver(drawMini).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});

/* ---------- drawer ---------- */
const drawer = document.getElementById('drawer'), dBody = document.getElementById('dBody'), dTabs = document.getElementById('dTabs');
let cur = null;
const TABS = [['over','Overview'],['stages','Stages'],['wf','Workflows'],['db','Dashboards'],['scope','Scope and SAP'],['links','Connections'],['pains','Pain points'],['open','Open points']];
const T = (heads, rows) => `<table class="tbl"><thead><tr>${heads.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`;
function tabHTML(k, t){
  const x = D[k];
  if (t==='over') return x.intro.map(p=>`<p>${esc(p)}</p>`).join('') + (x.flow.length?`<h4>How the work flows</h4>${chainHTML(x.flow)}`:'') + (x.insight?`<p class="muted" style="margin-top:14px">${esc(x.insight)}</p>`:'') +
    (x.extra && x.extra.rows.length ? `<h4>${esc(x.extra.title)}</h4>` + T(x.extra.heads, x.extra.rows.map(r=>`<tr>${r.map((c,i)=>`<td>${i?esc(c):`<b>${esc(c)}</b>`}</td>`).join('')}</tr>`)) : '') +
    (x.profile.length ? `<h4>Department profile</h4>` + T(['Item','Position today','What it means for the build'], x.profile.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`)) : '') +
    (x.tools.length ? `<h4>Tools in use</h4>` + T(['Tool','Used for','In the solution'], x.tools.map(r=>`<tr><td><b>${esc(r[0])}</b></td><td>${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`)) : '');
  if (t==='stages') return x.stages.map(s=>`<div class="stage"><h5>${esc(s.title)}</h5>${s.text?`<p>${esc(s.text)}</p>`:''}${chainHTML(s.nodes)}${s.note?`<div class="note">${esc(s.note)}</div>`:''}</div>`).join('') || '<p class="muted">No stages recorded.</p>';
  if (t==='wf') return T(['#','Workflow','Triggered by','Participants','Output'], x.workflows.map(r=>`<tr><td class="n">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td><td>${esc(r[3])}</td><td>${esc(r[4])}</td></tr>`));
  if (t==='db') return T(['#','Dashboard','What it shows','Data'], x.dashboards.map(r=>`<tr><td class="n">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td><td><span class="pill ${r[3]}">${{now:'Available today',cap:'To be captured',sap:'From SAP'}[r[3]]}</span></td></tr>`));
  if (t==='scope') return T(['#','Module','Screens and features','SAP data read'], x.scope.map(r=>{const s = x.sap[r[0]]; return `<tr><td class="n">${esc(r[0])}</td><td><b>${esc(r[1])}</b>${r[3]?`<div class="muted" style="font-size:12px;margin-top:4px">${esc(r[3])}</div>`:''}</td><td>${esc(r[2])}</td><td>${s?`${esc(s[0])}<div class="muted" style="font-size:12px;margin-top:4px">${esc(s[1])} · ${esc(s[2])}</div>`:'<span class="muted">—</span>'}</td></tr>`;}));
  if (t==='links') return (x.obs?`<p>${esc(x.obs)}</p>`:'') + T(['Party',`${x.name} receives`,`${x.name} provides`,'How it works today'], x.interactions.map(r=>{ const hit = G.edges.find(e => e.items.some(i => i.from===k && i.party===r[0]) && !e.b.startsWith('x_')); const other = hit ? (hit.a===k?hit.b:hit.a) : null;
      return `<tr><td>${other && D[other] && !D[other].pending ? `<button class="link" data-open="${other}">${esc(r[0])}</button>` : `<b>${esc(r[0])}</b>`}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`;}));
  if (t==='pains') return T(['#','What we were told','Why it matters','What we propose'], x.pains.map(r=>`<tr><td class="n">${esc(r[0])}</td><td><b>${esc(r[1])}</b></td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`));
  if (t==='open') return (x.open.length ? `<p class="muted">Questions for PIL before scope, timeline and commercials are fixed.</p><ol class="open-list">${x.open.map(o=>`<li>${esc(o)}</li>`).join('')}</ol>` : '<p class="muted">None recorded.</p>');
}
function openDrawer(k, tab='over'){
  cur = k; const x = D[k], g = GOF[k];
  document.getElementById('dGrp').textContent = g ? g.name : ''; document.getElementById('dGrp').style.color = g ? g.color : '';
  document.getElementById('dName').textContent = x.name;
  const tabs = x.common ? [['over','Overview'],['scope','Scope and SAP']] : TABS;
  dTabs.innerHTML = tabs.map(([id,l]) => `<button role="tab" data-tab="${id}" aria-selected="${id===tab}">${l}</button>`).join('');
  dBody.innerHTML = tabHTML(k, tab); dBody.scrollTop = 0;
  drawer.classList.add('open'); drawer.setAttribute('aria-hidden','false');
}
function closeDrawer(){ drawer.classList.remove('open'); drawer.setAttribute('aria-hidden','true'); }
dTabs.addEventListener('click', e => { const b = e.target.closest('[data-tab]'); if (!b) return; dTabs.querySelectorAll('button').forEach(x => x.setAttribute('aria-selected', x===b)); dBody.innerHTML = tabHTML(cur, b.dataset.tab); dBody.scrollTop = 0; });
document.getElementById('dClose').onclick = closeDrawer;

/* global clicks */
document.addEventListener('click', e => {
  const o = e.target.closest('[data-open]'); if (o){ openDrawer(o.dataset.open); fly('card-'+o.dataset.open, .6); return; }
  const g = e.target.closest('[data-go]'); if (g){ const k = g.dataset.go; if (D[k] && !D[k].pending && !D[k].common) openDrawer(k); fly('card-'+k, .6); return; }
  const f = e.target.closest('[data-fly]'); if (f){ fly(f.dataset.fly, .9); if (innerWidth <= 900){ idx.classList.add('closed'); document.body.classList.remove('idx'); } return; }
});

/* ---------- search ---------- */
const IX = [];
Object.values(D).forEach(x => { IX.push({t:x.name, s:'Department', k:x.key, tab:'over'});
  (x.scope||[]).forEach(r => IX.push({t:r[1], s:`${x.name} · module ${r[0]}`, k:x.key, tab:'scope', q:r[2]}));
  (x.workflows||[]).forEach(r => IX.push({t:r[1], s:`${x.name} · workflow`, k:x.key, tab:'wf', q:r[4]}));
  (x.dashboards||[]).forEach(r => IX.push({t:r[1], s:`${x.name} · dashboard`, k:x.key, tab:'db', q:r[2]}));
  (x.stages||[]).forEach(r => IX.push({t:r.title, s:`${x.name} · stage`, k:x.key, tab:'stages'})); });
const q = document.getElementById('q'), res = document.getElementById('res');
q.addEventListener('input', () => { const v = q.value.trim().toLowerCase(); if (v.length < 2){ res.hidden = true; return; }
  const hits = IX.filter(i => i.t.toLowerCase().includes(v)).concat(IX.filter(i => !i.t.toLowerCase().includes(v) && (i.q||'').toLowerCase().includes(v))).slice(0, 40);
  res.innerHTML = hits.length ? hits.map((h,j) => `<button data-r="${j}"><b>${esc(h.t)}</b><small>${esc(h.s)}</small></button>`).join('') : '<div class="none">Nothing matches that. Try a shorter word.</div>';
  res.hidden = false; res._hits = hits; });
res.addEventListener('click', e => { const b = e.target.closest('[data-r]'); if (!b) return; const h = res._hits[+b.dataset.r]; res.hidden = true; q.value = '';
  if (!D[h.k].pending) openDrawer(h.k, D[h.k].common ? 'scope' : h.tab); fly('card-'+h.k, .6); });
q.addEventListener('keydown', e => { if (e.key==='Escape'){ q.value=''; res.hidden = true; q.blur(); } if (e.key==='Enter'){ const b = res.querySelector('[data-r]'); if (b) b.click(); } });
document.addEventListener('pointerdown', e => { if (!e.target.closest('.search')) res.hidden = true; });

/* ---------- start ---------- */
function start(){ miniLayout(); fitWidth(); }
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
addEventListener('resize', () => { miniLayout(); });
</script>
