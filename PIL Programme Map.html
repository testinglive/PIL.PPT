 any time rather than at month end."], ["17", "Standard formats exist but real-life fields and exceptions are not captured", "The formats attached to the SOP do not carry everything the work actually needs, so the gap is filled in the margins of a spreadsheet.", "The SOP formats used as the base for the digital forms, extended with the additional fields and exception handling the department uses in practice."], ["18", "Design data comparison and progress against design are checked manually", "A reported quantity that does not match the current design is found only if someone looks for it.", "Component-wise comparison against the current design revision at the point the daily report is reviewed, with differences raised as comments to site."]], "scope": [["1", "Project planning record", "Project and package setup; WBS structure and coding; tender scope and quantity register; project list with filters; project planning summary", "One record per project carrying the WBS that budget, execution, resources, cost and MIS all reference, so every figure below reconciles to the same structure."], ["2", "Preliminary site visit", "Visit schedule; site checklist; geo and site details; soil, quarry and lead chart capture; raw-material rates and quotations; photographs; findings and risks; report generation; GM review and SVP approval; version and audit trail", "The site visit becomes a structured record with an approval route, rather than a report written after the fact from notes and photographs on a phone."], ["3", "Introduction meeting and minutes", "Meeting schedule; participants; agenda; discussion points; decisions; document and budget due dates; minutes generator; acknowledgement tracker; pending acknowledgement reminders", "The meeting that sets every department's due dates produces those due dates as tracked commitments rather than as text in a document."], ["4", "Budget collection and approval", "Department budget request and submission tracker; pending department list; due date and clock; consolidation; Project Coordinator review; SVP approval; rejection with comment and resubmission; budget and cost plan", "One approved project budget assembled without chasing, with the outstanding departments visible to everyone rather than only to Planning."], ["5", "SAP and WBS integration", "Budget to WBS mapping; sync status of pending, sent, successful or failed; integration reference; timestamp; error and retry log; cost and actuals retrieval", "The handover to SAP stops being an assumption. A failed upload is visible immediately instead of being discovered when the first cost report disagrees."], ["6", "Mobilization and resource planning", "Manpower requirement; material requirement; plant and machinery requirement; site establishment; requisition to HR, Procurement and P&M; mobilization status", "The resource requirement leaves Planning as a dated request to a named function, and its response is tracked against the plan."], ["7", "Master schedule and planning components", "Master schedule and WBS; S-curve; cash flow; manpower plan; machinery plan; material plan; monthly work programme; schedule import; baseline comparison", "The seven compulsory planning outputs held as tabs on one linked baseline, so a change to the schedule is reflected in the curve, the cash flow and the resource plans."], ["8", "Schedule approval and baseline control", "Draft, Planning GM review, Project Coordinator review, SVP approval, released; rejection reason; revision comparison; approved baseline lock; activity-wise work programme release", "An approved baseline that cannot be quietly edited, and a revision that can be compared against the version it replaces."], ["9", "Project readiness and kick-off gate", "Mandatory document checklist; approval status per item; presentation pack; attendance; minutes; acknowledgement; release to execution or blocked release with the missing item named", "The one control in the Planning process that can say no, and the reason every downstream department can rely on the plan it receives."], ["10", "Daily progress reporting", "Digital daily report form by component and activity; quantity capture; site entry; submission, review and approval clocks; verify or flag with comments; site view of status and comments; history", "Replaces the daily spreadsheet and the email round trip, and closes the cycle on the day the report is received."], ["11", "Progress against design and quantity check", "Component-wise comparison against the current design revision; quantity variance; difference register; comments to site; closure evidence", "A reported quantity that does not agree with the design is caught at review rather than at reconciliation."], ["12", "Weekly and monthly reporting", "Weekly progress report; monthly plan submission from site; Head Office verification; monthly progress report; report template library in approved formats", "Weekly and monthly reports generated from data already verified once, in the formats management has approved."], ["13", "Planned versus achieved and reconciliation", "Planned against achieved by activity and period; executed and balance quantity; unit of measurement; reconciliation; project type summary; variance analysis", "The comparison management relies on, available at any time and derived from the baseline rather than rebuilt from several sources."], ["14", "Material requirement and purchase trigger", "Monthly material requirement from the work programme; requirement against stock; requisition to Procurement; delivery status; consumption against plan", "Closes the planning cycle that runs from budget through design and the monthly plan to purchase, so a late requirement is visible before it becomes a late delivery."], ["15", "Exception and red flag register", "Exception capture; deviation type; owner; due date; ageing; escalation level; resolution and closure evidence; management red flag view", "Deviations surface as they happen, with an owner and a clock, instead of appearing in a monthly report."], ["16", "Dashboards, MIS and reports", "The eighteen dashboards of Section 3; drill-down to the underlying record; MIS pack generation on the fixed dates; approved report and deck formats; export to Excel and PDF", "Management visibility with early warning, in formats approved once and produced without assembly."], ["17", "Planning SLA engine and monitor", "SLA master with start event, due date and time, working or calendar days, warning threshold, grace period and breach status; escalation hierarchy; SLA monitor by project, owner and clock", "Every clock in the Planning SOP runs in one engine — the five-day visit, the seven-day meeting, the seven working days for budget, the fifteenth day for kick-off, the daily report times, the Monday weekly report and the fixed monthly dates."], ["18", "RACI, roles, access and audit", "Prepared by, reviewed by, approved by, consulted and informed per workflow; delegate and out-of-office substitution; pending-age visibility; Head Office and site roles; full audit trail; configuration masters", "Routing follows the RACI rather than a person's name, and an approval does not stall because one individual is unavailable."]], "open": ["That the ten-stage process set out in Section 1 reflects how Planning operates today.", "That the eighteen workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The headcount of the Head Office planning team and of a typical site planning team, which was not recorded during our discussion.", "Which of the planning clocks run on working days and which on calendar days — the five-day site visit, the seven-day introduction meeting, the seven working days for budget collection and the fifteenth day for kick-off.", "The daily reporting times, confirmed as submission by 9:30, review by 11:00 and approval by 16:00, and what should happen when each is breached.", "The fixed monthly reporting dates, confirmed as the 5th, 7th and 10th, and what each covers and who receives it.", "Which basis is authoritative for reporting project completion — milestones, payments or quantity calculation — given that all three are in use.", "The WBS structure and coding standard to be applied across budget, execution, resources, actual cost and MIS, and which department owns it.", "The scope of the SAP integration: which objects are read, whether the approved budget is written back automatically, and who owns the interface.", "Whether the master schedule remains in Microsoft Project with import into the platform, or the platform becomes the schedule of record.", "The escalation hierarchy and grace periods to be applied when a planning clock is breached.", "The delegation and substitution rules for the Planning GM, the Project Coordinator and the SVP, so that an approval does not stall on one person's absence.", "The mandatory document list for the kick-off gate, and who may authorise a release while an item is still open.", "What the site team should be able to see and do in the system, and whether daily reporting should be possible on mobile at site.", "The standard formats attached to the Planning SOP, and the real-life fields and exceptions that need to be added to them.", "The full list of major work items to be tracked, beyond earthwork, granular sub-base, wet mix macadam, dense bituminous macadam and bituminous concrete.", "The scope of Planning's closure obligations, which were named but not described during our discussion.", "Whether existing schedules, budgets, daily report history and reconciliation records should be migrated at go-live, and in what form they are held."], "sap": {"1": ["Project definition; WBS structure and codes", "PS", "Read"], "4": ["Approved project budget by WBS", "PS / CO", "Read"], "5": ["WBS budget; actual cost by WBS; posting status", "PS / CO", "Read (write-back to be decided)"], "6": ["PR status for manpower, material and equipment requisitions", "MM", "Read"], "13": ["Actual cost by WBS for planned vs achieved", "PS / CO", "Read"], "14": ["Stock by project and material; PR and PO status", "MM", "Read"]}}, "billing": {"key": "billing", "name": "Billing", "intro": ["Billing is the department that turns work done at site into a payable, verified bill. It sits between Planning, which supplies the BOQ and the rates, and Finance and Accounts, which make the payment. Most of its work concerns subcontractors: registering them as vendors, issuing their work orders, recording what they build every day, and preparing, checking and approving their bill every month. The department also carries out milestone-wise verification of the project and approves or rejects billing against it.", "The department works through nine stages. The first three set up the commercial basis — the BOQ and rates, the vendor and the work order. The next three run continuously, from the daily progress report through quantity control to the monthly bill. The last three are approval, reconciliation and handover for payment."], "insight": "The approval step determines the path. Where every level approves, the bill is signed, reconciled and passed to Finance and Accounts for payment. Where any level rejects, the whole bill returns to the beginning and the approval chain starts again from Level 0. That rule is the reason a single error at any level has such a large effect on the billing cycle.", "flowcap": "Master flow — nine stages from BOQ to payment and reporting", "flow": [{"t": "1. BOQ and Rates", "s": "from Planning", "dec": false, "hl": false}, {"t": "2. Vendor Registration", "s": "site to Accounts", "dec": false, "hl": false}, {"t": "3. Work Order", "s": "rate, quantity, 3 approvals", "dec": false, "hl": true}, {"t": "4. Daily DPR", "s": "checked the same day", "dec": false, "hl": true}, {"t": "5. Quantity Control", "s": "against WO quantity", "dec": false, "hl": false}, {"t": "6. Monthly Bill", "s": "opens on the 25th", "dec": false, "hl": false}, {"t": "7. Approved?", "s": "site and HO levels", "dec": true, "hl": false}, {"t": "Restart from Level 0", "s": "whole bill returns", "dec": false, "hl": false}, {"t": "8. Sign-off and Reconciliation", "s": "hard copy and SAP", "dec": false, "hl": true}, {"t": "9. Finance and MIS", "s": "payment and reporting", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — BOQ, Budget and Rate Baseline", "text": "Billing receives the BOQ from the Planning department. Rates are finalised by Planning, which also manages labour rates, stage and structure rates, and the benchmarks against which rates are judged. At present the BOQ and the work order are the only cost references Billing has; there is no budgeted cost for every item.", "nodes": [{"t": "Standard BOQ", "s": "from Planning", "dec": false, "hl": false}, {"t": "Rates finalised", "s": "by Planning, with benchmarks", "dec": false, "hl": false}, {"t": "Budget per item", "s": "not available today", "dec": false, "hl": true}, {"t": "Billing baseline", "s": "BOQ, rate, budget", "dec": false, "hl": false}], "note": "The cost of material, labour, transportation and plant and machinery cannot currently be fixed per item, so Billing has nothing to measure a bill against except the BOQ and the work order."}, {"title": "Stage 2 — Vendor Registration", "text": "A subcontractor has to exist as a vendor before it can be given a work order. The site collects the vendor's details — name, PAN, address, contact number and supporting information — and passes them to Planning, which passes them to Billing. Billing provides the vendor profile and the Accounts team creates the vendor account in SAP.", "nodes": [{"t": "Vendor details collected", "s": "at site", "dec": false, "hl": true}, {"t": "Site to Planning", "s": "forwarded", "dec": false, "hl": false}, {"t": "Planning to Billing", "s": "vendor profile prepared", "dec": false, "hl": false}, {"t": "Vendor account created", "s": "by Accounts, in SAP", "dec": false, "hl": false}], "note": "The details pass through three hands before the account exists. Each handover is manual, and the site has no view of where the request is."}, {"title": "Stage 3 — Work Order Creation and Approval", "text": "Once the vendor exists, the work order is created in SAP with its rates and quantities. It passes through three approvals, the first of which is the Billing Head. After approval, the site returns a physically signed hard copy of the contract.", "nodes": [{"t": "WO created in SAP", "s": "rate and quantity", "dec": false, "hl": false}, {"t": "Approval 1", "s": "Billing Head", "dec": false, "hl": false}, {"t": "Approval 2", "s": "to be confirmed", "dec": false, "hl": false}, {"t": "Approval 3", "s": "to be confirmed", "dec": false, "hl": false}, {"t": "Signed hard copy", "s": "returned from site", "dec": false, "hl": true}], "note": "Only the first of the three approvers was named in our discussion. The other two are raised for confirmation in Section 8."}, {"title": "Stage 4 — Daily Progress Recording", "text": "The subcontractor carries out the work and fills in the daily progress report on paper, chainage-wise. Once every subcontractor has submitted, the site converts the hard copies into an Excel DPR and enters it into SAP. The Head Office team checks every DPR daily; any mistake must be corrected the same day, before the next DPR is submitted.", "nodes": [{"t": "Hard-copy DPR", "s": "by subcontractor, chainage-wise", "dec": false, "hl": true}, {"t": "Converted to Excel", "s": "by site", "dec": false, "hl": true}, {"t": "Entered in SAP", "s": "by site team", "dec": false, "hl": false}, {"t": "Correct?", "s": "HO daily check", "dec": true, "hl": false}, {"t": "Corrected same day", "s": "before next DPR", "dec": false, "hl": false}], "note": "The same day's work is written three times — on paper, in Excel and in SAP. Highlighted steps are the two that a digital DPR at site would remove."}, {"title": "Stage 5 — Quantity Control", "text": "Quantities accumulate against each BOQ item and each work order as DPRs are recorded. A bill must not exceed the work order quantity, and SAP already enforces that limit. The department wants to be notified earlier — when 80% of the assigned quantity has been used — and to see a live work-in-progress position for every item.", "nodes": [{"t": "Quantity accumulates", "s": "per BOQ item and WO", "dec": false, "hl": false}, {"t": "80% of WO quantity", "s": "alert wanted", "dec": false, "hl": true}, {"t": "WO quantity reached", "s": "blocked in SAP", "dec": false, "hl": false}, {"t": "WIP per item", "s": "live position wanted", "dec": false, "hl": true}], "note": "The hard limit exists. What is missing is the early warning and the running position between them."}, {"title": "Stage 6 — Monthly Bill Preparation", "text": "Billing opens on the 25th of every month. The site team prepares the bill in Excel from the month's DPRs and has five days to review and confirm it. Three things are checked every month: measured material, plant production and the DPR. The reviewed bill is then sent to Head Office.", "nodes": [{"t": "Billing opens", "s": "25th of the month", "dec": false, "hl": false}, {"t": "Site bill prepared", "s": "in Excel", "dec": false, "hl": true}, {"t": "Monthly checks", "s": "material, plant production, DPR", "dec": false, "hl": false}, {"t": "Site review", "s": "5 days", "dec": false, "hl": false}, {"t": "Sent to HO Billing", "s": "for review", "dec": false, "hl": false}], "note": "The site bill is rebuilt in Excel from DPRs that already exist in SAP, so the month's data is re-keyed a fourth time."}, {"title": "Stage 7 — Review, Audit and Approval", "text": "The bill is approved at site at Levels 1 and 2, by the Project Manager and the Quality or Construction Manager. It is then reviewed and audited by the Head Office Billing team, which either confirms it or returns corrections, and signed off at Level 3 in Head Office. If the bill is rejected at any level, the entire process returns to Level 0 and starts again.", "nodes": [{"t": "Levels 1 and 2", "s": "PM and QM at site", "dec": false, "hl": false}, {"t": "HO review and audit", "s": "HO Billing team", "dec": false, "hl": false}, {"t": "Approved?", "s": "review outcome", "dec": true, "hl": false}, {"t": "Rejected", "s": "restarts from Level 0", "dec": false, "hl": true}, {"t": "Level 3 sign-off", "s": "Head Office", "dec": false, "hl": false}], "note": "A rejection at Level 3 sends the bill back through Levels 1 and 2 even where the issue concerns only one line."}, {"title": "Stage 8 — Signature, Reconciliation and Record", "text": "An approved bill is processed only on the final hard-copy signature and the SAP signature of every site and Head Office person in the chain. Reconciliation is then carried out against the BOQ item and date — a step that sits outside SAP today, as the DPR does. A scanned, signed copy is retained for tax audit.", "nodes": [{"t": "Hard-copy signatures", "s": "site and HO", "dec": false, "hl": true}, {"t": "SAP signatures", "s": "site and HO", "dec": false, "hl": false}, {"t": "Reconciliation", "s": "outside SAP", "dec": false, "hl": true}, {"t": "Signed copy retained", "s": "for tax audit", "dec": false, "hl": false}], "note": "Every approval is recorded twice, once on paper and once in SAP. Reconciliation and the DPR are the two billing records that do not live in SAP."}, {"title": "Stage 9 — Finance Handover, Cost Control and MIS", "text": "The signed bill passes to the Finance team and then to Accounts for payment. Alongside the payment cycle, the department wants a budgeted cost for every item, an approval from the relevant head whenever a cost goes above it, a warning on any miscellaneous or exaggerated payment, and project-wise red flag reports. MIS is the department's main area of focus.", "nodes": [{"t": "Bill to Finance", "s": "after sign-off", "dec": false, "hl": false}, {"t": "Accounts pays", "s": "vendor payment", "dec": false, "hl": false}, {"t": "Budget against actual", "s": "per item, with approval above budget", "dec": false, "hl": true}, {"t": "MIS and red flags", "s": "project-wise", "dec": false, "hl": true}], "note": "Management reports are produced as MIS and presentation decks. Both are assembled by hand from SAP, Excel and the site bills."}], "extra": null, "workflows": [["1", "Standard BOQ intake", "Project start", "Planning, Billing", "The standard BOQ held against the project and its WBS, available to Billing and every other department from day one"], ["2", "Rate and item budget baseline", "BOQ received", "Planning, Design, Billing", "Finalised rates, stage and structure rates, labour rates, benchmarks and a budgeted cost for every item, split by material, labour, transportation and plant"], ["3", "Vendor registration and account creation", "A new subcontractor is proposed at site", "Site, Planning, Billing, Accounts", "Vendor profile with PAN, address, contact and supporting documents, and a vendor account created in SAP, with the site able to see where the request stands"], ["4", "Work order creation and approval", "Vendor account created", "Billing, three approvers, Site", "Work order with rate and quantity approved at three levels, and the signed hard copy returned from site and held against it"], ["5", "Subcontractor cost breakdown", "Work order issued", "Subcontractor, Billing", "A labour and material cost breakdown submitted separately from the work order, giving Billing a cost basis the work order alone does not carry"], ["6", "Daily DPR capture at site", "Work carried out", "Subcontractor, Site Engineer, Site team", "Chainage-wise DPR entered once, on web or mobile, rather than written on paper, retyped into Excel and entered again into SAP"], ["7", "Daily HO DPR check and correction", "DPR submitted", "HO Billing, Site team", "Every DPR checked daily, with mistakes returned to site and corrected the same day before the next DPR is accepted"], ["8", "DPR against design comparison", "DPR submitted", "Billing, Design", "Reported quantities compared with design data, with differences raised before they reach a bill"], ["9", "Quantity threshold and WO limit control", "Quantity recorded against a work order", "Billing, Site", "An alert at 80% of the assigned quantity, a live work-in-progress position per item, and validation that no bill exceeds the work order quantity"], ["10", "Monthly bill preparation at site", "25th of the month", "Site team", "A monthly bill built from the month's verified DPRs, with measured material, plant production and DPR checks recorded against a site checklist"], ["11", "Site review and approval", "Site bill prepared", "Project Manager, Quality or Construction Manager", "Level 1 and Level 2 approval completed within the five-day site review window"], ["12", "HO review, audit and final sign-off", "Site approval complete", "HO Billing team, Level 3 approver", "Bill reviewed and audited against an HO checklist, then approved at Level 3 or rejected with a recorded reason"], ["13", "Signature capture and signed copy archive", "Level 3 approval", "Every site and HO approver", "Hard-copy signatures, SAP signatures and the scanned signed copy held together against the bill, retrievable for tax audit"], ["14", "Reconciliation", "Bill approved", "Billing", "Reconciliation by BOQ item and date produced in the system, rather than maintained outside SAP in a separate file"], ["15", "Handover to Finance and Accounts", "Bill signed and reconciled", "Billing, Finance, Accounts", "Bill passed for payment, with its payment status visible to Billing and to site"], ["16", "Over-budget and abnormal payment approval", "Cost exceeds item budget, or a payment falls outside the expected pattern", "Billing, relevant head", "A notification and a recorded approval or rejection from the relevant head before the cost or payment proceeds"], ["17", "Milestone verification", "A project milestone is reached", "Billing, Site, Planning", "Milestone-wise verification recorded, with the approval or rejection for billing that follows from it"], ["18", "MIS and red flag reporting", "Monthly cycle, or an exception raised", "Billing, Management", "MIS and presentation reports in agreed formats, and project-wise red flag reports produced from live data"]], "dashboards": [["1", "Billing cycle status", "Where each project's monthly bill sits — site preparation, site review, HO review, Level 3, signatures, Finance", "cap"], ["2", "Pending approvals by level", "Bills waiting at each approval level, with the approver and the age of the wait", "cap"], ["3", "Work order utilisation", "Quantity used against work order quantity, per vendor and per item, with the 80% threshold highlighted", "sap"], ["4", "Work in progress by item", "A live work-in-progress position for every BOQ item across all work orders", "cap"], ["5", "BOQ, executed and billed", "BOQ quantity against executed quantity against billed quantity, per item", "sap"], ["6", "Budget against actual by item", "Budgeted cost against actual cost for every item, with items above budget flagged for approval", "cap"], ["7", "Cost breakdown", "Cost split by material, labour, transportation and plant and machinery, per item and per project", "cap"], ["8", "DPR submission status", "DPRs submitted, checked, returned and corrected the same day, by site and by vendor", "now"], ["9", "DPR against design", "Reported quantity against design quantity, with open differences", "cap"], ["10", "Reconciliation status", "Reconciliation by BOQ item and date, with unreconciled items outstanding", "now"], ["11", "Vendor register", "Registered vendors, onboarding requests in progress and where each is held", "sap"], ["12", "Work order register", "Work orders by project and vendor, with value, quantity, approval status and signed copy status", "sap"], ["13", "Rejection analysis", "Bills returned to Level 0, the level that rejected them, the reason and the days lost", "cap"], ["14", "Abnormal payment alerts", "Miscellaneous or exaggerated payments flagged against the expected pattern, with their approval status", "cap"], ["15", "Project-wise red flags", "Over-budget items, threshold breaches, overdue approvals and unresolved differences, by project", "cap"], ["16", "Audit document completeness", "Bills with and without their signed hard copy, SAP signatures and scanned copy for tax audit", "cap"], ["17", "Milestone verification", "Milestones reached, verified, approved or rejected for billing, by project", "cap"], ["18", "Billing MIS", "The monthly management view of billed value, payment status, cost position and exceptions across projects", "now"]], "obs": "We note that most of the department's difficulty sits upstream of it. Billing cannot control a cost it has no budget for, and it cannot catch a quantity error that was introduced when a paper DPR was retyped at site.", "interactions": [["Planning", "The BOQ, the standard BOQ, finalised rates, labour rates, stage and structure rates, rate benchmarks and budget", "Billed quantities, cost position and notice of items going above budget; vendor details received from site", "BOQ and rates are received, but there is no budgeted cost for every item and cost heads are not fixed."], ["Design", "Design quantities for comparison against reported progress", "Differences between DPR quantity and design quantity", "Not structured. The comparison was named as a need rather than a current practice."], ["Site team", "DPRs, the monthly site bill, vendor details, measured material and plant production, and signed hard copies", "Work orders, DPR corrections, approval or rejection of bills, and returned bills for rework", "Paper DPRs converted to Excel and then entered in SAP. The site bill is prepared in Excel."], ["Project Manager and Quality or Construction Manager", "The site bill for Level 1 and Level 2 approval", "Approved bills forwarded to Head Office", "Hard-copy and SAP signatures, both required."], ["Subcontractors", "Vendor information, daily progress, invoices and work done, and a cost breakdown where requested", "Work orders, and payment through Accounts", "DPRs are handwritten by the subcontractor and collected at site."], ["Accounts", "Confirmation of vendor account creation, and payment status", "Vendor profiles for account creation, and approved bills for payment", "Vendor creation and payment both run through SAP. Billing is carried out according to the Accounts payment cycle."], ["Finance", "Budget and cost reference", "Signed and reconciled bills", "Passed on after sign-off."], ["Relevant department heads", "Approval or rejection where a cost exceeds its budget or a payment is abnormal", "Notice of the item or payment requiring approval", "No structured route exists today."], ["Management", "Direction on report formats", "MIS, presentation reports and project-wise red flags", "Assembled by hand from SAP, Excel and site bills."], ["Tax audit", "Requests for billing evidence", "Scanned and signed copies of approved bills", "Signed copies are required but not held centrally against each bill."]], "profile": [["Team structure", "Site billing team and Head Office billing team", "Site prepares; Head Office checks, audits and signs off. The platform needs a site entry experience that works on web and mobile, and a Head Office review queue that spans every project."], ["Team size", "Not recorded during the discussion", "Headcount at Head Office and at each site was not captured. It affects queue design and review load, and is raised in Section 8."], ["Approval structure", "Levels 1 and 2 at site, Level 3 at Head Office", "The approval route is fixed and well understood, which makes it straightforward to build. The rejection rule — return to Level 0 — is the part that needs a decision."], ["Nature of the work", "Subcontractor billing and milestone verification", "The department's product is a verified, approved and auditable bill. Everything in the platform is built around getting a quantity from site to payment without it being re-entered or disputed."], ["Position in the flow", "Planning, then Billing, then Finance and Accounts", "Billing is downstream of the BOQ and rates and upstream of payment. Its accuracy depends on what it receives, and its timeliness decides when subcontractors are paid."]], "tools": [["SAP", "Vendor accounts, work orders, rates, quantities, the work order quantity limit, DPR entry and approval signatures", "Retained as the system of record. The platform reads from it and writes to it, and adds what SAP does not hold — the DPR at source, reconciliation, early warnings and the approval view."], ["Excel", "The DPR after conversion from paper, the monthly site bill, reconciliation and MIS", "Replaced. Each becomes a structured record, and the bill and reconciliation are built from data entered once."], ["Paper", "Subcontractor DPRs, the signed work order contract and the final signed bill", "Replaced for data capture. Where a physical signature is still required for audit, the signed copy is scanned and held against the bill."], ["Scanned copies", "Evidence for tax audit", "Retained and centralised, with each copy attached to the bill it supports."], ["Email and telephone", "Vendor details, corrections, returned bills and follow-up", "Replaced for structured exchange, through a notification channel and an approver channel inside the platform."]], "pains": [["1", "Billing is stuck on the BOQ and the work order as its only cost reference", "There is no budget for every item, so nothing tells Billing that a cost is too high until it has already been paid.", "A budgeted cost held for every item, and every bill measured against it."], ["2", "Material, labour, transportation and plant cost cannot be fixed", "Without a cost split, an overrun cannot be traced to its cause.", "Fixed cost heads per item, with the budget and the actual both recorded against them."], ["3", "Accurate cost inputs from Planning and Design arrive late or not at all", "The department suggested these be provided within six months of award. Until then Billing works without a baseline.", "BOQ, budget, work orders, standard rates and material rates captured as a dated baseline, with a visible completeness position."], ["4", "The standard BOQ is not uploaded at project start", "Each department ends up working from its own version.", "A standard BOQ uploaded once by Planning at the start of the project and read by every department."], ["5", "The DPR is written on paper, retyped into Excel and entered again into SAP", "The same day's work is recorded three times, and every transcription is a chance to introduce an error that reaches the bill.", "A digital, chainage-wise DPR entered once at site on web or mobile, with SAP updated from it."], ["6", "The DPR and reconciliation are not in SAP", "The two records most likely to contain a dispute live outside the system of record.", "Both held in the platform and linked to the SAP work order and BOQ item they concern."], ["7", "Every DPR is checked by hand at Head Office each day", "Corrections must be made the same day before the next DPR, which leaves no slack when site is slow to respond.", "A daily review queue with automatic validation, errors returned to site with comments, and the same-day clock visible to both sides."], ["8", "A rejection sends the whole bill back to Level 0", "One error at Level 3 undoes the approvals already given at Levels 1 and 2, and the cycle starts again.", "Rejections recorded with their reason and level, and a configurable rule on how far back a rejected bill returns, subject to your confirmation."], ["9", "Every approval needs both a hard-copy and an SAP signature", "Each bill carries two signing exercises for every person in the chain.", "Signatures captured against the bill in one place, with the physical copy scanned and attached where it is still required."], ["10", "Signed and scanned copies are needed for tax audit", "Finding the evidence for a specific bill depends on where it was filed.", "A document vault holding every signed and scanned copy against the bill it supports, searchable by project, vendor and period."], ["11", "There is no warning before a work order quantity runs out", "SAP stops the bill at the limit, but by then it is too late to amend the work order without delaying payment.", "An alert at 80% of the assigned quantity and a live work-in-progress position for every item."], ["12", "Miscellaneous or exaggerated payments are not flagged", "An abnormal payment is found in review, if at all.", "Rules that flag unusual payments to Billing automatically, with a recorded decision before they proceed."], ["13", "Costs above budget have no approval route", "The department wants the relevant head to approve an overrun, but nothing asks them.", "Automatic routing to the relevant head whenever an item exceeds its budget, with the decision recorded."], ["14", "MIS is the main focus and is built by hand", "Reports are assembled from SAP, Excel and site bills each period.", "MIS and presentation reports generated from live data in agreed formats."], ["15", "Vendor creation passes by hand from site to Planning to Billing to Accounts", "Each handover is a delay, and site cannot see where its request is.", "A single vendor registration request that moves through each step with its status visible to site."], ["16", "Site cannot send billing data digitally", "The department asked for site to submit from web and mobile.", "Site-facing web and mobile entry for DPRs, bills and vendor details."], ["17", "DPR data is not compared with design data", "A quantity that does not match the design reaches the bill unchallenged.", "Comparison against design quantity at the point the DPR is checked, with differences raised as project-wise red flags."], ["18", "Labour and material issues are handled separately, and data is not validated", "Issues and figures that belong together are kept apart, and incorrect entries are found late.", "Labour and material combined against the work order, with validation rules applied at the point of entry."]], "scope": [["1", "Project billing record", "Project and WBS setup; BOQ item register; vendor and work order mapping per project; billing summary per project", "One record per project that every vendor, work order, DPR, bill and reconciliation hangs from, keyed to the same WBS used by Planning."], ["2", "BOQ, rate and budget master", "Standard BOQ upload; rate management; labour rates; stage and structure rates; rate benchmarks; item budget; cost heads for material, labour, transportation and plant", "The cost baseline the department does not have today. Every bill can be measured against a budget and a rate agreed in advance."], ["3", "Vendor registration", "Vendor request from site; PAN, address, contact and documents; Planning and Billing review; Accounts creation in SAP; request status visible to site", "A vendor onboarded through one tracked request rather than three manual handovers."], ["4", "Work order management", "Work order creation with rate and quantity; three-level approval; signed hard copy upload; amendments; work order register", "An approved work order with its signed contract attached, and every amendment traceable."], ["5", "Subcontractor cost breakdown", "Labour and material breakdown submitted outside the work order; comparison against item budget", "A cost basis for each work order that the work order itself does not carry."], ["6", "Digital DPR", "Chainage-wise DPR entry on web and mobile; subcontractor, item and quantity; measured material and plant production; SAP update from the DPR", "The day's work recorded once at source, removing the paper, Excel and SAP re-entry."], ["7", "HO DPR review", "Daily review queue; automatic validation; return to site with comments; same-day correction clock; DPR history", "Every DPR checked daily, with errors corrected before they are carried into a bill."], ["8", "Quantity control", "Cumulative quantity per item and work order; 80% alert; work order quantity validation; live work in progress per item; intimation on every quantity update", "An early warning before a work order runs out, and a bill that cannot exceed what was ordered."], ["9", "DPR and design comparison", "Reported quantity against design quantity; difference register; red flag raised to project", "A quantity that disagrees with the design is caught at review rather than at payment."], ["10", "Monthly bill preparation", "Billing opens on the 25th; bill built from verified DPRs; site checklist; measured material, plant production and DPR checks; five-day site review clock", "The monthly bill generated from data already verified, instead of being rebuilt in Excel."], ["11", "Multi-level approval", "Level 1 and Level 2 at site; HO review and audit; HO checklist; Level 3 sign-off; rejection with reason and level; configurable return rule", "A visible approval route where every decision is recorded, and a rejection does not have to erase work that was correct."], ["12", "Signatures and document vault", "Approval signatures against the bill; scanned hard-copy upload; signed copy retention; search by project, vendor and period for tax audit", "Every piece of audit evidence held against the bill it supports and retrievable in seconds."], ["13", "Reconciliation", "Reconciliation by BOQ item and date; system reconciliation against SAP; unreconciled items; reconciliation history", "Reconciliation held inside the platform rather than in a file outside SAP."], ["14", "Finance and Accounts handover", "Bill passed for payment; payment status; payment history per vendor", "Billing and site can see whether an approved bill has been paid without asking."], ["15", "Cost control and exceptions", "Budget against actual per item; over-budget approval routed to the relevant head; abnormal payment rules and alerts; exception register", "Overruns and unusual payments surface automatically and cannot proceed without a recorded decision."], ["16", "Milestone verification", "Milestone register per project; verification record; approval or rejection for billing", "Milestone-wise verification held as a record rather than as a conversation."], ["17", "Dashboards, MIS and reports", "The eighteen dashboards of Section 3; project-wise red flag reports; MIS and presentation report templates; drill-down to the underlying record; export to Excel and PDF", "The department's main area of focus, produced without anyone assembling it."], ["18", "SAP integration, notifications, roles and audit", "Read and write with SAP for vendor, work order, quantity and billing; notification channel and approver channel; site and HO roles; data validation rules; full audit trail", "The platform works alongside SAP rather than duplicating it, and every action is attributable."]], "open": ["That the nine-stage process set out in Section 1 reflects how Billing operates today.", "That the eighteen workflows in Section 2 are complete, and that none of the department's work falls outside them.", "Whether the department also raises bills to the client or authority, or whether its work is confined to subcontractor billing and milestone verification, and what milestone-wise verification covers.", "The headcount of the Head Office billing team and of a typical site billing team, which was not recorded during our discussion.", "The second and third approvers of a work order, since only the Billing Head was named.", "Whether the Level 1 and Level 2 site approvers are the Project Manager and the Quality Manager, or the Project Manager and the Construction Manager.", "Whether every rejection must return the bill to Level 0, or whether a bill may return to the level at which the problem sits with earlier approvals retained.", "The billing calendar — whether the 25th and the five-day site review run on calendar or working days, and the time allowed for Head Office review and sign-off.", "Whether approval signatures in the platform can stand in place of the hard-copy signature, or whether the physical signature must remain for audit.", "The cost heads to be used for every item, who supplies the item budgets, and whether the six-month window after award should be treated as a deadline.", "Whether subcontractors should be asked to submit a labour and material cost breakdown separately from the work order.", "Who counts as the relevant head for approving a cost above budget, for each cost category, and at what threshold.", "What defines a miscellaneous or exaggerated payment for the purpose of an automatic alert.", "The 80% quantity threshold, confirmed, and who should receive the alert.", "The scope of the SAP integration, including whether the DPR and reconciliation should be written back to SAP.", "Whether subcontractors should enter their DPR directly, or whether the site engineer enters it on their behalf.", "The MIS and presentation report formats the department and management expect.", "Whether existing vendor records, work orders, DPR history and reconciliations should be migrated at go-live, and in what form they are held."], "sap": {"1": ["Project; WBS; BOQ item codes", "PS", "Read"], "2": ["Approved budget and cost elements by WBS", "PS / CO", "Read"], "3": ["Vendor code and creation status", "FI / MM", "Read"], "4": ["Work order (service PO): rate, quantity, value, approvals", "MM", "Read"], "6": ["DPR quantities as posted against the work order", "MM", "Read / Write (to confirm)"], "8": ["Work order quantity ordered and consumed", "MM", "Read"], "10": ["Service entry sheets; bill posting status", "MM", "Read"], "13": ["Quantities and values billed in SAP, for reconciliation", "MM / FI", "Read"], "14": ["Vendor invoice and payment status", "FI", "Read"], "15": ["Budget against actual by WBS and cost element", "PS / CO", "Read"]}}, "quality": {"key": "quality", "name": "Quality", "intro": ["Quality decides whether material and completed work meet the approved Quality Assurance Plan, the Inspection and Test Plan, the drawings, the specification and the client's requirements. Its authority is a simple one and it runs through the whole project: no layer is released until the layer beneath it has passed.", "The department is almost entirely field-based and is organised around the major work streams — soil, granular layers, bitumen and concrete — each with its own manager reporting to the site quality lead. Its work runs through nine stages, from writing the quality plan at project start to handing over the evidence pack at the end."], "insight": "The release decision at stage seven is the structural feature of this process. A passed inspection releases the next layer or activity; a failure opens a non-conformance, and the work returns for corrective action and re-inspection before it can be released. A test that is missed, or a failed result that is allowed through, is not contained at that point — it is built over, and the cost of it appears much later.", "flowcap": "Master flow — nine stages from the quality plan to the evidence pack", "flow": [{"t": "1. QAP and ITP", "s": "project quality plan", "dec": false, "hl": false}, {"t": "2. Test Requirements", "s": "by material, stage, frequency", "dec": false, "hl": false}, {"t": "3. Source Approval", "s": "before material is used", "dec": false, "hl": true}, {"t": "4. Incoming Inspection", "s": "receipt, sampling, testing", "dec": false, "hl": false}, {"t": "5. Stage Checks", "s": "before, during and after work", "dec": false, "hl": false}, {"t": "6. RFI and Inspection", "s": "witness and sign-off", "dec": false, "hl": false}, {"t": "7. Testing", "s": "result against acceptance limit", "dec": false, "hl": false}, {"t": "Pass?", "s": "release decision", "dec": true, "hl": false}, {"t": "8. Non-conformance", "s": "corrective action and re-test", "dec": false, "hl": true}, {"t": "Next stage released", "s": "work may proceed", "dec": false, "hl": true}, {"t": "9. Evidence and Handover", "s": "reports and certificates", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Quality Assurance Plan and Inspection and Test Plan", "text": "At project start the QAP and the ITP are prepared and approved according to the project type, the design and specification, and the client and authority requirements. Together they define what will be inspected, what will be tested, and what must be satisfied before work is accepted.", "nodes": [{"t": "Project starts", "s": "type, design, specification", "dec": false, "hl": false}, {"t": "QAP prepared", "s": "from approved templates", "dec": false, "hl": false}, {"t": "ITP prepared", "s": "inspection and test plan", "dec": false, "hl": false}, {"t": "Client requirements applied", "s": "and approved revisions", "dec": false, "hl": true}], "note": "The QAP and the ITP exist as documents. There is no single system that holds them, applies them and measures against them."}, {"title": "Stage 2 — Inspection and Test Requirements", "text": "The plan is broken down into requirements: which inspections and which tests apply to each material, activity, stage and layer, and how often they are required against the quantity executed. Hold points, witness points and release criteria are set here.", "nodes": [{"t": "Requirements defined", "s": "material, activity, layer", "dec": false, "hl": false}, {"t": "Frequency set", "s": "against executed quantity", "dec": false, "hl": true}, {"t": "Hold and witness points", "s": "who must attend", "dec": false, "hl": false}, {"t": "Release criteria", "s": "what must be satisfied", "dec": false, "hl": false}], "note": "Frequency depends on executed quantity, so the department needs progress data to know how many tests are due. Test frequencies vary by project and must stay configurable rather than fixed in the system."}, {"title": "Stage 3 — Material Source Approval", "text": "Material cannot be used in the work until its source is approved. The request carries technical documents, samples, certificates and test results, and results in an approval, a conditional approval or a rejection. Approvals carry a validity and have to be revalidated.", "nodes": [{"t": "Source proposed", "s": "vendor and material", "dec": false, "hl": false}, {"t": "Documents and samples", "s": "certificates, test results", "dec": false, "hl": false}, {"t": "Technical decision", "s": "approved, conditional, rejected", "dec": false, "hl": true}, {"t": "Validity tracked", "s": "expiry and revalidation", "dec": false, "hl": false}], "note": "Source approval is a controlled technical decision, not an informal clearance. The decision, the evidence behind it and the person who made it all belong on one record."}, {"title": "Stage 4 — Incoming Material Inspection", "text": "Material arriving at site is received and inspected against the approved source. Samples are drawn, laboratory or third-party tests are carried out where required, and material whose decision is pending or failed is held rather than issued.", "nodes": [{"t": "Material received", "s": "against store receipt", "dec": false, "hl": false}, {"t": "Inspected and sampled", "s": "lot identified", "dec": false, "hl": false}, {"t": "Tested", "s": "laboratory or third party", "dec": false, "hl": false}, {"t": "Accept or hold", "s": "quarantine where failed", "dec": false, "hl": true}], "note": "The department also tracks what was received against what was consumed, and what remains, which is where material control and the protection of stock at the plant sit."}, {"title": "Stage 5 — Pre-work, In-process and Post-work Checks", "text": "Each activity carries checks before work begins, while it is being carried out and after it is finished. Checklists are prepared by the QA manager and cover the major work streams — earthwork and embankment, subgrade, granular layers, bituminous work and concrete and structural works.", "nodes": [{"t": "Checklist issued", "s": "prepared by QA manager", "dec": false, "hl": false}, {"t": "Pre-work check", "s": "before work begins", "dec": false, "hl": false}, {"t": "In-process check", "s": "during work", "dec": false, "hl": false}, {"t": "Post-work check", "s": "after completion", "dec": false, "hl": false}], "note": "Checklists, calculations and testing records are held in spreadsheets and paper today, which is why the same check can be recorded differently on two projects."}, {"title": "Stage 6 — Request for Inspection", "text": "When a stage is ready, an inspection request is raised against the project, the activity, the location or chainage and the work stage. The check is carried out with site, quality and, where required, the client, consultant or independent engineer in attendance, and signed off.", "nodes": [{"t": "RFI raised", "s": "activity, chainage, stage", "dec": false, "hl": false}, {"t": "Inspection scheduled", "s": "planned date", "dec": false, "hl": false}, {"t": "Witness attendance", "s": "client, consultant or IE", "dec": false, "hl": true}, {"t": "Sign-off", "s": "pass, conditional or reject", "dec": false, "hl": false}], "note": "Photographs are compulsory at inspection and must carry the northing, the timestamp and the chainage. Today they are taken on phones and circulated through messaging groups."}, {"title": "Stage 7 — Testing and Result Recording", "text": "Tests are requested against the ITP requirement, samples are collected and assigned to a laboratory or third party, and results are recorded against the acceptance limit. The result is a pass, a conditional pass or a failure, and it decides whether the next layer or stage may be released.", "nodes": [{"t": "Test requested", "s": "against ITP requirement", "dec": false, "hl": false}, {"t": "Sample collected", "s": "identified and tracked", "dec": false, "hl": false}, {"t": "Laboratory assigned", "s": "internal or third party", "dec": false, "hl": false}, {"t": "Within limit?", "s": "acceptance criteria", "dec": true, "hl": false}, {"t": "Non-conformance", "s": "stage 8", "dec": false, "hl": false}], "note": "Common categories discussed include gradation, density and compaction, moisture, CBR and effective CBR, aggregate and material properties, concrete and pavement-layer tests. The full catalogue and its acceptance criteria come from the approved QAP and ITP."}, {"title": "Stage 8 — Non-conformance and Corrective Action", "text": "Where a test fails or a defect is found, the non-conformance is recorded with the work or material affected, the location, the severity and the evidence. The reason is identified, a corrective action is agreed with a target date, the work is re-inspected or re-tested, and the evidence of closure is retained.", "nodes": [{"t": "Non-conformance raised", "s": "defect, location, severity, evidence", "dec": false, "hl": false}, {"t": "Root cause", "s": "reason identified", "dec": false, "hl": false}, {"t": "Corrective action", "s": "owner and target date", "dec": false, "hl": false}, {"t": "Re-inspect or re-test", "s": "returns to stage 7", "dec": false, "hl": true}, {"t": "Closed with evidence", "s": "verified", "dec": false, "hl": false}], "note": "Overdue and repeat non-conformances escalate. A mandatory hold point that is open or failed should prevent the next stage being marked as released."}, {"title": "Stage 9 — Quality Evidence and Handover", "text": "Reports and certificates are maintained for the client, the independent engineer or third-party inspector, and the project record. The evidence for an accepted stage is the inspection, the test result, the photographs and the sign-off that released it.", "nodes": [{"t": "Records assembled", "s": "inspections, tests, evidence", "dec": false, "hl": false}, {"t": "Certificates issued", "s": "client and independent engineer", "dec": false, "hl": false}, {"t": "Repository", "s": "versioned and searchable", "dec": false, "hl": true}, {"t": "Handover pack", "s": "project record", "dec": false, "hl": false}], "note": "Every record must show who checked, who approved, who rejected and who carried out the work. That trail is the department's product as much as the test result itself."}], "extra": null, "workflows": [["1", "QAP preparation and approval", "Project start", "Quality, Design, client or authority", "An approved project QAP built from a template, carrying the client and authority requirements that apply to this project"], ["2", "ITP and test frequency configuration", "QAP approved", "Quality", "Inspection and test requirements by material, activity, layer and location, with frequency expressed against executed quantity and configurable per project"], ["3", "QAP and ITP revision control", "Design revision, specification change or client instruction", "Quality, Design", "A new approved version with an effective date, with earlier inspections still judged against the version that applied at the time"], ["4", "Material source and vendor approval", "A new source or material is proposed", "Quality, Procurement, vendor, laboratory", "An approved, conditionally approved or rejected source, with its documents, samples and test results attached, and its validity and revalidation tracked"], ["5", "Incoming material inspection", "Material received at site or plant", "Quality, Stores", "An inspection decision against the material lot and store receipt, with failed or pending material held rather than issued"], ["6", "Sampling and chain of custody", "An ITP requirement falls due", "Quality, site, laboratory", "An identified sample traceable from collection to result, with the location and lot it represents"], ["7", "Test request and laboratory assignment", "Sample collected", "Quality, internal laboratory, third party", "A test request with a due date, assigned to a laboratory, visible as pending until the result is returned"], ["8", "Test result entry and acceptance", "Test carried out", "Laboratory, Quality", "A result recorded against the acceptance limit and reviewed, giving a pass, conditional pass or failure"], ["9", "Checklist configuration and issue", "Activity planned", "QA manager, work-stream managers", "Pre-work, in-process and post-work checklists issued against the activity and work stream"], ["10", "Inspection request and scheduling", "A stage is ready for inspection", "Site, Quality", "An RFI against project, activity, chainage and stage, with a planned date and the attendance required"], ["11", "Inspection and witness sign-off", "RFI scheduled", "Quality, site, client, consultant or independent engineer", "An electronic sign-off recording the outcome and everyone present, rather than a signature on a sheet"], ["12", "Hold point and stage release", "Inspection and test complete", "Quality, site, Planning", "The next layer or stage released only where the required condition is satisfied, with a controlled and recorded override where work genuinely cannot wait"], ["13", "Non-conformance recording", "A failed test or a defect found", "Quality, site, responsible party", "An NCR with the affected work, location, severity, evidence and responsible party"], ["14", "Corrective action and closure", "NCR raised", "Quality, site, work-stream manager", "Root cause, corrective action, target date, re-inspection or re-test and verified closure, with escalation where overdue or repeated"], ["15", "Field evidence capture", "Any inspection, test or non-conformance", "Site quality staff", "Photographs and video captured on mobile carrying the timestamp, the northing or location and the chainage, linked to the record they belong to"], ["16", "Material received against consumed", "Material issued or consumed", "Quality, Stores", "A reconciliation of what was received, what was consumed and what remains, against the approved source"], ["17", "Daily quality reporting and escalation", "Daily cycle, or a failure raised at site", "Work-stream managers, site quality lead, HOD", "A daily report per work stream, and a red flag raised from site that reaches the right manager rather than a group message"], ["18", "Certificate and evidence handover", "Stage accepted, or project handover", "Quality, client, independent engineer", "Reports and certificates issued and held in a versioned repository, searchable by project, activity, location and period"]], "dashboards": [["1", "Project quality status", "Quality position by project and work stream, with what is open, held or failed", "cap"], ["2", "Test register", "Tests due, carried out, overdue, missing and failed, by material, activity and layer", "now"], ["3", "ITP coverage", "Tests completed against tests required for the quantity executed, so a shortfall is visible before the layer is covered", "cap"], ["4", "RFI status", "Inspection requests raised, scheduled, witnessed, passed, rejected and pending, with age", "cap"], ["5", "Open hold points", "Stages that cannot be released, what is holding them and who must act", "cap"], ["6", "Pass and failure rate", "Pass, conditional pass and failure rates by material, activity, layer and location", "now"], ["7", "Non-conformance register", "Open, overdue and closed non-conformances by severity, with owner and target date", "cap"], ["8", "Non-conformance trends", "Recurring defects by project, source, material, activity, location and defect type", "cap"], ["9", "Material source approval", "Sources approved, conditional, rejected, expiring and awaiting revalidation", "cap"], ["10", "Incoming material status", "Lots received, inspected, accepted, held and rejected", "cap"], ["11", "Received against consumed", "Material received, consumed and remaining, by project and material", "sap"], ["12", "Laboratory load and turnaround", "Tests assigned per laboratory, work in hand and days to result", "cap"], ["13", "Certificate and approval expiry", "Approvals, certificates and third-party validations approaching expiry", "cap"], ["14", "Work-stream view", "The position for soil, granular layers, bitumen and concrete separately, each with its own manager", "cap"], ["15", "Evidence completeness", "Inspections and tests with and without their photographs, timestamp, location and chainage", "cap"], ["16", "Client and third-party inspection", "Witness inspections, third-party tests and certificates issued to the client and the independent engineer", "now"], ["17", "Red flags and escalation", "Failures raised from site, overdue corrective actions and repeat non-conformances, by owner and age", "cap"], ["18", "Quality MIS", "The management view across projects — testing, failures, held stages, open actions and trends", "now"]], "obs": "We note that the department's authority is exercised at other departments' decision points. That is why so much of its work today is chasing and confirming by telephone and message, and why placing the decision in the system is worth more here than a report would be.", "interactions": [["Design", "Drawings, specifications and the approved design quantity against which work is judged", "Site observations where the executed condition differs from the drawing, and queries arising from inspection", "Drawings and specifications are referenced from files. A revision reaching site late affects what is inspected."], ["Planning", "The work programme, activity sequence and executed quantity or progress", "Hold-point position and the release of a stage, which decides whether the next activity can start", "Executed quantity is needed to know how many tests are due under the ITP frequency, and it is obtained informally."], ["Procurement", "Proposed suppliers and sources, purchase details for bitumen and other materials", "Source approval decisions and supplier quality performance", "Supplier decisions are taken with Quality's input, but the input and the outcome are not held against the supplier."], ["Stores", "Material receipt, lot details, stock position and issue records", "Inspection decision on each lot, hold and quarantine instructions, and the received-against-consumed position", "Material control sits between the two, including the protection of stock held at the plant."], ["Site execution team", "Notice that a stage is ready, inspection requests and site conditions", "Checklists, inspection outcomes, test results, released stages and non-conformances", "Requests and results move by telephone and messaging groups, with photographs attached to messages."], ["Billing", "Executed quantity intended for certification", "Quality verification and acceptance of the work being billed", "Quality or technical verification may be required before a bill is accepted, but the link is not systematic."], ["Laboratories and third parties", "Test results and certificates", "Test requests, samples and assignment with due dates", "Results return as reports and are filed separately from the inspection they belong to."], ["Client, consultant and independent engineer", "Requirements, witness attendance, approvals and observations", "Inspection requests, test evidence, certificates and quality records", "Submissions follow the client's and authority's own systems and templates."], ["Management", "Direction on reporting and escalation", "Daily reports, red flags, failure trends and project quality status", "Compiled by hand from spreadsheets and reports."]], "profile": [["Organisation", "Four work streams under a site quality lead", "Soil, granular layers covering GSB, WMM, CTB and CTSB, bitumen, and concrete and structures each have a manager. They report to the main site quality lead at Assistant or Deputy General Manager level, who reports to the office quality function. Work and records should be assignable by work stream, not only by project."], ["Team size", "Recorded as 300 to 400", "A large, distributed population. Whether that figure covers the quality department alone or the wider site organisation was not clarified, and it is raised in Section 8. Either way it sets the expectation: the platform has to be usable by people who were not trained in an office."], ["Where the work happens", "Entirely at site", "Nobody in this department works from an office. Mobile capture is not an enhancement here, it is the primary interface, and it has to work where connectivity is poor."], ["Nature of the decision", "Technical and binding", "Material approval and stage release are controlled technical decisions. The platform's job is to make those decisions explicit, attributable and hard to bypass without a record."], ["Evidence requirement", "Photographs are compulsory", "Every inspection photograph must carry the northing, the timestamp and the chainage. This drives the mobile capture design and the evidence completeness view."]], "tools": [["Excel and paper", "Checklists, calculations, test records, registers and reporting", "Replaced. Each becomes a structured record tied to the material, the activity and the location it concerns."], ["Laboratory records", "Test requests, results and certificates", "Replaced by a test register linked to the sample, the ITP requirement and the inspection that depends on it."], ["Phone cameras and messaging groups", "Site photographs and failure reporting", "Replaced. Evidence is captured in the app against the record it belongs to, with the timestamp, location and chainage attached automatically."], ["Email, letters and links", "Document circulation and follow-up with other departments", "Replaced for structured exchange, with target dates, priority, tagging and a log of what was sent and when."], ["Client and authority systems", "Submission of quality records where the client requires it", "Retained. The platform produces the records and evidence in the required format; submission continues through the client's own system."], ["SAP", "Project and WBS references, material master, purchase and store receipts, vendor master", "Retained and unchanged. The platform reads these references and attaches its quality decisions to them. It does not create a second material master, purchase process or stock ledger."]], "pains": [["1", "There is no dedicated digital quality system", "The QAP and the ITP exist as documents, so nothing applies them or measures against them.", "A quality platform where the QAP and ITP are configuration, and every inspection and test is generated from them."], ["2", "Checklists, calculations and test records are held in spreadsheets and on paper", "The same check is recorded differently on different projects, and nothing can be counted across them.", "Structured checklists and a test register, defined once and applied on every project."], ["3", "Photographs are compulsory but scattered", "Evidence sits on phones and in messaging groups, separated from the inspection it supports.", "Mobile capture with timestamp, northing or location and chainage, linked to the inspection, test, non-conformance or material lot."], ["4", "How many tests are due is not known without executed quantity", "ITP frequency depends on quantity executed, which the department has to ask for.", "Test requirements generated automatically from executed quantity, showing what is due, done and outstanding."], ["5", "A missed test or a failed result allowed through affects later layers", "The consequence is buried under the next layer and surfaces as an expensive defect.", "Hold points that prevent a stage being released while a mandatory inspection is open or failed, with any override recorded."], ["6", "There is no single record of who checked, approved, rejected or carried out the work", "Accountability has to be reconstructed after the fact, if it can be at all.", "Every decision carries its person, role, date and comment, retained as a read-only history."], ["7", "Material approval is treated informally", "It is a controlled technical decision, but it can be given verbally.", "A source approval request with documents, samples and test results, and an explicit approved, conditional or rejected decision."], ["8", "Material received against consumed is not reconciled", "What arrived, what was used and what remains cannot be compared, which also affects control of stock at the plant.", "A received-against-consumed view per material and project, tied to the approved source and the store receipt."], ["9", "Reported density results are not trusted", "A figure that always sits at the threshold suggests the record is being written to satisfy the requirement.", "Results entered against a sample, a location and a laboratory, with evidence attached and the acceptance limit applied by the system."], ["10", "Test frequency is not tracked systematically", "Whether the required number of tests was carried out for a given quantity is not visible.", "Configurable frequency per project and material, with coverage shown against executed quantity."], ["11", "Supplier and source decisions are not held against quality outcomes", "The same supplier can cause repeated failures without it being apparent.", "Source approval, incoming inspection results and non-conformances all linked to the supplier."], ["12", "Protection of material at the plant was raised", "Material loss is a quality and cost issue, but the expected control was not defined.", "Received-against-consumed reconciliation as the starting point, with the specific control to be defined; raised in Section 8."], ["13", "Failure and red flag requests from site are handled manually", "An urgent issue depends on reaching the right person by telephone or group message.", "A red flag raised from the app that routes to the responsible manager with a target date and escalation."], ["14", "Delays caused by other departments are not logged", "An inspection held up by a late drawing or a late material looks like a quality delay.", "The reason and the responsible department recorded against the held item, so the delay is attributed correctly."], ["15", "Document management runs on email links and letters", "There is no target date, no tagging or priority, and no history of what was sent.", "A document and correspondence record with target dates, priority, tagging and a full log."], ["16", "The site team has no application for quality control and assurance", "People who never sit in an office are expected to work through office tools.", "A mobile-first application for inspections, checklists, tests, evidence and non-conformances, usable with poor connectivity."], ["17", "Quality work is organised by work stream but the records are not", "Soil, granular, bitumen and concrete each have their own manager, but the reporting does not follow that structure.", "Work-package assignment and reporting by work stream as well as by project."], ["18", "Reports and certificates are compiled by hand", "The evidence exists but has to be gathered each time it is asked for.", "Reports and certificates generated from the records, and a searchable repository by project, activity, location and period."]], "scope": [["1", "Project quality record", "Project and WBS setup; work-stream structure; location, chainage and structure register; quality summary per project", "One record per project, keyed to the same project and WBS references the rest of the business uses, that every inspection, test and non-conformance attaches to."], ["2", "QAP and ITP configuration", "Approved templates; project-specific QAP and ITP; hold points, witness points and release criteria; client and authority requirements; version control with effective dates", "The quality plan becomes live configuration instead of a document, and a historical record keeps the version it was judged against."], ["3", "Test requirement and frequency engine", "Requirements by material, activity, layer, location and stage; frequency by executed quantity or lot size; configurable per project; due, done and outstanding position", "The department can answer how many tests are due and how many were done, for any quantity, at any time."], ["4", "Material source approval", "Source and vendor request; technical documents, samples, certificates and test results; approved, conditional, rejected; validity, expiry and revalidation; supplier quality history", "A controlled technical decision with its evidence attached, and a history that follows the supplier across projects."], ["5", "Incoming material inspection", "Receipt against store and purchase reference; lot identification; inspection and sampling; accept, hold, quarantine or reject; issue restriction where held", "Material that has not passed cannot quietly find its way into the work."], ["6", "Sampling and chain of custody", "Sample identifier; collection location and lot; custody history; linkage to the ITP requirement and the test request", "Every result is traceable to the sample, the place and the person it came from."], ["7", "Laboratory and test management", "Test register; test request with due date; internal and third-party laboratory assignment; result entry and upload; acceptance limits; pass, conditional and fail; review and approval", "A single register of every test on every project, with results judged against the limit by the system."], ["8", "Checklist builder", "Pre-work, in-process and post-work checklists; by activity, material and work stream; mandatory items; versioning", "The QA manager defines a check once and it is applied the same way on every project."], ["9", "RFI and inspection workflow", "Digital RFI against project, activity, location and stage; scheduling; witness attendance for client, consultant or independent engineer; electronic sign-off; pass, conditional pass, reject, hold and rework status", "The inspection request, the people present and the outcome held as one record instead of a call and a signed sheet."], ["10", "Hold point and stage release", "Mandatory hold points; release criteria; block on open or failed inspection; controlled emergency override with authorisation and audit history", "The control that stops a layer being covered before it has passed, and records the exception where one is genuinely needed."], ["11", "Non-conformance and corrective action", "NCR capture with defect, location, severity and responsible party; root cause; corrective action with owner and target date; re-inspection and re-test; closure verification; escalation for overdue and repeat", "Failures are closed with evidence rather than forgotten, and repeats become visible."], ["12", "Field evidence capture", "Mobile photograph and video capture with timestamp, northing or GPS and chainage; offline capture and later sync; evidence linked to RFI, inspection, test, NCR, material lot and location", "The compulsory photograph becomes part of the record, with the information it is supposed to carry attached automatically."], ["13", "Material received against consumed", "Received, consumed and balance by material, project and source; comparison against store and purchase references; variance flags", "The material control position the department asked for, without keeping a second stock ledger."], ["14", "Document and certificate repository", "QAP, ITP, method statements, drawings and specifications, laboratory reports, certificates, inspection records and client approvals; versioning; read-only audit history; search by project, vendor, activity, location and period", "Every quality document in one place, in the version that applied, retrievable when an auditor or a client asks."], ["15", "Correspondence and follow-up", "Letters and communications with target date, priority and tagging; log history; delays attributed to the responsible department", "Follow-up with other departments becomes a tracked item instead of an email chain."], ["16", "Daily reporting and escalation", "Daily quality report by work stream; red flag from site; routing to the responsible manager; escalation to the quality lead and HOD", "An urgent failure reaches the right person with a record, rather than depending on who answers the phone."], ["17", "Dashboards, MIS and reports", "The eighteen dashboards of Section 3; drill-down to the underlying inspection, test or evidence; client and independent engineer report formats; export to Excel and PDF", "Management sees what is outstanding now, and every figure can be opened down to the record behind it."], ["18", "SAP references, roles, access and audit", "Read project, WBS, material, vendor and purchase or store references from SAP; work-stream and role-based assignment; site and office roles; full operational audit trail", "Quality decisions attach to the same references the rest of the business uses, without creating a competing master or ledger."]], "open": ["That the nine-stage process set out in Section 1 reflects how Quality operates today.", "That the eighteen workflows in Section 2 are complete, and that none of the department's work falls outside them.", "Whether the figure of 300 to 400 covers the quality department alone or the wider site organisation, and how many quality staff a typical project carries.", "The reporting line, confirmed as work-stream managers to the site quality lead at Assistant or Deputy General Manager level, and from there to the office quality function.", "That the four work streams are soil, granular layers covering GSB, WMM, CTB and CTSB, bitumen, and concrete and structures, and whether any others should be configured.", "The approved QAP and ITP templates, the full test catalogue and the acceptance criteria that apply to each test.", "The test frequency rules per material and layer, and the source of the executed quantity that drives them.", "Who may authorise an override where a mandatory hold point is open or failed and work genuinely cannot wait.", "The photograph requirement, confirmed as northing, timestamp and chainage, and whether site devices can capture location reliably where the work is.", "Which laboratories and third parties are used, and whether they should enter results directly or submit them to Quality.", "The validity period for a material source approval and the rules for revalidation.", "What the protection of material at the plant should mean in the system, since the requirement was raised but not defined.", "Whether quality acceptance must be recorded before Billing may certify the work, and at what level.", "What must be submitted to the client or authority system, in what format, and whether any integration with it is expected.", "The escalation route and target dates for overdue and repeat non-conformances.", "The report and certificate formats required by the client, the independent engineer and management.", "The SAP boundary, confirmed with the SAP owner, since the exact transactions the department relies on were not established during the discussion.", "Whether existing QAP and ITP documents, test registers, certificates and inspection records should be migrated at go-live, and in what form they are held."], "sap": {"1": ["Project and WBS", "PS", "Read"], "4": ["Vendor code for material sources", "MM", "Read"], "5": ["PO and GRN reference for incoming material; material code", "MM", "Read"], "13": ["Goods receipts and goods issues by material and project", "MM", "Read"]}}, "contract": {"key": "contract", "name": "Contract", "intro": ["The Contract department holds the company's contractual position with the client from the tender stage to final closure. It checks the tender and bid documents, accepts the award, arranges the securities and the agreement, and then administers the signed contract for the life of the project — every letter, every submission and every notice that goes to the client passes through it.", "The department does not produce most of what it submits. The work programme comes from Planning, drawings from Design, test evidence from Quality, and the bank guarantee through Accounts. Its job is to know what the contract requires, get the right input from the right department on time, review it, and put it in front of the client in a form that protects PIL's position. The work runs through nine stages."], "insight": "The first four stages run against fixed clocks set by the award. St
