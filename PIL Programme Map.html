 is under loan, held by the company, in use or sold. Figures kept in Excel are reconciled with SAP and bank records, and MIS reports are drawn from SAP.", "nodes": [{"t": "Bank and FI directory", "s": "contacts, documents", "dec": false, "hl": false}, {"t": "Asset status", "s": "loan, hold, use, sale", "dec": false, "hl": false}, {"t": "Reconciled", "s": "with SAP and bank", "dec": false, "hl": true}, {"t": "MIS", "s": "management", "dec": false, "hl": false}], "note": "A figure kept in Excel should be checked against SAP, P&M or the bank before it appears in a management view."}], "extra": {"title": "Instruments the team handles", "heads": ["Instrument", "Used for", "What must be tracked"], "rows": [["Bank guarantee", "Bid, performance, advance and other security to clients", "Bank, limit, project, expiry, extension, release"], ["Letter of credit", "Securing payment to suppliers", "Bank, limit, supplier, terms, closure"], ["Surety bond", "Security through an insurer, where accepted", "Insurer, project, expiry, release"], ["EMD", "Earnest money for tenders", "Tender, mode, result, refund"], ["Fixed deposit", "EMD, margin or lien", "Bank, linked instrument, maturity"], ["Vehicle and equipment loan", "Financing machines", "Machine, lender, instalments, NOC, RC"], ["Working capital and short-term loan", "Funding operations", "Limit, drawn, dues, renewal"], ["TRA", "Referred to as held in SAP", "To be confirmed with the team"]]}, "workflows": [["1", "BG request", "Tender or contract needs security", "Bidding or Contract, Finance", "Amount, beneficiary, format, required date and documents checked before work starts"], ["2", "BG issue", "Request approved", "Finance, bank", "Bank chosen by available limit; BG issued, limit debited, project and bank recorded"], ["3", "BG extension and amendment", "Expiry near, or contract change", "Contract, Finance, bank", "Decision recorded, request made to the bank, new dates captured"], ["4", "BG release", "Bid lost, work complete, or security no longer required", "Bidding or Contract, Finance", "Original returned, limit credited, record closed"], ["5", "BG invocation and exceptions", "Guarantee invoked or disputed", "Finance, Contract, Legal, management", "Case opened, escalated and followed to closure"], ["6", "Bank limit update", "Sanction, renewal or enhancement", "Finance, bank", "Limit by bank and type, with validity, used and available"], ["7", "LC opening", "Supplier needs an LC", "Purchase, Finance, bank", "LC opened against a limit, with terms and documents"], ["8", "LC amendment and closure", "Shipment, payment or change of terms", "Purchase, Finance, bank", "LC amended, paid or closed, and limit returned"], ["9", "Surety bond", "Client accepts a bond", "Contract, Finance, insurer", "Bond issued and tracked to expiry and release, like a guarantee"], ["10", "EMD and refund", "Tender needs EMD", "Bidding, Finance", "EMD paid by the chosen mode; refund followed once the result is known"], ["11", "FD and margin", "EMD or limit needs a deposit", "Finance, bank", "FD linked to the instrument it supports, with lien and maturity"], ["12", "Equipment finance", "Machine to be bought on loan", "P&M, Finance, lender", "Loan arranged against a specific machine from the P&M list"], ["13", "Instalments and interest", "Monthly", "Finance, Accounts", "Dues calendar with reminders, reconciled with SAP"], ["14", "Loan closure, NOC and RC", "Last instalment paid", "Finance, lender, P&M", "NOC received, RC book updated, machine free to move or sell"], ["15", "Working capital and short-term loans", "Sanction, drawdown or due date", "Finance, bank", "Drawn amounts, dues and renewals tracked with reminders"], ["16", "Payment scheduling", "Payment request raised", "Departments, Accounts, Finance, management", "Request checked, approved and scheduled by Treasury; paid through SAP and the bank"], ["17", "Tour request", "Employee travel", "Employee, manager, Accounts, Finance", "Request approved by the manager, processed by Accounts, and paid in the schedule"], ["18", "Bank and FI directory", "New relationship or contact change", "Finance", "Banks, NBFCs and FIs with contacts, facilities and documents in one place"], ["19", "Fixed asset finance status", "Asset bought, held, moved or sold", "Finance, P&M, Accounts", "For each asset: under loan or not, held, in use or sold"], ["20", "Reconciliation and MIS", "Month end, or on request", "Finance, Accounts, management", "Finance figures checked against SAP and the bank; MIS issued"]], "dashboards": [["1", "BG register", "Live guarantees by type, bank, project and beneficiary", "cap"], ["2", "Bank limits", "Sanctioned, used and available, by bank and in total", "cap"], ["3", "Project exposure", "Guarantees, LCs and bonds held for each project", "cap"], ["4", "Expiry calendar", "Instruments expiring in 30, 60 and 90 days", "cap"], ["5", "Extension and release backlog", "Decisions awaited, by owner and age", "cap"], ["6", "LC register", "Open LCs by bank, supplier and status", "cap"], ["7", "Surety bonds", "Bonds by insurer, project and expiry", "cap"], ["8", "EMD tracker", "EMDs outstanding and refunds due", "cap"], ["9", "FDs and margin", "Deposits, lien and maturity", "sap"], ["10", "Equipment finance", "Loans by machine, lender and balance", "sap"], ["11", "NOC and RC status", "Closed loans awaiting NOC or RC update", "cap"], ["12", "Loans and working capital", "Facilities, drawn amounts and renewals", "sap"], ["13", "Upcoming dues", "Instalments, interest and repayments by date", "sap"], ["14", "Fund position", "Bank balances and commitments by company", "sap"], ["15", "Payment requests", "Requests by stage, age and owner, and what is scheduled", "cap"], ["16", "Banks and FIs", "Relationships, facilities and contacts", "now"], ["17", "Pending inputs", "Dates, documents and decisions awaited from other teams", "cap"], ["18", "Finance MIS", "Management reports in the approved formats", "sap"]], "obs": "We note that most delays in Finance are not in Finance. A required date sent late, a tender result not passed on, a machine reference that does not match — each has an owner outside the team. Putting those inputs on record, with a date, is where the platform helps most.", "interactions": [["Bidding and Tender", "BG, EMD and FD needs; tender results", "Bid security, EMD, refunds", "Email."], ["Contract", "Performance and advance BG needs; extension and release decisions", "Guarantees and bonds, status", "Email and separate trackers."], ["Purchase", "LC needs, supplier terms", "LCs, payment schedule", "Email."], ["Plant and Machinery", "Machine list, machines to be financed, moves and sales", "Loan status, NOCs, RC updates", "Excel and email."], ["Accounts", "Payment-ready invoices, postings", "Payment schedule, loan and BG data", "SAP and email."], ["HR", "Tour and employee payment requests", "Scheduled payments", "Manager approval, then Accounts."], ["Projects and Planning", "Budgets and payment needs", "Fund availability, project exposure", "Excel and meetings."], ["Legal", "Review of bank and loan documents; invocation cases", "Documents and facts", "Email."], ["Banks", "Sanctions, BGs, LCs, statements", "Requests, documents, repayments", "Bank portals and paper."], ["NBFCs and FIs", "Equipment loans, NOCs", "Documents, instalments", "Email and paper."], ["Insurers", "Surety bonds", "Proposals and documents", "Email."], ["Management", "Payment approvals, direction", "MIS, exposure, fund position", "Excel."]], "profile": [["Position in F&A", "One of four teams, with Accounts, Indirect Tax and Direct Tax", "Shared parties, registers and reports with the other three; no duplicate entry."], ["Entities", "PIL and group companies", "Limits, instruments and loans carried by company; data kept separate by entity."], ["In SAP", "Loans, FDs, equipment finance, MIS", "SAP stays the book of record; the platform reads from it and never posts."], ["Outside SAP", "BGs, LCs, bonds, EMDs, limits, NOCs", "The registers the platform must build first."], ["Bank action", "Through bank portals and forms", "Stays with the bank. The platform records request, reference and status only."], ["Sensitivity", "Facilities, loans, bank documents", "Stricter access than project workflows, by role and company, with every view logged."]], "tools": [["SAP", "Loans, FDs, equipment finance, payments, MIS", "Retained and unchanged. Read-only extraction by company and period."], ["Excel", "BG, LC, bond, EMD, limit and loan tracking", "Replaced by registers, calendars and dashboards."], ["Bank portals", "Issue, amendment, release, repayment", "Retained. Bank references recorded against each case."], ["Email", "Requests, reminders, documents", "Replaced by tracked requests with owners and due dates."]], "pains": [["1", "BGs, LCs, surety bonds and equipment finance are managed by hand", "No single place shows what is out and where.", "One register for every instrument, by bank, project and company."], ["2", "Available limit is worked out in Excel", "A guarantee may be planned on a limit that is already used.", "Limits debited on issue and credited on release, automatically."], ["3", "Many BG types, each with its own handling", "Rules and documents differ by type and bank.", "Configurable types, with checklists and bank forms for each."], ["4", "Requests arrive late or incomplete", "Guarantees are delayed and work waits.", "A request form with required fields and documents, checked before acceptance."], ["5", "Expiry and renewal depend on reminders", "A lapsed guarantee can be a contractual default.", "Expiry alerts at set intervals, sent to the named owner."], ["6", "Release decisions are not passed on", "Limits stay blocked for guarantees nobody needs.", "A release step that the originating team must close."], ["7", "EMD refunds depend on hearing the tender result", "Money sits with clients longer than it should.", "EMDs linked to tenders, with refund follow-up after the result."], ["8", "The machine list is held by P&M, not Finance", "A loan can be matched to the wrong machine.", "Every loan linked to a machine from the P&M list, with mismatches flagged."], ["9", "NOC and RC book updates are followed by hand", "A paid-off machine may still show a lender.", "A closure step with NOC and RC evidence."], ["10", "Working capital and loan dues are tracked by hand", "A missed due date costs interest and standing with the bank.", "A dues calendar from SAP, with reminders."], ["11", "All outgoing payments go through Treasury", "Why a payment is waiting is hard to see.", "A payment request pipeline with each check and approval on record."], ["12", "Bank, NBFC and FI contacts are scattered", "Relationships depend on individuals.", "A directory with contacts, facilities and documents, access-controlled."], ["13", "Fixed asset status is not visible by loan, hold, use or sale", "An asset under loan could be moved or sold.", "A finance status against each asset, read by P&M and Accounts."], ["14", "Excel figures need reconciling with SAP and the bank", "Management may see numbers that do not agree.", "A validation step before a figure reaches a dashboard."], ["15", "Approvals must follow the set route", "A request that skips a step exposes the company.", "Fixed approval routes by request type and value; no bypass."], ["16", "Financial documents need tighter access", "Facility and bank data is sensitive.", "Role and company access, restricted folders, and an audit trail."]], "scope": [["1", "Security requests", "Request forms for BG, LC, bond, EMD and FD; required fields and documents; completeness check; return to requester", "Finance starts with everything it needs."], ["2", "BG register", "Add, track, amend, extend, release and remove; type, bank, project, beneficiary, dates, documents", "Every guarantee in one place."], ["3", "Bank limits", "Limits by bank, type and company; debit on issue, credit on release; available by bank, project and in total", "The available limit is always current."], ["4", "Expiry, extension and release", "Alerts at set intervals; decision requested from the owner; bank reference recorded; exceptions and invocation route", "Nothing lapses; nothing is held for nothing."], ["5", "LC register", "Opening, amendment, documents, payment and closure; linked to supplier and PO", "LCs followed start to finish."], ["6", "Surety bonds", "Insurer, project, amount, dates and release, handled like a guarantee", "Bonds visible alongside BGs."], ["7", "EMD and FD tracker", "EMD by tender and mode; refund follow-up; FDs with lien, maturity and linked instrument", "Deposits come back when they should."], ["8", "Equipment and vehicle finance", "Loan case per machine from the P&M list; lender, amount, instalments; mismatch flags", "One loan, one machine, one file."], ["9", "Loan closure, NOC and RC", "Closure checklist; NOC and RC book evidence; asset released for move or sale", "Paid-off machines are clean on paper."], ["10", "Loans and working capital", "Facilities, drawdowns, renewals; dues calendar from SAP; reminders", "No due date missed."], ["11", "Payment requests and scheduling", "Requests from departments and employees, including tour requests; Finance check; management approval; Treasury schedule; SAP and bank reference", "Every payment's status, visible."], ["12", "Fixed asset finance status", "Under loan, held, in use or sold, per asset; shared with P&M and Accounts", "No financed asset moved unseen."], ["13", "Bank and FI directory", "Banks, NBFCs, FIs; contacts and roles; facilities; restricted documents; no passwords stored", "Relationships that do not depend on one person."], ["14", "Documents and correspondence", "Bank forms by bank; version control; sent and received log; acknowledgement reference", "Every document found in seconds."], ["15", "Tasks with other departments", "Requests to Bidding, Contract, Purchase, P&M, Accounts, Legal; due dates; reminders; escalation", "Inputs arrive on time, or the delay is visible."], ["16", "Reconciliation", "Excel and working figures checked against SAP, P&M and bank references before reporting", "Numbers that agree."], ["17", "Dashboards and MIS", "The eighteen dashboards of Section 3; drill-down to the source; scheduled report packs", "Management sees the position without asking."], ["18", "SAP extraction, roles and audit", "Read-only extraction of loans, FDs, equipment finance and payments; role and company access; audit trail", "SAP and the bank remain in charge; the platform explains them."]], "open": ["That the nine-stage process set out in Section 1 reflects how Finance operates today.", "That the twenty workflows in Section 2 are complete, and that none of the team's work falls outside them.", "The size of the Finance team and the roles within it.", "The companies to be covered, and whether limits are held by company or for the group.", "The BG types in use, and the banks and forms for each.", "Who may request, approve and close each type of instrument, and at what value.", "What \"except\" in the BG requirements refers to — invocation, disputes, or another case.", "The expiry alert intervals, and who receives them.", "What TRA refers to, and how it is maintained in SAP.", "Which treasury, loan and FD functions are in use in SAP today, and which fields the platform should read.", "How EMDs are paid today — FD, BG, online or other — and how refunds are followed.", "How the P&M machine list should be shared, and which reference identifies a machine.", "What should happen to a machine on loan completion, and who updates the RC book.", "The approval route for payments by type and value, and how Treasury sets the schedule.", "The tour request route — manager approval, then Accounts — and whether it belongs with HR, Finance or both.", "Whether one guarantee register should serve Finance, Contract and Accounts.", "The SAP and bank boundary, confirmed with the SAP owner and Internal Audit.", "Whether current Excel registers and trackers should be migrated at go-live."], "sap": {"5": ["PO reference for LCs", "MM", "Read"], "7": ["Fixed deposits", "FI / TRM", "Read"], "8": ["Equipment loans; asset reference", "FI / TRM / AA", "Read"], "10": ["Loans and working capital: balances and dues", "FI / TRM", "Read"], "11": ["Payment documents after processing", "FI", "Read"], "12": ["Asset master and status", "AA", "Read"], "16": ["Loan, FD and payment balances for reconciliation", "FI / TRM", "Read"]}}, "itax": {"key": "itax", "name": "Indirect Tax", "intro": ["Indirect Tax looks after GST for every company in the group. Sales invoices start in Billing and are posted by Accounts in SAP; the tax invoice and e-invoice are then generated, and each month the team prepares the sales and purchase registers, reconciles the books with GST data, and files returns for each registration. It also handles GST notices, answering them itself where it can and bringing in its consulting firm where a matter goes beyond the team.", "The work runs across three systems that do not talk to each other — SAP, Computax for invoicing and e-invoice, and Signet for return filing and reconciliation — with Excel filling the gaps, including the notice tracker. Around three hundred sales invoices are raised each month. The work runs through nine stages."], "insight": "The check after the tax invoice is the one the team raised most clearly: every sale must have its e-invoice, and today that depends on Accounts remembering to tell the tax team. A missed e-invoice is a statutory problem that surfaces only later. From there the month runs to a fixed rhythm — registers, reconciliation, filing — while notices arrive on their own timetable and carry their own deadlines.", "flowcap": "Master flow — nine stages from the sales invoice to management reporting", "flow": [{"t": "1. Billing and Posting", "s": "SD module, Accounts in SAP", "dec": false, "hl": false}, {"t": "2. Tax Invoice", "s": "and e-invoice", "dec": false, "hl": false}, {"t": "E-invoice done?", "s": "for every sale", "dec": true, "hl": false}, {"t": "Alert and follow-up", "s": "to Accounts and Tax", "dec": false, "hl": true}, {"t": "3. Registers", "s": "sales and purchase", "dec": false, "hl": false}, {"t": "4. Vendor Checks", "s": "GST red flags", "dec": false, "hl": false}, {"t": "5. Reconciliation", "s": "books against GST data", "dec": false, "hl": true}, {"t": "6. Return Filing", "s": "monthly, by GSTIN", "dec": false, "hl": false}, {"t": "7. Notices", "s": "tracked and replied", "dec": false, "hl": false}, {"t": "8. Consultant Support", "s": "where needed", "dec": false, "hl": false}, {"t": "9. Reports and Filing Tracker", "s": "monthly, quarterly, annual MIS", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Billing and Accounts Posting", "text": "Sales are billed through the SAP SD module by the Billing team and posted by Accounts. Purchase invoices reach Accounts from Purchase and project teams. This is where the tax data the team will later rely on is first entered.", "nodes": [{"t": "Sale billed", "s": "SD module", "dec": false, "hl": false}, {"t": "Accounts posting", "s": "in SAP", "dec": false, "hl": false}, {"t": "Tax fields", "s": "GSTIN, HSN or SAC, values", "dec": false, "hl": true}, {"t": "Tax team informed", "s": "by Accounts", "dec": false, "hl": false}], "note": "Errors in GSTIN, HSN or SAC codes and values made here are found only at reconciliation, weeks later."}, {"title": "Stage 2 — Tax Invoice and E-invoice", "text": "The tax invoice is prepared and the e-invoice generated through Computax. The team wants e-invoicing automated and wants to be sure it is never missed — every document and sale posted by Accounts should reach the tax team for e-invoice generation.", "nodes": [{"t": "Posted sale", "s": "from SAP", "dec": false, "hl": false}, {"t": "Tax invoice", "s": "prepared", "dec": false, "hl": false}, {"t": "E-invoice done?", "s": "IRN generated", "dec": true, "hl": false}, {"t": "Alert", "s": "same day", "dec": false, "hl": true}], "note": "E-invoice generation depends on a person remembering to ask. The platform should check every posted sale for its e-invoice automatically."}, {"title": "Stage 3 — Sales and Purchase Registers", "text": "Each month the team prepares the sales register and the purchase register for each GST registration, from SAP and supporting data.", "nodes": [{"t": "Month closes", "s": "for each GSTIN", "dec": false, "hl": false}, {"t": "Data extracted", "s": "from SAP", "dec": false, "hl": false}, {"t": "Registers compiled", "s": "in Excel", "dec": false, "hl": true}, {"t": "Checked", "s": "before reconciliation", "dec": false, "hl": false}], "note": "The registers are rebuilt by hand each month, company by company."}, {"title": "Stage 4 — Vendor GST Checks", "text": "The team wants a red flag raised when a vendor's GST position is a problem at the time Billing processes its bill, so that input credit is not put at risk.", "nodes": [{"t": "Vendor bill", "s": "received for processing", "dec": false, "hl": false}, {"t": "GSTIN checked", "s": "status and filing", "dec": false, "hl": false}, {"t": "Red flag?", "s": "by agreed rules", "dec": true, "hl": false}, {"t": "Held for review", "s": "tax team decides", "dec": false, "hl": true}], "note": "The rules for what counts as a red flag, and what happens to a flagged bill, are for the tax team to set."}, {"title": "Stage 5 — GST Reconciliation", "text": "The team reconciles the books with GST return data in Signet, checks invoice values and tax fields, and follows up mismatches. The team told us this process needs work.", "nodes": [{"t": "Books", "s": "SAP registers", "dec": false, "hl": false}, {"t": "GST data", "s": "returns in Signet", "dec": false, "hl": false}, {"t": "Mismatches", "s": "value, GSTIN, HSN", "dec": false, "hl": true}, {"t": "Data requested", "s": "from Billing, Accounts", "dec": false, "hl": true}, {"t": "Corrected and closed", "s": "in SAP by owner", "dec": false, "hl": false}], "note": "Exceptions are matched by hand, and who owns each one, and whether it has been closed, is not held in one place."}, {"title": "Stage 6 — Return Preparation and Filing", "text": "Returns are prepared, reviewed and filed each month for each registration through Signet and the GST portal. The filing reference and acknowledgement are kept as proof.", "nodes": [{"t": "Checklist", "s": "data and exceptions", "dec": false, "hl": false}, {"t": "Prepared", "s": "by preparer", "dec": false, "hl": false}, {"t": "Reviewed and approved", "s": "separate roles", "dec": false, "hl": false}, {"t": "Filed", "s": "Signet and GST portal", "dec": false, "hl": false}, {"t": "Acknowledged", "s": "proof stored", "dec": false, "hl": true}], "note": "Filing stays on the official portal. The team asked for a return filing tracker to show where each return stands for each registration."}, {"title": "Stage 7 — GST Notices", "text": "GST notices are tracked in Excel. Each needs its deadline, the data it concerns, a reply and proof of submission. The team asked for a notice tracker and for the platform to suggest a reply.", "nodes": [{"t": "Notice received", "s": "authority, period, subject", "dec": false, "hl": false}, {"t": "Data scoped", "s": "from SAP for the period", "dec": false, "hl": false}, {"t": "Reply drafted", "s": "suggestion, then edited", "dec": false, "hl": true}, {"t": "Approved", "s": "by the tax lead", "dec": false, "hl": false}, {"t": "Submitted", "s": "proof stored", "dec": false, "hl": false}], "note": "A suggested reply is a starting draft built from the notice and past replies. The tax position and the final reply remain the team's decision."}, {"title": "Stage 8 — Consultant Support", "text": "The team first tries to answer queries and notices itself. Where a matter goes beyond its limits, the consulting firm helps prepare the reply.", "nodes": [{"t": "Matter assessed", "s": "in-house first", "dec": false, "hl": false}, {"t": "Consultant assigned", "s": "for this matter only", "dec": false, "hl": true}, {"t": "Documents shared", "s": "controlled access", "dec": false, "hl": false}, {"t": "Draft returned", "s": "reviewed by team", "dec": false, "hl": false}], "note": "Documents go to the consultant by email today. Access should be limited to the matter, not the company's data."}, {"title": "Stage 9 — Reports and Filing Tracker", "text": "The team prepares return filing reports and management information monthly, quarterly and annually, combining files by hand.", "nodes": [{"t": "Returns filed", "s": "by GSTIN", "dec": false, "hl": false}, {"t": "Registers and exceptions", "s": "by period", "dec": false, "hl": false}, {"t": "Notices", "s": "open and closed", "dec": false, "hl": false}, {"t": "MIS", "s": "compiled by hand", "dec": false, "hl": true}], "note": "The same figures are gathered again for each report. Generated from the records, they would always agree."}], "extra": {"title": "Systems in use today", "heads": ["System", "What it does today", "Position in the proposed solution"], "rows": [["SAP", "Billing through SD, accounts posting, GST data, tax codes", "Retained as the system of record; read by the platform, never posted to"], ["Computax", "Tax invoicing and e-invoice generation", "Retained; e-invoice status read back so every sale can be checked"], ["Signet", "Return filing and reconciliation", "Retained for filing; reconciliation results and filing status brought into the platform"], ["GST portal", "Official filing and notices", "Retained; acknowledgements and notices recorded in the platform"], ["Excel", "Notice tracker, registers, reports", "Replaced by the notice tracker, registers and dashboards"]]}, "workflows": [["1", "Entity and GSTIN profile", "New company or registration", "Indirect Tax", "Each registration with state, SAP company code, filing calendar and authorised users"], ["2", "Filing calendar", "Registration set up", "Indirect Tax", "Returns and due dates per GSTIN, configured rather than fixed"], ["3", "Sales invoice notification", "Sale posted in SAP", "Billing, Accounts, Indirect Tax", "Every posted sale made visible to the tax team without anyone having to ask"], ["4", "E-invoice control", "Posted sale", "Indirect Tax, Accounts", "E-invoice status checked for every sale, with an alert for any missing"], ["5", "Invoice field validation", "Invoice posted", "Indirect Tax", "GSTIN, HSN or SAC and values checked, with exceptions raised to the owner"], ["6", "Credit and debit notes", "Adjustment posted", "Accounts, Indirect Tax", "Notes linked to the original invoice and reflected in the registers"], ["7", "Sales register", "Month end", "Indirect Tax", "Sales register per GSTIN from SAP"], ["8", "Purchase register", "Month end", "Indirect Tax", "Purchase register per GSTIN from SAP"], ["9", "Vendor GST check", "Vendor bill processed by Billing", "Billing, Indirect Tax", "A red flag on vendors whose GST position needs review, before the bill proceeds"], ["10", "Data request", "Missing or unclear data", "Indirect Tax, Billing, Accounts, Purchase, Store", "A tracked request with required fields, due date, reminders and escalation"], ["11", "GST reconciliation", "Registers and return data ready", "Indirect Tax", "Books reconciled with GST data per GSTIN and period, with mismatches listed"], ["12", "Exception resolution", "Mismatch found", "Indirect Tax, owning department", "Each exception followed from identification to correction in SAP and closure"], ["13", "Return preparation", "Due date approaching", "Preparer", "A checklist of data, reconciliation and open exceptions before filing"], ["14", "Review and approval", "Return prepared", "Reviewer, approver", "Return reviewed and approved by separate people"], ["15", "Filing record", "Return filed", "Indirect Tax", "Filing date, reference and acknowledgement stored against the period"], ["16", "Notice intake", "Notice received", "Indirect Tax", "Notice with GSTIN, authority, reference, period, subject, deadline and owner"], ["17", "Notice data scoping", "Notice opened", "Indirect Tax", "The specific SAP records and documents for the notice period, extracted and logged"], ["18", "Reply and submission", "Notice data ready", "Indirect Tax, consultant where needed, approver", "A suggested draft, edited and approved by the team, submitted with proof"], ["19", "Consultant engagement", "Matter beyond the team", "Indirect Tax, consulting firm", "Consultant given access to one matter, with deliverables and due dates tracked"], ["20", "Reports and filing tracker", "Monthly, quarterly, annual", "Indirect Tax, management", "Return filing reports and MIS generated from the records"]], "dashboards": [["1", "Filing calendar", "Returns due, in preparation, filed and overdue by GSTIN", "cap"], ["2", "Period readiness", "Checklist status for each GSTIN and month", "cap"], ["3", "E-invoice status", "Posted sales with and without e-invoice", "cap"], ["4", "Invoice volume", "Sales invoices by company, GSTIN and month", "sap"], ["5", "Invoice field exceptions", "Invoices with GSTIN, HSN or SAC or value issues", "cap"], ["6", "Sales register", "Sales by GSTIN, customer and period", "sap"], ["7", "Purchase register", "Purchases by GSTIN, vendor and period", "sap"], ["8", "Vendor red flags", "Vendors flagged, bills held and decisions taken", "cap"], ["9", "Reconciliation status", "Periods reconciled, in progress and not started, by GSTIN", "cap"], ["10", "Open exceptions", "Exceptions by cause, owner, department and age", "cap"], ["11", "Data requests", "Requests pending with other departments, and their turnaround", "cap"], ["12", "Returns filed", "Returns filed, and filings missing an acknowledgement", "cap"], ["13", "Notices by deadline", "Open notices by days to deadline and owner", "cap"], ["14", "Notice analysis", "Notices by authority, category and period, and repeated queries", "cap"], ["15", "Consultant matters", "Matters with the consultant, due dates and status", "cap"], ["16", "Tax payments and refunds", "Payments, refunds and interest by period, read-only", "sap"], ["17", "Evidence completeness", "Periods and notices with and without their supporting documents", "cap"], ["18", "Indirect Tax MIS", "Return filing reports and management summary, monthly, quarterly and annual", "now"]], "obs": "We note that most GST errors are made upstream and found downstream. A check at the point the invoice is posted costs far less than a correction after the return is filed.", "interactions": [["Billing", "Sales invoices through SD; vendor bills", "Invoice field corrections; vendor red flags", "SAP and email."], ["Accounts", "Postings, credit and debit notes, notice that a sale needs an e-invoice", "Exceptions to correct; e-invoice confirmation", "Depends on Accounts asking."], ["Purchase", "Vendor GSTIN and purchase details", "Vendor GST status", "SAP."], ["Store", "Material movement details where tax is affected", "Data requests", "On request."], ["Finance", "Tax payment and refund status", "Liability and payment requests", "SAP."], ["Direct Tax", "Shared vendor and company data", "GST position where it affects TDS", "Separate systems."], ["Legal", "Litigation support", "Notices that become disputes", "Case by case."], ["Consulting firm", "Advice and draft replies", "Notices, data and documents", "Email."], ["GST portal", "Notices and return data", "Returns and replies", "Through Signet and the portal."], ["Management", "Direction", "Filing status and MIS", "Compiled by hand."]], "profile": [["Team size", "30 members noted", "Whether this is the Indirect Tax team or the wider F&A function is raised in Section 8."], ["Volume", "Around 300 sales invoices a month", "Small enough to check every invoice automatically, not by sample."], ["Entities", "Several group companies and GST registrations", "Every record carries its company and GSTIN; data is kept separate by registration."], ["Filing rhythm", "Monthly returns", "A period workspace for each GSTIN and month."], ["Outside help", "A consulting firm", "Matter-level access for the consultant, and no wider access to company data."]], "tools": [["SAP", "Billing, posting, GST data", "Retained and unchanged. Read on a schedule, scoped by GSTIN and period."], ["Computax", "Invoicing and e-invoice", "Retained. E-invoice status brought in, by export or interface as available."], ["Signet", "Return filing and reconciliation", "Retained. Reconciliation output and filing status brought in."], ["Excel", "Notice tracker, registers, reports", "Replaced by structured records; bulk upload kept for data that arrives in sheets."], ["TDS Saral", "Direct Tax", "Covered in the Direct Tax document."]], "pains": [["1", "SAP, Computax and Signet are not synchronised", "The same invoice is handled in three places that can disagree.", "One view that reads all three and shows where they differ."], ["2", "Accounts may forget to ask for an e-invoice", "A missed e-invoice is a statutory problem found late.", "Every posted sale checked for its e-invoice automatically, with an alert the same day."], ["3", "The team wants e-invoicing automated", "Manual generation takes time and invites error.", "E-invoice triggered from the posted sale, subject to what Computax and SAP allow."], ["4", "Reconciliation needs work", "Mismatches are matched by hand and their closure is not tracked.", "A reconciliation workspace with an exception register and owners."], ["5", "The notice tracker is in Excel", "Deadlines, owners and replies are not visible in one place.", "A notice tracker with deadlines, owners, documents and status."], ["6", "The team wants a suggested reply for notices", "Drafting from scratch takes time the team does not have.", "A suggested draft from the notice and past replies, always reviewed and approved by the team."], ["7", "The consultant is used when a matter exceeds the team", "Documents move by email without control.", "Matter-level consultant access with version history."], ["8", "Sales and purchase registers are rebuilt monthly", "Effort is repeated every month for every GSTIN.", "Registers generated from SAP per GSTIN."], ["9", "Vendor GST problems are found late", "Input credit is at risk after the bill is paid.", "A red flag at the point Billing processes the bill."], ["10", "Invoice field errors surface at reconciliation", "Corrections come weeks after the invoice.", "GSTIN, HSN or SAC and value checks when the invoice is posted."], ["11", "Several companies and registrations", "Wrong entity or period is an easy mistake.", "Data kept separate by GSTIN, with a group view for management only."], ["12", "Return filing status is not tracked centrally", "Whether every return is filed is not visible at a glance.", "A return filing tracker with acknowledgements."], ["13", "Reports are assembled by hand", "Monthly, quarterly and annual reporting repeats the same work.", "Reports generated from the records."], ["14", "Notices are not linked to the data behind them", "Finding the invoices for a notice period takes time.", "Scoped SAP extracts attached to each notice."], ["15", "Bulk upload is needed where data arrives in sheets", "Line-by-line entry is not practical.", "Bulk upload with validation."], ["16", "Data from other departments is chased by email", "Delays sit with others but show as tax delays.", "Tracked data requests with due dates and turnaround shown."]], "scope": [["1", "Entity and GSTIN workspace", "Company and registration profiles; SAP company code; filing calendar; authorised users; data kept separate by GSTIN; group view", "Every piece of work tied to the right company and registration."], ["2", "Period workspace", "Monthly, quarterly and annual cycles per GSTIN; checklist; source data status; owners; issues", "Each period prepared in one place."], ["3", "Invoice feed and e-invoice control", "Posted sales from SAP; e-invoice status from Computax; missing e-invoice alerts; automated trigger where the systems allow", "No sale without its e-invoice."], ["4", "Invoice validation", "GSTIN, HSN or SAC and value checks at posting; exceptions to the owning department", "Errors caught when they are made."], ["5", "Sales and purchase registers", "Registers per GSTIN and month from SAP; credit and debit notes linked; export", "Registers without monthly rebuilding."], ["6", "Vendor GST checks", "Vendor GSTIN status; configurable red-flag rules; hold and review at Billing", "Input credit protected before payment."], ["7", "Data requests", "Requests to Billing, Accounts, Purchase and Store; required fields; due dates; reminders; escalation", "Missing data chased by the system."], ["8", "Reconciliation workspace", "Books against GST data per GSTIN and period; reconciliation output from Signet; mismatch listing", "Reconciliation with a clear start and finish."], ["9", "Exception register", "Exception by cause; owner; request; response; correction in SAP by the owner; verification; closure", "Every mismatch followed to closure."], ["10", "Return preparation and approval", "Pre-filing checklist; preparer, reviewer and approver roles; exception sign-off", "Returns filed only when ready."], ["11", "Filing tracker", "Filing status per GSTIN and period; reference; acknowledgement; missing-acknowledgement alerts", "Proof of every return, in one place."], ["12", "Notice tracker", "Notice with GSTIN, authority, reference, period, subject, deadline, priority, owner; reminders; related-notice grouping", "No notice deadline missed."], ["13", "Notice data and reply", "Scoped SAP extract for the notice; suggested draft from notice text and past replies; edit, review and approval; submission proof", "Faster replies, with the decision staying with the team."], ["14", "Consultant collaboration", "Consultant profile; matter-level access with expiry; document exchange with versions; deliverables and due dates", "Outside help without opening company data."], ["15", "Document and evidence repository", "Workpapers, approvals, notices, replies, acknowledgements; by GSTIN, period and reference; filed copies locked", "Evidence for any period found in seconds."], ["16", "Bulk upload", "Template upload with validation for data that arrives in sheets", "Volume handled without retyping."], ["17", "Dashboards and MIS", "The eighteen dashboards of Section 3; return filing reports; monthly, quarterly and annual MIS; export", "Reports that always agree with the records."], ["18", "SAP, Computax and Signet links, roles and audit", "Scoped read-only extraction; status from Computax and Signet; internal and consultant roles; audit trail", "Three systems seen as one, without changing any of them."]], "open": ["That the nine-stage process set out in Section 1 reflects how Indirect Tax operates today.", "That the twenty workflows in Section 2 are complete, and that none of the team's work falls outside them.", "The team size — thirty members were noted — and whether this is the Indirect Tax team or the wider F&A function.", "The list of group companies and GST registrations to be covered.", "Which system generates the e-invoice — SAP or Computax — and what interface or export each offers.", "How Accounts informs the tax team today, and at what point in posting the e-invoice should be triggered.", "What Signet can export or share for reconciliation and filing status.", "The reconciliations required each month, and the exception categories to use.", "The returns filed for each registration, and their due dates.", "The rules for a vendor GST red flag, and what should happen to a flagged bill.", "The preparer, reviewer and approver for returns and notice replies.", "The categories and volume of notices, and how they reach the team.", "Whether a suggested reply for notices is acceptable, and which past replies it may draw on.", "What the consulting firm should be able to see and upload.", "Which data arrives in sheets and needs bulk upload.", "The meaning of \"Web 02\" in the invoice flow, and of the figures \"0–1\" and \"5\" noted beside the team size.", "The SAP boundary, confirmed with the SAP owner, including the tables and fields the platform should read.", "Whether the current notice tracker, registers and filing records should be migrated at go-live."], "sap": {"1": ["Company codes and GSTINs", "FI", "Read"], "3": ["Posted sales invoices", "SD / FI", "Read"], "4": ["GSTIN, HSN/SAC and value on posted invoices", "SD / MM / FI", "Read"], "5": ["Sales and purchase registers; credit and debit notes", "FI / SD / MM", "Read"], "6": ["Vendor GSTIN", "FI", "Read"], "8": ["GST ledger data by GSTIN and period", "FI", "Read"], "13": ["Scoped invoice and ledger extracts for a notice", "FI", "Read"]}}, "treasury": {"key": "treasury", "name": "Treasury", "intro": ["Treasury decides what gets paid, and when. Payment requests come in from HR, Admin, Technical, IT, projects and other teams — mostly by email, some by WhatsApp. Treasury collects them, checks each against the vendor's outstanding in SAP, sets a priority, weighs it against the funds and bank limits available, and puts a payment summary before management. Once approved, the payment data is uploaded to the bank portal and the UTR and payment advice follow.", "Treasury also keeps the cash picture: bank-wise balances and limits, receipts against bills raised by the Technical team, transfers between the company's own accounts, fixed deposits, and the cash flow that management reviews. SAP holds the vendors, invoices and outstanding balances; the bank portal handles the payment itself. Everything in between is managed in email and Excel. The work runs through nine stages."], "insight": "The check against SAP is where Treasury protects the company: is the vendor right, is the amount actually outstanding, or is this an advance that needs its own approval. Today that check happens after the request has already arrived in whatever format the department chose, so much of Treasury's day goes into putting requests into one shape before any decision can be made.", "flowcap": "Master flow — nine stages from a payment request to the cash picture", "flow": [{"t": "1. Request Intake", "s": "email, WhatsApp, Excel", "dec": false, "hl": false}, {"t": "2. Classification", "s": "by payment type", "dec": false, "hl": false}, {"t": "3. SAP Check", "s": "against outstanding", "dec": false, "hl": false}, {"t": "Agrees?", "s": "amount, vendor", "dec": true, "hl": false}, {"t": "Query", "s": "to department or Accounts", "dec": false, "hl": false}, {"t": "4. Priority and Summary", "s": "colour-coded list", "dec": false, "hl": true}, {"t": "5. Funds and Limits", "s": "bank-wise balance", "dec": false, "hl": false}, {"t": "6. Management Approval", "s": "full, partial, deferred", "dec": false, "hl": true}, {"t": "7. Bank Upload", "s": "UTR and advice", "dec": false, "hl": false}, {"t": "8. Receipts and Transfers", "s": "bills, own accounts", "dec": false, "hl": false}, {"t": "9. Cash Flow and MIS", "s": "inflow, outflow, reports", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Payment Request Intake", "text": "Departments send their payment needs to Treasury, mostly by email and a few by WhatsApp. The daily volume is substantial. Each request should carry the project, SAP vendor code, vendor name, amount and reason, but formats differ from team to team.", "nodes": [{"t": "Payment needed", "s": "any department", "dec": false, "hl": false}, {"t": "Sent", "s": "email or WhatsApp", "dec": false, "hl": false}, {"t": "Collected", "s": "by Treasury", "dec": false, "hl": true}, {"t": "Retyped", "s": "into one Excel list", "dec": false, "hl": false}], "note": "An email or a WhatsApp message is not a reliable record of what was asked for, or who approved it. The request itself needs to become the record."}, {"title": "Stage 2 — Classification", "text": "Requests fall into two broad classes: payments against an outstanding invoice, and advance payments made before an invoice exists. A third case is a payment to a party with no SAP vendor code, where bank details have to be obtained and checked separately.", "nodes": [{"t": "Request", "s": "with vendor and amount", "dec": false, "hl": false}, {"t": "Outstanding or advance", "s": "type recorded", "dec": false, "hl": false}, {"t": "SAP code?", "s": "vendor exists", "dec": true, "hl": false}, {"t": "Bank details", "s": "obtained and verified", "dec": false, "hl": true}], "note": "Vendor bank details held outside SAP are a fraud risk. They should be collected through a controlled request, checked by a second person, and never sent in plain text by email or chat."}, {"title": "Stage 3 — Checking Against SAP Outstanding", "text": "Treasury compares each request with the vendor's outstanding in SAP. Where the amount is higher than what is due, no outstanding is found, or the vendor code differs, the request goes back for clarification. Vendor codes can differ by company or state, so PAN is sometimes used to match the same party.", "nodes": [{"t": "Requested amount", "s": "from department", "dec": false, "hl": false}, {"t": "SAP outstanding", "s": "vendor and project", "dec": false, "hl": false}, {"t": "Agrees?", "s": "amount and code", "dec": true, "hl": false}, {"t": "Review task", "s": "Treasury or Accounts", "dec": false, "hl": true}], "note": "A mismatch should open a review, not reduce or reject the payment on its own. The decision stays with a person."}, {"title": "Stage 4 — Priority and Payment Summary", "text": "Every checked request is given a priority, marked by colour today. Treasury then builds a payment summary for management: what is requested, what SAP shows, the type, the priority and any note on statutory dues or commitments.", "nodes": [{"t": "Checked requests", "s": "ready for review", "dec": false, "hl": false}, {"t": "Priority set", "s": "by colour", "dec": false, "hl": true}, {"t": "Payment summary", "s": "built in Excel", "dec": false, "hl": false}, {"t": "Recommendation", "s": "from Treasury", "dec": false, "hl": false}], "note": "The priority categories are set by Finance. The platform can sort and filter by them, but it does not decide what gets paid."}, {"title": "Stage 5 — Funds and Bank Limits", "text": "Before the summary goes up, Treasury looks at the balance and available limit in each bank account, across the group's companies, and at what is already committed — statutory payments, earlier approvals, loan dues.", "nodes": [{"t": "Bank MIS", "s": "balance by account", "dec": false, "hl": false}, {"t": "Available limit", "s": "by bank", "dec": false, "hl": false}, {"t": "Commitments", "s": "statutory, approved", "dec": false, "hl": false}, {"t": "Funds for today", "s": "what can be paid", "dec": false, "hl": true}], "note": "Balances and limits are gathered separately from the request queue, so the two are rarely seen side by side. Each figure should show where it came from and when."}, {"title": "Stage 6 — Management Approval", "text": "Management and the directors review the summary and decide what is paid in full, what is paid in part and what waits. Emergency payments come through the same door, with a reason.", "nodes": [{"t": "Summary sent", "s": "to management", "dec": false, "hl": false}, {"t": "Reviewed", "s": "by directors", "dec": false, "hl": false}, {"t": "Approved?", "s": "in full", "dec": true, "hl": false}, {"t": "Partial or held", "s": "reason recorded", "dec": false, "hl": true}], "note": "Who can approve what, and up to which amount, is not yet written down. Without that, an approval cannot be checked afterwards."}, {"title": "Stage 7 — Bank Upload, UTR and Advice", "text": "The approved list is prepared as payment data and uploaded to the bank portal, where the bank's own approval steps apply. Once paid, the UTR is noted and a payment advice goes to the vendor.", "nodes": [{"t": "Final list", "s": "as approved", "dec": false, "hl": false}, {"t": "Payment data", "s": "bank format", "dec": false, "hl": false}, {"t": "Uploaded", "s": "bank portal", "dec": false, "hl": false}, {"t": "UTR received", "s": "from the bank", "dec": false, "hl": true}, {"t": "Advice sent", "s": "to vendor", "dec": false, "hl": false}], "note": "The bank portal remains the only place a payment is made. The platform records the approved list, the bank reference and the advice — nothing more."}, {"title": "Stage 8 — Receipts and Internal Transfers", "text": "The Technical team submits bills every month. They pass to Accounts, and Treasury follows the receipt into the bank. Money moved between the company's own bank accounts is recorded separately.", "nodes": [{"t": "Bill submitted", "s": "Technical, monthly", "dec": false, "hl": false}, {"t": "Accounts", "s": "booked", "dec": false, "hl": false}, {"t": "Receipt", "s": "in the bank", "dec": false, "hl": true}, {"t": "Internal transfer", "s": "between own accounts", "dec": false, "hl": false}], "note": "Transfers between accounts are kept in Excel today. They need a reason, an approver and a bank reference like any other movement."}, {"title": "Stage 9 — Cash Flow, Bank MIS and Reports", "text": "Treasury puts together the cash flow — inflows, outflows and what is expected — along with bank MIS, fixed deposit references, payment advice status, vendor ageing and MSME reports.", "nodes": [{"t": "Bank MIS", "s": "each account", "dec": false, "hl": false}, {"t": "Inflow and outflow", "s": "actual and expected", "dec": false, "hl": false}, {"t": "Cash flow", "s": "by company", "dec": false, "hl": true}, {"t": "Reports", "s": "ageing, MSME, advice", "dec": false, "hl": false}], "note": "Each report is prepared by hand. A figure should carry its source and date so management knows how fresh it is."}], "extra": {"title": "Payment request types", "heads": ["Type", "When it applies", "What Treasury checks"], "rows": [["Outstanding", "Invoice booked, amount due in SAP", "Requested amount against SAP outstanding"], ["Advance", "Payment before an invoice", "PO or agreement, reason, approval"], ["Without SAP code", "Party not set up as a vendor", "Verified bank details, reason, approval"], ["Routine", "Recurring expenses", "Schedule and amount against last period"], ["Emergency", "Must be paid today", "Justification, named approver, review afterwards"], ["Statutory", "Dues to government and authorities", "Due date and amount"]]}, "workflows": [["1", "Payment request", "Department needs a payment", "Department, Treasury", "One request in a standard form, with project, vendor code, amount, reason and documents"], ["2", "Incomplete request", "Missing field or document", "Treasury, department", "Request returned with what is missing; resubmission tracked"], ["3", "Classification", "Request received", "Treasury", "Type recorded — outstanding, advance, without SAP code, routine, emergency or statutory"], ["4", "Vendor bank details", "Payment to a party without SAP details", "Department, Treasury, checker", "Bank details obtained and verified by a second person, held securely"], ["5", "SAP outstanding check", "Request classified", "Treasury", "Requested amount compared with SAP outstanding for the vendor and project"], ["6", "Mismatch review", "Amount or code does not agree", "Treasury, Accounts, department", "Review task resolved and the outcome recorded"], ["7", "Advance payment", "Payment needed before invoice", "Department, Treasury, approver", "Advance approved against a PO or agreement, and followed until adjusted"], ["8", "Routine payments", "Recurring expense due", "Admin, HR, Treasury", "Recurring items raised on schedule without a fresh request each time"], ["9", "Priority setting", "Request checked", "Treasury, Finance", "Priority set from agreed categories, shown by colour"], ["10", "Emergency payment", "Payment needed the same day", "Department, Treasury, named approver", "Paid on a separate route with justification, and reviewed afterwards"], ["11", "Fund position", "Daily, before the summary", "Treasury", "Bank-wise balance, available limit and commitments for the day"], ["12", "Payment summary", "Requests ready for decision", "Treasury", "Summary with request, SAP figure, type, priority, funds and recommendation"], ["13", "Management approval", "Summary sent", "Management, directors", "Approval by line, at the right level, with time and name recorded"], ["14", "Partial or deferred payment", "Approved in part, or held", "Management, Treasury, department", "Split or deferral with amount, reason and approver, linked to the original"], ["15", "Bank upload", "Final list approved", "Treasury, bank", "Approved list sent for bank processing; bank reference recorded"], ["16", "UTR and payment advice", "Payment made", "Treasury, Accounts", "UTR recorded against each request; advice sent to the vendor; requester told"], ["17", "Receipts against bills", "Technical team's monthly bill", "Technical, Accounts, Treasury", "Bill followed from submission to receipt in the bank"], ["18", "Internal bank transfer", "Funds needed in another account", "Treasury, approver", "Transfer recorded with reason, approval and bank reference"], ["19", "FD and FDR register", "Deposit placed or maturing", "Treasury, Finance", "Deposit, maturity and linked use recorded, with reminders"], ["20", "Cash flow and reports", "Daily, weekly or month end", "Treasury, management", "Cash flow, bank MIS, ageing, MSME and advice reports, each with source and date"]], "dashboards": [["1", "Requests received", "Requests by department, type, amount and age", "cap"], ["2", "Incomplete requests", "Requests returned, and what is missing", "cap"], ["3", "SAP mismatches", "Requests that do not agree with SAP, and who is reviewing", "cap"], ["4", "Priority queue", "Checked requests by priority and colour", "cap"], ["5", "Pending approvals", "Lines awaiting management, by age and value", "cap"], ["6", "Emergency payments", "Emergency cases, approvers and reviews due", "cap"], ["7", "Partial and deferred", "Balances still to be paid, and when", "cap"], ["8", "Approved for bank", "Today's approved list and bank processing status", "cap"], ["9", "UTR and advice status", "Payments with UTR, and advices sent or pending", "cap"], ["10", "Vendor outstanding", "Outstanding by vendor, project and company", "sap"], ["11", "Payables and MSME ageing", "Dues by age, with MSME vendors marked", "sap"], ["12", "Advances", "Advances paid and not yet adjusted", "sap"], ["13", "Bank balances", "Balance by bank, account and company", "now"], ["14", "Bank limits", "Available limit and use by bank", "now"], ["15", "FDs and FDRs", "Deposits by bank and maturity", "sap"], ["16", "Receipts", "Bills raised and money received, by project", "sap"], ["17", "Cash flow", "Inflows, outflows, transfers and what is expected", "cap"], ["18", "Treasury MIS", "Management reports in the approved formats", "now"]], "obs": "We note that most of Treasury's effort goes into the requests before the decision: chasing formats, checking codes, rebuilding lists. One form for every department, checked against SAP as it arrives, gives that time back to the decision itself.", "interactions": [["HR", "Salary, reimbursement and employee payment requests", "Payment status", "Email."], ["Admin", "Office, utility and routine expense requests", "Payment status", "Email and WhatsApp."], ["Technical", "Payment requests; monthly bills", "Payment and receipt status", "Email."], ["IT", "Software, hardware and service payments", "Payment status", "Email."], ["Projects and Planning", "Site and subcontractor payment needs", "Fund availability", "Email and Excel."], ["Purchase and Store", "Vendor and advance requests", "Payment status, UTR", "Email."], ["Accounts", "Outstanding, invoices, bookings", "UTRs, payment details, mismatch queries", "SAP and email."], ["Finance", "Priority rules, limits, FD and loan dues", "Payment schedule, cash position", "Excel and email."], ["Billing", "Bills raised to clients", "Receipts", "SAP."], ["Banks", "Balances, MIS, UTRs", "Payment uploads, transfers", "Bank portals."], ["Vendors", "Bank details, queries", "Payment advices", "Email."], ["Management", "Approvals, direction", "Payment summary, cash flow, MIS", "Excel and meetings."]], "profile": [["Request channels", "Mostly email, a few by WhatsApp", "One request form; email and WhatsApp used only to notify, never as the record."], ["Volume", "Substantial every day", "Bulk review, filters and one-click approvals by line."], ["Entities", "Several companies and bank accounts", "Requests, balances and reports by company; PAN used to match parties across codes."], ["SAP", "Vendors, invoices, outstanding, payments", "SAP stays the book of record; the platform reads from it and never posts."], ["Bank action", "Upload to the bank portal", "Stays with the bank. The platform records the approved list, reference and UTR only."], ["Sensitivity", "Bank details, balances, approvals", "Masked fields, maker and checker, role and company access, full audit trail."]], "tools": [["SAP", "Vendor codes, outstanding, payments, reports", "Retained and unchanged. Read-only extraction by company and period."], ["Excel", "Request lists, summary, cash flow, transfers", "Replaced by the request queue, summary and dashboards."], ["Email and WhatsApp", "Requests and follow-up", "Replaced by the request form; kept for notifications only."], ["Bank portals and MIS", "Payments, balances, UTRs", "Retained. Balances and references recorded against each request."]], "pains": [["1", "Requests arrive by email and WhatsApp", "Nothing shows every request in one place.", "One payment request module for every department."], ["2", "Each department sends its own format", "Treasury retypes every request before it can decide.", "A standard request format with required fields."], ["3", "Approval authority is not defined", "An approval cannot be checked afterwards.", "Approval levels by type and value, set once and applied every time."], ["4", "SAP outstanding is checked after the request arrives", "Mismatches surface late and slow the whole list.", "Requests checked against SAP as they are submitted."], ["5", "Outstanding and advance payments are mixed", "Advances need a different check and approval.", "Request types, each with its own fields and route."], ["6", "Some payments have no SAP vendor code", "Bank details from outside SAP carry fraud risk.", "Verified bank details with maker and checker, masked in every view."], ["7", "Priority is set by colour in Excel", "Why a payment waited is hard to explain later.", "Priority categories recorded with each line."], ["8", "The payment summary is built by hand", "Hours go into a list that is out of date by evening.", "A summary generated from the checked queue."], ["9", "Bank balances and limits are seen apart from requests", "Cash decisions are slower than they need to be.", "Funds and requests on the same screen."], ["10", "Partial payments are decided but not recorded", "The balance still due can be forgotten.", "Splits and deferrals linked to the original request."], ["11", "Emergency payments go outside the normal route", "They are the ones most likely to be questioned.", "An emergency route with justification and review afterwards."], ["12", "UTRs and advices are followed by hand", "Vendors and departments ask Treasury for status.", "UTR against each request; advice and requester update sent automatically."], ["13", "Vendor codes differ across companies and states", "The same party can be paid twice.", "PAN shown across codes to flag possible duplicates."], ["14", "Technical bills and receipts are tracked monthly by hand", "Expected inflows are not visible in the cash flow.", "Bills followed from submission to receipt."], ["15", "Internal bank transfers are recorded in Excel", "Movements between accounts lack an approval trail.", "A transfer record with reason, approver and bank reference."], ["16", "Request, report and sample formats are needed", "Without them each team keeps inventing its own.", "Agreed formats built into the platform."]], "scope": [["1", "Payment request", "One form for all departments; project, vendor code, amount, reason, documents; required fields; return for correction", "Every request in one shape."], ["2", "Request types", "Outstanding, advance, without SAP code, routine, emergency, statutory; fields and route for each", "The right checks for each case."], ["3", "Vendor bank details", "Secure request; document upload; maker and checker; masked fields; review date", "Bank details that can be trusted."], ["4", "SAP check", "SAP outstanding beside the requested amount; outcomes such as agrees, exceeds, not found, duplicate risk", "Mismatches found on arrival."], ["5", "Review tasks", "Mismatch tasks to Treasury, Accounts or the department; outcome recorded", "Queries closed, not lost in email."], ["6", "Advances", "Advance against PO or agreement; approval; follow-up until adjusted", "No advance left open."], ["7", "Routine and emergency payments", "Recurring schedules; emergency route with justification, named approver and later review", "Exceptions handled openly."], ["8", "Priority queue", "Finance-set categories and colours; sorting and filters; reasons recorded", "Priorities that can be explained."], ["9", "Fund position", "Bank-wise balance and limit by company; commitments; source and date on each figure", "What can be paid today, at a glance."], ["10", "Payment summary", "Summary from the queue with SAP figure, type, priority, funds and recommendation; export", "No list rebuilt by hand."], ["11", "Approvals", "Levels by type and value; approve, part-approve or hold by line; maker and checker; time and name recorded", "Every payment approved by the right person."], ["12", "Bank processing and UTR", "Approved list for bank processing; bank reference; UTR against each request", "Proof of payment on every line."], ["13", "Payment advice and status", "Advice to vendor; update to requester; delivery recorded", "Fewer \"has it been paid?\" calls."], ["14", "Receipts", "Monthly bills from the Technical team; receipts against bills; expected inflows", "Money in, followed like money out."], ["15", "Transfers and deposits", "Internal bank transfers with approval and reference; FD and FDR register with maturity reminders", "Every movement between accounts on record."], ["16", "Cash flow", "Inflows, outflows, transfers, commitments and expected items by company and bank", "One cash picture for management."], ["17", "Dashboards and reports", "The eighteen dashboards of Section 3; bank MIS, ageing, MSME and advice reports in agreed formats", "Management sees the position without asking."], ["18", "SAP extraction, roles and audit", "Read-only extraction of vendors, outstanding and payments; role and company access; audit trail", "SAP and the bank remain in charge; the platform explains them."]], "open": ["That the nine-stage process set out in Section 1 reflects how Treasury operates today.", "That the twenty workflows in Section 2 are complete, and that none of the team's work falls outside them.", "The size of the Treasury team, its roles, and how it sits alongside Finance and Accounts.", "The companies and bank accounts to be covered.", "The departments that raise payment requests, and the typical daily volume.", "The request, report and sample formats in use or preferred, so that they can be built in.", "The request types and fields, including how payments without an SAP vendor code are handled today.", "The approval levels by type and value, and who holds each.", "The priority categories and what each colour stands for.", "What the \"debit … process\" in our notes refers to, as the term was not captured clearly.", "How WhatsApp is used today — sharing requests, approvals or both — and whether it should remain for notifications only.", "How bank balances and limits are obtained today, and how often.", "How partial, deferred and emergency payments are decided and recorded.", "Who collects and verifies vendor bank details, and from which documents.", "The flow of the Technical team's monthly bills, and whether the form goes to or comes from that team.", "Who initiates and approves internal bank transfers.", "Whether the payment scheduling described in our Finance document sits wholly with Treasury.", "The SAP and bank boundary, confirmed with the SAP owner, including the reports and fields the platform should read.", "Whether current Excel lists and trackers should be migrated at go-live."], "sap": {"2": ["Vendor code", "FI", "Read"], "3": ["Vendor bank details held in the vendor master", "FI", "Read"], "4": ["Vendor open items (outstanding)", "FI", "Read"], "6": ["PO and down payments", "MM / FI", "Read"], "9": ["Bank GL balances by company", "FI", "Read"], "10": ["Outstanding by vendor and project", "FI", "Read"], "12": ["Payment documents", "FI", "Read"], "13": ["Payment data for advices", "FI", "Read"], "14": ["Customer billing and receipts", "SD / FI", "Read"], "15": ["Fixed deposits", "FI / TRM", "Read"], "16": ["Payables and receivables due", "FI", "Read"], "17": ["Ageing and MSME data", "FI", "Read"]}}, "insurance": {"key": "insurance", "name": "Insurance", "intro": ["Insurance covers everything PIL could lose: its projects, its equipment and vehicles, and its people. A team of two arranges project policies, insures registered vehicles and non-registered equipment, runs the group medical (GMC) and group personal accident (GPA) policies for employees, renews every policy on time, and handles the paperwork when a claim is made. The insurance budget is approved by the CFO.", "None of this is held in SAP. Asset details come from Purchase and P&M, employee details from HR, and project requirements from Contract and Bidding — and all of it is kept in Excel. Insurers can change from year to year, so the policy history is only as good as the sheets that carry it. The work runs through nine stages."], "insight": "The split after the asset data decides how an asset is insured. A registered vehicle goes through RTO registration and is insured on its IDV, and every vehicle policy falls due on 30 March. Non-registered equipment is covered under a tracker, and the team cannot yet say what each item costs to insure. The team wants that answer — insurance cost by equipment and by project — more than anything else.", "flowcap": "Master flow — nine stages from the insurance budget to cost reporting", "flow": [{"t": "1. Budget", "s": "approved by the CFO", "dec": false, "hl": false}, {"t": "2. Asset Data", "s": "from Purchase and P&M", "dec": false, "hl": false}, {"t": "Registered?", "s": "vehicle or equipment", "dec": true, "hl": false}, {"t": "3. Vehicles", "s": "RTO, IDV, policy", "dec": false, "hl": true}, {"t": "4. Equipment", "s": "insurance tracker", "dec": false, "hl": true}, {"t": "5. Project Policies", "s": "from Contract", "dec": false, "hl": false}, {"t": "6. Employee Benefits", "s": "GMC and GPA", "dec": false, "hl": false}, {"t": "7. Renewals and Insurers", "s": "due dates, contracts", "dec": false, "hl": true}, {"t": "8. Claims", "s": "documents, surveyor", "dec": false, "hl": false}, {"t": "9. Cost and Reports", "s": "by equipment and project", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Insurance Budget and Approval", "text": "Insurance prepares the premium budget for the year across projects, vehicles, equipment and employee benefits. The CFO approves it, and premiums are then placed against it.", "nodes": [{"t": "Premium estimate", "s": "by class of policy", "dec": false, "hl": false}, {"t": "Budget prepared", "s": "for the year", "dec": false, "hl": false}, {"t": "CFO approval", "s": "amount approved", "dec": false, "hl": true}, {"t": "Premiums placed", "s": "against the budget", "dec": false, "hl": false}], "note": "How much was approved and how much has been spent are both kept in Excel, so the remaining budget is worked out by hand."}, {"title": "Stage 2 — Asset Data from Purchase and P&M", "text": "When equipment or a vehicle is bought, Purchase and P&M give Insurance its details — asset code, description, class and value. Insurers expect these details to be right, and a claim depends on them later.", "nodes": [{"t": "Asset bought", "s": "vehicle or equipment", "dec": false, "hl": false}, {"t": "Details sent", "s": "code, class, value", "dec": false, "hl": false}, {"t": "Complete?", "s": "code and value", "dec": true, "hl": false}, {"t": "Request back", "s": "to Purchase or P&M", "dec": false, "hl": true}], "note": "The machine list belongs to P&M. Insurance should read it, not keep a second list that drifts from the first."}, {"title": "Stage 3 — Registered Vehicles", "text": "Vehicles are registered with the RTO and insured on their IDV. New registrations are tracked until complete. All vehicle insurance falls due on 30 March, so the whole fleet is renewed in one window.", "nodes": [{"t": "New vehicle", "s": "from Purchase", "dec": false, "hl": false}, {"t": "RTO registration", "s": "status tracked", "dec": false, "hl": false}, {"t": "IDV and premium", "s": "quoted", "dec": false, "hl": false}, {"t": "Policy issued", "s": "vehicle cover", "dec": false, "hl": true}, {"t": "Renewal", "s": "every 30 March", "dec": false, "hl": false}], "note": "A single renewal date makes the fleet easy to plan but hard to execute. It needs a bulk view: every vehicle, its IDV, last premium and quote, in one list."}, {"title": "Stage 4 — Non-registered Equipment", "text": "Equipment that is not registered with the RTO is covered under the insurance tracker, usually as part of a wider policy. The team wants to know what each item costs to insure, and the cost by class of equipment.", "nodes": [{"t": "Equipment received", "s": "P&M record", "dec": false, "hl": false}, {"t": "Insurance tracker", "s": "added under policy", "dec": false, "hl": true}, {"t": "Covered", "s": "by class", "dec": false, "hl": false}, {"t": "Individual cost", "s": "per item", "dec": false, "hl": true}], "note": "The premium is paid at policy level. Breaking it down to each item needs an agreed basis — value, class, or both — which is raised in Section 8."}, {"title": "Stage 5 — Project Insurance", "text": "Contract and Bidding bring Insurance in when a tender or contract sets out what must be insured. Insurance helps work out the cost at bid and commercial stage, and places the project policy once the work is won.", "nodes": [{"t": "Tender terms", "s": "insurance required", "dec": false, "hl": false}, {"t": "Cost for bid", "s": "with Contract", "dec": false, "hl": false}, {"t": "Project awarded", "s": "contract signed", "dec": false, "hl": false}, {"t": "Project policy", "s": "for the contract term", "dec": false, "hl": true}], "note": "The Contract document already proposes a register of contractual obligations. The insurance each contract requires belongs there, linked to the policy that meets it."}, {"title": "Stage 6 — Employee Benefits: GMC and GPA", "text": "Employees are covered by a group medical policy and a group personal accident policy. Insurance uses the employee data HR records, and additions and deletions are sent to the insurer by mail as people join and leave.", "nodes": [{"t": "HR data", "s": "joiners and leavers", "dec": false, "hl": false}, {"t": "GMC and GPA", "s": "members covered", "dec": false, "hl": false}, {"t": "Updates by mail", "s": "additions, deletions", "dec": false, "hl": true}, {"t": "Premium adjusted", "s": "by the insurer", "dec": false, "hl": false}], "note": "A joiner left off the list is uninsured; a leaver left on it is paid for. HR's joining and exit records should raise the update, not a separate email."}, {"title": "Stage 7 — Insurers, Contracts and Renewals", "text": "Insurers and brokers may change from one year to the next. The team wants a directory of insurers and their contracts, and a clear list of due dates so that every renewal is started in time.", "nodes": [{"t": "Due date near", "s": "any policy", "dec": false, "hl": false}, {"t": "Quotes", "s": "from insurers", "dec": false, "hl": false}, {"t": "Same insurer?", "s": "terms compared", "dec": true, "hl": false}, {"t": "Moved", "s": "history kept", "dec": false, "hl": true}], "note": "When the insurer changes, the history of claims and premiums on that asset must stay with the asset, not with the old insurer's file."}, {"title": "Stage 8 — Claims", "text": "When a loss occurs, Insurance handles the claim — intimation, documents, surveyor visits and follow-up to settlement. Different claims need different documents: a project claim is not the same as a flood claim.", "nodes": [{"t": "Incident", "s": "site, vehicle, person", "dec": false, "hl": false}, {"t": "Intimation", "s": "to the insurer", "dec": false, "hl": false}, {"t": "Documents", "s": "by claim type", "dec": false, "hl": true}, {"t": "Surveyor", "s": "visit and queries", "dec": false, "hl": false}, {"t": "Settled", "s": "and closed", "dec": false, "hl": false}], "note": "The documents a claim needs are spread across site, P&M, Safety and Finance, and are not easy to find by email. Coverage and settlement remain the insurer's decision."}, {"title": "Stage 9 — Cost and Reports", "text": "The team wants insurance cost by equipment and by project, the individual cost of non-registered equipment, total premium and IDV, and how the premium paid compares with what was approved.", "nodes": [{"t": "Premium paid", "s": "by policy", "dec": false, "hl": false}, {"t": "By equipment", "s": "and class", "dec": false, "hl": false}, {"t": "By project", "s": "where deployed", "dec": false, "hl": false}, {"t": "Reports", "s": "premium, IDV, approved", "dec": false, "hl": true}], "note": "Equipment moves between projects during a policy year. Project-wise cost needs P&M's deployment record to split the premium fairly."}], "extra": {"title": "Insurance the team manages", "heads": ["Class", "Covers", "Data from", "Renewal"], "rows": [["Project", "Works under contract", "Contract, Bidding", "Per contract term"], ["Registered vehicles", "Vehicles with RTO registration", "Purchase, P&M", "30 March"], ["Non-registered equipment", "Machines without RTO registration", "Purchase, P&M", "Per policy"], ["GMC", "Group medical cover for employees", "HR", "Per policy"], ["GPA", "Group personal accident for employees", "HR", "Per policy"]]}, "workflows": [["1", "Insurance budget", "Start of the year", "Insurance, CFO", "Premium budget by class, approved by the CFO"], ["2", "Asset data intake", "Vehicle or equipment bought", "Purchase, P&M, Insurance", "Asset code, description, class and value received and checked"], ["3", "New vehicle registration", "New vehicle received", "P&M, Insurance, RTO", "RTO registration followed to completion, with status visible"], ["4", "Vehicle policy", "Vehicle registered or bought", "Insurance, insurer", "Policy issued on the IDV, with premium recorded"], ["5", "Fleet renewal", "30 March approaching", "Insurance, insurers, CFO", "Every vehicle renewed in one exercise, with IDV and premium per vehicle"], ["6", "Equipment insurance tracker", "Non-registered equipment received", "P&M, Insurance", "Item added to the tracker under the right policy and class"], ["7", "Equipment cost", "Policy placed or renewed", "Insurance, Finance", "Premium broken down to each item and each class"], ["8", "Insurance for bids", "Tender requires insurance", "Bidding, Contract, Insurance", "Insurance cost and terms provided for the bid and commercials"], ["9", "Project policy", "Project awarded", "Contract, Insurance, insurer", "Project policy placed to meet the contract, for its term"], ["10", "GMC updates", "Employee joins or leaves", "HR, Insurance, insurer", "Additions and deletions sent to the insurer and confirmed"], ["11", "GPA cover", "Joining, leaving, renewal", "HR, Insurance, insurer", "Members covered and premium kept current"], ["12", "Insurer and contract directory", "New insurer, broker or contract", "Insurance", "Insurers, brokers, contacts and contracts in one place"], ["13", "Quotes and placement", "New cover or renewal", "Insurance, insurers, CFO", "Quotes compared, insurer chosen, approval recorded"], ["14", "Policy documents", "Policy or endorsement issued", "Insurance", "Policy, schedule and endorsements filed against the assets they cover"], ["15", "Due dates and renewals", "Any policy nearing expiry", "Insurance", "Reminders ahead of expiry; renewal started and tracked"], ["16", "Claim intimation", "Incident or loss", "Site, Safety, HR, Insurance", "Claim opened with policy, asset or person, date and first facts"], ["17", "Claim documents", "Claim opened", "Insurance, site, P&M, Finance", "Documents collected against the checklist for that claim type"], ["18", "Surveyor and insurer queries", "Surveyor appointed or query raised", "Insurance, site, surveyor", "Visits, queries and responses recorded with dates"], ["19", "Claim settlement", "Insurer decision", "Insurance, Finance, Legal", "Settlement amount and reference recorded; claim closed or disputed"], ["20", "Cost and MIS", "Month end, or on request", "Insurance, CFO, management", "Premium by equipment, class and project; budget against approved and paid"]], "dashboards": [["1", "Policy register", "Active policies by class, insurer and company", "now"], ["2", "Renewals due", "Policies expiring in 30, 60 and 90 days, and the 30 March fleet renewal", "now"], ["3", "Vehicle insurance", "Registered vehicles with IDV, premium and policy status", "now"], ["4", "Registration status", "New registrations pending with the RTO, and their age", "cap"], ["5", "Equipment tracker", "Non-registered equipment under insurance, by class and policy", "now"], ["6", "Uninsured or incomplete", "Assets without cover, or missing asset code or value", "cap"], ["7", "Class-wise equipment", "Insurance and registration status by class of equipment", "cap"], ["8", "Cost by equipment", "Premium for each item, including non-registered equipment", "cap"], ["9", "Cost by project", "Premium carried by each project", "cap"], ["10", "Budget against premium", "Budget approved by the CFO against premium approved and paid", "cap"], ["11", "Premium and IDV", "Total premium and total IDV by class and company", "now"], ["12", "Project policies", "Policies by project, cover period and contract requirement", "cap"], ["13", "GMC and GPA", "Members covered, additions and deletions pending", "cap"], ["14", "Open claims", "Claims by type, age, owner and stage", "cap"], ["15", "Documents and queries", "Claim documents outstanding, and surveyor or insurer queries awaiting reply", "cap"], ["16", "Claim settlement", "Amounts claimed, settled and pending, by type and insurer", "cap"], ["17", "Insurers and contracts", "Insurers and brokers, contracts, and share of premium", "cap"], ["18", "Insurance MIS", "Monthly summary for the CFO and management", "cap"]], "obs": "We note that for a team of two, the work is mostly gathering: asset details from Purchase and P&M, employees from HR, requirements from Contract, evidence from site. Every one of those can arrive as a task with a due date instead of an email to chase.", "interactions": [["Purchase", "Details of equipment and vehicles bought", "Cover confirmation", "Email and Excel."], ["Plant and Machinery", "Equipment list, class, registration, deployment", "Policy and renewal status, claims on machines", "Excel."], ["Contract and Bidding", "Insurance required by tenders and contracts", "Insurance cost for bids; project policies", "Email."], ["HR", "Employee data, joiners and leavers", "GMC and GPA cover; employee claims", "Email."], ["Finance and CFO", "Budget approval", "Budget, premium and claim figures", "Excel."], ["Accounts and Treasury", "Premium payment and booking", "Premium requests, settlements received", "Email and SAP."], ["Project and Safety", "Incident reports and claim evidence", "Claim checklist and status", "Email and phone."], ["Legal", "Support on disputed claims", "Policy and claim documents", "Ema
