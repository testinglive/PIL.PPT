uty rosters, and arranges cabs as needed. The team wants vehicle utilisation reported, and each driver's licence tracked so that nobody drives on an expired one.", "nodes": [{"t": "Vehicle", "s": "13 in the HO fleet", "dec": false, "hl": false}, {"t": "Driver and duty", "s": "licence checked", "dec": false, "hl": false}, {"t": "Fuel and running", "s": "logged by hand", "dec": false, "hl": true}, {"t": "Utilisation", "s": "per vehicle", "dec": false, "hl": false}], "note": "A figure of 73 cabs was also noted; how it relates to the thirteen vehicles is raised in Section 8."}, {"title": "Stage 5 — Purchase Requests for Admin Items", "text": "For stationery, uniforms and rewards, Admin raises the purchase request and Purchase buys. Admin then distributes the items.", "nodes": [{"t": "Need identified", "s": "stationery, uniforms", "dec": false, "hl": false}, {"t": "PR raised", "s": "by Admin", "dec": false, "hl": true}, {"t": "Purchased", "s": "by Purchase, in SAP", "dec": false, "hl": false}, {"t": "Distributed", "s": "to sites and staff", "dec": false, "hl": false}], "note": "The purchase itself stays in SAP. What Admin needs is the status of its requests and what was distributed where."}, {"title": "Stage 6 — CUG and SIM Management", "text": "Admin manages the company's SIM connections — numbers, activation and deactivation, postpaid connections, recharges and bills — and wants to use them as a CUG for internal communication. In the MIS, CUG bills are reported with the other utilities.", "nodes": [{"t": "Request", "s": "joiner or role", "dec": false, "hl": false}, {"t": "SIM issued", "s": "number activated", "dec": false, "hl": false}, {"t": "Recharge and bill", "s": "monthly", "dec": false, "hl": false}, {"t": "Deactivated", "s": "on exit or closure", "dec": false, "hl": true}], "note": "A SIM left active after someone leaves, or after a site closes, keeps billing. HR exits and Project Closure should both trigger deactivation."}, {"title": "Stage 7 — Facilities, Leases, Assets and Licences", "text": "Admin manages rent for head office, branches and factories, and land leases; electricity, water and internet; housekeeping cost by site; the canteen and welfare activities; the register of furniture, equipment and other assets; and the factory, pollution and fire licences with their renewals. It also handles the admin side of accidents and medical cases, such as first aid, travel and hospital arrangements.", "nodes": [{"t": "Rent and leases", "s": "HO, branch, factory", "dec": false, "hl": false}, {"t": "Utilities", "s": "power, water, internet", "dec": false, "hl": false}, {"t": "Housekeeping", "s": "canteen, welfare", "dec": false, "hl": false}, {"t": "Asset register", "s": "furniture, equipment", "dec": false, "hl": true}, {"t": "Licences", "s": "factory, fire, pollution", "dec": false, "hl": true}], "note": "Leases and licences both carry renewal dates, and nothing reminds anyone when they fall due. A lapsed factory or fire licence can stop work at the premises."}, {"title": "Stage 8 — Billing and Bill Booking", "text": "Bills for the canteen, electricity, petty cash and other admin expenses are collected and kept in folders, checked, and booked in SAP, with GST handled with Finance. At site, the admin team sends a daily billing report and closes its billing on the 21st of each month. Two billing staff at head office handle admin billing, which is separate from project billing.", "nodes": [{"t": "Bills collected", "s": "per folder", "dec": false, "hl": false}, {"t": "Site billing report", "s": "daily, closes on 21st", "dec": false, "hl": false}, {"t": "Checked", "s": "against budget and vendor", "dec": false, "hl": true}, {"t": "Booked in SAP", "s": "with GST", "dec": false, "hl": false}], "note": "Billing was described as taking around two months. Until a bill is booked, its cost is invisible to the budget."}, {"title": "Stage 9 — Expense Reporting", "text": "Site admin sends daily, expense and event reports. Head office prepares monthly and quarterly expense reports, reports admin matters to the CHRO, and uses a Power BI dashboard built from an HR Admin Excel report.", "nodes": [{"t": "Site reports", "s": "daily, expense, events", "dec": false, "hl": false}, {"t": "Consolidated", "s": "in Excel", "dec": false, "hl": false}, {"t": "Power BI", "s": "HR Admin dashboard", "dec": false, "hl": false}, {"t": "Monthly and quarterly", "s": "to CHRO", "dec": false, "hl": true}], "note": "The department told us there is no monitoring system and no way to trace data back to its source today."}], "extra": {"title": "Admin reports the team has listed", "heads": ["Area", "Report", "What it shows"], "rows": [["Travel", "Travel expenses", "Flight, train, taxi, fuel and hotel"], ["", "Employee reimbursement", "Travel claim settlement"], ["", "Travel budget control", "Budget against actual travel cost"], ["Rent and accommodation", "Office rent", "Head office, branch and factory rent"], ["", "Guest house", "Occupancy and cost"], ["", "Land lease", "Lease cost tracking"], ["Facilities", "Utility expenses", "Electricity, water, internet, CUG SIM"], ["", "Housekeeping", "Site-wise cost"], ["", "Welfare expenses", "Canteen and welfare activities"], ["", "Asset management", "Furniture, equipment and asset register"], ["Vehicles", "Fleet dashboard", "Vehicle utilisation"], ["", "Driver licence tracker", "Licence validity for each driver"], ["Licences", "Licence tracker", "Factory, pollution and fire licences"], ["", "Renewal dashboard", "Upcoming renewals"]]}, "workflows": [["1", "Admin budget and projections", "New project, new quarter", "Admin, Finance, Planning", "The admin budget by cost centre, WBS and category, with quarterly projections"], ["2", "Exception and commitment approval", "Spend beyond budget", "Admin, department head, CHRO", "An approved or rejected exception, recorded against the budget"], ["3", "Joining travel and stay", "New joiner confirmed by HR", "HR, Admin, joiner", "Travel, hotel and food arranged before joining"], ["4", "Business travel booking", "Travel request", "Employee, approver, travel desk", "Travel booked through TripGain within the travel budget"], ["5", "Travel and site reimbursement", "Trip completed, or expense at site", "Employee, approver, Admin, Finance", "Claim for taxi, fuel, hotel or site expense checked, approved and passed for payment"], ["6", "Site accommodation and guest house", "Project start, or staff arrival", "Site admin, vendor, Purchase", "Accommodation and furniture arranged; guest house occupancy and cost recorded"], ["7", "Driver licence tracking", "Driver joins, or licence nearing expiry", "Car executive, drivers", "Licence on record for every driver, with renewal reminders"], ["8", "Canteen and food", "Daily", "Site admin, canteen vendor", "Meals served and cost recorded by site and vendor"], ["9", "Local transport and cabs", "Transport request", "Site admin, cab vendor", "Trips and cost recorded"], ["10", "Fleet and driver management", "Daily duty, fuel, service due", "Car executive, drivers", "Duty roster, fuel log, utilisation, running cost and service records per vehicle"], ["11", "Admin purchase request", "Need for stationery, uniforms or rewards", "Admin, Purchase", "PR raised and tracked to receipt and distribution"], ["12", "CUG and SIM lifecycle", "Joining, role change, exit, site closure", "Admin, HR, provider", "Connection issued, recharged, billed and deactivated when no longer needed"], ["13", "Rent, factory and land lease", "New premises, renewal due", "Admin, Legal, Finance", "Agreement recorded with rent, deposit, term and renewal date, and renewed or closed on time"], ["14", "Utilities and housekeeping", "Monthly", "Admin, vendors", "Electricity, water, internet and CUG bills, and housekeeping cost, recorded by location"], ["15", "Welfare, events and medical support", "Event planned, or accident or illness", "Admin, HR, Safety", "Event arranged and followed up; first aid, travel and hospital support recorded"], ["16", "Asset register", "Furniture or equipment bought, moved or disposed", "Admin", "An admin asset register by location and custodian"], ["17", "Factory, pollution and fire licences", "New premises, or renewal due", "Admin, Legal, authorities", "Licences held with validity and documents, renewed before they lapse"], ["18", "Site billing cycle", "Daily, closing on the 21st", "Site admin, HO billing", "Daily billing report and the month's site bills submitted by the 21st"], ["19", "Bill checking and booking", "Bill received", "HO billing, Finance", "Bill checked against budget and vendor terms, booked in SAP with GST, petty cash settled"], ["20", "Expense reporting", "Daily, monthly, quarterly", "Admin, CHRO", "Daily consumption, monthly and quarterly expense reports by category, site and cost centre"]], "dashboards": [["1", "Expense by category", "Admin spend by category, site, cost centre and month", "now"], ["2", "Budget against consumed", "Budget, committed and consumed by cost centre, WBS and category", "sap"], ["3", "Daily consumption", "Today's spend by site and category, as it is recorded", "cap"], ["4", "Travel expenses", "Flight, train, taxi, fuel and hotel", "now"], ["5", "Travel budget control", "Budget against actual travel cost", "now"], ["6", "Reimbursements", "Travel and site claims submitted, approved, settled and pending", "cap"], ["7", "Office rent", "Head office, branch and factory rent, with renewals due", "cap"], ["8", "Guest house", "Occupancy and cost by location", "cap"], ["9", "Land lease", "Lease cost and terms by site", "cap"], ["10", "Utilities and CUG", "Electricity, water, internet and CUG bills; connections held by people who have left", "cap"], ["11", "Housekeeping", "Housekeeping cost by site", "cap"], ["12", "Canteen and welfare", "Canteen cost, meals and welfare activities by site", "cap"], ["13", "Asset register", "Furniture, equipment and other assets by location and custodian", "cap"], ["14", "Fleet", "Vehicle utilisation, fuel and running cost per vehicle", "cap"], ["15", "Driver licences", "Licence validity for each driver, and expiries due", "cap"], ["16", "Licences and renewals", "Factory, pollution and fire licences, and upcoming renewals", "cap"], ["17", "Site billing status", "Sites that have submitted by the 21st, bills pending and ageing", "cap"], ["18", "Bills and vendors", "Admin bills booked in SAP by month, category and vendor", "sap"], ["19", "Exceptions", "Exception and commitment cases raised and approved, with amounts", "cap"], ["20", "Admin MIS", "Monthly and quarterly expense report for the CHRO", "now"]], "obs": "We note that Admin's services follow people and projects: a joiner needs travel and a SIM, an exit needs the SIM deactivated, and a closing site needs its leases, canteen and connections ended. Those triggers already exist in HR and Project Closure, and linking them is worth more than any report.", "interactions": [["HR", "Joiners, transfers and exits; site reimbursement claims", "Travel, stay, SIM, facilities; deactivation on exit", "Combined team at site; separate at head office."], ["Finance", "Budgets, bill booking, GST, payment", "Checked bills, petty cash, expense reports", "Bills booked in SAP."], ["Purchase", "Stationery, uniforms, furniture", "Purchase requests", "PR raised in SAP."], ["Planning", "Project WBS and tentative site budget", "Admin cost projections", "Budget read from WBS."], ["Project and site teams", "Requests for stay, transport, events", "Site services and reports", "Daily and monthly reports."], ["Project Closure", "Closure dates", "Leases and connections cancelled, SIM and cards closed", "Demobilisation sheets."], ["Safety and Insurance", "Accident and medical cases", "First aid, travel and hospital support", "Case by case."], ["Legal", "Rent and lease agreements; licence guidance", "Agreement and licence details, renewals", "Agreements on file."], ["Authorities", "Factory, pollution and fire licences", "Applications, renewals, inspections", "Files and portals."], ["Vendors", "Services and bills", "Orders, payments, feedback", "Excel and folders."], ["CHRO and management", "Approvals for exceptions", "Monthly and quarterly reports", "Excel and Power BI."]], "profile": [["Team size", "Recorded as 9 and as 10 at head office", "A travel desk executive, car executives and two billing staff among them. Site admin sits within the combined site HR and Admin team."], ["Fleet", "13 vehicles for HO and senior management", "Small enough to manage by vehicle, with fuel, duty and utilisation on mobile, and a licence on record for every driver."], ["MIS structure", "Travel, rent, facilities, vehicles, licences", "Dashboards and expense categories follow the team's own structure."], ["Approvals", "CHRO and department head for exceptions", "Exception approval by value and category."], ["Billing rhythm", "Daily site reports; site billing closes on the 21st", "The system schedules the cycle and shows which sites are late."], ["Budget basis", "Cost centre, WBS and quarterly budget", "Every expense is recorded against a cost centre or WBS and a category."]], "tools": [["TripGain", "Travel booking and its dashboard", "Retained. Bookings and spend are brought into the platform so travel sits with the rest of Admin's expenses."], ["SAP", "WBS budget, purchase requests, bill booking", "Retained and unchanged. The platform reads budgets and booked bills, and does not book or pay."], ["Excel", "Site reports, trackers, HR Admin dashboard report", "Replaced by structured records from site and HO."], ["Folders", "Bills by category", "Replaced by bills uploaded against the expense they belong to."], ["Power BI", "HR Admin dashboard", "Fed from the platform, or replaced by its own dashboards."]], "pains": [["1", "Admin details are managed manually, with nothing in a system", "Every figure has to be gathered before it can be used.", "Structured records for each service, captured at site and HO."], ["2", "There is no monitoring system", "Overspend and delays are seen after the fact.", "Live dashboards with alerts against budget."], ["3", "Data cannot be traced to its source", "A figure in a report cannot be checked back to the bill.", "Every figure drills down to the record and the bill behind it."], ["4", "Budget against consumption is not tracked live or daily", "Spend is known only once bills are booked.", "Budget, committed and consumed, with daily consumption from site records."], ["5", "Travel cost outside TripGain is not seen against the budget", "Taxi, fuel and claims are missing from the travel picture.", "All travel cost brought together against the travel budget."], ["6", "Bills are kept in folders and billing takes around two months", "Costs arrive late and vendors wait.", "Bills uploaded and checked as they arrive, with ageing shown."], ["7", "Site reports are compiled in Excel for the 21st", "Consolidation takes time and errors carry through.", "Site billing and daily reports submitted in the platform, with late sites flagged."], ["8", "Expense reports are built by hand", "Monthly and quarterly reports take effort each time.", "Reports by category generated from the records."], ["9", "Vendor management is not structured", "Rates, contracts and performance are not compared.", "A vendor register with services, rates, bills and performance."], ["10", "SIM connections are tracked by hand", "Connections stay active and billing after people leave.", "A CUG and SIM register with deactivation on exit or site closure."], ["11", "Fleet use, fuel and driver licences are tracked by hand", "Running cost is unknown, and a driver may be on an expired licence.", "Vehicle logs with utilisation, and licence expiry alerts."], ["12", "Office, factory and land leases are tracked by hand", "Renewals and deposits are missed.", "An agreement register with renewal alerts."], ["13", "Furniture, equipment and other assets are not tracked", "What exists where, and with whom, is unknown.", "An asset register by location and custodian."], ["14", "Exceptions are approved outside a system", "Budget overruns are not recorded against the budget.", "Exception approval by the CHRO and department head, recorded against the budget."], ["15", "Factory, pollution and fire licences need a tracker", "A lapsed licence can stop work at the premises.", "A licence register with a renewal dashboard."], ["16", "Site events and welfare are followed up by hand", "Follow-ups are missed and welfare spend is not reported.", "Events and welfare activities recorded with cost and follow-up tasks."]], "scope": [["1", "Budget and cost centre", "Budget by cost centre, WBS and category read from SAP; quarterly budget and projections; committed and consumed", "Every expense measured against its budget as it happens."], ["2", "Exception approval", "Exception and commitment requests; approval by department head and CHRO; recorded against the budget", "Overruns approved and visible, not hidden."], ["3", "Travel and joining", "Joining arrangements from HR; travel requests; TripGain bookings brought in; flight, train, taxi, fuel and hotel cost; travel budget control", "Travel managed within budget and seen with other costs."], ["4", "Reimbursement", "Travel and site claims with receipts — taxi, fuel, hotel and others; approval; status to settlement", "Claims settled without paper."], ["5", "Accommodation and guest house", "Site accommodation; guest house bookings, occupancy and cost; furniture issued; cost per head", "Stays arranged and costed by location."], ["6", "Licences and renewals", "Factory, pollution and fire licences; validity and documents; renewal dashboard and alerts; link to Legal", "No licence lapses unseen."], ["7", "Fleet and transport", "Vehicle register; utilisation; drivers and duty roster; driver licence tracker; fuel log; service and documents; cab trips", "Running cost and use per vehicle, and every driver licensed."], ["8", "CUG and SIM", "Connection register; issue, activation and deactivation; recharge and bills; triggers from HR exits and Project Closure", "No connection billing after it should have stopped."], ["9", "Rent and land lease", "Head office, branch and factory rent; land leases; deposit, term and renewal; alerts; link to Legal", "Renewals and deposits handled on time."], ["10", "Facilities, canteen and welfare", "Electricity, water and internet by location; housekeeping cost by site; canteen meals and cost; welfare and events with follow-ups; medical and accident support", "Offices and sites run with known costs."], ["11", "Asset register", "Furniture, equipment and other admin assets by location and custodian; movement and disposal", "Admin assets accounted for."], ["12", "Admin purchase requests", "Requests for stationery, uniforms and rewards; PR status from SAP; distribution", "Admin knows where its requests stand."], ["13", "Vendor management", "Vendor register; services, rates and contracts; bills; performance", "Vendors compared and managed on facts."], ["14", "Site reporting and billing cycle", "Daily billing, expense and event reports from site; cycle closing on the 21st; late sites flagged", "Site data arrives structured and on time."], ["15", "Bill tracking", "Bill upload against the expense; checks against budget and vendor terms; GST details; petty cash; status to SAP booking", "Bills move from receipt to booking without folders."], ["16", "Expense dashboards", "The twenty dashboards of Section 3 in the team's MIS structure; expense by category; daily consumption; budget against consumed", "The dashboards the department asked for."], ["17", "Reports and MIS", "Monthly and quarterly expense reports; CHRO reports; drill-down to the bill; export to Excel, PDF and Power BI", "Reports that can be traced to their source."], ["18", "SAP and TripGain links, roles and audit", "Read budgets, PRs and booked bills from SAP; TripGain data; site and HO roles; audit trail", "Admin records tied to the systems of record, without a second ledger."]], "open": ["That the nine-stage process set out in Section 1 reflects how Admin operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The head office team size, recorded as both 9 and 10, and the roles within it.", "The fleet — thirteen vehicles were recorded, and a figure of 73 cabs was also noted — what each refers to, how utilisation should be measured, and whether the driver licence tracker covers company drivers only or contracted drivers too.", "How the admin budget is set by cost centre and WBS, how the quarterly budget works, and what counts as an exception or commitment case.", "The approval limits at which the department head and the CHRO approve.", "Whether TripGain can share its bookings and spend with the platform, and what it covers today.", "What the two-month billing period refers to, and the site billing rules around the 21st.", "Who books admin bills in SAP, and how GST and petty cash are handled.", "The vendors in use, and whether their rates and contracts are held anywhere today.", "The SIM and CUG set-up — provider, number of connections and how CUG is to work.", "The rent, guest house and land lease agreements to be tracked, including the factories whose rent Admin pays, and how renewals are shared with Legal.", "That factory, pollution and fire licences sit with Admin, as assumed in our revised HR document, and the premises each applies to.", "That travel and site reimbursements, placed with HR in our first HR document, are handled by Admin.", "What counts as an admin asset beyond furniture and equipment, and whether assets are tagged.", "What Admin does in accident and medical cases, as distinct from HR, Safety and Insurance.", "The meaning of items in our notes we could not resolve: \"listing details\", \"PR, reward\", \"Power\" after TripGain, and the scope of duty management.", "The SAP boundary, confirmed with the SAP owner, including which budget and bill fields the platform should read.", "Whether current trackers, agreements, licences, vendor lists and expense history should be migrated at go-live, and the Excel files and HR Admin report the department offered to share."], "sap": {"1": ["Budget by cost centre and WBS; committed and actual", "CO / PS", "Read"], "12": ["PR and PO status for admin items", "MM", "Read"], "13": ["Vendor master for admin vendors", "FI / MM", "Read"], "15": ["Bill booking status; GST details on booked bills", "FI", "Read"], "17": ["Booked expenses by GL and cost centre", "FI / CO", "Read"]}}, "store": {"key": "store", "name": "Store", "intro": ["Store receives, holds, issues and accounts for material across every project, plant and site. SAP already carries its core transactions — purchase requisitions and orders, goods receipt, issues, stock transfers and most stock reporting. What SAP does not carry is the physical side: the truck being unloaded, the count at the gate, the silo and tank levels, the diesel meter reading, the tool in someone's custody, and the reasons behind a difference between the book and the shelf.", "So the department runs two records side by side — SAP and its own site sheets — and joins them by hand. Staff export several SAP reports, merge them with site data in Excel, and produce daily, weekly and monthly reports from the result. The work runs through nine stages."], "insight": "Every stage produces two events: something happens physically, and something is posted in SAP. The gap between the two is where the department's problems live — material received but not yet in SAP, stock on the shelf that the book does not show, and reports that have to be rebuilt by hand to explain the difference. The proposed platform records the physical event, links it to the SAP transaction, and shows the gap until it closes.", "flowcap": "Master flow — nine stages from demand to reconciliation", "flow": [{"t": "1. Demand and PR", "s": "central or local purchase", "dec": false, "hl": false}, {"t": "2. Receipt and Inward", "s": "physical, then SAP", "dec": false, "hl": true}, {"t": "3. Quality Hand-off", "s": "where inspection applies", "dec": false, "hl": false}, {"t": "Accepted?", "s": "by Quality", "dec": true, "hl": false}, {"t": "Return or replacement", "s": "with Purchase", "dec": false, "hl": false}, {"t": "4. Storage and Issue", "s": "by location, against reservation", "dec": false, "hl": true}, {"t": "5. Bulk and Plant", "s": "aggregate, cement, bitumen", "dec": false, "hl": false}, {"t": "6. Diesel, Tools, Spares", "s": "issue and custody", "dec": false, "hl": false}, {"t": "7. Inter-site Transfer", "s": "surplus before purchase", "dec": false, "hl": false}, {"t": "8. Non-moving and Scrap", "s": "ageing and decisions", "dec": false, "hl": false}, {"t": "9. Reconciliation and Reporting", "s": "physical against SAP, daily to monthly", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Demand and Purchase Requisition", "text": "Site and store requirements are raised as purchase requisitions and move through the purchase process in SAP. Approved central and bulk procurement is distinguished from limited local purchases.", "nodes": [{"t": "Requirement", "s": "from site or store", "dec": false, "hl": false}, {"t": "Stock checked", "s": "here and at other sites", "dec": false, "hl": false}, {"t": "PR raised", "s": "in SAP", "dec": false, "hl": false}, {"t": "PO by Purchase", "s": "central or local", "dec": false, "hl": false}], "note": "Open requisitions, orders and reservations stay open in SAP until they are closed. Nobody is prompted to follow up on the old ones."}, {"title": "Stage 2 — Receipt and Inward", "text": "When material arrives, Store checks the delivery, the invoice or challan, the quantity and the condition, and supports the goods receipt in SAP. Physical receipt and SAP posting do not always happen at the same time.", "nodes": [{"t": "Vehicle arrives", "s": "supplier and challan", "dec": false, "hl": false}, {"t": "Unloaded", "s": "count or weighment", "dec": false, "hl": false}, {"t": "Documents checked", "s": "invoice, challan, condition", "dec": false, "hl": false}, {"t": "Awaiting SAP", "s": "interim gap", "dec": false, "hl": true}, {"t": "GRN in SAP", "s": "inward posted", "dec": false, "hl": false}], "note": "Until the goods receipt is posted, material that is physically on site is invisible to everyone who looks at SAP."}, {"title": "Stage 3 — Quality Hand-off, Rejection and Return", "text": "Where material needs inspection, Quality or the concerned department decides whether it is accepted; Store does not make that decision. Rejections, shortages and damage are coordinated with Quality and Purchase and may lead to a return or replacement.", "nodes": [{"t": "Received", "s": "awaiting inspection", "dec": false, "hl": false}, {"t": "Inspected", "s": "by Quality", "dec": false, "hl": false}, {"t": "Accepted?", "s": "quality decision", "dec": true, "hl": false}, {"t": "Held or rejected", "s": "return with Purchase", "dec": false, "hl": true}, {"t": "Replaced or closed", "s": "SAP reference", "dec": false, "hl": false}], "note": "Store, Quality, Purchase and Finance each own a part of this. The hand-offs between them are not visible in one place."}, {"title": "Stage 4 — Location-wise Storage and Issue", "text": "Material is held across project, site and plant locations and issued against the relevant requirement or reservation. Issues are posted in SAP.", "nodes": [{"t": "Stored", "s": "by location", "dec": false, "hl": false}, {"t": "Issue request", "s": "against reservation", "dec": false, "hl": false}, {"t": "Issued", "s": "to work front or contractor", "dec": false, "hl": false}, {"t": "Acknowledged", "s": "by the receiver", "dec": false, "hl": true}, {"t": "Posted in SAP", "s": "issue", "dec": false, "hl": false}], "note": "On multi-location projects, a clean view of what is physically where is hard to get without confusing it with SAP's valued stock."}, {"title": "Stage 5 — Bulk Material and Plant Production", "text": "Aggregate, cement in silos, bitumen in tanks and inputs and output at ready-mix and other plants need daily physical records of receipt, consumption, production and closing balance, alongside the stock movements in SAP.", "nodes": [{"t": "Opening balance", "s": "silo, tank, stockpile", "dec": false, "hl": false}, {"t": "Received", "s": "measured", "dec": false, "hl": false}, {"t": "Consumed or produced", "s": "at the plant", "dec": false, "hl": false}, {"t": "Closing balance", "s": "physical reading", "dec": false, "hl": true}], "note": "This data is collected by hand each day and does not reach a dashboard in time to act on."}, {"title": "Stage 6 — Diesel, Small Tools and Spares", "text": "Store issues diesel against reservations or approved use, and handles small tools, equipment spares, PPE and other store items — their issue and return, damage, shelf-life, warranty and serial numbers. Large vehicle and equipment hire and maintenance belong to Plant and Machinery.", "nodes": [{"t": "Diesel request", "s": "equipment or purpose", "dec": false, "hl": false}, {"t": "Meter or dip reading", "s": "before and after", "dec": false, "hl": true}, {"t": "Tool issued", "s": "to a custodian", "dec": false, "hl": false}, {"t": "Returned or replaced", "s": "condition recorded", "dec": false, "hl": true}], "note": "Who holds which tool, and which items are near expiry or out of warranty, is not recorded in any structured way today."}, {"title": "Stage 7 — Inter-site Transfer", "text": "Where another project or site has the material, it is transferred rather than bought again. Transfers are posted in SAP.", "nodes": [{"t": "Surplus found", "s": "at another site", "dec": false, "hl": true}, {"t": "Transfer approved", "s": "source and destination", "dec": false, "hl": false}, {"t": "Dispatched", "s": "transfer in SAP", "dec": false, "hl": false}, {"t": "Received", "s": "acknowledged", "dec": false, "hl": false}], "note": "Surplus is found by asking around. A saving from a transfer should be confirmed by the business, not assumed by the system."}, {"title": "Stage 8 — Non-moving Stock and Scrap", "text": "Stock that has not moved for more than forty-five days was mentioned as the threshold for attention. Each item needs a decision — consume, transfer, return, repair, sell or scrap — and scrap needs approval and a disposal record.", "nodes": [{"t": "Ageing", "s": "over 45 days", "dec": false, "hl": false}, {"t": "Owner assigned", "s": "project or store", "dec": false, "hl": true}, {"t": "Action decided", "s": "use, move, return, scrap", "dec": false, "hl": false}, {"t": "Outcome recorded", "s": "with SAP reference", "dec": false, "hl": false}], "note": "Non-moving stock is reported, but a report does not assign an owner or record what was decided."}, {"title": "Stage 9 — Reconciliation and Reporting", "text": "Store prepares daily, weekly and monthly reports on receipt, stock and production, reconciles physical and project records with SAP, and tracks delays between physical events and SAP entries. Today this means running several SAP reports, exporting them and merging them with site sheets in Excel.", "nodes": [{"t": "SAP reports run", "s": "several T-codes", "dec": false, "hl": false}, {"t": "Exported and merged", "s": "with site sheets", "dec": false, "hl": true}, {"t": "Variance explained", "s": "physical against book", "dec": false, "hl": false}, {"t": "Reports issued", "s": "daily to monthly", "dec": false, "hl": false}], "note": "The same consolidation is repeated for every report, and material-group mapping is redone by copy and paste."}], "extra": {"title": "What SAP records and what the platform records", "heads": ["Event", "Recorded in SAP", "Recorded in the platform"], "rows": [["Requirement", "PR, PO, release and approval", "Follow-up status and ageing of open documents"], ["Receipt", "GRN and inward posting", "Vehicle, count or weighment, condition, documents, receiver, and the GRN reference once posted"], ["Inspection", "—", "Hand-off to Quality, status and outcome"], ["Issue", "Issue against reservation", "Recipient, work front, acknowledgement, and the SAP issue reference"], ["Transfer", "Stock transfer", "Request, approval, dispatch and receipt acknowledgement"], ["Bulk and plant", "Stock movements", "Daily physical balances, readings and production"], ["Diesel", "Issue", "Meter or dip reading, equipment, receiver"], ["Stock", "Book quantity and value", "Physical quantity by location, clearly labelled as physical"], ["Scrap", "Disposal transaction where required", "Register, approval and outcome"]]}, "workflows": [["1", "Requirement and PR follow-up", "Site or store need", "Site, Store, Purchase", "Requirement checked against stock here and elsewhere, PR raised in SAP, and its status followed"], ["2", "Local purchase", "Urgent or small need within limits", "Store, approver", "A local purchase within approved limits, recorded with its reference"], ["3", "Physical receipt and unloading", "Vehicle arrives", "Store, supplier", "Vehicle, supplier, material, quantity, location, time and documents recorded"], ["4", "Receipt verification", "Material unloaded", "Store", "Count or weighment, document and condition check, with photographs"], ["5", "SAP receipt link", "Receipt verified", "Store", "The GRN reference linked to the physical receipt, with the delay between them tracked"], ["6", "Inspection request", "Material needing inspection received", "Store, Quality", "An inspection request with status, and material held until the decision"], ["7", "Rejection, shortage and return", "Failed inspection, short or damaged delivery", "Store, Quality, Purchase, supplier", "A case with reason, evidence, owner, return or replacement status and SAP reference"], ["8", "Storage by location", "Material accepted", "Store", "Material placed and recorded by project, plant, site and location"], ["9", "Issue against reservation", "Issue request", "Store, site, contractor", "Issue with recipient, work front, purpose, acknowledgement and SAP issue reference"], ["10", "Bulk material register", "Daily", "Store, plant", "Opening, receipt, issue, consumption and closing balance for each silo, tank and stockpile"], ["11", "Plant input and production", "Daily", "Plant, Store", "Inputs consumed and output produced at each plant"], ["12", "Diesel issue", "Equipment or approved use", "Store, operator", "Diesel issued with reading, equipment, receiver and SAP reference"], ["13", "Small tools and spares custody", "Issue or return", "Store, custodian, P&M", "Item, serial, custodian, condition, repair hand-off and return"], ["14", "Warranty and shelf-life", "Item received, or date approaching", "Store, Purchase, P&M", "Warranty, serial and expiry recorded, with reminders and claims"], ["15", "Inter-site transfer", "Surplus matches a need", "Store at both sites, approvers", "Request, approval, dispatch, receipt and SAP transfer reference"], ["16", "Non-moving stock review", "Stock passes the ageing threshold", "Store, project owner", "An owner, a decision and an outcome for each non-moving item"], ["17", "Scrap", "Material declared scrap", "Store, approver, Finance", "Scrap recorded, approved and disposed, with sale or disposal reference"], ["18", "Physical verification and reconciliation", "Scheduled count or month end", "Store, Finance", "Opening, SAP movements, physical adjustments, closing and unexplained variance"], ["19", "Open document follow-up", "PR, PO or reservation open beyond a limit", "Store, Purchase, site", "A follow-up task with owner, until the document is closed in SAP"], ["20", "Store reporting", "Daily, weekly, monthly", "Store, management", "Receipt, issue, stock, bulk, production, diesel, ageing and reconciliation reports in approved formats"]], "dashboards": [["1", "Stock position", "Quantity by project, plant, site, location and material group", "sap"], ["2", "Physical against book", "Physical quantity by location beside SAP book quantity, with variance", "cap"], ["3", "Receipts", "Material received today, this week and this month", "sap"], ["4", "Awaiting SAP entry", "Physical receipts, issues and transfers not yet posted, with owner and reason", "cap"], ["5", "Posting delay", "Days between physical event and SAP posting, by site and team", "cap"], ["6", "Issues", "Material issued by project, work front and contractor", "sap"], ["7", "Bulk material balance", "Silo, tank and stockpile balances by day", "cap"], ["8", "Plant production", "Inputs and output by plant and day", "cap"], ["9", "Diesel", "Diesel issued by equipment, site and day, with readings", "cap"], ["10", "Inspection and returns", "Material awaiting inspection, held, rejected and returned", "cap"], ["11", "Open documents", "Open PRs, POs and reservations by age and owner", "sap"], ["12", "Non-moving stock", "Stock by ageing bucket, with owner and decision", "sap"], ["13", "Surplus and transfer", "Surplus at one site matching a need at another, and transfers proposed", "cap"], ["14", "Transfers in transit", "Transfers dispatched and not yet received", "sap"], ["15", "Scrap", "Scrap by site and material, approved and disposed", "cap"], ["16", "Tools and custody", "Small tools and spares by custodian, overdue returns and repairs", "cap"], ["17", "Warranty and shelf-life", "Items nearing expiry or end of warranty", "cap"], ["18", "Store MIS", "Daily, weekly and monthly management reports in the approved formats", "now"]], "obs": "We note that most of the delays in this department happen at hand-offs — from site to Store, from Store to Quality, from Quality to Purchase, from Store to SAP. A shared status on each receipt does more than any single screen.", "interactions": [["Site and Planning", "Requirements and reservations", "Issued material, stock availability", "Requests and site sheets."], ["Purchase", "POs, supplier details", "Receipts, shortages, rejections, returns", "PR and PO in SAP; follow-ups by phone."], ["Quality", "Inspection decisions", "Inspection requests, held material", "Separate records."], ["Plant and Machinery", "Spares needs, repairs", "Diesel, spares, small tools", "Large equipment owned by P&M."], ["Finance", "Valuation, invoice matching", "GRN support, reconciliation, scrap records", "SAP."], ["Billing", "Subcontractor material consumption questions", "Material issued to each subcontractor", "Extracted on request."], ["Safety", "PPE and signboard requirements", "PPE issue, weekly store inspection", "Issue in SAP; custody not recorded."], ["Admin", "Stationery and uniforms", "Issue of admin items", "Through Purchase and SAP."], ["Project Closure", "Closure dates", "Material reconciliation, inventory transfer and scrap lists", "Demobilisation sheets."], ["Suppliers and contractors", "Deliveries, returns", "Receipts, issues, acknowledgements", "Challans and paper."], ["Management", "Direction", "Daily, weekly and monthly reports", "Merged from SAP and Excel."]], "profile": [["Team size", "Not recorded", "Raised in Section 8, with the number of stores and locations."], ["Locations", "Projects, plants, sites and storage locations", "Every record carries its location; views roll up by project and plant."], ["SAP use", "Core transactions and most stock reports", "SAP stays the system of record; the platform reads from it on a schedule and never posts."], ["Physical work", "At the gate, the store and the plant", "Receipts, readings and issues are captured on mobile where they happen."], ["Ageing threshold", "More than 45 days, as mentioned", "Configurable ageing buckets, confirmed with the department."]], "tools": [["SAP", "PR, PO, GRN, issue, transfer, stock and standard and custom reports", "Retained and unchanged. Approved reports read on a schedule, read-only."], ["Excel", "Merging SAP reports with site data; daily, weekly and monthly reports", "Replaced by reconciled dashboards and reports in the approved formats."], ["Site sheets and registers", "Bulk material, production, diesel, receipts", "Replaced by daily physical registers on mobile."], ["Challans and invoices", "Receipt evidence", "Retained, scanned and attached to the receipt record."]], "pains": [["1", "Physical events and SAP entries happen at different times", "Material on site is invisible until it is posted.", "A physical receipt record linked to its SAP posting, with the gap shown."], ["2", "Several SAP reports are exported and merged by hand", "Every report is rebuilt from scratch.", "Scheduled read-only extraction and ready-made reconciled reports."], ["3", "Multi-location stock is hard to see cleanly", "Physical and valued stock get confused.", "Physical stock by location, clearly separated from SAP book stock."], ["4", "Bulk material, production and diesel data are collected by hand", "Daily figures arrive too late to act on.", "Daily mobile registers feeding a live dashboard."], ["5", "Material-group mapping is redone for each report", "Groupings differ between reports.", "One configurable mapping used everywhere."], ["6", "Non-moving stock is reported but not acted on", "Money stays locked in stock nobody owns.", "An owner, a decision and an outcome for each item."], ["7", "Surplus at other sites is found by asking", "Material is bought that already exists elsewhere.", "Surplus shown against new requirements before a PR is raised."], ["8", "Scrap is not tracked to disposal", "Scrap sits unrecorded or is disposed without trace.", "A scrap register with approval and disposal reference."], ["9", "Tools and spares custody is not recorded", "Tools go missing without a name against them.", "Custody by person with overdue returns flagged."], ["10", "Shelf-life, warranty and serial numbers are not held", "Expired items are issued and claims are missed.", "A warranty and expiry register with reminders."], ["11", "Hand-offs to Quality, Purchase and Finance are not visible", "A rejected delivery can sit between departments.", "A shared status on each receipt from arrival to closure."], ["12", "Open PRs, POs and reservations stay open", "Old documents distort what is due.", "Ageing and follow-up tasks until closed in SAP."], ["13", "Diesel is issued without a structured reading", "Consumption per equipment cannot be checked.", "Meter or dip readings recorded with each issue."], ["14", "Physical and SAP stock are reconciled in Excel", "Variance is explained late, if at all.", "A reconciliation workspace with unexplained variance flagged."], ["15", "Issues are not acknowledged by the receiver", "Disputes over what was received cannot be settled.", "Receiver acknowledgement on every issue."], ["16", "Transfer savings are claimed without checking", "Reported savings may not be real.", "Transfer opportunities flagged; savings confirmed by the business."]], "scope": [["1", "Store workspace", "Projects, plants, sites, stores and locations; authorised users; material groups and SAP references", "Each store set up once, mapped to SAP."], ["2", "Physical receipt", "Vehicle, supplier, material, quantity, location, time; count or weighment; condition; challan and invoice attached; receiver", "Every delivery recorded the moment it arrives."], ["3", "SAP link and exception queue", "Physical event linked to GRN, issue or transfer reference; awaiting-posting, mismatch and missing-document queue; ageing and owner", "No gap between site and SAP goes unseen."], ["4", "Inspection hand-off", "Inspection request to Quality; received, awaiting inspection, accepted, held, rejected, posted and closed states", "Quality decisions visible to Store and Purchase."], ["5", "Rejection and returns", "Shortage, damage and rejection cases; reason, evidence, owner; return or replacement status; SAP reference", "Every rejected delivery followed to closure."], ["6", "Issue and acknowledgement", "Issue request against reservation; recipient, work front and contractor; acknowledgement; SAP issue reference", "Proof of what was issued, to whom."], ["7", "Bulk material registers", "Aggregate, silo, tank and stockpile registers; configurable units and methods; daily opening, receipt, issue and closing", "Bulk balances known every day."], ["8", "Plant production", "Plant inputs and output by day; link to bulk registers", "Production and consumption on one record."], ["9", "Diesel", "Request, issue, meter or dip reading, equipment or purpose, receiver, SAP reference", "Diesel consumption per equipment, checkable."], ["10", "Tools, spares and custody", "Item and serial; custodian; issue and return; condition; repair hand-off to P&M; replacement", "Every tool has a name against it."], ["11", "Warranty and shelf-life", "Warranty, serial and expiry per item; reminders; claim and renewal tasks", "No expired item issued, no claim missed."], ["12", "Stock and location view", "SAP quantity by project, plant, location and group; physical quantity by location, labelled separately; source and time on every figure", "One stock view, with the book and the shelf side by side."], ["13", "Inter-site transfer", "Surplus register; match to new requirements; request, approval, dispatch and receipt; SAP transfer reference", "Existing material used before new material is bought."], ["14", "Non-moving stock", "Configurable ageing buckets; owner; decision — consume, transfer, return, repair, sell, scrap or retain; outcome", "Non-moving stock turned into decisions."], ["15", "Scrap", "Scrap register by location and material; approval; disposal or sale reference; SAP reference where required", "Scrap accounted for from declaration to disposal."], ["16", "Reconciliation workspace", "Opening, SAP receipts, SAP issues, transfers, physical adjustments, closing; unexplained variance; open PR, PO and reservation follow-up", "Physical and SAP stock reconciled without Excel."], ["17", "Dashboards and reports", "The eighteen dashboards of Section 3; daily, weekly and monthly reports in the approved formats; filters and export", "Reports that no longer need rebuilding."], ["18", "SAP extraction, roles and audit", "Scheduled read-only extraction of approved SAP reports; material-group mapping; site and HO roles; audit trail", "SAP stays the source of truth, and every figure can be traced to it."]], "open": ["That the nine-stage process set out in Section 1 reflects how Store operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The size of the Store team, and the number of stores, plants and storage locations it covers.", "The SAP reports and T-codes used today, and whether a scheduled read-only extraction of them is acceptable.", "The daily, weekly and monthly report formats currently in use, so they can be reproduced rather than redesigned.", "The material groups and how they map to SAP material codes.", "The limits and approval for local purchases.", "Which materials need Quality inspection before use, and who records the decision.", "How bulk material is measured at each silo, tank and stockpile, and which plants report production.", "How diesel is measured at issue, and what reference each issue is made against.", "Where the line sits between Store and Plant and Machinery for tools, spares and equipment.", "Which items carry shelf-life, warranty or serial numbers that should be tracked.", "The ageing threshold for non-moving stock, confirmed as forty-five days or otherwise, and who decides the action.", "The approval route for scrap, and how disposal is recorded.", "How often physical verification is carried out, and who signs off variances.", "How transfer savings should be confirmed before they are reported.", "The SAP boundary, confirmed with the SAP owner, including the tables and fields the platform should read.", "Whether current site registers and Excel reports should be migrated at go-live."], "sap": {"1": ["Plants; storage locations; material groups", "MM", "Read"], "2": ["PO against which material arrives", "MM", "Read"], "3": ["GRN (MIGO), goods issue and transfer postings", "MM", "Read"], "5": ["Return deliveries and credit references", "MM", "Read"], "6": ["Reservations and goods issue documents", "MM", "Read"], "9": ["Diesel goods issues", "MM", "Read"], "12": ["Stock by plant, location and material group", "MM", "Read"], "13": ["Stock transfer documents", "MM", "Read"], "14": ["Stock ageing by material", "MM", "Read"], "15": ["Scrap movements", "MM", "Read"], "16": ["Receipts, issues, transfers; open PR, PO and reservations", "MM", "Read"]}}, "pm": {"key": "pm", "name": "Plant & Machinery", "intro": ["Plant and Machinery manages every piece of construction equipment PIL uses, owned or hired, from the moment a project needs it to the day it is returned, sold or retired. It plans equipment with each project, allocates machines from the fleet or hires them, and then follows each one through daily operation, fuel, preventive maintenance, breakdowns, spares and external service, insurance and documents, and cost.", "SAP holds the formal side — the asset master, purchase orders, spares, service entries and cost postings. The operational side — where a machine is today, whether it worked or stood idle, how much fuel it used, when its service is due, why a hire was approved — is compiled by hand from site inputs and several SAP reports. The work runs through nine stages."], "insight": "The decision after planning shapes the cost of every project: can the machine come from PIL's own fleet or another site, or does it have to be hired? Answering it needs a live view of what is deployed, what is idle and what is about to be released. Once a machine is on site, stages six to eight repeat every day for as long as it is there, and they decide whether the machine earns its cost.", "flowcap": "Master flow — nine stages from equipment planning to lifecycle and cost", "flow": [{"t": "1. Equipment Planning", "s": "by project and milestone", "dec": false, "hl": false}, {"t": "2. Fleet and Availability", "s": "owned and hired", "dec": false, "hl": false}, {"t": "In own fleet?", "s": "available on time", "dec": true, "hl": false}, {"t": "3. Allocation or Transfer", "s": "from fleet or another site", "dec": false, "hl": true}, {"t": "4. Hire", "s": "quotations, approval, PO", "dec": false, "hl": true}, {"t": "5. Mobilisation", "s": "deploy, extend, return", "dec": false, "hl": false}, {"t": "6. Daily Operation", "s": "status, readings, idle", "dec": false, "hl": true}, {"t": "7. Fuel Control", "s": "against expected use", "dec": false, "hl": false}, {"t": "8. Maintenance", "s": "preventive and breakdown", "dec": false, "hl": false}, {"t": "9. Lifecycle and Cost", "s": "insurance, disposal, reports", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Project Equipment Planning", "text": "After award, P&M works with Planning and the project team to set the equipment the project needs by period and milestone — type, quantity and expected use — against the fleet available, the progress planned and the budget.", "nodes": [{"t": "Project awarded", "s": "programme and milestones", "dec": false, "hl": false}, {"t": "Equipment need", "s": "type, quantity, period", "dec": false, "hl": false}, {"t": "Budget checked", "s": "by milestone", "dec": false, "hl": false}, {"t": "Demand plan", "s": "agreed with Planning", "dec": false, "hl": true}], "note": "When a project needs equipment beyond its plan or budget, the reason, the approval and the cost impact are not recorded together."}, {"title": "Stage 2 — Fleet Register and Availability", "text": "Equipment is viewed by project, plant or work centre or camp, equipment class and individual asset. Work centres and functional locations identify where a machine is physically deployed. Owned and hired equipment are both tracked.", "nodes": [{"t": "Company", "s": "group entity", "dec": false, "hl": false}, {"t": "Project", "s": "and milestone", "dec": false, "hl": false}, {"t": "Work centre", "s": "plant or camp", "dec": false, "hl": false}, {"t": "Class", "s": "equipment type", "dec": false, "hl": false}, {"t": "Asset", "s": "SAP asset reference", "dec": false, "hl": true}], "note": "The asset master stays in SAP. What is missing is the operational layer on top of it — where the machine is, what state it is in, and when it will be free."}, {"title": "Stage 3 — Allocation and Transfer", "text": "Where the fleet has the equipment, it is allocated to the project and work centre for a planned duration, or transferred from another site that is releasing it.", "nodes": [{"t": "Request", "s": "from project", "dec": false, "hl": false}, {"t": "Availability checked", "s": "idle and releasing", "dec": false, "hl": true}, {"t": "In own fleet?", "s": "on time", "dec": true, "hl": false}, {"t": "Allocated", "s": "with planned duration", "dec": false, "hl": false}], "note": "Allocation is worked out from reports rather than a single live view, so a machine idle at one site may be hired at another."}, {"title": "Stage 4 — Equipment Hire", "text": "Where the fleet cannot supply, the site raises a hire requirement. Quotations and rates are obtained and compared, approvals given, and the formal purchase order raised in SAP. The steps before the PO are manual today.", "nodes": [{"t": "Hire request", "s": "need and duration", "dec": false, "hl": false}, {"t": "Quotations", "s": "rates compared", "dec": false, "hl": true}, {"t": "Approval", "s": "recommended vendor", "dec": false, "hl": true}, {"t": "PO in SAP", "s": "formal commercial step", "dec": false, "hl": false}], "note": "Highlighted steps leave no structured trail today. Why a vendor was chosen, and who approved the rate, is held in email and paper."}, {"title": "Stage 5 — Mobilisation, Extension and Return", "text": "Allocated or hired equipment is mobilised to site and accepted there. Extensions, idle equipment, surplus, return, transfer and release each need a reason and an approval.", "nodes": [{"t": "Mobilised", "s": "to site", "dec": false, "hl": false}, {"t": "Accepted", "s": "deployed", "dec": false, "hl": false}, {"t": "Still needed?", "s": "at planned end", "dec": true, "hl": false}, {"t": "Returned or moved", "s": "release recorded", "dec": false, "hl": true}], "note": "An extension or a late return on hired equipment costs money every day. Today it is noticed when the bill arrives."}, {"title": "Stage 6 — Daily Operation and Utilisation", "text": "Site records each machine's working, idle or breakdown status, hours, kilometres or meter readings, the activity it worked on and where. The department wants utilisation by project, class and asset, not only a monthly total.", "nodes": [{"t": "Start reading", "s": "hours or kilometres", "dec": false, "hl": false}, {"t": "Activity", "s": "work front", "dec": false, "hl": false}, {"t": "Status", "s": "working, idle, breakdown", "dec": false, "hl": true}, {"t": "End reading", "s": "validated", "dec": false, "hl": false}], "note": "Idle time without a reason cannot be acted on. Readings that go backwards or repeat need to be caught when they are entered."}, {"title": "Stage 7 — Fuel Control", "text": "Fuel consumption is captured by machine, site, class and project and compared with the expected level. The department asked for an alert when deviation crosses the approved threshold, and for each deviation to be investigated with its context — load, terrain, site conditions and the machine's maintenance state.", "nodes": [{"t": "Fuel issued", "s": "with meter reading", "dec": false, "hl": false}, {"t": "Consumption", "s": "per hour or km", "dec": false, "hl": false}, {"t": "Within range?", "s": "for the class", "dec": true, "hl": false}, {"t": "Investigated", "s": "cause and action", "dec": false, "hl": true}], "note": "Diesel is issued by Store. P&M needs the same issue linked to the machine's reading to judge consumption."}, {"title": "Stage 8 — Maintenance and Repair", "text": "Preventive service falls due by calendar, hours or kilometres. Breakdowns are repaired using spares, external service and labour. Spares and services are procured and received in SAP; the maintenance job itself — symptom, diagnosis, work done, downtime, cost — is tracked outside it.", "nodes": [{"t": "Service due", "s": "or breakdown", "dec": false, "hl": true}, {"t": "Work order", "s": "diagnosis and priority", "dec": false, "hl": false}, {"t": "Spares and service", "s": "PR, PO, GRN in SAP", "dec": false, "hl": false}, {"t": "Repaired", "s": "downtime recorded", "dec": false, "hl": false}, {"t": "Back in service", "s": "approved", "dec": false, "hl": false}], "note": "A missed service is found after the breakdown it causes. Alerts before the due date are what the department asked for."}, {"title": "Stage 9 — Lifecycle, Insurance, Cost and Reporting", "text": "Each asset carries its age, condition, documents and fitness, purchase and depreciation reference, insurance with renewals and claims, additions made after purchase, and eventually its disposal, sale or retirement. Costs are tracked by equipment, project and class and by maintenance, fuel, external service and hire, against the budget, with alerts when it is about to run out.", "nodes": [{"t": "Documents", "s": "fitness, insurance", "dec": false, "hl": false}, {"t": "Renewals and claims", "s": "due dates", "dec": false, "hl": true}, {"t": "Cost breakdown", "s": "fuel, repair, hire", "dec": false, "hl": false}, {"t": "Budget check", "s": "exhaustion alerts", "dec": false, "hl": false}, {"t": "Disposal", "s": "sale or retirement", "dec": false, "hl": false}], "note": "Management reports are assembled from several sources whose timing differs, which makes the figures hard to interpret."}], "extra": {"title": "Equipment states", "heads": ["Group", "States", "Set by"], "rows": [["Planning", "Planned, available, requested, approved", "P&M with Planning and the project"], ["Deployment", "Mobilising, deployed", "P&M and site on acceptance"], ["Operation", "Working, idle", "Site daily log"], ["Maintenance", "Under maintenance, breakdown", "Maintenance work order"], ["Release", "Demobilising, returned", "P&M on release"], ["End of life", "Sold or disposed, inactive", "Approved disposal, with SAP action"]]}, "workflows": [["1", "Equipment demand plan", "Project awarded, or programme revised", "P&M, Planning, project head", "Equipment need by project, milestone, period, class and quantity, with budget reference"], ["2", "Fleet register", "Asset acquired, hired or changed", "P&M", "Each machine with SAP asset reference, class, owned or hired, location, state and owner"], ["3", "Availability check", "Equipment request", "P&M", "Current allocation, expected release, idle and surplus machines, and the gap to fill"], ["4", "Allocation and transfer", "Machine available in the fleet", "P&M, releasing and receiving sites", "Machine allocated or transferred with planned duration and approval"], ["5", "Hire request and quotations", "Machine not available in time", "Site, P&M", "A hire request with need, duration, quotations and rate comparison"], ["6", "Hire approval and PO link", "Vendor recommended", "P&M, approvers, Purchase", "Approved hire with vendor and terms, and the SAP PO reference once raised"], ["7", "Mobilisation and acceptance", "Allocation or hire approved", "P&M, site", "Machine moved, received at site and marked deployed"], ["8", "Extension, return and release", "Planned end date, or machine no longer needed", "Site, P&M, approver", "Extension approved with reason, or machine returned, transferred or released"], ["9", "Plan exception", "Demand, duration or cost beyond the approved plan", "Project head, P&M, approver", "Justification, approval, cost impact and follow-up recorded"], ["10", "Daily equipment log", "Each working day", "Operator or site user", "Status, activity, start and end readings, location and attachments per machine"], ["11", "Idle and breakdown reasons", "Machine not working", "Site", "A reason code for every idle, standby, relocation, repair or breakdown period"], ["12", "Reading validation", "Reading entered", "Site, P&M", "Impossible, duplicate or out-of-order readings flagged; corrections keep the original"], ["13", "Fuel log", "Fuel issued", "Store, operator, P&M", "Fuel by machine with quantity, meter reading, hours or kilometres and receiver"], ["14", "Fuel deviation investigation", "Consumption outside the expected range", "P&M, site", "Variance, context, cause, corrective action and verified closure"], ["15", "Preventive maintenance", "Service due by date, hours or kilometres", "P&M, workshop", "Service scheduled, alerted before due, completed and recorded"], ["16", "Breakdown and repair", "Machine breaks down", "Site, P&M, technician or vendor", "Work order with failure, downtime, diagnosis, work done, cause, return-to-service approval"], ["17", "Spares and external service", "Work order needs parts or service", "P&M, Store, Purchase", "Request handed to SAP, and the PR, PO, GRN or service entry linked back to the job"], ["18", "Insurance and documents", "Acquisition, renewal due, or claim", "P&M, Insurance, Finance", "Insurance, fitness and other documents held with due dates, renewals and claims"], ["19", "Disposal and retirement", "Machine uneconomic or surplus", "P&M, management, Finance", "Disposal proposal, approval and outcome, with the SAP action referenced"], ["20", "Cost and utilisation reporting", "Daily, weekly, monthly", "P&M, management", "Utilisation, availability and cost by asset, class and project, against budget"]], "dashboards": [["1", "Fleet position", "Owned and hired machines by project, class and state", "sap"], ["2", "Availability board", "Allocated, idle, releasing soon and capacity gaps against demand", "cap"], ["3", "Demand against allocation", "Equipment planned by milestone against equipment deployed", "cap"], ["4", "Utilisation", "Working hours against available hours by asset, class and project", "cap"], ["5", "Idle equipment", "Idle machines and hours with reasons", "cap"], ["6", "Deployment against plan", "Extensions, overdue returns and machines past their planned end", "cap"], ["7", "Breakdowns and downtime", "Breakdowns by class and cause, hours lost and repeat failures", "cap"], ["8", "Preventive maintenance", "Services due, overdue and completed", "cap"], ["9", "Maintenance backlog", "Open work orders by age, waiting for spares or service", "cap"], ["10", "Fuel consumption", "Fuel per hour or kilometre by machine and class, against the expected range", "cap"], ["11", "Fuel deviations", "Deviations open, explained and closed", "cap"], ["12", "Hired equipment", "Hired machines by project and class, with rates, durations and utilisation", "cap"], ["13", "Hire approvals", "Hire requests by stage, from request to PO", "cap"], ["14", "Maintenance cost", "Spares, external service and labour by asset, class and project", "sap"], ["15", "Equipment cost breakdown", "Fuel, maintenance, external service and hire by project", "sap"], ["16", "Budget and exceptions", "Equipment budget against cost by milestone, near-exhaustion alerts and approved exceptions", "sap"], ["17", "Insurance and documents", "Insurance, fitness and other documents expiring, and claims open", "cap"], ["18", "P&M MIS", "Daily, weekly and monthly management reports in the approved formats", "now"]], "obs": "We note that the same diesel issue is recorded by Store for stock and needed by P&M for consumption, and the same spares are received by Store and consumed by a P&M work order. Linking those records once removes a large part of the manual reconciliation both departments do today.", "interactions": [["Planning", "Programme, milestones, progress", "Equipment plan and availability", "Agreed per project."], ["Project and site", "Equipment requests, daily logs, breakdown reports", "Machines, operators, maintenance", "Site formats and phone."], ["Store", "Diesel issue, spares, small tools", "Consumption against machines, repair hand-offs", "Separate records."], ["Purchase", "Hire POs, spares and service POs", "Hire requests, quotations, approvals", "PO in SAP; pre-PO steps manual."], ["Finance", "Cost postings, depreciation, asset values", "Operational cost explanation, disposals", "SAP."], ["Billing", "Hire bills for checking", "Deployment and utilisation for hired machines", "Checked against site records."], ["Insurance", "Policies and claim progress", "Asset details, incident facts", "By file."], ["Safety", "Lifting and equipment checks, operator requirements", "Equipment fitness and documents", "Separate checklists."], ["Project Closure", "Closure dates", "Machinery transferred, hired equipment returned, RTO and insurance documents", "Demobilisation sheets."], ["Vendors and hirers", "Quotations, machines, service", "Orders, extensions, returns", "Email and paper."], ["Management", "Approvals for hire, extensions, exceptions, disposals", "Utilisation, cost and availability reports", "Compiled from several reports."]], "profile": [["Team size", "Not recorded", "Raised in Section 8, with the size of the owned and hired fleet."], ["Fleet", "Owned and hired equipment", "Both follow the same states; hired machines also carry vendor, rate and duration."], ["Hierarchy", "Project, work centre or camp, class, asset", "Every record sits in the hierarchy and rolls up by it."], ["Where work happens", "At site and in workshops", "Daily logs, readings and breakdown reports captured on mobile."], ["SAP use", "Asset master, procurement, spares, service entries, cost", "SAP stays the system of record; the platform reads from it and does not post."]], "tools": [["SAP", "Asset master, PR and PO, spares, service entries, WBS cost, depreciation", "Retained and unchanged. Read-only extraction with source and time shown; any write-back only if separately approved."], ["Site formats", "Daily logs, readings, fuel, breakdowns", "Replaced by mobile logs with validation."], ["Excel", "Consolidating SAP reports and site data into management reports", "Replaced by dashboards and reports in the approved formats."], ["Email and paper", "Hire quotations, approvals, insurance documents", "Replaced by hire workflow and a document register."]], "pains": [["1", "Records and reports are spread across SAP, site inputs and manual consolidation", "No single figure can be trusted without checking its source.", "One platform reading SAP and site records, with source and time on every figure."], ["2", "Requirement, availability, allocation and return are not in one workflow", "Machines are hired while others stand idle.", "An availability board and allocation workflow by project and milestone."], ["3", "Equipment beyond plan or budget lacks a clear trail", "Cost overruns cannot be traced to a decision.", "Plan exceptions with reason, approver and cost impact."], ["4", "Daily status, idle time and readings are not visible live", "Utilisation is known only at month end.", "Mobile daily logs feeding a live utilisation view."], ["5", "Idle time has no recorded reason", "Idle cost cannot be attributed or reduced.", "Configurable reason codes for every idle and standby period."], ["6", "Readings can be wrong or missing", "Utilisation and fuel figures become unreliable.", "Validation on entry, with corrections that keep the original."], ["7", "Preventive maintenance is not alerted in advance", "Missed services lead to breakdowns.", "Service schedules by date, hours or kilometres with due and overdue alerts."], ["8", "Breakdowns and their impact on availability are reported later", "Lost hours and repeat failures go unanalysed.", "Breakdown work orders with downtime, cause and return-to-service approval."], ["9", "Fuel deviation is a number without context", "Real misuse and genuine hard conditions look the same.", "Alerts on deviation, with an investigation that records load, terrain and maintenance state."], ["10", "Hire quotations and approvals before the PO are manual", "The choice of vendor and rate cannot be audited.", "A hire workflow from request and quotes to approval, linked to the SAP PO."], ["11", "Hired machine extensions and returns are not tracked", "Hire charges run on after the need has ended.", "Planned end dates with alerts, and extensions only with approval."], ["12", "Cost by equipment, project and class needs manual work", "The cost of a machine cannot be compared with what it produced.", "Cost breakdown from SAP linked to utilisation by asset."], ["13", "Budget exhaustion is noticed late", "Additional approvals come after the money is spent.", "Budget alerts by project and milestone."], ["14", "Insurance, renewals, claims and documents are not organised", "A lapsed policy or document stops a machine or exposes the company.", "A lifecycle register with renewal and claim tracking."], ["15", "Spares and service are not linked to the job that used them", "Maintenance cost per machine is guesswork.", "Work orders linked to the SAP PR, PO, GRN and service entry."], ["16", "Source timing differences make reports hard to read", "Two reports on the same day can disagree.", "Every figure labelled with source, scope and extraction time."]], "scope": [["1", "Equipment register and hierarchy", "Machine profile with SAP asset reference; class; owned or hired; project, work centre and camp; state; owner; documents; drill-down from company to asset", "One operational record per machine, tied to SAP."], ["2", "Demand planning", "Equipment need by project, milestone, period, class and quantity; expected utilisation; budget reference; Planning inputs", "Equipment planned with the programme, not after it."], ["3", "Availability and allocation", "Availability board; idle, surplus and releasing machines; allocation and inter-site transfer with approval", "The fleet used first, every time."], ["4", "Hire management", "Hire request; quotations and rate comparison; recommended vendor; approvals; SAP PO link; hired deployment, extension and return", "Every hire justified, approved and ended on time."], ["5", "Mobilisation and release", "Mobilisation, site acceptance, planned end date, extension, return, transfer and release with reasons", "Machines in and out with a record of why."], ["6", "Plan exceptions", "Deviation from plan, duration or cost; justification; approver; impact; follow-up", "Overruns tied to decisions."], ["7", "Daily equipment log", "Mobile log of status, activity, start and end readings, location and attachments; idle and breakdown reason codes; offline capture", "What every machine did, every day."], ["8", "Reading validation", "Checks for impossible, duplicate, out-of-order and missing readings; authorised correction with original kept", "Utilisation and fuel figures that can be trusted."], ["9", "Fuel control", "Fuel log linked to Store issue and machine reading; expected range by class and condition; deviation alerts; investigation and closure", "Fuel judged against what it should be."], ["10", "Preventive maintenance", "Schedules by date, hours or kilometres; due and overdue alerts; maintenance calendar; impact on planned allocation", "Services done before breakdowns force them."], ["11", "Breakdown and repair", "Work orders for preventive, corrective, breakdown and inspection; downtime; diagnosis; technician or vendor; cause; return-to-service approval", "Every repair recorded and every lost hour counted."], ["12", "Spares and service hand-off", "Spares and external service requests from the work order; SAP PR, PO, GRN and service entry linked back; Store hand-off", "Maintenance cost per machine, from real transactions."], ["13", "Insurance and documents", "Insurance, fitness and other documents per asset; due dates; renewals; claims and status", "No policy or document lapses unnoticed."], ["14", "Asset lifecycle and disposal", "Age, condition, additions after purchase, purchase and depreciation reference; disposal proposal, approval and outcome with SAP action referenced", "Each machine's life on one record."], ["15", "Cost and budget", "Cost by asset, class and project from SAP; split by fuel, maintenance, external service and hire; budget by milestone; exhaustion alerts", "The cost of each machine set against what it did."], ["16", "Site mobile app", "Daily logs, readings, breakdown reports, fuel and acceptance on mobile; offline sync; photographs", "Site data captured where the machines are."], ["17", "Dashboards and reports", "The eighteen dashboards of Section 3; daily, weekly and monthly reports in approved formats; export", "Management reports without manual consolidation."], ["18", "SAP extraction, roles and audit", "Read-only extraction of approved SAP data with source and time; site, workshop and HO roles; audit trail", "SAP stays the source of truth for cost, value and procurement."]], "open": ["That the nine-stage process set out in Section 1 reflects how Plant and Machinery operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The size and structure of the P&M team at head office, sites and workshops.", "The size of the owned fleet and the typical number of hired machines, by class.", "The equipment classes to be configured, and how work centres, functional locations and camps are set up in SAP.", "What Planning provides for the equipment demand plan, and at what level — project, milestone or activity.", "The approval route for allocation, transfer, hire, extension and plan exceptions, and any value limits.", "How many quotations a hire needs, and how the rate comparison is recorded today.", "Who records daily logs at site, which readings each class uses, and whether any machines carry telematics or GPS.", "The idle, standby and breakdown reason codes in use, if any.", "The expected fuel consumption by class and condition, and the deviation threshold that should raise an alert.", "The preventive maintenance intervals by class, and who approves a machine's return to service.", "Where the line sits between P&M and Store for diesel, spares and small tools, as raised in the Store document, and that head office cars stay with Admin.", "The insurance, fitness and other documents tracked per machine, and who handles claims.", "The approval route for disposal, sale and retirement.", "The daily, weekly and monthly report formats in use, so they can be reproduced.", "The SAP boundary, confirmed with the SAP owner, including the modules, reports and fields the platform should read.", "Whether current fleet lists, logs, maintenance history and insurance records should be migrated at go-live."], "sap": {"1": ["Equipment and asset master (asset code, class, value)", "PM / AA", "Read"], "2": ["Budget reference by project and milestone", "PS / CO", "Read"], "4": ["PO for hired equipment", "MM", "Read"], "9": ["Diesel goods issues by equipment", "MM", "Read"], "12": ["PR, PO, GRN and service entry for spares and repairs", "MM", "Read"], "14": ["Asset acquisition, depreciation and disposal", "AA", "Read"], "15": ["Cost by asset, class and project", "CO / PM", "Read"]}}, "purchase": {"key": "purchase", "name": "Purchase", "intro": ["Purchase turns requirements from sites and projects into material and services on the ground. It reviews each purchase requisition, gathers and compares quotations, takes the purchase through approval to a purchase order, and then follows the supplier until the material is delivered and received. Alongside that it keeps track of approved brands and sources, qualifies new suppliers, handles returns when Quality rejects material, and reports on what has been bought, what is outstanding and what is committed.", "The formal steps are already in SAP — requisitions, release strategy, orders, receipts, invoices and payment. Almost everything between them is done by phone, email and Excel: chasing suppliers, planning deliveries, remembering which local vendor was good, and building reports. The work runs through nine stages."], "insight": "The first three stages are the ones SAP sees. Stage four is where most of the department's day goes: once an order exists, somebody has to confirm it with the supplier, agree when it will arrive, chase it when it does not, and make sure the receipt is posted when it does. Stages five to eight are what make a purchase go right or wrong — delivering at the right pace, from the right source, and dealing properly with what goes back.", "flowcap": "Master flow — nine stages from requisition to management reporting", "flow": [{"t": "1. PR and Triage", "s": "need, priority, clarity", "dec": false, "hl": false}, {"t": "2. RFQ and Quotations", "s": "multiple suppliers", "dec": false, "hl": false}, {"t": "Competitive?", "s": "enough quotations", "dec": true, "hl": false}, {"t": "Special approval", "s": "reason recorded", "dec": false, "hl": true}, {"t": "3. Approval and PO", "s": "release in SAP", "dec": false, "hl": false}, {"t": "4. Supplier Follow-up", "s": "acknowledge, dispatch, GRN", "dec": false, "hl": true}, {"t": "5. Supply Schedule", "s": "with Planning and Store", "dec": false, "hl": false}, {"t": "6. Vendors and Brands", "s": "approved sources", "dec": false, "hl": false}, {"t": "7. Rejection and Return", "s": "with Quality and Store", "dec": false, "hl": false}, {"t": "8. Change and Delay", "s": "reason-coded", "dec": false, "hl": false}, {"t": "9. Redeployment and MIS", "s": "surplus to other projects, reports to management", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Purchase Requisition and Triage", "text": "Site and project users raise requisitions for materials, spares, services and other needs. Purchase reviews each one, checks the material and category, and routes it into the right purchasing process. Many requisitions are marked urgent, which makes the genuinely critical ones hard to pick out.", "nodes": [{"t": "PR raised", "s": "in SAP by site", "dec": false, "hl": false}, {"t": "Reviewed", "s": "material and category", "dec": false, "hl": false}, {"t": "Clarification", "s": "if unclear", "dec": false, "hl": true}, {"t": "Priority set", "s": "by rule, not by label", "dec": false, "hl": true}, {"t": "Assigned", "s": "to a buyer", "dec": false, "hl": false}], "note": "A priority based on the required date, stock cover, lead time and milestone would separate real urgency from habit."}, {"title": "Stage 2 — RFQ, Quotations and Comparison", "text": "Purchase requests quotations, normally from several suppliers, and prepares a comparison. Emergency and single-source cases need a higher or special approval. The comparison follows the authority limits before the order.", "nodes": [{"t": "RFQ issued", "s": "to suppliers", "dec": false, "hl": false}, {"t": "Quotations received", "s": "price, terms, lead time", "dec": false, "hl": false}, {"t": "Comparison", "s": "prepared", "dec": false, "hl": true}, {"t": "Enough?", "s": "quotations", "dec": true, "hl": false}, {"t": "Special approval", "s": "with reason", "dec": false, "hl": false}], "note": "Comparisons are prepared in Excel. Suppliers who were asked but did not respond are not recorded."}, {"title": "Stage 3 — Approval and Purchase Order", "text": "The approved comparison leads to the purchase order, released in SAP through its release strategy. The order carries the supplier, quantity, rate and terms.", "nodes": [{"t": "Comparison approved", "s": "by authority limit", "dec": false, "hl": false}, {"t": "PO created", "s": "in SAP", "dec": false, "hl": false}, {"t": "Released", "s": "SAP release strategy", "dec": false, "hl": false}, {"t": "Sent to supplier", "s": "by email or phone", "dec": false, "hl": true}], "note": "SAP holds the approval of the order. The reasoning that led to it — the comparison, the comments, the choice — is kept outside it."}, {"title": "Stage 4 — Supplier Acknowledgement and Delivery Follow-up", "text": "After the order, Purchase confirms it with the supplier, tracks acknowledgement, the planned delivery, d
