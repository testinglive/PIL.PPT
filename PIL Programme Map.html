ispatch, site receipt and the goods receipt in SAP. This is highly manual, especially across several states, sites and local purchasers.", "nodes": [{"t": "Acknowledged", "s": "by supplier", "dec": false, "hl": true}, {"t": "Delivery planned", "s": "date and location", "dec": false, "hl": false}, {"t": "Dispatched", "s": "vehicle and challan", "dec": false, "hl": true}, {"t": "Received at site", "s": "by Store", "dec": false, "hl": false}, {"t": "GRN in SAP", "s": "posted", "dec": false, "hl": false}], "note": "Every highlighted step is a phone call today. An order nobody has acknowledged looks the same in SAP as one that is on a truck."}, {"title": "Stage 5 — Supply Scheduling with Planning and Store", "text": "For bulk materials, a requisition quantity is not enough. Supply has to be staggered week by week or month by month to match the work planned and the space available at site. Otherwise material arrives too early, attracts detention and storage cost, or becomes excess stock.", "nodes": [{"t": "Planned work", "s": "from Planning", "dec": false, "hl": false}, {"t": "Store capacity", "s": "at site", "dec": false, "hl": false}, {"t": "Staggered schedule", "s": "weekly or monthly", "dec": false, "hl": true}, {"t": "Supplier confirms", "s": "quantity and date", "dec": false, "hl": false}, {"t": "Received against plan", "s": "with deviation", "dec": false, "hl": false}], "note": "The schedule, where there is one, lives in a sheet. Nothing compares what arrived with what was planned."}, {"title": "Stage 6 — Vendor, Brand and Source Approval", "text": "Projects often have approved brands and sources, or specific client and technical requirements. For a new supplier or brand, Purchase gathers market information and arranges technical review, plant visits, and Quality or third-party testing before approval. Knowledge of local vendors is valuable but held by individuals.", "nodes": [{"t": "New source proposed", "s": "or market survey", "dec": false, "hl": false}, {"t": "Plant visit", "s": "and documents", "dec": false, "hl": false}, {"t": "Quality testing", "s": "or third party", "dec": false, "hl": false}, {"t": "Approved", "s": "for material and project", "dec": false, "hl": true}, {"t": "Re-review", "s": "on a date", "dec": false, "hl": false}], "note": "When a buyer moves on, what they knew about a region's suppliers leaves with them."}, {"title": "Stage 7 — Quality Rejection, Return and Replacement", "text": "When material is found defective, Store, Quality and Purchase work together on the test evidence, the supplier communication, the return or replacement and closure. Quality decides acceptance; Purchase handles the supplier.", "nodes": [{"t": "Issue logged", "s": "at receipt or use", "dec": false, "hl": false}, {"t": "Test and evidence", "s": "by Quality", "dec": false, "hl": false}, {"t": "Quality decision", "s": "rejected", "dec": false, "hl": false}, {"t": "Supplier notified", "s": "by Purchase", "dec": false, "hl": true}, {"t": "Return or replace", "s": "SAP reference, closed", "dec": false, "hl": false}], "note": "The same case appears in the Quality and Store documents. Held once, it gives each of the three departments the part it owns."}, {"title": "Stage 8 — Change, Delay and Exceptions", "text": "Scope and design changes, revised requirements, rate changes, storage limits, vendor or payment constraints and unclear demand all delay procurement. Today they are handled by email, and Purchase is left to chase the missing inputs and explain the delay.", "nodes": [{"t": "Change or blocker", "s": "reason coded", "dec": false, "hl": false}, {"t": "Inputs requested", "s": "Planning, Design, site", "dec": false, "hl": true}, {"t": "Impact recorded", "s": "PR, PO, schedule", "dec": false, "hl": false}, {"t": "Resolved", "s": "amend, hold, re-order", "dec": false, "hl": false}], "note": "A reason-coded delay register shows whether a delay sat with Purchase or upstream of it, so dependencies can be resolved fairly."}, {"title": "Stage 9 — Redeployment and Management Reporting", "text": "Non-moving, surplus or near-expiry material at one project should be visible to other projects before new material is bought, subject to demand, quality validity and approval. Purchase also prepares reports on requisitions, orders, receipts, deliveries, purchase value, inventory and outstanding payments.", "nodes": [{"t": "Surplus visible", "s": "across projects", "dec": false, "hl": true}, {"t": "Matched to demand", "s": "before a new PR", "dec": false, "hl": false}, {"t": "Transferred", "s": "in SAP", "dec": false, "hl": false}, {"t": "MIS", "s": "from SAP and site data", "dec": false, "hl": false}], "note": "Waste was described where surplus was not moved in time. Reports are assembled from SAP, Excel and site data, and their freshness is not always clear."}], "extra": {"title": "Who owns each step", "heads": ["Step", "Owner", "Recorded in"], "rows": [["Requisition", "Site, project or Store", "SAP"], ["Triage and priority", "Purchase", "Platform"], ["Quotations and comparison", "Purchase", "Platform, as evidence"], ["Approval and order", "Approvers, Purchase", "SAP release strategy and PO"], ["Acknowledgement and delivery", "Purchase with supplier", "Platform"], ["Physical receipt and GRN", "Store", "Platform and SAP"], ["Acceptance", "Quality", "Quality module"], ["Return or replacement", "Purchase with supplier", "Platform, with SAP reference"], ["Invoice and payment", "Finance", "SAP"]]}, "workflows": [["1", "PR intake and triage", "PR raised in SAP", "Purchase", "Each PR linked, categorised, assigned to a buyer and given a stage"], ["2", "Priority assessment", "PR received", "Purchase, site", "A priority from required date, stock cover, lead time and milestone, with emergency only on an approved reason"], ["3", "Clarification", "PR unclear or incomplete", "Purchase, requester, technical", "A clarification request with due date, answered on the record"], ["4", "RFQ", "PR ready to source", "Purchase, suppliers", "Suppliers contacted, with responses and non-responses recorded"], ["5", "Quotation register", "Quotations received", "Purchase", "Price, terms, validity, lead time, freight and documents per quotation"], ["6", "Comparison and approval", "Quotations complete", "Purchase, approvers", "A comparison by template, approved by the matrix for category, value and risk"], ["7", "Single-source and emergency deviation", "Too few quotations or urgent need", "Purchase, higher approver", "Special approval with reason, kept with the comparison"], ["8", "PO link", "PO released in SAP", "Purchase", "The SAP PO reference linked to the decision history"], ["9", "PO acknowledgement", "PO sent", "Purchase, supplier", "Supplier acknowledgement recorded, with reminders until it is received"], ["10", "Staggered supply plan", "Bulk or scheduled material", "Purchase, Planning, Store", "Planned quantity and date by week or month, supplier confirmation and deviation"], ["11", "Dispatch and delivery follow-up", "Delivery due", "Purchase, supplier, site", "Dispatch, vehicle and challan, revised ETA and partial deliveries, with escalation"], ["12", "GRN follow-up", "Material delivered but not posted", "Purchase, Store", "A task until the goods receipt is posted in SAP"], ["13", "Local purchase coordination", "Purchase by state or site buyers", "Local purchasers, HO Purchase", "Local buying visible in the same pipeline as central purchasing"], ["14", "New supplier and brand assessment", "New source proposed", "Purchase, Quality, technical", "Market survey, plant visit, tests, findings and decision, with re-review date"], ["15", "Approved brand and source register", "Project or client requirement", "Purchase, Quality, Contract", "Approved brands and sources by material, project, client and state, with validity and approver"], ["16", "Supplier history", "Delivery, quality or service event", "Purchase", "Observations recorded against the supplier across projects"], ["17", "Rejection and return", "Quality rejects material", "Store, Quality, Purchase, supplier", "One case from evidence to Quality decision, supplier notice, return or replacement and closure"], ["18", "Change notice and delay register", "Change in quantity, design, scope, rate or storage", "Purchase, Planning, Design, site, Finance", "Inputs requested with due dates, impact on PR, PO and schedule recorded, delay reason coded"], ["19", "Cross-project redeployment", "New PR, or surplus identified", "Purchase, Store, Quality", "Surplus matched to demand, approved, and transferred in SAP"], ["20", "Purchase MIS", "Daily, weekly, monthly", "Purchase, management", "Reports on requisitions, orders, deliveries, value, commitments and outstanding payments, with source and time shown"]], "dashboards": [["1", "PR-to-PO pipeline", "Every open requisition and order by stage, owner and next action", "cap"], ["2", "PR ageing", "Requisitions by age and stage, and those waiting on clarification", "sap"], ["3", "Open POs", "Orders by age, supplier and delivery status", "sap"], ["4", "Critical requirements", "Requirements at risk by required date, stock cover and lead time", "cap"], ["5", "Quotations pending", "RFQs out, quotations received and suppliers not responding", "cap"], ["6", "Approvals pending", "Comparisons and deviations awaiting approval, by approver and age", "cap"], ["7", "Unacknowledged orders", "POs sent and not acknowledged by the supplier", "cap"], ["8", "Supply against plan", "Planned, confirmed and received quantities by week or month", "cap"], ["9", "Late and partial deliveries", "Deliveries past promised date, partial deliveries and revised ETAs", "cap"], ["10", "GRN pending", "Material delivered but not yet received in SAP", "cap"], ["11", "Supplier performance", "On-time delivery, rejections and observations by supplier", "cap"], ["12", "Approved brands and sources", "Approvals by material and project, and those nearing re-review", "cap"], ["13", "New source assessments", "Assessments in progress, visits and tests pending, decisions made", "cap"], ["14", "Rejections and returns", "Open cases by supplier, material and stage", "cap"], ["15", "Delay reasons", "Delays by reason, split between upstream causes and Purchase actions", "cap"], ["16", "Surplus and redeployment", "Non-moving, surplus and near-expiry material that matches open demand", "sap"], ["17", "Purchase value and commitments", "Ordered, received and committed value by project, category and supplier", "sap"], ["18", "Purchase MIS", "Management reports, including outstanding payment status for prioritisation", "now"]], "obs": "We note that most delays attributed to Purchase start somewhere else — an unclear requirement, a design change, a missing input, a full store. Recording the reason and the owner of each delay is what lets management fix the right thing.", "interactions": [["Site and project", "Requisitions, clarifications, priorities", "Order and delivery status", "SAP PR; follow-up by phone."], ["Planning", "Weekly and monthly work plan", "Staggered supply schedule", "Discussed informally."], ["Store", "Receipts, capacity, surplus, GRN status", "Expected deliveries, returns", "SAP and phone."], ["Quality", "Source approvals, test results, rejections", "New source proposals, supplier actions", "Separate records."], ["Design and technical", "Specifications, changes", "Queries on specification", "Email."], ["Contract", "Client-specified brands and requirements", "Sources checked against the contract", "By reference to the contract."], ["Finance and Accounts", "Payment status, budget and commitments", "Order details for invoice matching", "SAP."], ["Plant and Machinery", "Hire, spares and service requirements", "Hire and service orders", "SAP PO; pre-PO steps manual."], ["Safety and Admin", "PPE, stationery and uniform requirements", "Orders and delivery status", "SAP PR."], ["Local purchasers", "Local buying by state and site", "Rules, approvals, central visibility", "Excel and phone."], ["Suppliers", "Quotations, acknowledgements, dispatches", "RFQs, orders, schedules, return notices", "Email and phone."], ["Management", "Approvals and direction", "Purchase MIS", "Assembled from SAP and Excel."]], "profile": [["Team size", "Not recorded", "Raised in Section 8, with the split between head office, states and local purchasers."], ["Spread", "Several states, sites and local purchasers", "One pipeline for central and local buying, filterable by state and site."], ["What is bought", "Materials, spares, services and other requirements", "Categories drive the approval matrix and comparison template."], ["SAP use", "PR, release strategy, PO, GRN, invoice and payment", "SAP stays the system of record; the platform links to it and does not post."], ["Largest effort", "Supplier and site follow-up after the PO", "Follow-up tasks, reminders and supplier acknowledgement are the core of the build."]], "tools": [["SAP", "PR, release, PO, GRN, invoice, payment, stock", "Retained and unchanged. Read on a schedule; any write-back only through a separately approved interface."], ["Excel", "Comparisons, schedules, trackers, MIS", "Replaced by structured comparison, schedule and pipeline records."], ["Email and phone", "RFQs, supplier follow-up, clarifications", "Retained as channels; every request, promise and response is recorded against the order."], ["Personal knowledge", "Local vendors and sources", "Captured in the supplier and source register."]], "pains": [["1", "Supplier acknowledgement, dispatch and GRN are followed up by phone and email", "The department's time goes on chasing, and nothing is on record.", "Follow-up tasks per order with promised dates, reminders and escalation."], ["2", "There is no single live view across sites and local purchasers", "Nobody can see who owns each order and what happens next.", "One PR-to-PO pipeline with owner, stage and next action."], ["3", "Many PRs are marked urgent", "Genuinely critical needs are hard to spot.", "Priority set by rule from date, stock cover, lead time and milestone."], ["4", "PR quantity has no delivery schedule", "Material arrives early, costs detention and becomes excess.", "A staggered supply plan linked to Planning and Store capacity."], ["5", "Vendor and source knowledge is held by individuals", "It is lost when people move and cannot be reused.", "A supplier, brand and source register with history."], ["6", "New sources need visits and tests, tracked informally", "Approvals take longer and are hard to audit.", "A new source assessment workflow with decision and re-review date."], ["7", "Rejection and return are not one case", "Returns stall between Quality, Store and Purchase.", "A shared case from evidence to closure, each department owning its step."], ["8", "Changes and unclear requirements arrive by email", "Purchase chases inputs and carries the delay.", "A change notice with inputs requested from each department and due dates."], ["9", "Delay reasons are not recorded", "Upstream delays look like Purchase delays.", "A reason-coded delay register."], ["10", "Quotation comparisons are kept in Excel", "The basis for an order is hard to find later.", "A comparison record kept with the approval and the SAP PO."], ["11", "Single-source and emergency purchases need special approval", "The reason for the exception must stand up later.", "A deviation approval with reason, kept with the order."], ["12", "Surplus at other projects is found late", "New material is bought and existing material is wasted.", "Surplus shown against new requirements before sourcing."], ["13", "Reports are assembled from SAP, Excel and site data", "Freshness and ownership of figures are unclear.", "Reports built from the records, with source and time on every figure."], ["14", "Payment status is needed for prioritisation", "A supplier waiting for payment may hold delivery.", "Read-only payment status from SAP; Finance keeps control."], ["15", "Materials delivered are not always received in SAP promptly", "Stock and commitments are wrong until the GRN is posted.", "GRN-pending tracking after physical delivery."], ["16", "Local purchasing sits outside the central view", "Spend and supplier performance are split.", "Local purchases in the same pipeline and reports."]], "scope": [["1", "PR-to-PO control tower", "SAP PR and PO references; project, site, category, quantity, required date, buyer, supplier; operational stages; ageing per stage; next action and owner", "Every open purchase visible in one place."], ["2", "Priority model", "Configurable rules on required date, criticality, stock cover, lead time and milestone; emergency only on an approved reason", "Urgency that means something."], ["3", "Clarifications", "Clarification requests to requesters and technical teams; due dates; responses on record", "Unclear requirements resolved before sourcing."], ["4", "RFQ and quotations", "RFQ register; suppliers contacted and responses; price, terms, validity, lead time, freight, documents", "Every quotation kept with its PR."], ["5", "Comparison and approval", "Comparison templates by category; approval matrix by category, value and risk; comments; deviation approvals for single source and emergency", "The basis for each order, approved and retrievable."], ["6", "PO acknowledgement and supplier communication", "PO sent and acknowledged; supplier notifications by email or portal; communication log", "Suppliers confirm on record, not only by phone."], ["7", "Supply scheduling", "Staggered plan from Planning demand and Store capacity; planned, confirmed and received quantities; deviation", "Deliveries paced to the work."], ["8", "Delivery follow-up", "Dispatch, vehicle, challan, ETA, partial delivery; reminders and escalation; risk alerts for unacknowledged, late or early delivery and GRN pending", "Late deliveries caught before they stop work."], ["9", "Local purchase view", "Local purchases by state and site within the same pipeline; limits and approvals", "Central and local buying seen together."], ["10", "Supplier, brand and source register", "Profiles linked to SAP vendor reference; categories, areas, contacts, status, documents; history across projects", "Vendor knowledge owned by the company."], ["11", "New source assessment", "Market survey; plant visit; Quality or third-party test request; findings; decision; re-review date", "New suppliers qualified on evidence."], ["12", "Approved brands and sources", "By material, client, project, state and technical requirement; validity; approving authority", "Buyers know what is allowed for each project."], ["13", "Rejection and return", "Case linked to receipt, PO, supplier and material; evidence; Quality decision; supplier notice; return, replacement or credit; SAP reference", "Returns closed with each department's part done."], ["14", "Change and delay register", "Change notices; inputs from Planning, Design, site, Store, Quality, Contract and Finance; impact on PR, PO and schedule; reason codes", "Delays explained and owned."], ["15", "Redeployment", "Surplus, non-moving and near-expiry material matched to new demand; approval; SAP transfer reference", "Existing material used before new material is bought."], ["16", "Supplier performance", "On-time delivery, partial deliveries, rejections and observations by supplier and category", "Suppliers compared on facts."], ["17", "Dashboards and MIS", "The eighteen dashboards of Section 3; management reports in approved formats; read-only payment status; export", "Reports without manual assembly."], ["18", "SAP extraction, roles and audit", "Scheduled read-only extraction of PR, PO, GRN, stock, value and payment status; buyer, approver and local purchaser roles; audit trail", "SAP stays the authority; the platform explains what happens around it."]], "open": ["That the nine-stage process set out in Section 1 reflects how Purchase operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The size of the Purchase team, and how it divides between head office, states and local purchasers.", "The purchase categories in use, and how they map to SAP.", "The rules that should decide priority, and who may approve an emergency.", "The minimum number of quotations by category and value, and the approval for single-source purchases.", "The approval matrix and authority limits, and how they sit alongside the SAP release strategy.", "How suppliers should acknowledge orders and confirm dispatch — by email, a supplier portal, or both.", "What Planning can provide for staggered supply schedules, and how Store capacity is known.", "The approved brand and source lists by client and project, and who approves new ones.", "The steps and evidence required to approve a new supplier or source.", "How returns, replacements and credits are settled with Finance.", "Who owns each kind of change notice, and the reason codes to use for delays.", "The rules and approval for moving surplus material between projects.", "The limits and approval that apply to local purchases.", "The report formats in use, and what level of payment status Purchase should see.", "The SAP boundary, confirmed with the SAP owner, including the reports and fields the platform should read.", "Whether current trackers, comparisons and supplier lists should be migrated at go-live."], "sap": {"1": ["PR and PO headers and items; approval status", "MM", "Read"], "6": ["PO output and release date", "MM", "Read"], "8": ["GRN pending against PO", "MM", "Read"], "10": ["Vendor master", "MM", "Read"], "13": ["Return deliveries", "MM", "Read"], "15": ["Stock and stock transfers", "MM", "Read"], "17": ["Vendor payment status", "FI", "Read"]}}, "om": {"key": "om", "name": "O&M", "intro": ["Operations and Maintenance takes over a project once construction is handed over and the Commercial Operation Date is reached, and looks after the road through the defect liability period and the longer maintenance obligations that follow. Depending on the contract model, that can run for many years. The work is routine upkeep and repair — cleaning, drainage, vegetation, street lights and blinkers, signboards, noise barriers and other road furniture — together with defects, accident damage, material and service needs, and regular reporting to the client and management.", "Toll operations are a separate function with their own systems and sit outside this scope. Formal procurement, stock, budgets and client billing stay in SAP. What O&M lacks is the operational record in between: what was handed over, what condition it is in, what work was done, with what evidence, and what is still open. The work runs through nine stages."], "insight": "Everything O&M does depends on the first stage: a clear record of what was handed over and in what condition. From there the cycle repeats for years — inspect, raise the work, get the material, do it, prove it, report it. A task is only complete when a supervisor has verified it; work that fails verification or recurs goes back as rework, and the recurrence is itself a signal worth tracking.", "flowcap": "Master flow — nine stages from handover to client reporting", "flow": [{"t": "1. Handover", "s": "from construction at COD", "dec": false, "hl": true}, {"t": "2. O&M Plan", "s": "by contract model", "dec": false, "hl": false}, {"t": "3. Daily Field Work", "s": "DPR and routine upkeep", "dec": false, "hl": false}, {"t": "4. Inspection", "s": "condition and defects", "dec": false, "hl": false}, {"t": "5. Work Order", "s": "routine, repair, major", "dec": false, "hl": false}, {"t": "6. Material and Service", "s": "through Purchase and Store", "dec": false, "hl": false}, {"t": "7. Damage and Claims", "s": "warranty and insurance", "dec": false, "hl": false}, {"t": "Verified?", "s": "by supervisor", "dec": true, "hl": false}, {"t": "Rework", "s": "recurrence recorded", "dec": false, "hl": false}, {"t": "8. Reports and Submissions", "s": "DPR, client, periodic", "dec": false, "hl": true}, {"t": "9. Client and Billing", "s": "evidence for billing", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Handover from Construction", "text": "At project completion and COD, the O&M team takes over for the maintenance stage. The handover should include the asset and component inventory, documents, existing defects and pending work, material and stock, and operating responsibilities.", "nodes": [{"t": "COD reached", "s": "from Project Closure", "dec": false, "hl": false}, {"t": "Asset inventory", "s": "by chainage or zone", "dec": false, "hl": false}, {"t": "Documents", "s": "as-builts, warranties", "dec": false, "hl": false}, {"t": "Pending defects", "s": "snags and open claims", "dec": false, "hl": true}, {"t": "Accepted", "s": "with exceptions", "dec": false, "hl": true}], "note": "There is no single controlled baseline today. The maintenance team inherits what it can find, and pending defects from construction become maintenance problems."}, {"title": "Stage 2 — O&M Plan by Contract Model", "text": "Maintenance duration, scope, client obligations, reporting and budget depend on the contract model. The plan sets out what must be maintained, how often, to what standard and response time, and what must be reported.", "nodes": [{"t": "Contract model", "s": "EPC, HAM, BOT", "dec": false, "hl": false}, {"t": "Obligations", "s": "scope and period", "dec": false, "hl": false}, {"t": "Maintenance plan", "s": "by asset and zone", "dec": false, "hl": true}, {"t": "Report calendar", "s": "client and internal", "dec": false, "hl": false}], "note": "Scope, terms and report formats vary by project. Without a configurable plan, the data cannot be brought together across projects."}, {"title": "Stage 3 — Daily Field Work and DPR", "text": "Field teams carry out recurring upkeep — cleaning, water and drainage work, vegetation, street lights and blinkers, signboards, noise barriers and other road furniture — and record the day in a daily progress report.", "nodes": [{"t": "Planned activities", "s": "for the day", "dec": false, "hl": false}, {"t": "Work done", "s": "by zone", "dec": false, "hl": false}, {"t": "Evidence", "s": "photos, time, place", "dec": false, "hl": true}, {"t": "DPR", "s": "compiled by hand", "dec": false, "hl": false}], "note": "The DPR is compiled from files and sheets. The photographs that prove the work sit on phones."}, {"title": "Stage 4 — Condition Inspection", "text": "The road and its assets are inspected against checklists. Observations become work, with severity and response targets set by the client contract.", "nodes": [{"t": "Checklist", "s": "by asset type", "dec": false, "hl": false}, {"t": "Observation", "s": "condition and severity", "dec": false, "hl": false}, {"t": "Response target", "s": "from the contract", "dec": false, "hl": true}, {"t": "Work order raised", "s": "stage 5", "dec": false, "hl": false}], "note": "Contracts set response times for defects. Unless the clock starts at the observation, nobody knows how close a defect is to breaching it."}, {"title": "Stage 5 — Work Orders", "text": "Work is raised as routine or preventive, corrective, emergency, major maintenance, accident damage restoration, warranty repair or inspection. Each type needs its own priority, approval and reporting.", "nodes": [{"t": "Work order", "s": "type and priority", "dec": false, "hl": false}, {"t": "Assigned", "s": "team or contractor", "dec": false, "hl": false}, {"t": "Traffic control", "s": "where needed", "dec": false, "hl": false}, {"t": "Completed", "s": "with evidence", "dec": false, "hl": true}, {"t": "Verified", "s": "or reopened", "dec": false, "hl": false}], "note": "A completed task is an operational confirmation only. It is not a service receipt in SAP, a billing approval or a payment authorisation."}, {"title": "Stage 6 — Material and Service Follow-up", "text": "O&M needs materials, services and equipment for its work. It raises the requirement and follows the PR and PO through Purchase and Store, but does not approve or post anything itself.", "nodes": [{"t": "Requirement", "s": "on the work order", "dec": false, "hl": false}, {"t": "PR and PO", "s": "in SAP by Purchase", "dec": false, "hl": false}, {"t": "Status followed", "s": "until received", "dec": false, "hl": true}, {"t": "Issued by Store", "s": "to the work", "dec": false, "hl": false}], "note": "Work blocked for want of material is not visible as blocked today. O&M sees a pending PR, not the reason it is pending."}, {"title": "Stage 7 — Damage, Warranty and Insurance", "text": "Defects and damage, including damage from vehicle accidents, are logged, repaired and evidenced. Where a person or vehicle is involved, Safety runs the incident. O&M needs the linked view: repair, damage evidence, warranty status, and insurer or broker coordination through to the claim outcome.", "nodes": [{"t": "Damage logged", "s": "cause and severity", "dec": false, "hl": false}, {"t": "Safety incident", "s": "linked where relevant", "dec": false, "hl": false}, {"t": "Repair", "s": "work order", "dec": false, "hl": false}, {"t": "Claim or warranty", "s": "insurer, broker, vendor", "dec": false, "hl": true}, {"t": "Outcome", "s": "recorded", "dec": false, "hl": false}], "note": "The evidence for a claim is the repair record and its photographs. They sit today across O&M, Safety, Legal and email."}, {"title": "Stage 8 — Reports and Submissions", "text": "O&M prepares the DPR, maintenance status reports and other periodic reports. Scheduled submissions mentioned include monthly PR-related input, a quarterly accident report and six-monthly checks, subject to each project's and client's requirements.", "nodes": [{"t": "Due date", "s": "from the calendar", "dec": false, "hl": false}, {"t": "Data requested", "s": "from sites", "dec": false, "hl": false}, {"t": "Draft and review", "s": "internal approval", "dec": false, "hl": false}, {"t": "Submitted", "s": "proof stored", "dec": false, "hl": true}], "note": "Frequencies will be configured from each contract and client, not fixed from this discussion."}, {"title": "Stage 9 — Client, Billing and Management", "text": "Maintenance status and client reports feed management and client billing. O&M prepares the work, evidence and status; Billing and Finance remain responsible for the bill and the payment.", "nodes": [{"t": "Work verified", "s": "with evidence", "dec": false, "hl": false}, {"t": "Client verification", "s": "where required", "dec": false, "hl": false}, {"t": "Evidence to Billing", "s": "for client bill", "dec": false, "hl": true}, {"t": "Management view", "s": "status and backlog", "dec": false, "hl": false}], "note": "Field condition, work done, client verification and the billing reference are not connected in one timeline today."}], "extra": {"title": "Work types", "heads": ["Type", "Raised when", "What it needs"], "rows": [["Routine and preventive", "On the maintenance plan", "Schedule, checklist, completion evidence"], ["Corrective and defect", "An inspection or report finds a defect", "Severity, response target, verification"], ["Emergency", "A hazard to road users", "Immediate response, traffic control, time to make safe"], ["Major maintenance", "Planned renewal under the contract", "Approval, budget reference, client notice"], ["Damage restoration", "An accident damages an asset", "Link to Safety incident, evidence for insurance"], ["Warranty repair", "A defect is covered by a warranty", "Vendor reference, claim, completion"], ["Inspection", "Scheduled or requested by the client", "Checklist and observations"]]}, "workflows": [["1", "Handover checklist", "COD or completion", "Construction team, O&M, Project Closure", "COD date, maintenance period, obligations, owner, zones and report calendar recorded"], ["2", "Asset and component inventory", "Handover", "O&M, Design", "Assets and road furniture by chainage or zone, with type, condition and documents"], ["3", "Handover acceptance", "Inventory and documents complete", "O&M, construction, management", "Handover accepted with exceptions, owners for each, and a final record that cannot be changed"], ["4", "Maintenance plan", "Handover accepted", "O&M, Contract", "Plan by contract model, asset, zone and client requirement"], ["5", "Daily progress report", "Each working day", "Site O&M team", "Activities planned and done, observations, incidents, resources and pending actions"], ["6", "Condition inspection", "Inspection schedule", "O&M inspectors", "Checklists for road, drainage, vegetation, lights, signboards, barriers and other assets"], ["7", "Observation to work order", "Defect observed", "O&M", "A work order with severity and response target from the contract"], ["8", "Routine and preventive work", "Plan due", "O&M team or contractor", "Scheduled work done and evidenced"], ["9", "Corrective work", "Defect work order", "O&M team or contractor", "Defect repaired within its response target"], ["10", "Emergency response", "Hazard reported", "O&M, Safety", "Site made safe and repaired, with response time recorded"], ["11", "Major maintenance", "Planned renewal due", "O&M, management, client", "Approved and completed major work, with client notice"], ["12", "Damage restoration", "Accident damage", "O&M, Safety", "Damage repaired, linked to the Safety incident, with evidence for claims"], ["13", "Warranty repair", "Defect under warranty", "O&M, vendor", "Warranty claim raised and repair completed by the vendor"], ["14", "Completion and verification", "Work reported complete", "Field team, supervisor", "Work verified or reopened, with recurrence tracked"], ["15", "Material and service requirement", "Work order needs material or service", "O&M, Purchase, Store", "Requirement with needed-by date, followed through PR, PO and issue; blocked work flagged"], ["16", "Insurance claim", "Insured damage", "O&M, Insurance, broker, Legal where needed", "Claim with evidence, estimate, correspondence, status and outcome"], ["17", "Report and submission", "Calendar due date", "O&M, approver", "Data requested, draft, review, approval, submission and proof stored"], ["18", "Client verification", "Work needing client sign-off", "O&M, client or IE", "Client verification recorded against the work"], ["19", "Billing evidence", "Billing period", "O&M, Billing", "Verified work and evidence passed to Billing for the client bill"], ["20", "O&M MIS", "Daily, monthly, quarterly", "O&M, management", "Status, backlog, response and evidence reports across projects"]], "dashboards": [["1", "Projects in O&M", "Projects by contract model, maintenance period and end date", "cap"], ["2", "Handover status", "Handovers accepted, exceptions open and snags carried over", "cap"], ["3", "Asset condition", "Condition by asset type and zone, and last inspection", "cap"], ["4", "Planned against completed", "Maintenance planned and done by project and period", "cap"], ["5", "Overdue work", "Work orders past their response target, by severity", "cap"], ["6", "Work by type", "Routine, corrective, emergency, major, damage and warranty work", "cap"], ["7", "Emergency response", "Time to make safe and time to repair", "cap"], ["8", "Repeat defects", "Defects that recur at the same asset or location", "cap"], ["9", "Defect and damage backlog", "Open defects and damage by age and severity", "cap"], ["10", "Warranty cases", "Warranty repairs open, with vendor and age", "cap"], ["11", "Insurance claims", "Claims by status, amount reference and age", "cap"], ["12", "Material and service blockers", "Work held for material or service, with PR and PO status", "sap"], ["13", "Evidence completeness", "Completed work with and without photographs and verification", "cap"], ["14", "DPR status", "DPRs submitted and missing by site and day", "cap"], ["15", "Submissions", "Client and internal reports due, overdue and submitted", "cap"], ["16", "Verified for billing", "Work verified and passed to Billing, by period", "cap"], ["17", "Maintenance cost", "Cost against budget by project and work type", "sap"], ["18", "O&M MIS", "The management view across projects in maintenance", "now"]], "obs": "We note that O&M is the last department in the chain and inherits the records of every one before it — as-builts from Design, open claims from Contract, securities from Finance, snags from Quality. The handover is the moment those records either arrive together or are lost.", "interactions": [["Construction and Project Closure", "Handover, COD, snags, documents", "Handover acceptance and exceptions", "Files and meetings."], ["Design", "As-built drawings", "Site condition that differs from drawings", "Files."], ["Contract", "Maintenance obligations, response times, client letters", "Status and evidence for replies and claims", "Email and letters."], ["Safety", "Incident records", "Damage repair, signage and traffic control", "Separate records."], ["Legal and Insurance", "Claim guidance", "Damage evidence, repair records", "Email and files."], ["Purchase", "PO status", "Material and service requirements", "SAP PR; follow-up by phone."], ["Store", "Material issue and availability", "Material needs by work order", "SAP."], ["Plant and Machinery", "Maintenance equipment", "Equipment needs", "By request."], ["Billing and Finance", "Client billing status, budget", "Verified work and evidence", "Reports."], ["Client, NHAI and IE", "Instructions, inspections, verification", "Reports, submissions, completed work", "Formal reports and letters."], ["Maintenance contractors", "Work done", "Work orders", "Phone and sheets."]], "profile": [["Team size", "Not recorded", "Raised in Section 8, with the number of projects in maintenance."], ["Duration", "Long maintenance periods", "Records must stay usable for many years and survive changes of staff."], ["Variation", "Scope and reports differ by project", "Plans, checklists and report calendars configured per project and client."], ["Where work happens", "Along the road, often remote", "Mobile capture that works offline, with time, user and location."], ["Boundary", "Toll operations separate", "The platform covers field maintenance only."]], "tools": [["SAP", "PR, PO, stock, budget, client billing", "Retained and unchanged. Status read on a schedule; no posting from the platform."], ["Excel and files", "DPR, reports, registers", "Replaced by field records, registers and generated reports."], ["Phones and email", "Photographs, follow-ups, claims correspondence", "Evidence captured in the app; correspondence recorded against the case."], ["Toll systems", "Toll operations", "Outside scope."]], "pains": [["1", "There is no controlled handover baseline", "O&M inherits unknown condition and pending defects.", "A handover checklist, asset inventory and acceptance with exceptions."], ["2", "DPR and reports are compiled by hand", "Reporting takes time that should go on the road.", "DPR from mobile field records, and reports generated from them."], ["3", "Scope, terms and formats vary by project", "Data cannot be brought together across projects.", "Configurable plans, checklists and templates per project."], ["4", "Defects, damage, warranty and insurance are fragmented", "Evidence for claims is scattered and incomplete.", "One damage and claim case linked to the repair and the Safety incident."], ["5", "PR status is visible but not the reason it is stuck", "Work waits without anyone knowing why.", "Blocked work flagged with PR, PO and supplier status."], ["6", "Routine, major and damage work are not separated", "Priorities and reports mix different kinds of work.", "Separate work types with their own priority and approval."], ["7", "Report submissions are hard to monitor", "A missed client report is a contractual issue.", "A submission calendar with proof of each submission."], ["8", "Work, verification and billing are not in one timeline", "Billing cannot easily prove the work behind the bill.", "One timeline from observation to verified work to billing evidence."], ["9", "Toll operations are separate", "The platform must not absorb a separate function.", "A clear boundary, with toll out of scope."], ["10", "Evidence sits on phones", "Proof of work cannot be found when needed.", "Photographs captured against the work order, with time and place."], ["11", "Response times are not tracked from the observation", "Breaches are found after they happen.", "Response clocks from the moment a defect is observed."], ["12", "Recurring defects are not visible", "The same repair is paid for again.", "Recurrence tracked by asset and location."], ["13", "Warranty coverage is not known at the point of repair", "Work covered by a vendor is done at PIL's cost.", "Warranty status shown on the asset when work is raised."], ["14", "Remote sites have weak connectivity", "Records are written up later, from memory.", "Offline capture with sync."], ["15", "Long maintenance periods outlast staff", "Knowledge of the asset leaves with people.", "A work history per asset that stays with the project."], ["16", "Management sees status only through reports", "Backlogs grow before anyone notices.", "Live dashboards across projects."]], "scope": [["1", "Handover", "Handover checklist; COD and maintenance period; obligations; owner; zones; documents; pending defects; open claims; acceptance with exceptions; locked final record", "A clean start for every maintenance period."], ["2", "Asset and component register", "Assets and road furniture by chainage or zone; type; condition; last inspection; warranty and documents; work history", "Every asset known, with its history."], ["3", "Maintenance plan", "Plan by contract model, asset, zone and client requirement; frequencies; response targets", "The contract turned into scheduled work."], ["4", "Daily progress report", "Mobile DPR by site and zone; activities; observations; incidents; resources; pending actions", "The DPR written where the work is done."], ["5", "Inspection checklists", "Configurable checklists for road, drainage, vegetation, lights, signboards, barriers and other assets; observations; severity", "Defects found and recorded consistently."], ["6", "Work orders", "All work types; priority; source; asset and location; material and service needs; traffic control; assignee; approval path; response clock", "All work raised, typed and timed."], ["7", "Completion and verification", "Mobile completion with photographs and time; labour and contractor reference; supervisor verification; reopen and recurrence", "Work proven before it is counted."], ["8", "Material and service follow-up", "Requirement on the work order; PR, PO and receipt status from SAP; Store availability; blocked-work alerts", "Nothing held up without someone knowing why."], ["9", "Defect and damage register", "Asset, location, cause, severity, immediate action, work order, warranty applicability, evidence; link to Safety incident", "Every defect and damage event on record."], ["10", "Warranty and insurance cases", "Insurer, broker or vendor reference; photographs; estimate; correspondence; status; outcome; Legal link where formal", "Claims supported by the evidence already captured."], ["11", "Report and submission calendar", "Calendar configured per contract and client; data requests; draft, review, approval, submission; proof stored", "No report missed, and every submission provable."], ["12", "Client verification and billing evidence", "Client or IE verification of work; verified work passed to Billing by period", "Bills backed by verified work."], ["13", "Maintenance contractors", "Work orders to contractors; completion; performance", "Contractor work managed like in-house work."], ["14", "Site mobile app", "DPR, inspections, work orders, evidence and verification on mobile; offline sync", "Field records captured where the road is."], ["15", "Project configuration", "Contract model, maintenance period, obligations, work types, checklists and templates per project", "Different projects managed in one system."], ["16", "Document repository", "As-builts, manuals, warranties, test records, reports and claims by project and asset", "Documents found with the asset they belong to."], ["17", "Dashboards and MIS", "The eighteen dashboards of Section 3; periodic reports; export", "Management and client views without compilation."], ["18", "SAP extraction, roles and audit", "Read-only extraction of PR, PO, stock, budget and billing status; site, supervisor and HO roles; audit trail", "SAP stays the authority for money and material."]], "open": ["That the nine-stage process set out in Section 1 reflects how O&M operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The size of the O&M team, and how many projects are currently in maintenance.", "The contract model and maintenance period for each project in O&M.", "Who prepares and who accepts the handover, and what the handover checklist should contain.", "How the asset inventory is built — from as-builts, by chainage, by zone — and who maintains it.", "The maintenance items and frequencies for each project, and the response times set by each contract.", "What counts as major maintenance, and who approves it.", "How emergencies are reported and who responds.", "How insurance claims are raised today, and the role of the broker.", "Which assets carry warranties, and from whom.", "Who raises purchase requisitions for O&M material and services.", "The report calendar for each client — including the quarterly accident report, the monthly PR-related input and the six-monthly checks — and their formats.", "Which work needs client or IE verification, and how verified work reaches Billing.", "Whether maintenance contractors should record their work directly in the platform.", "That toll operations are outside this scope.", "The SAP boundary, confirmed with the SAP owner, including the status fields the platform should read.", "Whether existing registers, reports and claim records for projects already in O&M should be migrated at go-live."], "sap": {"8": ["PR, PO and GRN status; stock availability", "MM", "Read"], "12": ["Client billing status", "SD", "Read"], "15": ["Project and contract reference; maintenance budget", "PS / CO", "Read"]}}, "accounts": {"key": "accounts", "name": "Accounts", "intro": ["Accounts keeps the books for PIL and its special purpose vehicles. It creates vendor and customer accounts after verifying them, checks every purchase from order to goods receipt to invoice before it can be paid, books sales billed through SAP, posts direct entries such as insurance and bank charges, and follows receivables and payables as they age. It also keeps track of prepaid expenses, the purchase, sale and rent of assets, depreciation under income tax rules, and bank guarantees, and prepares the reports management and the tax teams need.", "SAP carries the transactions — MM for purchasing, SD for sales billing and FI for the books. Most of the checking, tracking and reporting around those transactions is done by hand in Excel, and vendor GST status is verified manually every day. The work runs through nine stages."], "insight": "The decision before payment is where Accounts protects the company: the invoice matches the order and the receipt, the vendor's GST is in order, the company and the balance are right. When a check fails the payment is held, and today the query behind the hold travels by email. Once a payment is made, the same data has to reappear in ageing, MSME, project and tax reports, each of which is currently rebuilt by hand.", "flowcap": "Master flow — nine stages from party onboarding to management reporting", "flow": [{"t": "1. Party Onboarding", "s": "vendor and customer, GST checked", "dec": false, "hl": false}, {"t": "2. PO and Receipt", "s": "GRN through MIGO", "dec": false, "hl": false}, {"t": "3. Invoice Verification", "s": "MIRO: invoice, qty, amount", "dec": false, "hl": false}, {"t": "Ready to pay?", "s": "all checks passed", "dec": true, "hl": false}, {"t": "Held", "s": "document, GST or balance query", "dec": false, "hl": false}, {"t": "4. Payment and Advice", "s": "MSME 45 days watched", "dec": false, "hl": true}, {"t": "5. Sales and Receivables", "s": "SD billing, collection", "dec": false, "hl": false}, {"t": "6. Direct Accounting", "s": "insurance, bank, GL", "dec": false, "hl": false}, {"t": "7. Prepaid and Assets", "s": "schedules, sale, rent", "dec": false, "hl": true}, {"t": "8. Bank Guarantees", "s": "expiry and renewal", "dec": false, "hl": false}, {"t": "9. Reports and MIS", "s": "ageing, MSME, WBS P&L, by SPV", "dec": false, "hl": true}], "stages": [{"title": "Stage 1 — Vendor and Customer Onboarding", "text": "Departments send a vendor registration form. Accounts verifies the vendor, including GST, and creates the vendor account in SAP. Customer accounts are created the same way. Where a payment is needed to a party without GST, a one-time account is used.", "nodes": [{"t": "Registration form", "s": "from the department", "dec": false, "hl": false}, {"t": "Verification", "s": "GST and documents", "dec": false, "hl": true}, {"t": "Category", "s": "project, service, admin", "dec": false, "hl": false}, {"t": "Account created", "s": "in SAP", "dec": false, "hl": false}], "note": "What was checked, and when, is not recorded beside the account. One-time accounts need their own control so they are not reused."}, {"title": "Stage 2 — Purchase Order and Goods Receipt", "text": "Purchases follow the order in SAP. When material arrives, Store posts the goods receipt through MIGO. For services, the relevant service is selected when the request is raised.", "nodes": [{"t": "PO", "s": "from Purchase", "dec": false, "hl": false}, {"t": "Goods received", "s": "at site", "dec": false, "hl": false}, {"t": "GRN", "s": "MIGO in SAP", "dec": false, "hl": false}, {"t": "Ready for invoice", "s": "quantity known", "dec": false, "hl": true}], "note": "An invoice cannot be verified properly until the receipt is posted. A late GRN becomes a late payment."}, {"title": "Stage 3 — Invoice Verification", "text": "The vendor's invoice is verified in SAP through MIRO — invoice, quantity and amount against the order and the receipt — and the account is checked.", "nodes": [{"t": "Invoice received", "s": "from vendor", "dec": false, "hl": false}, {"t": "Matched", "s": "PO, GRN, invoice", "dec": false, "hl": false}, {"t": "Agrees?", "s": "qty and amount", "dec": true, "hl": false}, {"t": "Query raised", "s": "to Purchase or site", "dec": false, "hl": true}], "note": "Queries on mismatches go by email and can sit unanswered. Nothing shows how long each invoice has been waiting."}, {"title": "Stage 4 — Payment Readiness, Payment and Advice", "text": "Before payment, Accounts checks the vendor's GST status, the company and the balance. Micro and small enterprises must be paid within forty-five days. Once paid, a payment advice is sent.", "nodes": [{"t": "Verified invoice", "s": "due for payment", "dec": false, "hl": false}, {"t": "GST check", "s": "vendor status", "dec": false, "hl": true}, {"t": "Company and balance", "s": "checked", "dec": false, "hl": false}, {"t": "Paid", "s": "through Finance and SAP", "dec": false, "hl": false}, {"t": "Advice sent", "s": "to vendor", "dec": false, "hl": false}], "note": "GST verification is done by hand every day. MSME ageing against the forty-five-day clause is tracked in Excel."}, {"title": "Stage 5 — Sales and Receivables", "text": "Sales are billed through the SD module and booked in the accounts. Incoming payments are tracked against invoices, and receivables are reported by age.", "nodes": [{"t": "Sale billed", "s": "SD module", "dec": false, "hl": false}, {"t": "Booked", "s": "customer account", "dec": false, "hl": false}, {"t": "Payment received", "s": "matched to invoice", "dec": false, "hl": false}, {"t": "Receivable ageing", "s": "reported by hand", "dec": false, "hl": true}], "note": "Incoming and outgoing payments are both needed to see ageing properly, and both are compiled in Excel today."}, {"title": "Stage 6 — Direct Accounting and General Ledger", "text": "Some entries are posted directly — insurance, bank charges and other bank-related items. These are entered manually in the general ledger in SAP.", "nodes": [{"t": "Bank statement", "s": "or insurance document", "dec": false, "hl": false}, {"t": "Manual entry", "s": "GL in SAP", "dec": false, "hl": true}, {"t": "Checked", "s": "against source", "dec": false, "hl": false}, {"t": "Reconciled", "s": "with the bank", "dec": false, "hl": false}], "note": "Posting stays in SAP. What the platform can add is a record of the source document, the check and the reconciliation behind each entry."}, {"title": "Stage 7 — Prepaid Expenses and Assets", "text": "Prepaid expenses such as insurance are spread over their period in an Excel schedule. Assets are followed from order to invoice, and sales and rentals of assets are recorded — what was bought, sold, to whom, or rented. Depreciation under income tax rules is worked out for reporting.", "nodes": [{"t": "Prepaid schedule", "s": "insurance and others", "dec": false, "hl": true}, {"t": "Asset bought", "s": "PO to invoice", "dec": false, "hl": false}, {"t": "Sold or rented", "s": "to whom, on what terms", "dec": false, "hl": false}, {"t": "Tax depreciation", "s": "income tax rules", "dec": false, "hl": true}], "note": "The team said the prepaid work can be automated. Book depreciation and asset postings stay in SAP; the tax depreciation schedule is a report built from SAP asset data."}, {"title": "Stage 8 — Bank Guarantees and Banking", "text": "Bank guarantees are tracked for expiry, renewal and release, and banking and loan arrangements need documents and follow-up. This is done by hand and in Excel.", "nodes": [{"t": "BG issued", "s": "bank, amount, beneficiary", "dec": false, "hl": false}, {"t": "Expiry approaching", "s": "alert needed", "dec": false, "hl": true}, {"t": "Renewed or amended", "s": "with approval", "dec": false, "hl": false}, {"t": "Released", "s": "documents returned", "dec": false, "hl": false}], "note": "The Contract document already proposes a security register for guarantees given to clients. One register serving both teams avoids keeping the same guarantee twice."}, {"title": "Stage 9 — Reports and MIS", "text": "Accounts prepares MSME and ageing reports, payment advice reports, project-wise payment and profit and loss by WBS, asset reports, income tax reports and management MIS, for each company and special purpose vehicle. All are compiled in Excel.", "nodes": [{"t": "SAP extracts", "s": "FI, MM, SD", "dec": false, "hl": false}, {"t": "Excel", "s": "merged and reworked", "dec": false, "hl": true}, {"t": "Checked", "s": "by company and SPV", "dec": false, "hl": false}, {"t": "Issued", "s": "management and tax", "dec": false, "hl": false}], "note": "These reports carry sensitive figures. Who can see which company's data should be controlled by role."}], "extra": {"title": "Reports the team produces", "heads": ["Report", "What it shows", "Source"], "rows": [["MSME ageing", "Dues to micro and small enterprises against the forty-five-day clause", "SAP payables and vendor category"], ["Payables and receivables ageing", "Outgoing and incoming payments by age, party and project", "SAP FI"], ["Payment advice report", "Payments made and advices sent", "SAP payments"], ["WBS payment and P&L", "Payments, costs and profit by project and WBS", "SAP FI and project structure"], ["Prepaid schedule", "Prepaid amounts and their monthly release", "Excel today"], ["Asset report", "Assets bought, sold, to whom, and rented", "SAP assets and Excel"], ["Tax depreciation", "Depreciation under income tax rules", "SAP asset data, worked in Excel"], ["Income tax reports", "Figures needed by the Direct Tax team", "SAP FI"]]}, "workflows": [["1", "Vendor registration", "Registration form from a department", "Department, Accounts", "Documents and GST verified, category set, and the vendor created in SAP by the master owner"], ["2", "Customer account creation", "New customer", "Billing, Accounts", "Customer verified and created in SAP"], ["3", "One-time party", "Payment to a party without GST or regular account", "Accounts, approver", "A controlled one-time account with its reason and approval"], ["4", "Vendor GST verification", "Daily, monthly, or at payment", "Accounts, Indirect Tax", "Vendor GST status checked and recorded, with problems flagged"], ["5", "Goods receipt check", "Invoice received", "Accounts, Store", "Invoices without a GRN, and GRNs without an invoice, listed and followed up"], ["6", "Invoice verification", "Invoice and GRN available", "Accounts", "Invoice, quantity and amount verified in MIRO, with mismatches queried"], ["7", "Service entry selection", "Service request raised", "Requester, Accounts", "The right service and vendor type chosen at the start, so the invoice books correctly"], ["8", "Payment readiness", "Invoice verified and due", "Accounts, Finance", "Documents, GST, company and balance checks complete, with blocked cases held and explained"], ["9", "MSME payment watch", "Invoice from a micro or small enterprise", "Accounts", "Days to the forty-five-day limit shown, with alerts before it is reached"], ["10", "Payment advice", "Payment made", "Accounts", "Advice prepared and sent, with delivery recorded"], ["11", "Sales booking", "Invoice billed through SD", "Billing, Accounts", "Sale booked to the customer and project"], ["12", "Receivable follow-up", "Invoice due or overdue", "Accounts, Billing", "Incoming payments matched and overdue receivables followed"], ["13", "Direct entries", "Bank statement, insurance or other direct item", "Accounts", "Manual GL entry in SAP with its source document and check recorded"], ["14", "Bank reconciliation support", "Month end or statement received", "Accounts", "Differences listed and explained"], ["15", "Prepaid schedule", "Prepaid expense booked", "Accounts", "Release schedule by month, with reminders for each period's entry"], ["16", "Asset purchase to invoice", "Asset ordered", "Purchase, Accounts, P&M", "Asset followed from order to invoice and capitalisation reference"], ["17", "Asset sale and rent", "Asset sold or rented out", "Accounts, P&M, management", "Buyer or renter, terms, approval and SAP reference recorded"], ["18", "Tax depreciation schedule", "Year end, or on request", "Accounts, Direct Tax", "Depreciation under income tax rules from SAP asset data, reviewed by the team"], ["19", "Bank guarantee tracking", "BG issued, expiry approaching", "Accounts, Finance, Contract", "Expiry alerts, renewal, amendment and release recorded"], ["20", "Data requests and MIS", "Missing input, or reporting date", "Accounts, other departments, management", "Tracked requests to other teams, and reports generated by company and SPV"]], "dashboards": [["1", "Payables ageing", "Outgoing dues by age, vendor, project and company", "sap"], ["2", "MSME ageing", "Dues to micro and small enterprises against the forty-five days", "sap"], ["3", "Receivables ageing", "Incoming dues by age, customer and project", "sap"], ["4", "Payment readiness", "Invoices ready, held and why, by owner", "cap"], ["5", "Payments and advices", "Payments made and advices sent or pending", "sap"], ["6", "Invoices awaiting verification", "Invoices received and not yet verified, by age", "sap"], ["7", "Receipt and invoice gaps", "GRNs without invoices and invoices without GRNs", "sap"], ["8", "Vendor GST status", "Vendors checked, flagged and last verified", "cap"], ["9", "Onboarding requests", "Vendor and customer requests by stage", "cap"], ["10", "One-time parties", "One-time accounts used, amounts and approvals", "sap"], ["11", "WBS payments and P&L", "Payments, costs and profit by project and WBS", "sap"], ["12", "Prepaid schedule", "Prepaid balances and monthly releases due", "now"], ["13", "Asset movements", "Assets bought, sold and rented, by company", "cap"], ["14", "Tax depreciation", "Depreciation under income tax rules by asset block", "cap"], ["15", "Bank guarantees", "Guarantees by expiry, renewal due and released", "cap"], ["16", "Data requests", "Inputs pending from other departments, by age", "cap"], ["17", "Company and SPV view", "Key balances and ageing for each company and SPV", "sap"], ["18", "Accounts MIS", "Management reports in the approved formats", "now"]], "obs": "We note that most payment delays start with a missing input — a GRN not posted, a document not sent, a query not answered. Making those dependencies visible, with an owner and a date, is where the platform helps Accounts most.", "interactions": [["Purchase", "POs, vendor details, registration forms", "Vendor accounts, invoice queries", "SAP and email."], ["Store", "GRNs through MIGO", "Missing receipt queries", "SAP."], ["Billing", "Sales invoices through SD", "Customer accounts, receivable status", "SAP."], ["Indirect Tax", "GST exceptions and vendor flags", "Postings, credit notes, e-invoice requests", "Email."], ["Direct Tax", "Tax requirements", "Income tax reports, tax depreciation", "Excel."], ["Finance", "Payment approvals, fund position", "Payment-ready invoices, ageing", "SAP and email."], ["Projects and Planning", "WBS structure, project context", "WBS payments and P&L", "Excel reports."], ["Contract", "Guarantees given to clients", "BG status", "Separate trackers."], ["Plant and Machinery", "Asset purchases and disposals", "Asset accounting references", "SAP and Excel."], ["Admin and HR", "Admin bills, insurance", "Payments and prepaid schedules", "Folders and SAP."], ["Vendors and customers", "Invoices, payments", "Payment advices, statements", "Email."], ["Banks", "Statements, guarantees", "Instructions and documents", "Bank portals and paper."], ["Management", "Direction", "MIS by company and SPV", "Excel."]], "profile": [["Team size", "10 to 12 members", "A small team handling every transaction in the group; the platform must remove chasing and rebuilding."], ["Entities", "PIL and its special purpose vehicles", "Every record and report carries its company; data kept separate by entity."], ["SAP modules", "MM, SD and FI", "SAP stays the book of record; the platform reads from it and never posts."], ["Sensitivity", "Financial and party data", "Access by role and company, with the audit trail on every view and change."], ["Daily manual work", "GST verification, reports", "The first things to automate."]], "tools": [["SAP", "MM, SD, FI, GL, MIGO, MIRO, payments", "Retained and unchanged. Read-only extraction by company and period."], ["Excel", "Reports, prepaid schedule, asset and BG tracking", "Replaced by schedules, registers and dashboards."], ["GST portal", "Manual vendor GST checks", "Checks recorded against the vendor, automated where an approved source allows."], ["Email", "Queries, forms, advices", "Replaced by tracked requests; advices sent from the platform."]], "pains": [["1", "Reporting is managed by hand in Excel", "The same figures are rebuilt for every report.", "Reports generated from SAP data by company and SPV."], ["2", "Vendor GST is verified manually every day", "Time is spent daily, and a missed check risks input credit.", "GST status recorded per vendor, rechecked on a rule and at payment."], ["3", "Vendor registration comes as a form", "Verification evidence is not kept with the account.", "A registration request with documents, checks and approvals on record."], ["4", "One-time accounts are used for parties without GST", "They need control so they are not reused.", "One-time parties with reason, approval and review."], ["5", "MSME ageing against the forty-five-day clause is tracked by hand", "A missed deadline has statutory consequences.", "An MSME watch with alerts before the limit."], ["6", "Incoming and outgoing payments are tracked for ageing in Excel", "Ageing is out of date as soon as it is compiled.", "Live payables and receivables ageing from SAP."], ["7", "Prepaid work such as insurance is kept in Excel", "Monthly releases depend on someone remembering.", "A prepaid schedule with monthly reminders."], ["8", "Asset sale and rent are reported by hand", "Who bought or rented what is hard to find later.", "An asset movement record with buyer, terms and approval."], ["9", "Tax depreciation is worked out by hand", "The schedule is rebuilt every year.", "A tax depreciation schedule from SAP asset data."], ["10", "WBS-wise payment and P&L reports are manual", "Project profitability is seen late.", "WBS reports from SAP on demand."], ["11", "Data must be role and permission managed", "Financial data is sensitive.", "Access by role and company, with every view logged."], ["12", "FI data needs synchronising across SAP accounts", "Mismatches between records cause rework.", "Differences shown for correction in SAP, once the need is confirmed."], ["13", "Bank guarantee expiry is tracked by hand", "A lapsed guarantee can be a contractual default.", "A guarantee register with expiry alerts, shared with Contract."], ["14", "Manual GL entries for bank items", "The source and check behind each entry are not recorded.", "A record of source document and check for each direct entry."], ["15", "Inputs from other teams are chased by email", "Payments and reports wait on answers nobody tracks.", "Tracked requests with owners and due dates."], ["16", "Payment readiness is not visible end to end", "Why an invoice is not yet paid is hard to explain.", "A readiness view with each check and the reason for any hold."]], "scope": [["1", "Party onboarding", "Vendor and customer registration requests; document checklist; category; verification; approval; SAP master reference once created", "Every party verified before it is created."], ["2", "One-time parties", "Reason, approval, amount and review for one-time accounts", "Exceptions controlled, not habitual."], ["3", "Vendor GST checks", "GST status per vendor; check rules — daily, monthly or at payment; flags to Indirect Tax", "No more manual daily checking."], ["4", "Receipt and invoice matching view", "PO, GRN and invoice status from SAP; gaps listed; queries to Purchase, Store or site", "Invoices ready for verification, with gaps chased."], ["5", "Payment readiness", "Checklist of documents, GST, company and balance checks; hold reasons; owner; status to payment", "Every held payment explained."], ["6", "MSME watch", "MSME vendors; invoice dates; days to forty-five; alerts", "No MSME deadline missed."], ["7", "Payment advice", "Advice prepared from SAP payment data; sent to vendor; delivery recorded", "Vendors told without manual work."], ["8", "Receivables", "Customer invoices and receipts from SAP; overdue follow-up tasks", "What PIL is owed, followed up."], ["9", "Direct entry support", "Source document, check and reviewer for each manual GL entry; bank reconciliation differences", "Direct entries that can be traced."], ["10", "Prepaid schedules", "Prepaid items with period and monthly release; reminders; evidence of each period's entry", "Prepaid work that runs itself."], ["11", "Asset movements", "Purchase to invoice; sale and rent with buyer, terms and approval; SAP reference", "Every asset's story in one record."], ["12", "Tax depreciation schedule", "Asset blocks and rates under income tax rules; schedule from SAP asset data; review and export", "A schedule that no longer needs rebuilding."], ["13", "Bank guarantee register", "Bank, amount, beneficiary, dates, documents; expiry alerts; renewal, amendment and release; shared with Contract", "No guarantee lapses unseen."], ["14", "Data requests", "Requests to any department; required documents; due dates; reminders; escalation", "Inputs arrive on time, or the delay is visible."], ["15", "Entity and SPV setup", "Companies and SPVs; SAP company codes; data separation; group view", "Each entity's books kept apart."], ["16", "Reports", "MSME, ageing, payment advice, WBS payments and P&L, asset, income tax reports; export", "Reports generated, not rebuilt."], ["17", "Dashboards and MIS", "The eighteen dashboards of Section 3; drill-down to the SAP reference; management packs", "Management sees the position without asking."], ["18", "SAP extraction, roles and audit", "Read-only extraction from FI, MM and SD by company and period; role and company access; audit trail", "SAP remains the books; the platform explains them."]], "open": ["That the nine-stage process set out in Section 1 reflects how Accounts operates today.", "That the twenty workflows in Section 2 are complete, and that none of the team's work falls outside them.", "The list of companies and special purpose vehicles to be covered, and their SAP company codes.", "The vendor registration form, the documents required and the vendor categories in use.", "When vendor GST should be checked — daily, monthly or at payment — and what source is used.", "The policy for one-time accounts and who approves them.", "What \"FI – SAP account synchronisation\" refers to, and between which records.", "What \"selection of service while raising\" should cover for service and admin vendors.", "The checks required before payment, who approves, and who releases the payment.", "How MSME vendors are identified, and how the forty-five-day clause is applied.", "The format and recipients of payment advices.", "The prepaid items to be scheduled, beyond insurance.", "The approval route for asset sale and rent.", "Whether the tax depreciation schedule should be prepared here or with the Direct Tax team.", "How WBS payments and P&L should be defined, and at what level.", "Whether the bank guarantee register should be shared with the Contract department's security register.", "The SAP boundary, confirmed with the SAP owner, including the reports and fields the platform should read.", "Whether current Excel reports, schedules and trackers should be migrated at go-live."], "sap": {"1": ["Vendor and customer master", "FI", "Read"], "2": ["One-time vendor postings", "FI", "Read"], "3": ["Vendor GSTIN", "FI", "Read"], "4": ["PO, GRN (MIGO) and invoice (MIRO) status", "MM / FI", "Read"], "5": ["Open items; vendor balances; company code", "FI", "Read"], "6": ["MSME flag; invoice dates; open items", "FI", "Read"], "7": ["Payment documents and payment runs", "FI", "Read"], "8": ["Customer invoices (SD billing) and receipts", "SD / FI", "Read"], "9": ["Manual GL postings; bank statement items", "FI", "Read"], "10": ["Prepaid GL balances", "FI", "Read"], "11": ["Asset acquisitions, sales and retirements", "AA", "Read"], "12": ["Asset master and values for tax depreciation", "AA", "Read"], "13": ["BG references, if held in SAP", "FI / TRM", "Read"], "15": ["Company codes and SPVs", "FI", "Read"], "16": ["Ageing; WBS payments and P&L", "FI / PS", "Read"]}}, "finance": {"key": "finance", "name": "Finance", "intro": ["Finance is the treasury side of F&A. It arranges the bank guarantees, letters of credit, surety bonds, EMDs and fixed deposits the business needs to bid and execute work, and keeps track of the bank limits behind them. It raises finance for vehicles and equipment, manages working capital and short-term loans, deals with banks, NBFCs and financial institutions, and schedules every outgoing payment through Treasury.", "SAP holds loans, fixed deposits, equipment finance and the financial reports. Almost everything around them — guarantee requests, limits by bank and project, expiry dates, loan NOCs, dues and follow-ups with other teams — is managed by hand in Excel and email. The work runs through nine stages."], "insight": "The question at the centre is whether the limit is free. Every guarantee, LC or bond uses part of a non-fund-based limit at a particular bank, and every release gives it back. Today that balance is worked out in Excel, so the available limit is only as current as the last person who updated the sheet — and a guarantee nobody asks to release keeps the limit blocked.", "flowcap": "Master flow — nine stages from a request for security to management reporting", "flow": [{"t": "1. Request", "s": "from Bidding, Contract, P&M", "dec": false, "hl": false}, {"t": "2. Guarantees and Limits", "s": "BG against bank limit", "dec": false, "hl": false}, {"t": "3. LC, Bonds, EMD", "s": "by bank or insurer", "dec": false, "hl": false}, {"t": "Limit free?", "s": "bank and project", "dec": true, "hl": false}, {"t": "Arrange", "s": "margin, FD or another bank", "dec": false, "hl": false}, {"t": "4. Issued and Live", "s": "limit debited, project tagged", "dec": false, "hl": true}, {"t": "5. Expiry and Release", "s": "extend or return", "dec": false, "hl": true}, {"t": "6. Equipment Finance", "s": "per machine, NOC, RC", "dec": false, "hl": false}, {"t": "7. Loans and WC", "s": "dues and interest", "dec": false, "hl": false}, {"t": "8. Treasury Payments", "s": "every outgoing payment", "dec": false, "hl": true}, {"t": "9. Banks, Reconciliation, MIS", "s": "directory, SAP, bank", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Requests from Bidding, Contract and Other Teams", "text": "Most work starts with another team. Bidding needs a bid security or EMD for a tender; Contract needs a performance or advance guarantee after award; P&M needs finance for a machine; Purchase may need an LC. The request reaches Finance by email with the amount, beneficiary, date and format.", "nodes": [{"t": "Need arises", "s": "tender, award, purchase", "dec": false, "hl": false}, {"t": "Request to Finance", "s": "amount, date, format", "dec": false, "hl": false}, {"t": "Complete?", "s": "docs and date", "dec": true, "hl": false}, {"t": "Returned", "s": "to the requester", "dec": false, "hl": true}], "note": "Late or incomplete requests are the most common cause of a delayed guarantee. The required date often arrives after the work should have started."}, {"title": "Stage 2 — Bank Guarantees and Limits", "text": "PIL uses several types of guarantee — bid, performance, advance, retention and others. Each is non-fund based and issued against a limit at a particular bank. An issue is debited from the limit and a release is credited back. The team needs to see the limit by bank, by project and in total, and what is still available.", "nodes": [{"t": "Limit by bank", "s": "sanctioned, type, validity", "dec": false, "hl": false}, {"t": "BG issued", "s": "limit debited", "dec": false, "hl": true}, {"t": "Live", "s": "project and beneficiary", "dec": false, "hl": false}, {"t": "Released", "s": "limit credited", "dec": false, "hl": false}], "note": "Each bank has its own forms. Bank action stays with the bank's portal or process; the platform keeps the request, the documents, the status and the effect on the limit."}, {"title": "Stage 3 — Letters of Credit, Surety Bonds, EMD and FDs", "text": "Letters of credit follow much the same life as a guarantee but serve a different purpose — securing payment to a supplier. Surety bonds are arranged through insurers where a client accepts them in place of a guarantee. EMDs are paid for tenders, and fixed deposits are placed as EMD or as margin against a limit.", "nodes": [{"t": "LC opened", "s": "for a supplier", "dec": false, "hl": false}, {"t": "Surety bond", "s": "through an insurer", "dec": false, "hl": false}, {"t": "EMD paid", "s": "refund after result", "dec": false, "hl": true}, {"t": "FD placed", "s": "EMD or margin, lien", "dec": false, "hl": false}], "note": "EMD refunds depend on Bidding telling Finance the tender result. FD maturity and lien sit in SAP but are not linked to the guarantee or tender they support."}, {"title": "Stage 4 — Issued, Live and Project-wise", "text": "Once an instrument is issued, Finance records the bank, reference, amount, beneficiary, project, issue and expiry dates, and sends the original or copy where it needs to go. From this point it counts against the project's exposure and the bank's limit.", "nodes": [{"t": "Bank issues", "s": "reference received", "dec": false, "hl": false}, {"t": "Recorded", "s": "bank, project, dates", "dec": false, "hl": true}, {"t": "Sent", "s": "to client or supplier", "dec": false, "hl": false}, {"t": "Exposure", "s": "by project and bank", "dec": false, "hl": false}], "note": "The Contract and Accounts documents each propose a guarantee register. We suggest one register, owned by Finance and read by the other two teams."}, {"title": "Stage 5 — Expiry, Extension and Release", "text": "As expiry approaches, the team that asked for the instrument must say whether it is to be extended or released. If a bid is lost or work is complete, the guarantee should come back and the limit be freed. Today this depends on reminders by email.", "nodes": [{"t": "Expiry near", "s": "30, 60, 90 days", "dec": false, "hl": false}, {"t": "Owner asked", "s": "Contract or Bidding", "dec": false, "hl": true}, {"t": "Extend?", "s": "still required", "dec": true, "hl": false}, {"t": "Released", "s": "limit freed", "dec": false, "hl": false}], "note": "A late decision either lets a guarantee lapse or keeps limit blocked for nothing. Invocation and other exceptions need their own route, with Legal involved."}, {"title": "Stage 6 — Vehicle and Equipment Finance", "text": "Vehicles and machines are financed through banks and NBFCs. For each one Finance needs the financier, loan amount, instalments, balance and status. When the loan is complete, the NOC is taken, the RC book is updated to remove the lender, and the machine is free to move or be sold. P&M holds the machine list.", "nodes": [{"t": "Machine", "s": "from P&M list", "dec": false, "hl": false}, {"t": "Finance taken", "s": "bank or NBFC", "dec": false, "hl": false}, {"t": "Instalments", "s": "month by month", "dec": false, "hl": false}, {"t": "Loan closed", "s": "NOC received", "dec": false, "hl": true}, {"t": "RC updated", "s": "free to move or sell", "dec": false, "hl": false}], "note": "Equipment finance is recorded in SAP, but the link to the exact machine, the NOC and the RC book status are kept separately. Without a firm machine reference, a loan can be matched to the wrong asset."}, {"title": "Stage 7 — Working Capital and Short-term Loans", "text": "Working capital facilities and short-term loans are drawn, serviced and renewed. Dues, interest dates and renewals are followed by hand.", "nodes": [{"t": "Sanctioned", "s": "limit and terms", "dec": false, "hl": false}, {"t": "Drawn", "s": "as needed", "dec": false, "hl": false}, {"t": "Dues", "s": "interest and principal", "dec": false, "hl": true}, {"t": "Repaid or renewed", "s": "with the bank", "dec": false, "hl": false}], "note": "Interest and principal are calculated and posted in SAP. What is missing is a calendar of what falls due, and a reminder before it does."}, {"title": "Stage 8 — Treasury Payment Scheduling", "text": "All outgoing payments are scheduled by Treasury. Requests come from projects, vendors, offices and employees — including tour requests approved by a manager and processed by Accounts. Finance checks each against budget and documents, management approves, and the payment is made through SAP and the bank.", "nodes": [{"t": "Payment request", "s": "project, vendor, office", "dec": false, "hl": false}, {"t": "Finance check", "s": "budget and documents", "dec": false, "hl": false}, {"t": "Approved", "s": "by management", "dec": false, "hl": false}, {"t": "Scheduled", "s": "by Treasury", "dec": false, "hl": true}, {"t": "Paid", "s": "SAP and bank", "dec": false, "hl": false}], "note": "The platform tracks readiness and approval only. It does not create invoices, post entries, release payments or send bank instructions."}, {"title": "Stage 9 — Banks, Fixed Assets, Reconciliation and MIS", "text": "Finance keeps contacts and documents for many banks, NBFCs and financial institutions. It needs to know, for each fixed asset, whether it
