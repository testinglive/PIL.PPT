isation", "Equipment no longer needed", "Plant and Machinery", "Machinery transferred, hired equipment returned, RTO formalities and insurance and warranty documents transferred"], ["13", "Inventory transfer and scrap", "Stock review", "Stores, Procurement", "Book stock against physical stock with variance, and each item transferred or scrapped"], ["14", "Site administration close-out", "Demobilisation start date", "HR and Admin", "Leases, licences and connections cancelled; SIM, data and visiting cards cancelled; landowner NOC; labour licence documents submitted"], ["15", "Financial close-out", "Closure record opened", "Finance and Accounts", "BGs, FDRs and LCs released, bank accounts closed, taxes, creditors, debtors and deposits settled or carried forward"], ["16", "Claims, cases and POA close-out", "Closure record opened", "Contract, Legal", "Open claims and cases carried forward with owners; POAs for the project revoked"], ["17", "Maintenance handover", "Final takeover or COD", "Project team, maintenance team or company", "A handover pack accepted by the maintenance side"], ["18", "Demobilisation plan against actual", "Demobilisation start date", "All departments", "Planned and actual demobilisation by department, with variance"], ["19", "Closure report and synopsis", "All checklists closed or carried forward", "Project head, Planning, Finance", "The closure report and synopsis, filled from the records rather than typed"], ["20", "Lessons learnt", "Any event during the project, and at closure", "All departments, management", "Events, lessons and actions recorded and searchable for future projects"]], "dashboards": [["1", "Closure pipeline", "Projects nearing completion, in closure and closed, across the portfolio", "cap"], ["2", "Project closure readiness", "For one project, checklist items closed and open by department", "cap"], ["3", "My closure items", "Each user's checklist items and remaining tasks, by date", "cap"], ["4", "Punch list", "Internal and external punch items by owner, action date and status", "cap"], ["5", "Remaining tasks", "Everything overdue or carried forward, with owner and age", "cap"], ["6", "Client completion", "Takeover certificates and COD by project, with dates and pending points", "cap"], ["7", "Demobilisation plan against actual", "Planned and actual demobilisation by department, with variance", "now"], ["8", "Manpower demobilisation", "People surplus, transferred, relieved, and F&F pending, with recommendations", "cap"], ["9", "Plant and machinery", "Equipment transferred, hired equipment returned, RTO formalities pending", "cap"], ["10", "Inventory and material reconciliation", "Book stock against physical stock and value difference, transferred and scrapped", "sap"], ["11", "Subcontractor close-out", "Work orders open and closed, NOCs, final bills and evaluations pending", "sap"], ["12", "Guarantees and deposits", "BGs, FDRs and LCs to be released to vendors and by the client, with validity and follow-up owner", "sap"], ["13", "Accounts, taxes and liabilities", "Bank accounts to close, taxes payable and realisable, creditors, debtors, PF and labour welfare dues", "sap"], ["14", "Leases, licences and NOCs", "Agreements, connections, statutory licences and cards cancelled or live, and NOCs received", "cap"], ["15", "Carried-forward matters", "Open claims, legal cases and POAs that outlive the project, with owners", "cap"], ["16", "Project performance", "Baseline against actual dates and budget, LOA revenue against actual and collection, cost and margin", "sap"], ["17", "Lessons learnt library", "Lessons across projects by event type, client, project type and department", "cap"], ["18", "Closure MIS", "The management view across projects in closure — readiness, money held, items overdue, carried-forward matters", "cap"]], "obs": "We note that closure is the point where every earlier department's records are tested. Where those records are held in the platform — drawings, quality results, bills, claims, POAs — the closure checklist can read them rather than ask for them again.", "interactions": [["Site execution", "Punch lists, reconciliations, COD collection, balance work report", "Testing results, design sign-off, material data", "Sheets and site folders."], ["Planning", "Completion progress, closure trigger, demobilisation dates", "Department status", "HO visit at around 90% completion."], ["Billing", "Final client and subcontractor bills", "Measurements, NOCs, reconciliations", "Part of the HO site visit."], ["Design and engineering", "As-builts, takeover certificates, correspondence, claim details", "Site markings of what was built", "Drawings on file."], ["Quality and safety", "Final testing, QA sign-off, safety audit", "Completed work, punch list status", "Reports filed separately."], ["Procurement and purchase", "PO and PR closure, licences, warranties, material reconciliation", "Stock position, vendor documents", "Checklist in Excel; orders in SAP."], ["HR and administration", "Manpower demobilisation, F&F, leases, licences, cards, landowner NOC", "Project head's recommendations on staff", "Demobilisation sheets."], ["Plant and machinery", "Equipment transfer, hire returns, RTO, asset documents", "Transfer destinations from other projects", "Transfer lists."], ["Techno-commercial", "Work order closure, subcontractor NOC, final bill, SD, evaluation", "Billing and material reconciliation", "Checklist in Excel; work orders in SAP."], ["Finance and accounts", "BG, FDR and LC release, bank accounts, taxes, creditors and debtors", "Release conditions from Contract and project head remarks", "Demobilisation sheets; values in SAP."], ["Contract", "Open claims documented, claim tracker updated, securities from client", "Takeover and COD dates", "Claim tracker."], ["Legal", "POAs closed, cases listed", "Project team exits", "POA and case trackers."], ["Maintenance team or company", "Accepts the handover", "As-builts, warranties, obligations", "Not defined."], ["Client", "Closure points, takeover certificates, COD, security release", "Completed work and documents", "Formal letters through Contract."]], "profile": [["Ownership", "No closure department", "Every department closes its own part. The platform has to provide the shared view that no single team holds, and someone has to own it; this is raised in Section 8."], ["Team size", "Drawn from every department", "The users are the same people who use the other departmental modules, which is why closure should read their existing records rather than start again."], ["Closure process", "Department by department", "Nothing specific has been defined for closure as a whole. The formats shared with us are the starting point for templates."], ["Trigger", "About 90% work completion", "The HO visit marks the start. It can be raised automatically from progress data."], ["Client milestones", "Client closure points and COD", "Received from the client; they start the DLP, security release and maintenance clocks."], ["After completion", "Separate maintenance department or company", "Closure ends with a formal handover, not only an internal close."]], "tools": [["Document checklist", "What each department must close", "Becomes the checklist templates, configurable per department and project type."], ["Demobilisation plan", "Ten sheets covering manpower, recoveries, BGs, bank accounts, taxes, leases, PF, cards and inventory", "Replaced by structured registers under each department's checklist."], ["Demobilisation plan against actual", "Department-wise variance", "Produced from the registers rather than kept separately."], ["Closure report and synopsis", "Baseline against actual, budget, revenue, cost, margin", "Generated from project, planning and SAP data, and completed by the project head."], ["Lessons learnt report", "Event, lesson, action", "Replaced by a lessons library searchable across projects."], ["Task tracker", "Remaining items", "Replaced by the remaining-tasks tracker linked to each checklist."], ["SAP", "Orders, stock, work orders, guarantees, accounts, financial results", "Retained and unchanged. Closures that happen in SAP stay there; the platform reads their status and figures."]], "pains": [["1", "No one owns closure as a whole", "Each department finishes its list, but nobody can say when the project is closed.", "One closure record per project with a named owner and a combined status."], ["2", "Each department keeps its own checklist", "There is no view of all checklists together, or of what is left.", "Checklist templates per department, issued together and tracked on one screen."], ["3", "Departments start when their part comes", "Starts are uneven and some items begin too late.", "A defined trigger that issues every checklist on the same date."], ["4", "Punch lists are kept in sheets", "Owners and action dates are written down, but nothing follows them up.", "Punch items with owner, date, photograph, reminders and closure, on mobile."], ["5", "Remaining tasks need to be visible", "The department asked for them to be shown in a task tracker.", "A remaining-tasks tracker fed by every checklist."], ["6", "COD and takeover are not linked to internal close-out", "The dates that start DLP, security release and handover are held separately.", "Client completion recorded against the closure record, starting dependent dates."], ["7", "Demobilisation runs across ten sheets", "Manpower, recoveries, guarantees, accounts, taxes, leases, PF, cards and inventory are compiled by hand.", "Structured registers per area, owned by the responsible department."], ["8", "Book and physical stock are compared in Excel", "Variance is found late and explained later.", "Stock read from SAP and compared with physical count in the platform."], ["9", "Guarantees and deposits wait for follow-up", "Money stays held until someone chases release.", "A release register with validity, clause, contact and reminders."], ["10", "Subcontractor NOCs and final bills can be missed", "A subcontractor without an NOC can raise claims after the project closes.", "No subcontractor closed without NOC, final bill and SD statement."], ["11", "Leases, connections and cards are cancelled by hand", "Anything left live keeps costing after the site is gone.", "A cancellation list with owners and dates, checked before closure."], ["12", "Staff recommendations sit in a sheet", "The project head's view of each person does not reach the next project.", "Recommendations recorded against the person and visible to HR."], ["13", "The handover to maintenance is not defined", "The maintenance side may not receive drawings, warranties and obligations in one pack.", "A handover pack with acceptance by the maintenance side."], ["14", "Closure report and synopsis are compiled at the end", "The data exists across departments but is collected again.", "Reports generated from the records and SAP, completed by the project head."], ["15", "Lessons learnt are filed, not reused", "The next project cannot find them.", "A lessons library searchable by project type, client, event and department."], ["16", "Claims and cases outlive the project", "They risk being lost when the site team disperses.", "Carried-forward matters with named owners, linked to the Contract and Legal modules."]], "scope": [["1", "Closure record and trigger", "Closure record per project; trigger from progress threshold; likely completion and demobilisation dates; HO visit record; owner", "One place that says whether a project is closing, and who owns it."], ["2", "Checklist templates", "Templates per department from the document checklist; configurable by project type and client; mandatory evidence; versioning", "Every department's list defined once and issued the same way on every project."], ["3", "Department checklist workspace", "Items with owner and target date; evidence upload; sign-off; not-applicable with reason and approval; carry-forward", "Each department closes its part with proof, visible to everyone else."], ["4", "Punch list and remaining tasks", "Internal and external punch items; responsible person and action date; photographs; mobile capture; reminders and escalation; remaining-tasks tracker", "What is left is known, owned and followed up."], ["5", "Testing, QA and safety close-out", "Final test records; QA sign-off; safety audit findings and closure; link to the Quality module", "The physical work signed off before it is handed over."], ["6", "Client completion", "Client closure points; provisional and final takeover certificates; COD; dependent dates for DLP, security release and handover", "Client milestones recorded once and used by every department that depends on them."], ["7", "Design and document close-out", "As-built drawings; reconciliation sheet; correspondence and claim details; link to the Design and Contract modules", "The final technical record held against the project."], ["8", "Manpower demobilisation", "Surplus schedule with expertise and recommendation; transfer or relief; full and final; recoveries and payments; PF and labour welfare liabilities", "People released or redeployed with dues settled and recommendations kept."], ["9", "Plant, machinery and inventory", "Equipment transfer; hired equipment return; RTO formalities; insurance and warranty documents; SAP book stock against physical; transfer and scrap", "Assets and stock accounted for before the site closes."], ["10", "Subcontractor and procurement close-out", "Work order and PO/PR closure status from SAP; final bill; NOC; credit and debit with SD; subcontractor evaluation; licences; performance warranties", "No supplier or subcontractor left open."], ["11", "Site administration close-out", "Leases, licences and connections; guest house and labour colony; SIM, data and visiting cards; landowner NOC; labour licence submission", "Nothing left live that keeps costing money."], ["12", "Financial close-out tracker", "BGs, FDRs and LCs to and from vendors and client, with clause, validity and follow-up contact; bank accounts; taxes; creditors, debtors and deposits; values read from SAP", "Money held is released on time, and what is owed is settled or carried forward."], ["13", "Carried-forward matters", "Open claims, legal cases and POAs linked from the Contract and Legal modules; new owners after closure", "What outlives the project stays owned."], ["14", "Maintenance handover", "Handover pack of as-builts, warranties, asset documents and obligations; acceptance by the maintenance team or company", "A formal transfer instead of a set of files sent on request."], ["15", "Closure report and synopsis", "Baseline against actual dates, hours and budget; deliverables and benefits; CAPEX and OPEX; revenue, collection, cost and margin from SAP; recommendations", "The closure report drafted by the system and completed by the project head."], ["16", "Lessons learnt library", "Event type, description, lesson and action; captured during and at the end of the project; search by project type, client and department", "Lessons the next project can find."], ["17", "Dashboards, MIS and reports", "The eighteen dashboards of Section 3; demobilisation plan against actual; export to Excel and PDF", "Management sees closure status across projects without asking for it."], ["18", "SAP references, roles and audit", "Read project, WBS, stock, order, guarantee, account and financial status from SAP; department roles; full audit trail", "Closure reads the same records the business uses, without a second ledger."]], "open": ["That the nine-stage process set out in Section 1 reflects how projects are closed today.", "That the twenty workflows in Section 2 are complete, and that no department's closure work falls outside them.", "Who should own closure for a project — the project manager, project head, business unit head or Planning — and who gives the final sign-off.", "That closure starts at around ninety percent work completion with the HO visit, and how that percentage is measured.", "That the document checklist is complete, and whether Planning, Billing, Quality and Safety should have their own checklists in it.", "The client closure points by client or authority, and how COD relates to the provisional and final takeover certificates.", "Which department or company takes over maintenance, what it must receive, and who accepts the handover.", "Which closure activities happen in SAP — order closure, stock transfer, account closure — so the platform reads their status rather than repeating them.", "Whether a project can be closed with claims, cases or dues still open, and who approves carrying them forward.", "Who may mark a checklist item as not applicable.", "The meaning of \"premium and warranty from required team members\" in our notes, and which warranties Purchase collects.", "Who carries out the safety audit, and in what format.", "Who prepares and receives the closure report and synopsis, and whether their current formats should be kept as they are.", "Who contributes to lessons learnt, who reviews them, and whether tender and planning teams should see them.", "The remaining materials promised by the team — DPR, design documents and BOQ — so that the closure templates can be completed.", "Whether projects already in closure, and closure reports and lessons from past projects, should be migrated at go-live."], "sap": {"1": ["Project progress and status", "PS", "Read"], "9": ["Book stock by project; asset register for plant and machinery", "MM / AA", "Read"], "10": ["Open PR, PO and work order status; final bill status", "MM", "Read"], "12": ["BG, FDR and LC references; vendor and customer balances; deposits", "FI / TRM", "Read"], "15": ["Revenue, collection, cost and margin by project", "FI / CO / PS", "Read"]}}, "safety": {"key": "safety", "name": "Safety", "intro": ["Safety is involved from the bid to the handover of the finished road. At the bid, it prepares the safety plan, policy and budget. After award, it writes the safety and environment plan for the whole project, inducts every worker, and then runs the site every day — attendance, toolbox talks, first aid, inspections, permits and observations. It buys and issues safety equipment through Purchase and Stores, attends NHAI's quarterly safety audits, responds to accidents, and at the end checks the road furniture with the Independent Engineer and NHAI.", "Most of the department is at site: thirty to thirty-seven people across projects, with one person at head office. Its records today are Excel sheets, signed papers and files. The work runs through nine stages."], "insight": "Stages four to seven repeat every day, week and month for as long as the project runs, and that is where the volume is. An accident moves the work into stage eight at once: the injured person is cared for, the head office is told, and the reason has to be found and recorded. At completion, the road furniture and signage are reviewed by the Independent Engineer and NHAI before the road is handed over.", "flowcap": "Master flow — nine stages from the bid to the road safety handover", "flow": [{"t": "1. Bid Planning", "s": "plan, policy, budgets", "dec": false, "hl": false}, {"t": "2. HSE Plan", "s": "for the whole project", "dec": false, "hl": false}, {"t": "3. Induction", "s": "every worker, signed", "dec": false, "hl": true}, {"t": "4. Daily Controls", "s": "attendance, TBT, first aid", "dec": false, "hl": true}, {"t": "5. Inspections and Permits", "s": "weekly and monthly", "dec": false, "hl": false}, {"t": "6. PPE and Materials", "s": "Purchase, Stores, issue", "dec": false, "hl": false}, {"t": "7. Audits", "s": "NHAI every 3 months", "dec": false, "hl": false}, {"t": "Incident?", "s": "on site", "dec": true, "hl": false}, {"t": "8. Incident Response", "s": "care, report, investigate", "dec": false, "hl": true}, {"t": "9. Road Safety Handover", "s": "IE and NHAI review", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Bid Safety Planning and Budget", "text": "During bidding, Safety helps prepare the safety plan and policy and the budgets that go with them — safety, safety manpower and environment. A site visit informs the plan.", "nodes": [{"t": "Tender received", "s": "safety requirements", "dec": false, "hl": false}, {"t": "Site visit", "s": "conditions and risks", "dec": false, "hl": false}, {"t": "Plan and policy", "s": "for the bid", "dec": false, "hl": false}, {"t": "Budgets", "s": "safety, manpower, environment", "dec": false, "hl": true}], "note": "The budget set at the bid is the baseline that later purchases and manpower should be measured against, but the two are not linked today."}, {"title": "Stage 2 — Project HSE Plan", "text": "After award, Safety prepares the safety and environment plan for the entire project, covering site conditions, diversions, environmental controls and events. It sets out the activities, their hazards and controls, the emergency arrangements, the traffic and signage plan for the road, and the safety activities planned through the project.", "nodes": [{"t": "Project awarded", "s": "bid plan as the base", "dec": false, "hl": false}, {"t": "Risks and controls", "s": "by activity", "dec": false, "hl": false}, {"t": "Diversions and traffic", "s": "signage plan", "dec": false, "hl": false}, {"t": "HSE plan approved", "s": "with activities plan", "dec": false, "hl": true}], "note": "The plan is a document. Nothing links the controls it requires to the inspections, permits and toolbox talks that are meant to carry them out."}, {"title": "Stage 3 — Induction and Onboarding", "text": "At the start of the project and whenever new workers arrive, Safety holds an induction: workers are introduced, a presentation is given, safety hoardings are put up and the safety rules are explained. Each worker signs. Identity details are taken, the employee master is updated and labour details are passed to HR. Subcontractors receive the safety policies and sign them.", "nodes": [{"t": "Worker arrives", "s": "company or subcontractor", "dec": false, "hl": false}, {"t": "Induction", "s": "presentation and rules", "dec": false, "hl": false}, {"t": "Signature taken", "s": "on paper", "dec": false, "hl": true}, {"t": "Details to HR", "s": "ID and labour details", "dec": false, "hl": true}], "note": "Contract labour changes often. A worker who has not been inducted cannot be told apart from one who has without going back to the signed sheets."}, {"title": "Stage 4 — Daily Site Controls", "text": "Every day the site safety team goes to the working area, takes worker attendance, verifies labour details, checks the site and confirms first aid is available. Before work starts, a toolbox talk covers the day's activities, hazards and precautions, with each attendee's name and signature recorded.", "nodes": [{"t": "Attendance", "s": "workers on site", "dec": false, "hl": false}, {"t": "Labour verified", "s": "against records", "dec": false, "hl": false}, {"t": "Toolbox talk", "s": "topic and signatures", "dec": false, "hl": true}, {"t": "Site check", "s": "first aid, conditions", "dec": false, "hl": false}], "note": "This happens on every working day on every site. Each of these steps is a paper or Excel entry today."}, {"title": "Stage 5 — Inspections, Permits and Observations", "text": "The site team carries out weekly and monthly observations against checklists — fire, lifting, painting, work permits and work at height among them — with evidence attached. Permits control hazardous work. Unsafe acts and conditions are recorded, and a safety violation system deals with repeat or serious breaches.", "nodes": [{"t": "Checklist due", "s": "weekly or monthly", "dec": false, "hl": false}, {"t": "Inspection", "s": "with evidence", "dec": false, "hl": false}, {"t": "Observation raised", "s": "owner and date", "dec": false, "hl": true}, {"t": "Closed?", "s": "verified", "dec": true, "hl": false}, {"t": "Violation", "s": "escalated", "dec": false, "hl": false}], "note": "Checklists are kept in Excel. An observation written in a sheet has no owner who is reminded, and no one can see which are still open across sites."}, {"title": "Stage 6 — PPE and Safety Materials", "text": "Safety estimates the safety products needed and raises the requirement with Purchase. Purchase buys and sends the material to Stores. Safety then draws from Stores as work requires and issues equipment to workers. The store team also carries out weekly inspections and holds road signboards and safety material.", "nodes": [{"t": "Estimate", "s": "safety products", "dec": false, "hl": false}, {"t": "PR raised", "s": "to Purchase", "dec": false, "hl": false}, {"t": "Received in store", "s": "SAP", "dec": false, "hl": false}, {"t": "Issued to site", "s": "and to workers", "dec": false, "hl": true}, {"t": "Worn and replaced", "s": "not recorded", "dec": false, "hl": true}], "note": "Purchase and stock sit in SAP. Who received which item, and when it was replaced, is not recorded anywhere, so an incident cannot show whether the right equipment had been issued."}, {"title": "Stage 7 — Audits and Performance Monitoring", "text": "NHAI conducts a safety audit every three months, which the safety team attends. Clients carry out their own audits. Internally, a half-yearly monitoring system runs, a monthly management review takes place, and safe man-hours achieved are tracked.", "nodes": [{"t": "Audit scheduled", "s": "NHAI, client, internal", "dec": false, "hl": false}, {"t": "Audit attended", "s": "by safety team", "dec": false, "hl": false}, {"t": "Findings", "s": "owner and target date", "dec": false, "hl": true}, {"t": "Closed with evidence", "s": "before next audit", "dec": false, "hl": false}], "note": "Safe man-hours and monitoring figures are compiled from site sheets for each review."}, {"title": "Stage 8 — Incident Response and Investigation", "text": "When an accident happens, the site follows the set guidelines, and for serious cases the injured are taken to hospital. The head office team reports on any casualty: whether one occurred and why. The cause is investigated, responsibility and precautions are recorded, and the facts go to Legal and Insurance where the matter goes further.", "nodes": [{"t": "Incident", "s": "on site", "dec": false, "hl": false}, {"t": "Immediate care", "s": "first aid or hospital", "dec": false, "hl": true}, {"t": "HO informed", "s": "casualty report", "dec": false, "hl": false}, {"t": "Investigation", "s": "cause and precautions", "dec": false, "hl": false}, {"t": "Legal, Insurance", "s": "where required", "dec": false, "hl": false}], "note": "Motor accident claims handled by Legal often start here. The facts collected at site in the first hours are what the case later depends on."}, {"title": "Stage 9 — Road Safety Handover and Closure", "text": "Once construction is complete, Safety checks the road furniture and signage and has it reviewed by the Independent Engineer and NHAI. Their feedback is taken and the required changes made. Safety items are also part of project closure — signboards, the management review, and the closing safety records.", "nodes": [{"t": "Road furniture check", "s": "signs, markings, barriers", "dec": false, "hl": false}, {"t": "IE and NHAI review", "s": "joint inspection", "dec": false, "hl": true}, {"t": "Feedback applied", "s": "as discussed", "dec": false, "hl": false}, {"t": "Safety closure", "s": "records complete", "dec": false, "hl": false}], "note": "Feedback from the review is agreed in discussion. Recording it as items with owners would show when the road is ready to hand over."}], "extra": {"title": "Checks, permits and records", "heads": ["Item", "When", "What it needs in the system"], "rows": [["Worker attendance and TBT", "Daily", "Attendee list with signature or photo, topic and trainer"], ["Fire safety", "Weekly or monthly", "Checklist per extinguisher and location, with evidence"], ["Lifting", "Weekly or monthly", "Equipment and operator checks, linked permit"], ["Work at height", "Per activity", "Permit with controls, validity and closure"], ["Work permits", "Per activity", "Issuer and receiver, hazards, validity window, closure"], ["Painting", "Weekly or monthly", "Checklist with evidence"], ["Store inspection", "Weekly", "Store team checklist, safety stock condition"], ["Environment", "As planned", "Readings for dust, air and noise against thresholds"], ["Road signage and furniture", "During diversions and at completion", "Inspection against the traffic and signage plan"]]}, "workflows": [["1", "Bid safety input", "Tender under preparation", "Safety, Tender", "Safety plan, policy and budgets for safety, manpower and environment, with the site visit recorded"], ["2", "Project HSE plan and risk register", "Project awarded", "Safety, Planning, project head", "An approved plan with activities, hazards, controls, emergency contacts and planned safety activities"], ["3", "Traffic and diversion plan", "Work on or beside a live road", "Safety, site, client", "An approved signage and diversion plan per work zone, with implementation checks"], ["4", "Subcontractor safety agreement", "Work order issued", "Safety, Techno-commercial, subcontractor", "Safety policies signed by the subcontractor and held against the work order"], ["5", "Worker induction", "New worker or project start", "Safety, worker", "Induction recorded with rules acknowledged and signature, before the worker is deployed"], ["6", "Worker record and verification", "Induction", "Safety, HR", "Identity, employer, medical fitness and labour details recorded and shared with HR, with restricted access"], ["7", "Daily attendance and site check", "Each working day", "Site safety team", "Attendance, labour verification and first-aid check recorded per site"], ["8", "Toolbox talk", "Each working day, before work", "Site safety team, workers", "Topic, hazards, attendees and signatures recorded, with photographs"], ["9", "Observation checklists", "Weekly and monthly schedule", "Site safety team", "Completed checklists for fire, lifting, painting and others, with evidence and findings"], ["10", "Permit to work", "Hazardous activity planned", "Safety, site, receiver", "A permit with hazards, controls, validity, approvals and closure"], ["11", "Observation and violation", "Unsafe act or condition found", "Safety, responsible party", "An observation with owner, target date and closure; repeat or serious cases escalated through the violation system"], ["12", "Environmental monitoring", "Monitoring schedule", "Safety", "Readings for dust, air and noise against thresholds, with reports attached"], ["13", "PPE requirement and purchase request", "Estimate or low stock", "Safety, Purchase", "A requirement raised to Purchase and tracked to receipt in store"], ["14", "PPE issue and custody", "Worker needs equipment", "Safety, Stores, worker", "Items issued to a named worker, with acknowledgement, replacement and return"], ["15", "Store and signage inspection", "Weekly schedule", "Store team, Safety", "Store and road signboard inspections recorded with findings"], ["16", "External safety audit", "NHAI every three months, or client audit", "Safety, NHAI or client", "Audit visit recorded, findings assigned and closed with evidence"], ["17", "Internal monitoring and review", "Monthly and half-yearly", "Safety, management", "Monthly management review and half-yearly monitoring, with safe man-hours"], ["18", "Incident response", "Accident or near miss", "Site, Safety, HO, hospital", "Immediate action and notifications recorded, with photographs and evidence"], ["19", "Investigation and casualty reporting", "Incident recorded", "Safety, HO, Legal, Insurance", "Cause, responsibility, precautions and actions recorded; casualty report from HO; factual pack for Legal and Insurance"], ["20", "Road furniture review", "Construction complete", "Safety, IE, NHAI", "Joint review recorded, feedback items closed, safety closure completed"]], "dashboards": [["1", "Site safety today", "Workers on site, TBTs done, permits open and observations raised, per site", "cap"], ["2", "HSE plan readiness", "Plan, risk register, emergency contacts and traffic plan in place per project", "cap"], ["3", "Induction status", "Workers inducted, awaiting induction and due for re-induction", "cap"], ["4", "Worker verification", "Identity, fitness and labour details complete and shared with HR", "cap"], ["5", "Toolbox talks", "TBTs held against working days, attendance and topics", "cap"], ["6", "Inspection completion", "Checklists due and done, by type, site and week", "now"], ["7", "Permits", "Permits open, expiring, suspended and closed", "cap"], ["8", "Observations and violations", "Open observations by severity, owner, subcontractor and age; violations raised", "now"], ["9", "Overdue actions", "Corrective actions past their date, from any source", "cap"], ["10", "Audit findings", "NHAI, client and internal findings, open and closed, by project", "cap"], ["11", "Environmental readings", "Dust, air and noise readings against thresholds", "cap"], ["12", "PPE issue and stock", "Requested, in store, issued and due for replacement, by site", "sap"], ["13", "Safety budget", "Bid budget for safety, manpower and environment against actual spend", "sap"], ["14", "Incidents and near misses", "Incidents by type, severity, site, cause and status of investigation", "now"], ["15", "Safe man-hours", "Safe man-hours achieved by project and period", "now"], ["16", "Subcontractor safety", "Policy signed, observations, violations and incidents per subcontractor", "cap"], ["17", "Road furniture and signage", "Signage installed and inspected, IE and NHAI feedback open and closed", "cap"], ["18", "Safety MIS", "The management view across projects — incidents, overdue actions, audits and safe man-hours — monthly and half-yearly", "cap"]], "obs": "We note that the records Safety creates at site in the first hours after an incident are the records Legal, Insurance and the client will rely on months later. Capturing them properly at the time is worth more than compiling them later.", "interactions": [["Tender and BD", "Tender safety requirements", "Safety plan, policy and budgets for the bid", "Prepared as documents for the bid."], ["Planning", "Work programme and activities", "Safety activities plan, hazards per activity", "Aligned informally."], ["Site execution", "Daily activities, work areas", "TBTs, permits, inspections, observations", "On paper and in Excel at site."], ["Subcontractors", "Workers, equipment", "Safety policies to sign, observations, violations", "Signed copies filed."], ["HR and Admin", "Employee master", "Labour details, identity information, induction records", "Passed on by hand."], ["Purchase", "Purchased safety items", "Requirements and specifications", "Requirement raised, purchase in SAP."], ["Stores", "Safety items and signboards, weekly inspection", "Requests for issue", "Issue in SAP; custody to worker not recorded."], ["Quality", "Site conditions from inspections", "Safety observations affecting work", "Separate records."], ["Legal and Insurance", "Requests for facts", "Incident facts and evidence", "Compiled after the event."], ["Contract", "Client letters on safety", "Audit responses and replies to client instructions", "Through formal correspondence."], ["Project Closure", "Closure checklist", "Road furniture review, signage, safety records", "Part of the department checklists."], ["NHAI, IE and client", "Audits, feedback, instructions", "Audit attendance, corrective actions, road furniture for review", "Audit every three months; feedback by discussion."], ["Management", "Direction", "Casualty reports, monthly review, half-yearly monitoring", "Compiled from site sheets."]], "profile": [["Team size", "30 to 37 members; 1 at head office", "Almost the whole department works at site. The mobile app is the main interface, and it has to work where connectivity is poor."], ["Workforce covered", "Company and subcontractor labour", "Labour turns over often. Induction and verification have to be quick to record and easy to check at the gate."], ["Frequency", "Daily, weekly, monthly, quarterly, half-yearly", "Most records are recurring. The system should schedule them and show what is missed."], ["Standards", "An ISO management standard was referenced", "Records should be structured so they can serve as audit evidence; the standard is to be confirmed."], ["Sensitive data", "Identity and medical details", "Held with restricted access, visible only to those who need it."]], "tools": [["Excel", "Checklists, observations, monthly inputs, safe man-hours", "Replaced by structured records on mobile, with dashboards built from them."], ["Paper and signatures", "Induction, TBT, subcontractor policies", "Replaced by digital acknowledgement with signature or photograph."], ["Presentations and hoardings", "Worker induction", "Retained. The presentation is held as the induction content version."], ["Files and folders", "Plans, audit reports, incident records", "Replaced by a project safety repository linked to each record."], ["SAP", "Purchase, stock and budget for safety items", "Retained and unchanged. The platform reads stock and purchase references; issue to workers is recorded in the platform."]], "pains": [["1", "Checklists and monthly inputs are kept in Excel", "Nobody sees the live position across sites, and trends are hard to find.", "Mobile checklists feeding dashboards directly."], ["2", "Induction and TBT signatures are on paper", "Proving who was inducted or attended means finding the sheet.", "Digital attendance with signature or photograph, searchable by worker."], ["3", "Contract labour changes often", "A new worker can start before induction without anyone noticing.", "Induction status checked at deployment, with a warning where it is missing."], ["4", "Labour details go to HR by hand", "The same details are entered twice.", "One worker record, shared with HR."], ["5", "Observations have no tracked owner", "Corrective action is lost after the inspection or audit visit.", "Every observation with owner, target date, reminder and verified closure."], ["6", "Permits are separate from the work they cover", "An expired or unclosed permit is not visible.", "A permit register with validity, approvals and closure."], ["7", "Repeat breaches need a violation system", "Without a record, the same person or subcontractor repeats the same breach.", "A violation register by person and subcontractor, with escalation."], ["8", "PPE issue to workers is not recorded", "After an incident, there is no proof the right equipment was issued.", "Issue to a named worker with acknowledgement and replacement history."], ["9", "PPE demand runs through Purchase and Stores separately", "Safety cannot see where its request stands.", "Request status from requirement to issue, with SAP references."], ["10", "NHAI audits every three months", "Findings must be closed before the next visit, and the evidence found.", "An audit register with findings, owners and closure evidence."], ["11", "Incident information is collected after the event", "Facts gathered late are incomplete, and later cases depend on them.", "Incident reporting from the site app within the hour, with photographs and notifications."], ["12", "Casualty reports are compiled at HO", "The cause and the precautions are not tracked to completion.", "An investigation workflow with cause, actions and verification."], ["13", "Safe man-hours and monitoring are compiled for each review", "The figure is only as current as the last compilation.", "Safe man-hours calculated from attendance and incidents."], ["14", "Road furniture feedback is agreed in discussion", "Items from the IE and NHAI review can be missed.", "Review findings recorded as items with owners and closure."], ["15", "The bid safety budget is not compared with actual spend", "Overspend or underspend on safety is not visible.", "Budget against actual from SAP, by project."], ["16", "Management reporting is periodic", "Critical risks are seen late.", "A live dashboard with alerts for high-risk items."]], "scope": [["1", "Bid safety and budget", "Bid safety plan and policy; budgets for safety, manpower and environment; site visit record; SAP project reference", "The bid baseline kept and carried into the project."], ["2", "Project HSE plan and risk register", "Plan with version; activities, hazards, risk rating and controls; emergency contacts and hospital; safety activities plan; configurable risk library", "A plan whose controls drive the inspections, permits and talks that follow."], ["3", "Traffic and signage plan", "Diversion and signage plan per work zone; revisions and approval; implementation checks", "Road safety planned and checked on the ground."], ["4", "Subcontractor safety", "Policy acknowledgement per subcontractor and work order; subcontractor safety record", "Every subcontractor signed up before work starts."], ["5", "Worker register and induction", "Worker record with employer and site; identity and fitness with restricted access; induction content version; acknowledgement; re-induction alerts; share to HR", "Nobody works without induction, and the record is instant to check."], ["6", "Daily attendance and toolbox talks", "Attendance per site; TBT topic, hazards, trainer, attendees; signature or photograph; first-aid check", "The daily routine recorded in minutes on a phone."], ["7", "Checklist builder and inspections", "Configurable checklists for fire, lifting, painting, electrical, store and others; schedules; evidence; findings", "Every inspection scheduled, done and proven."], ["8", "Permit to work", "Permit types including work at height and hot work; hazards and controls; issuer and receiver; validity; suspension and closure", "No hazardous work without a live, closed-out permit."], ["9", "Observations and violations", "Observation with location, category, severity, photograph, owner and date; verification; violation register by person and subcontractor; escalation", "Unsafe acts corrected, and repeat breaches visible."], ["10", "Environmental monitoring", "Readings for dust, air and noise; location, method and threshold; reports attached; follow-up", "Environmental controls measured, not assumed."], ["11", "PPE and safety materials", "Item catalogue with specification and replacement rule; requirement to Purchase; request status from SAP; issue to worker with acknowledgement; damage, return and replacement", "The right equipment issued to the right person, provably."], ["12", "Audits and corrective action", "Audit schedule for NHAI, client and internal; findings with clause, severity, owner and date; closure evidence; escalation", "Findings closed before the next audit, with proof."], ["13", "Incidents and investigation", "Rapid incident and near-miss report; notifications; evidence; casualty report; investigation with cause and actions; factual pack for Legal and Insurance", "Facts captured at the time, and lessons acted on."], ["14", "Safety performance", "Safe man-hours from attendance and incidents; monthly management review; half-yearly monitoring", "Performance figures that are always current."], ["15", "Road furniture review and closure", "Road furniture and signage inspection; IE and NHAI review findings; closure items for Project Closure", "A handover the client has signed off, item by item."], ["16", "Site mobile app", "All site records on mobile; offline capture and later sync; photographs with time and location", "Site teams record work where it happens."], ["17", "Dashboards, MIS and reports", "The eighteen dashboards of Section 3; alerts for high-risk items; monthly and half-yearly reports; export to Excel and PDF", "Management sees live risk without waiting for a report."], ["18", "SAP references, roles and audit", "Read project, WBS, material, store and purchase references from SAP; site and HO roles; restricted personal data; full audit trail", "Safety records tied to the business's references, without a second stock or finance record."]], "open": ["That the nine-stage process set out in Section 1 reflects how Safety operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The team size, recorded as thirty to thirty-seven with one person at head office, and how many sit on a typical project.", "The full list of checklists and their frequencies, with a copy of each Excel format.", "The permit types in use, and who issues, receives and closes each.", "How the safety violation system works today, and whether violations lead to penalties on subcontractors.", "What worker identity and medical details must be held, and who may see them.", "How long an induction remains valid, and when re-induction is required.", "The PPE items issued, the rules for replacement and return, and the SAP material references for them.", "The format of the NHAI quarterly audit and of client audits, and who closes findings.", "How incidents are classified, who must be notified and how quickly, what the head office casualty report contains, and who investigates.", "Which environmental readings are taken, how often, and against which limits.", "The road furniture review with the IE and NHAI — its checklist and when it takes place.", "The ISO standard referenced during the discussion, whose number we could not confirm from our notes.", "The meaning of items in our notes we could not resolve: \"malum\" among the observation items, \"Simgya plan\" and \"PIC card\" under project closure, and \"9th month\" in the store notes.", "How safe man-hours are calculated, and the formats for the monthly review and half-yearly monitoring.", "The SAP boundary, confirmed with the SAP owner, including which references the platform should read.", "Whether existing checklists, observations, incident records and safe man-hour figures should be migrated at go-live."], "sap": {"1": ["Project and WBS; safety budget", "PS / CO", "Read"], "11": ["PR status and goods issue for PPE and safety material", "MM", "Read"]}}, "hr": {"key": "hr", "name": "HR", "intro": ["HR staffs every project from the manpower budget the project is given. Its first rule is to use the people PIL already has: an internal transfer comes before a new hire. When hiring is needed, HR runs the whole process — finding the candidate, making the offer and onboarding — and then manages the employee through attendance, leave, overtime, payroll inputs, statutory dues, performance, training and, eventually, release or exit. The head office team handles HR for all group companies; at site, HR and Admin work as one team.", "The work is spread across SAP, greytHR, the ESS portal for biometric attendance, and Excel. Since our meeting, the team has listed the MIS it needs — recruitment, operations and statutory reports — and several of these already come from SAP reports. The gap is less about data and more about bringing it together in one place, with the records that sit outside SAP added to it. The department's work runs through nine stages."], "insight": "The decision after the resource check is the one HR cares most about: can the role be filled by someone already on the payroll? Answering it needs a live view of who is where and who is about to be released. Once people are deployed, most of the effort goes into stage five — attendance regularisation takes up more of the team's time than anything else — and into stage six, where statutory dues and their dates must never slip.", "flowcap": "Master flow — nine stages from the project's manpower budget to release", "flow": [{"t": "1. Manpower Budget", "s": "headcount and cost", "dec": false, "hl": false}, {"t": "2. Resource Check", "s": "existing people first", "dec": false, "hl": false}, {"t": "Available internally?", "s": "transfer or hire", "dec": true, "hl": false}, {"t": "Internal Transfer", "s": "site or department", "dec": false, "hl": true}, {"t": "3. Recruitment", "s": "sourcing, TAT", "dec": false, "hl": false}, {"t": "4. Offer and Onboarding", "s": "offer to joining", "dec": false, "hl": true}, {"t": "5. Attendance", "s": "leave, late coming, OT", "dec": false, "hl": true}, {"t": "6. Payroll and Statutory", "s": "PF, ESIC, PT, LWF", "dec": false, "hl": false}, {"t": "7. Performance and Training", "s": "KPIs, appraisal, growth", "dec": false, "hl": false}, {"t": "8. Exit and Absconding", "s": "tracked and closed", "dec": false, "hl": false}, {"t": "9. Release at Project Closure", "s": "transfer to the next project, or exit", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Project Manpower Budget", "text": "When PIL wins a project, the project has a budget for employees. HR works with Planning on the manpower needed, operation by operation, subject to approval. SAP already reports approved against actual headcount and budget against actual salary cost, including cost per employee.", "nodes": [{"t": "New project", "s": "awarded", "dec": false, "hl": false}, {"t": "Manpower budget", "s": "headcount and cost", "dec": false, "hl": false}, {"t": "Manpower plan", "s": "with Planning", "dec": false, "hl": true}, {"t": "Budget vs actual", "s": "HC and salary cost", "dec": false, "hl": false}], "note": "The budget report sits in SAP, while open requisitions and planned transfers sit in Excel. Seen together, they show whether a new hire fits the budget before it is made."}, {"title": "Stage 2 — Resource Check and Internal Transfer", "text": "Before hiring, HR looks for someone suitable already in the company — on another project, or about to be released from one. If there is, the person is transferred. Transfers between sites and departments are reported from SAP.", "nodes": [{"t": "Position approved", "s": "role and grade", "dec": false, "hl": false}, {"t": "Search existing staff", "s": "skill and availability", "dec": false, "hl": true}, {"t": "Match found?", "s": "internal first", "dec": true, "hl": false}, {"t": "Transfer", "s": "site or department", "dec": false, "hl": false}], "note": "The search relies on people's knowledge of who is where. Recommendations recorded at project closure about each person's suitability do not reach this search."}, {"title": "Stage 3 — Recruitment", "text": "Where no one is available internally, HR recruits. The job is created in SAP, candidates are sourced and selected, and the process is tracked in Excel. The team wants to see open positions, hiring by source and the time taken to fill each role.", "nodes": [{"t": "Job description", "s": "being prepared", "dec": false, "hl": false}, {"t": "Job created", "s": "in SAP", "dec": false, "hl": false}, {"t": "Sourcing", "s": "by source", "dec": false, "hl": true}, {"t": "Selection", "s": "TAT measured", "dec": false, "hl": true}], "note": "The department asked for an applicant tracking system, and for a record of people who should not be rehired so that past problems are not repeated."}, {"title": "Stage 4 — Offer and Onboarding", "text": "The selected candidate receives an offer. Offers are released, accepted, rejected or put on hold, and the team wants to compare offers made with people who actually join. On joining, the employee is created in the SAP employee master and enrolled for attendance.", "nodes": [{"t": "Offer released", "s": "approved", "dec": false, "hl": true}, {"t": "Accepted?", "s": "or on hold", "dec": true, "hl": false}, {"t": "Joining", "s": "documents collected", "dec": false, "hl": false}, {"t": "Employee master", "s": "in SAP, biometric", "dec": false, "hl": false}], "note": "The employee database the team listed carries code, grade, designation, department, location, company, cost centre, joining and confirmation dates, reporting manager, employment type, CTC, gross and fixed and variable pay. Most of it is set here."}, {"title": "Stage 5 — Attendance, Leave and Overtime", "text": "Attendance is captured by biometric scan through the ESS portal. Missed punches are regularised, and this takes up most of the team's work. The team wants present and absent percentages and late coming, leave use by type — CL, SL and PL — and overtime hours with their cost.", "nodes": [{"t": "Biometric scan", "s": "ESS portal", "dec": false, "hl": false}, {"t": "Punch complete?", "s": "daily", "dec": true, "hl": false}, {"t": "Regularisation", "s": "request, approval", "dec": false, "hl": true}, {"t": "Leave and OT", "s": "hours and cost", "dec": false, "hl": false}], "note": "When someone is absent without informing anyone, HR should know the same day. The Safety team keeps its own attendance for workers, and HR holds third-party labour details but not their attendance."}, {"title": "Stage 6 — Payroll, Statutory Dues and Claims", "text": "Salary is processed in SAP. Every month HR must account for PF — employee and employer share — ESIC for covered employees, professional tax by state and the labour welfare fund, and keep the gratuity provision and liability current. Contractors' CLRA and labour licences are followed, as are death and insurance claims, workmen compensation cases and labour court matters.", "nodes": [{"t": "Payroll inputs", "s": "attendance, leave, OT", "dec": false, "hl": false}, {"t": "Salary", "s": "in SAP", "dec": false, "hl": false}, {"t": "Statutory dues", "s": "PF, ESIC, PT, LWF", "dec": false, "hl": true}, {"t": "Monthly calendar", "s": "delays and penalties", "dec": false, "hl": false}, {"t": "Claims and cases", "s": "WC, labour, insurance", "dec": false, "hl": false}], "note": "The team asked for a monthly statutory calendar, a report of delays and penalties, and a tracker for audit observations until each is closed."}, {"title": "Stage 7 — Performance, Growth and Training", "text": "Employees are rated against department-wise KPIs, with appraisal forms in SAP. The team wants the spread of ratings, increments by grade, promotions — changes in grade and designation — and training hours and participation.", "nodes": [{"t": "KPIs set", "s": "by department", "dec": false, "hl": false}, {"t": "Appraisal", "s": "rating in SAP", "dec": false, "hl": false}, {"t": "Increment", "s": "% by grade", "dec": false, "hl": true}, {"t": "Promotion", "s": "grade, designation", "dec": false, "hl": false}, {"t": "Training", "s": "hours, participation", "dec": false, "hl": false}], "note": "Appraisal and promotion reports come from SAP. KPIs and training are not recorded anywhere that can be reported on."}, {"title": "Stage 8 — Exit and Absconding", "text": "People leave by resignation, termination, retirement or absconding. When a person stops coming without informing, HR issues notices and closes the case. Every exit is reported by type.", "nodes": [{"t": "Exit starts", "s": "by type", "dec": false, "hl": true}, {"t": "Notices", "s": "if absconding", "dec": false, "hl": false}, {"t": "Clearances", "s": "assets, dues", "dec": false, "hl": false}, {"t": "Exit closed", "s": "F&F, rehire flag", "dec": false, "hl": false}], "note": "An exit matters beyond HR: the person may hold a power of attorney, a company phone or site authority."}, {"title": "Stage 9 — Release at Project Closure", "text": "As a project closes, its manpower is released. Each person is transferred to another project or exits, with full and final settlement where applicable. This feeds straight back into the resource check for the next project.", "nodes": [{"t": "Surplus identified", "s": "with recommendation", "dec": false, "hl": false}, {"t": "Needed elsewhere?", "s": "next project", "dec": true, "hl": false}, {"t": "Transfer", "s": "back to stage 2", "dec": false, "hl": true}, {"t": "Otherwise exit", "s": "F&F settled", "dec": false, "hl": false}], "note": "The demobilisation formats from Project Closure already capture each person's expertise and the project head's recommendation. Held in the platform, they become the pool HR searches at stage 2."}], "extra": {"title": "HR reports the team has listed", "heads": ["Report", "What it shows", "SAP report"], "rows": [["Manpower cost analysis", "Budget against actual salary cost, cost per employee", "Zhr_budget_v2"], ["Budget vs actual manpower", "Approved against actual headcount", "Zhr_budget_v2"], ["Diversity", "Gender ratio, age profile, grade mix", "S_PH0_48000510"], ["Recruitment tracker", "Open positions, source-wise hiring, TAT, offer against joining", "—"], ["Offer management", "Offers released, accepted, rejected, on hold", "—"], ["Employee database", "Master, joining and pay details", "S_PH0_48000510"], ["Exit report", "Resignation, termination, retirement, absconding", "—"], ["Transfer report", "Inter-site and inter-department movements", "Zhr_transfer"], ["Promotion report", "Grade and designation changes", "S_PH0_48000510"], ["Attendance", "Present %, absent %, late coming", "—"], ["Leave analysis", "CL, SL and PL use", "Zhr_2006"], ["Overtime", "OT hours and OT cost", "—"], ["KPI dashboard", "Department-wise performance", "—"], ["Appraisal tracker", "Rating distribution", "Zhr_IT_PMS_report"], ["Increment analysis", "Increment % by grade", "—"], ["Training", "Training hours, participation", "—"]]}, "workflows": [["1", "Project manpower budget", "Project awarded", "HR, Planning, Finance", "Budgeted headcount and salary cost by operation and grade, compared with actual from SAP"], ["2", "Manpower requisition", "Project needs a role filled", "Project head, Planning, HR, approver", "An approved requisition, checked against the budget"], ["3", "Internal transfer", "Match found, or move between site or department", "HR, releasing and receiving heads", "A transfer with effective date, recorded against both sides"], ["4", "Recruitment and applicant tracking", "Requisition needs a new hire", "HR, hiring manager", "Job created in SAP; candidates tracked by source and stage; TAT measured; rehire check done"], ["5", "Offer management", "Candidate selected", "HR, approver, candidate", "Offer released and tracked to acceptance, rejection, hold or joining"], ["6", "Joining and onboarding", "Offer accepted", "HR, site HR and Admin, joiner", "Documents collected, employee created in SAP, biometric enrolment done"], ["7", "Attendance and regularisation", "Each working day; missed punch", "Employee, manager, HR", "Attendance by site with late coming flagged; regularisation approved or rejected"], ["8", "Leave and unauthorised absence", "Leave request, or absence without leave", "Employee, manager, HR", "CL, SL and PL recorded; unauthorised absence notified the same day"], ["9", "Overtime", "Extra hours worked", "Employee, manager, HR", "Overtime hours approved and costed, then passed to payroll"], ["10", "Payroll inputs", "Month end", "HR, Finance", "Attendance, leave and overtime passed to SAP for salary"], ["11", "Statutory dues", "Monthly", "HR, Finance, Treasury", "PF, ESIC, PT by state and LWF worked out, paid on time and recorded"], ["12", "Gratuity and insurance", "Month end, joining, exit", "HR, Finance, Insurance", "Gratuity provision and liability kept current; employee data exchanged with insurance"], ["13", "Contract labour and licences", "Contractor deployed", "Site HR, Safety, contractor", "Labour details by contractor and site; CLRA and labour licences tracked to renewal"], ["14", "Statutory calendar and audit", "Each month; audit observation", "HR, auditors, management", "Due dates tracked; delays and penalties reported; audit observations followed to closure"], ["15", "KPIs, appraisal and increment", "Appraisal cycle", "Employee, manager, HR, management", "KPIs reviewed, ratings given, increments approved by grade"], ["16", "Promotion", "Appraisal or vacancy", "Manager, HR, management", "Grade and designation change approved and updated in SAP"], ["17", "Training", "Training need or plan", "HR, managers, employees", "Sessions held, attendance recorded, hours counted per person"], ["18", "Employee claims and cases", "Death, injury, insurance claim or labour dispute", "HR, Legal, Insurance, family", "Claims, WC cases and labour court matters followed to closure"], ["19", "Exit and absconding", "Resignation, termination, retirement or unauthorised absence", "Employee, manager, HR, Finance", "Notices where needed, clearances, F&F, exit report and rehire flag"], ["20", "Project release", "Project closure", "HR, project head", "Each person transferred or exited, with recommendation kept for future staffing"]], "dashboards": [["1", "Employee database", "Headcount by company, location, department, grade and employment type", "sap"], ["2", "Organogram", "The reporting tree for each company, project and department", "sap"], ["3", "Diversity", "Gender ratio, age profile and grade mix", "sap"], ["4", "Budget vs actual manpower", "Approved against actual headcount, by project", "sap"], ["5", "Manpower cost", "Budget against actual salary cost, and cost per employee", "sap"], ["6", "Recruitment tracker", "Open positions, source-wise hiring and TAT", "cap"], ["7", "Offers", "Released, accepted, rejected, on hold, and offer against joining", "cap"], ["8", "Available for transfer", "People being released, with skills and recommendations", "cap"], ["9", "Transfers and promotions", "Inter-site and inter-department moves; grade and designation changes", "sap"], ["10", "Attendance", "Present %, absent %, late coming and pending regularisation", "now"], ["11", "Leave", "CL, SL and PL use, and unauthorised absence", "sap"], ["12", "Overtime", "OT hours and OT cost by site, department and person", "cap"], ["13", "KPIs", "Department-wise performance", "cap"], ["14", "Appraisal and increment", "Rating distribution, and increment % by grade", "sap"], ["15", "Training", "Training hours and participation", "cap"], ["16", "Exits", "Resignation, termination, retirement and absconding, by project and tenure", "cap"], ["17", "Statutory dues", "PF, ESIC, PT by state, LWF, and gratuity provision and liability", "sap"], ["18", "Statutory calendar", "Monthly due dates, delays and penalties", "cap"], ["19", "Contractor licences", "CLRA and labour licences, and renewals due", "cap"], ["20", "Claims, cases and audit", "Death and insurance claims, WC cases, labour cases, audit observations and closure", "cap"]], "obs": "We note that two things HR is asked for — a live resource pool and same-day absence alerts — both depend on data held by other teams: project status from Planning and closure, and attendance from site. The value of the platform here is in the link, not the screen.", "interactions": [["Planning", "Manpower requirement by operation and period", "Deployment and availability", "Discussed per project."], ["Project and site teams", "Requisitions, attendance approvals, KPI inputs", "People, attendance records, notices", "Email, phone and Excel."], ["Finance and Treasury", "Manpower budget, payroll outputs", "Payroll inputs, statutory dues, gratuity provision, F&F", "Payroll in SAP."], ["Legal", "Guidance on labour cases and claims", "Case facts; exits affecting POAs and authorities", "Email."], ["Insurance", "Insurance data, claim outcomes", "Employee data, death and insurance claims", "Files and email."], ["Safety", "Worker induction and labour details; injury reports", "Employee master information; WC cases", "Separate attendance kept by Safety."], ["Admin", "Site facilities for joiners; factory licences", "Joiners, transfers and exits", "Combined team at site; separate at head office."], ["Project Closure", "Surplus schedule, recommendations, closure dates", "Transfers, relieving, F&F", "Demobilisation sheets."], ["Labour contractors", "Labour details, CLRA and labour licences", "Site rules and requirements", "Held by site HR."], ["Auditors", "Audit observations", "Closure evidence", "Excel."], ["Management", "Approvals for positions, offers, increments and promotions", "HR and statutory MIS", "Compiled by hand; some Power BI."]], "profile": [["Team size", "Recorded as 50 to 55, and as 30 to 32", "The two figures may be the whole HR team and the head office team, or HR with and without site Admin. This is raised in Section 8."], ["Structure", "HO HR for all companies; HR and Admin combined at site", "Roles must allow a site user to act for both HR and Admin, while head office keeps them separate."], ["Companies covered", "All group companies", "Every record carries its company, and every view can be filtered by company."], ["SAP reports in use", "Budget, employee, transfer, leave and appraisal reports", "Read as they are. The platform adds what SAP does not hold, and does not rebuild what it does."], ["Largest task", "Attendance regularisation", "The regularisation flow and its approvals need to be quick on mobile for site managers."], ["Hiring rule", "Internal transfer before new hire", "The resource pool is checked automatically before a job is opened."]], "tools": [["SAP", "Employee master, job creation, salary, appraisal, HR reports", "Retained and unchanged. The platform reads employee, pay and report data and does not keep a second master or run payroll."], ["greytHR", "HR management", "To be decided with HR: integrated as it is, or its functions taken over by the platform."], ["ESS portal", "Biometric attendance", "Retained as the attendance source, with regularisation and alerts in the platform."], ["Excel", "Hiring, trackers, statutory calendar, reports", "Replaced by recruitment, offer, statutory, claims and exit modules."], ["Power BI", "Dashboards", "Retained where useful, fed from the platform; or replaced by its own dashboards."]], "pains": [["1", "HR has the data, but it is not summarised for quick use", "Every question means building a report from several systems.", "One HR view across SAP, attendance and the new modules, with a customisable dashboard."], ["2", "Several MIS reports come from different SAP reports", "Each has to be run and combined by hand.", "SAP reports read on a schedule and shown together."], ["3", "Hiring is managed in Excel from sourcing to hiring", "Source-wise hiring and TAT cannot be reported.", "An applicant tracking module from requisition to joining."], ["4", "Offers are not tracked", "Offers on hold, rejected or not joined go unseen.", "Offer approval and tracking to joining."], ["5", "Existing people should come first, but availability is not visible", "A new hire may be made while a suitable person is being released elsewhere.", "A resource pool searched before a job opens."], ["6", "Attendance regularisation takes up most of the work", "The team's time goes on corrections rather than people.", "Self-service regularisation with mobile approval, and late coming flagged."], ["7", "HR is not told when someone is absent without informing", "Absconding is recognised late.", "Same-day alerts for unauthorised absence."], ["8", "Overtime hours and cost are worked out by hand", "OT cost is seen only after it is paid.", "Overtime approved before it is worked, costed as it is recorded."], ["9", "There is no record of who should not be rehired", "Past problems can be rehired.", "A rehire flag with reason, checked at shortlisting."], ["10", "KPIs and training are not displayed", "Performance and development are invisible between appraisals.", "KPI and training views by department and employee."], ["11", "PF, ESIC, PT, LWF and gratuity are reported separately", "No single view of what is due and what is paid.", "One statutory view by company and state."], ["12", "A monthly statutory calendar is needed", "A missed date means a penalty.", "Due dates with reminders, and a delays and penalties report."], ["13", "Contractor CLRA and labour licences need tracking", "Unlicensed contract labour is PIL's liability.", "Licences held by contractor and site, with renewal alerts."], ["14", "Claims, WC cases and labour cases need tracking", "Families and courts wait on HR's follow-up.", "A case register with status, dates and documents, shared with Legal."], ["15", "Audit observations need closure tracking", "The same observation can return in the next audit.", "Observations with owner, due date and closure evidence."], ["16", "HR attendance and Safety attendance are separate", "The same people can appear in two records that do not agree.", "Separate records kept, with a shared worker identity so they can be compared."]], "scope": [["1", "Employee view and organogram", "Employee database fields read from SAP; documents; history of transfers and promotions; reporting tree", "One place to look up any employee across companies."], ["2", "Manpower budget and requisition", "Budget against actual headcount and salary cost from SAP; requisition and approval against it", "Hiring tied to what each project can afford."], ["3", "Resource pool and transfers", "People available or being released, with skills and recommendations; transfer workflow across sites and departments", "Existing people considered first, every time."], ["4", "Recruitment and applicant tracking", "JD library; job creation passed to SAP; candidates by source and stage; TAT; rehire check", "Hiring tracked from requisition to selection."], ["5", "Offer management", "Offer templates; approval; release; accepted, rejected, hold and joined", "Every offer visible until the person joins."], ["6", "Joining and onboarding", "Joining checklist; documents; employee creation in SAP; biometric enrolment; site HR and Admin tasks", "New joiners ready to work on day one."], ["7", "Attendance and regularisation", "Attendance from ESS; present, absent and late coming; missing punch alerts; mobile approval", "The team's largest task made self-service."], ["8", "Leave, absence and overtime", "CL, SL and PL; unauthorised absence alerts; overtime approval and cost; payroll inputs", "Absences seen the same day; overtime approved and costed."], ["9", "Payroll and statutory view", "Salary, PF, ESIC, PT by state, LWF, gratuity provision and liability read from SAP; insurance data", "What is due and paid, in one view."], ["10", "Statutory calendar and audit", "Monthly due dates and reminders; delays and penalties; audit observations with owner and closure", "Nothing missed, and nothing repeated."], ["11", "Contract labour and licences", "Labour by contractor and site; CLRA and labour licences with renewal alerts; shared worker identity with Safety", "Contract labour known to HR and properly licensed."], ["12", "Claims and cases", "Death and insurance claims; WC cases; labour court matters; documents and hearing dates; shared with Legal", "Every case followed to closure."], ["13", "Performance and KPIs", "Department KPIs; appraisal through SAP; rating distribution; increments by grade; promotions", "Performance visible all year, not only at appraisal."], ["14", "Training", "Training plan; sessions; attendance; hours per person; participation by department", "Development that can be measured."], ["15", "Exit and absconding", "Resignation, termination, retirement; absconding notices; clearances; F&F with Finance; rehire flag; notice to Legal for POA review", "Clean exits that tell the rest of the business."], ["16", "Project release", "Surplus list from Project Closure; transfer or exit decision; recommendations kept", "People released into the next project, not lost."], ["17", "Dashboards and HR MIS", "The twenty dashboards of Section 3 in the team's MIS structure; customisable views; export to Excel, PDF and Power BI", "The summarised view HR asked for."], ["18", "SAP, ESS and greytHR links, roles and audit", "Read the named SAP reports and employee data; attendance from ESS; greytHR as agreed; site and HO roles; audit trail", "HR records tied to the systems of record, without a second master."]], "open": ["That the nine-stage process set out in Section 1 reflects how HR operates today.", "That the twenty workflows in Section 2 are complete, and that none of the department's work falls outside them.", "The team size, recorded as both 50 to 55 and 30 to 32, and how it divides between head office and sites.", "What greytHR is used for today alongside SAP and the ESS portal, whether it should stay, and which Power BI dashboards should be kept.", "That the platform may read the SAP reports named in the MIS sheet, and the fields each should supply.", "Where the data for reports without an SAP source is kept today — recruitment, offers, attendance, overtime, KPIs, increments, training and exits.", "How the project manpower budget is set and approved, and what \"security cost\" in the manpower flow refers to.", "The approval route for requisitions, transfers, offers, increments and promotions.", "The rules for attendance regularisation and late coming, and who approves.", "How HR attendance and Safety attendance should relate, and what HR holds for third-party labour.", "The overtime rules, and how OT cost is calculated.", "How many days of unauthorised absence count as absconding, and the notice process that follows.", "The states in which PT and LWF apply, and how gratuity provision is worked out today.", "That factory, pollution and fire licences sit with Admin, and CLRA and labour licences with HR.", "Who owns employee claims, WC cases and labour cases between HR and Legal, and which audits raise the observations to be tracked.", "That travel and site reimbursements, listed under Admin in the MIS sheet, move from this document to the Admin document.", "The meaning of items in our first notes we could not resolve: \"Deployment\" in the manpower notes, \"Joining India\", \"small discussion\" among the site items, \"talent evaluation point-wise\", and the quarterly review item.", "The SAP boundary, confirmed with the SAP owner, including which employee and pay fields the platform should read.", "Whether current hiring trackers, statutory calendars, case records and exit reports should be migrated at go-live."], "sap": {"1": ["Employee database (S_PH0_48000510): code, grade, designation, department, location, company, cost centre, DOJ, CTC", "HCM", "Read"], "2": ["Approved vs actual headcount; budget vs actual salary cost (Zhr_budget_v2)", "HCM / CO", "Read"], "3": ["Inter-site and inter-department transfers (Zhr_transfer)", "HCM", "Read"], "4": ["Position and job creation status", "HCM", "Read"], "6": ["Employee number once created", "HCM", "Read"], "8": ["Leave balances and use — CL, SL, PL (Zhr_2006)", "HCM", "Read"], "9": ["Payroll results; PF, ESIC, PT, LWF; gratuity provision and liability", "HCM Payroll", "Read"], "13": ["Appraisal ratings (Zhr_IT_PMS_report); promotions (S_PH0_48000510)", "HCM", "Read"], "15": ["Full and final settlement status", "HCM / FI", "Read"]}}, "admin": {"key": "admin", "name": "Admin", "intro": ["Admin provides the services people need to work: travel and accommodation for joiners and travelling staff, accommodation, guest houses, canteen and local transport at site, company vehicles and drivers, SIM and CUG connections, stationery and uniforms, office, site and factory facilities, the rent and land leases behind them, and the factory, pollution and fire licences those premises need. It works to a budget for each cost centre and project, and books every bill so that it can be paid.", "Head office Admin is a small team — a travel desk, car executives and billing. At site, HR and Admin work as one team and send daily and monthly reports, with the site billing cycle closing on the 21st of each month. Travel is booked through TripGain, bills are booked in SAP, and almost everything in between is kept in Excel and folders. Since our meeting, the team has shared the MIS it needs, grouped into travel, rent and accommodation, facilities and vehicles. This version is built around that structure. The work runs through nine stages."], "insight": "Stages two to seven are the services, and each one spends money. The decision that follows is the same for all of them: is it within budget? Where it is not, the CHRO and the department head approve it as an exceptional case. Everything then ends in a bill that has to be checked, booked and reported — and today the question of how much has been spent against the budget can only be answered after the month closes.", "flowcap": "Master flow — nine stages from budget to expense reporting", "flow": [{"t": "1. Budget", "s": "cost centre and WBS", "dec": false, "hl": false}, {"t": "2. Travel and Joining", "s": "hotel, food, air travel", "dec": false, "hl": false}, {"t": "3. Site Set-up", "s": "stay, canteen, guest house", "dec": false, "hl": false}, {"t": "4. Fleet and Transport", "s": "vehicles, cabs, drivers", "dec": false, "hl": false}, {"t": "5. Purchase Requests", "s": "stationery, uniforms", "dec": false, "hl": false}, {"t": "6. CUG and SIM", "s": "connections and bills", "dec": false, "hl": false}, {"t": "7. Facilities and Licences", "s": "rent, utilities, assets", "dec": false, "hl": false}, {"t": "Within budget?", "s": "every expense", "dec": true, "hl": false}, {"t": "Exception approval", "s": "CHRO and department head", "dec": false, "hl": true}, {"t": "8. Billing and Booking", "s": "21st cycle, SAP", "dec": false, "hl": true}, {"t": "9. Expense Reporting", "s": "daily, monthly, quarterly", "dec": false, "hl": false}], "stages": [{"title": "Stage 1 — Budget and Projections", "text": "Admin works to a budget by cost centre and project. The WBS gives the tentative budget for each site. Admin tracks the quarterly budget and projections against it, and spending beyond it becomes an exceptional or commitment case.", "nodes": [{"t": "Cost centre", "s": "office or initiative", "dec": false, "hl": false}, {"t": "WBS budget", "s": "tentative for each site", "dec": false, "hl": false}, {"t": "Quarterly budget", "s": "and projections", "dec": false, "hl": false}, {"t": "Exceptions", "s": "commitment cases", "dec": false, "hl": true}], "note": "The budget sits in SAP, and consumption is worked out from bills after they are booked. There is no daily view of spend against budget."}, {"title": "Stage 2 — Travel and Joining Arrangements", "text": "Before a person joins, and whenever staff travel, Admin arranges flights, trains, taxis and hotels through TripGain, within the travel budget. Where accommodation goes beyond the budget, the CHRO and the department head approve it. Travel claims — including fuel and site expenses — are then settled. The team wants travel cost seen against the travel budget.", "nodes": [{"t": "Request", "s": "joining or business travel", "dec": false, "hl": false}, {"t": "Booked in TripGain", "s": "flight, train, hotel", "dec": false, "hl": false}, {"t": "Within budget?", "s": "travel policy", "dec": true, "hl": false}, {"t": "CHRO approval", "s": "with department head", "dec": false, "hl": true}, {"t": "Claim settled", "s": "after the trip", "dec": false, "hl": false}], "note": "TripGain holds the bookings, but taxi, fuel and claim costs sit outside it, so the full travel cost is not seen against the budget. Site reimbursements, which our HR document first placed with HR, are handled here."}, {"title": "Stage 3 — Site Accommodation, Canteen and Guest House", "text": "For each project, Admin sets up accommodation, furniture such as chairs and cots, the canteen, local transport and guest houses, usually through third-party vendors. The team wants guest house occupancy and cost reported.", "nodes": [{"t": "Accommodation", "s": "for site staff", "dec": false, "hl": false}, {"t": "Furniture", "s": "chairs, cots", "dec": false, "hl": false}, {"t": "Canteen", "s": "vendor or in-house", "dec": false, "hl": false}, {"t": "Local transport", "s": "cabs", "dec": false, "hl": false}, {"t": "Guest house", "s": "occupancy and cost", "dec": false, "hl": true}], "note": "Each of these is a recurring cost with a vendor behind it. Occupancy, meals served and vendor terms are held in sheets at site."}, {"title": "Stage 4 — Fleet and Transport", "text": "Admin manages thirteen company vehicles for head office and senior management, with their drivers, fuel and d
